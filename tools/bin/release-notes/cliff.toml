# git-cliff's part of a release's notes (tools/bin/release-notes, T-069): the range's commits,
# grouped by type, each with its short SHA linked. Run by tools/bin/pinned at the version pinned
# there, never the npm package, with --strip all: the notes' title, their Upgrading section and
# everything else are tools/bin/release-notes'. The groups and their order are the changelog's
# (the root cliff.toml).

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
  ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/donvargax/itos/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
topo_order = false
commit_parsers = [
	{ message = "^feat", group = "<!-- 00 -->Features" },
	{ message = "^fix", group = "<!-- 01 -->Fixes" },
	{ message = "^perf", group = "<!-- 02 -->Performance" },
	{ message = "^refactor", group = "<!-- 03 -->Refactoring" },
	{ message = "^test", group = "<!-- 04 -->Tests" },
	{ message = "^build", group = "<!-- 05 -->Build" },
	{ message = "^ci", group = "<!-- 06 -->CI" },
	{ message = "^docs", group = "<!-- 07 -->Documentation" },
	{ message = "^chore", group = "<!-- 08 -->Chores" },
	{ message = "^style", group = "<!-- 09 -->Style" },
	{ message = "^[Rr]evert", group = "<!-- 10 -->Reverts" },
	{ message = ".*", group = "<!-- 11 -->Other" },
]
