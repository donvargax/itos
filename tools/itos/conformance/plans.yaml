        - check:
            task: T-060
            index: 3
            command: vp run e2e --workers 1
          cost: late
          cost_from: default
          action: run
        - check:
            task: T-060
            index: 4
            command: vp run e2e:smoke
          cost: late
          cost_from: default
          action: merged
          kind: scenario
        - check:
            task: T-061
            index: 0
            command: vp run e2e
          cost: late
          cost_from: default
          action: merged
          kind: scenario
      tasks:
        - T-060
        - T-061
      left_out: []
      unknown: []
      not_started: []
  - name: T-045's pair keeps its written order, the sh -c late by default
    argv: [ci, plan, "{{sha.base}}", "{{sha.pair}}", --json]
