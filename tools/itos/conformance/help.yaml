# What help must do (docs/decisions/0052-the-corpus-pins-only-the-contract-exit-codes-json-less-message-and-fix-and-files-written.md):
# exit 0 with something on stdout, naming a command's subcommands. Its words
# are for people, so no case pins them. Help needs no files: it is printed
# before any config is read.
cases:
  - name: itos --help
    argv: [--help]
    exit: 0
    stdout_nonempty: true
    stdout_has:
      [
        status,
        next,
        task list,
        work take,
        decision add,
        followup add,
        draft add,
        commit check-message,
        push,
        review post,
        git-shim install,
        pin,
        upgrade,
        init,
        verify,
        tests list,
        ci plan,
        hook install,
        guard claude-code,
        config get,
        version,
        guide,
        brief,
      ]
  - name: itos task --help
    argv: [task, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos task list, itos task add, itos task next-id]
  - name: itos work --help
    argv: [work, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has:
      [
        itos work list,
        itos work show,
        itos work take,
        itos work promote,
        itos work done,
        itos work add,
        itos work edit,
        itos work queue,
        itos work drop,
        itos work defer,
        itos work resume,
        itos work give-back,
        itos work check,
      ]
  - name: itos decision --help
    argv: [decision, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos decision add, itos decision answer, itos decision ratify, itos decision overturn, itos decision record, itos decision show]
  - name: itos followup --help
    argv: [followup, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos followup add, itos followup note, itos followup close, itos followup show, itos followup doc]
  - name: itos draft --help
    argv: [draft, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos draft add, itos draft edit, itos draft promote, itos draft drop]
  - name: itos commit --help
    argv: [commit, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos commit check-message, itos commit check-paths, itos commit footers]
  - name: itos push --help
    argv: [push, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos push
  - name: itos review --help
    argv: [review, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos review post, "--stage spec|diff", "itos:v1"]
  - name: itos git-shim --help
    argv: [git-shim, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos git-shim install, itos git-shim uninstall, itos git-shim run]
  - name: itos pin --help
    argv: [pin, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos pin
  - name: itos upgrade --help
    argv: [upgrade, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos upgrade
  - name: itos init --help
    argv: [init, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos init
  - name: itos verify --help
    argv: [verify, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos verify
  - name: itos tests --help
    argv: [tests, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos tests list, itos tests smoke, itos tests moves, itos tests next-id]
  - name: itos ci --help
    argv: [ci, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos ci plan, itos ci run, itos ci scope, itos ci range, itos ci watch]
  - name: itos hook --help
    argv: [hook, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos hook commit-msg, itos hook pre-push, itos hook install]
  - name: itos guard --help
    argv: [guard, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos guard claude-code
  - name: itos config --help
    argv: [config, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos config check, itos config get]
  - name: itos version --help
    argv: [version, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos version
  - name: itos go --help
    argv: [go, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos go
  - name: itos guide --help
    argv: [guide, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos guide
  - name: itos brief --help
    argv: [brief, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: [itos brief, --role]
  - name: itos status --help
    argv: [status, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos status
  - name: itos next --help
    argv: [next, --help]
    exit: 0
    stdout_nonempty: true
    stdout_has: itos next
  - name: a bare itos prints the help and exits 2
    argv: []
    exit: 2
    stdout_nonempty: true
    stdout_has: [task list, work take, ci plan]
  - name: help <command> is the command's --help
    argv: [help, ci, plan]
    exit: 0
    stdout_has: itos ci plan
  - name: -h is --help
    argv: [verify, -h]
    exit: 0
    stdout_has: itos verify
  - name: the help of the longest command path it knows
    argv: [tests, smoke, check, scenario, --help]
    exit: 0
    stdout_has: itos tests smoke check
  - name: arguments after the command do not change its help
    argv: [task, T-007, --help]
    exit: 0
    stdout_has: itos task
  - name: an unknown command's help is itos's
    argv: [bogus, --help]
    exit: 0
    stdout_has: [task list, work take, ci plan]
  - name: help with a topic that is no command exits 2, naming it
    argv: [help, bogus]
    exit: 2
    stderr_has: bogus
  - name: version
    argv: [version]
    files:
      itos.yaml: "version: 1\n"
    exit: 0
    stdout_has: "{{version}}"
