# The hooks: `hook install` declaring the two hooks in the git config (slice
# 91: no hook manager, no hook file, never over an entry of the project's own
# without --force, refused by a git that runs no hook its config declares),
# and itos commit and itos push refusing, exit 3, where git would run none of
# itos's hooks (the runner declares stand-ins in every case's repository);
# `hook commit-msg` (the staged paths, each kind's staged range check, then
# the header lint, if any, built in or a delegate, and the footer rules,
# always); `hook pre-push` (git's ref lines on stdin, or pre-commit's
# environment: once per remote base, else the whole run, and nothing for a
# deleted branch), after verifying the commits each pushed ref adds, printing
# nothing for those that pass and refusing the push, running no command, for
# one that fails.
git:
  - commit: "docs: start"
    files: { README.md: "scratch\n" }
    label: base
  - commit: "docs: more"
    files: { README.md: "more\n" }
    label: more
files:
  itos.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
    commits:
      types: [feat, build, docs, test]
      footers:
        Task: { source: ledger, required_for: [build, test], validate_for: all, read_at: commit }
      scopes:
        build: { only: ["tools/**", "*.json"] }
        docs: { only: ["**/*.md", "tasks/**"] }
        test: { only: ["tools/**", "**/*.test.ts"] }
    tests:
      scenario:
        root: features
        id: "ID-[A-Z]+-\\d+"
        range_checks:
          - name: moves
            except_types: [feat]
            staged: "sh moves.sh {type}"
    work: { people: { source: yaml, file: people.yaml } }
    hooks:
      bin: tools/bin/itos
      pre_push: { per_base: "echo tests since {base}", whole: "echo every test" }
  moves.sh: |
    # A staged range check: fails for a test commit that stages tools/moved.ts.
    if [ "$1" = test ] && git diff --cached --name-only | grep -qx tools/moved.ts; then
      echo "Scenarios moved badly:" >&2
      echo "  - a test commit changes the live scenario ID-A-01" >&2
      echo "  - a test commit loses the scenario ID-A-02" >&2
      exit 1
    fi
  tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n"
cases:
  # hook install's cases pin what a consumer relies on (decision 35, T-113):
  # its --json and the entries it leaves in the git config (git_config_after),
  # the runner's stand-ins (`: itos hook <event>`) where it writes nothing.
  - name: hook install declares both hooks in the git config, and leaves the project's hooks and core.hooksPath alone
    argv: [hook, install, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", .husky/commit-msg: "npx commitlint --edit \"$1\"\n" }
      - run: git config core.hooksPath .husky
    files_after:
      .husky/commit-msg: "npx commitlint --edit \"$1\"\n"
      .husky/pre-push: null
      .git/hooks/commit-msg: null
    git_config_after:
      core.hooksPath: .husky
      hook.itos-commit-msg.event: commit-msg
      hook.itos-commit-msg.command: tools/bin/itos hook commit-msg
      hook.itos-pre-push.event: pre-push
      hook.itos-pre-push.command: tools/bin/itos hook pre-push
    exit: 0
    json:
      schema: 1
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: tools/bin/itos hook commit-msg
          action: wrote
        - name: itos-pre-push
          event: pre-push
          command: tools/bin/itos hook pre-push
          action: wrote
    stderr: |
      wrote hook.itos-commit-msg
      wrote hook.itos-pre-push
  - name: an entry already as hook install writes it is left unchanged
    argv: [hook, install, --json]
    git:
      - run: git config hook.itos-commit-msg.command 'tools/bin/itos hook commit-msg' && git config hook.itos-pre-push.command 'tools/bin/itos hook pre-push'
    git_config_after: &declared
      hook.itos-commit-msg.event: commit-msg
      hook.itos-commit-msg.command: tools/bin/itos hook commit-msg
      hook.itos-pre-push.event: pre-push
      hook.itos-pre-push.command: tools/bin/itos hook pre-push
    exit: 0
    json:
      schema: 1
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: tools/bin/itos hook commit-msg
          action: unchanged
        - name: itos-pre-push
          event: pre-push
          command: tools/bin/itos hook pre-push
          action: unchanged
    stderr: |
      unchanged hook.itos-commit-msg
      unchanged hook.itos-pre-push
  - name: --print prints the git config's entries and writes nothing
    argv: [hook, install, --print]
    git_config_after: &stand-ins
      hook.itos-commit-msg.event: commit-msg
      hook.itos-commit-msg.command: ": itos hook commit-msg"
      hook.itos-pre-push.event: pre-push
      hook.itos-pre-push.command: ": itos hook pre-push"
    exit: 0
    stdout: "[hook \"itos-commit-msg\"]\n\tevent = commit-msg\n\tcommand = tools/bin/itos hook commit-msg\n[hook \"itos-pre-push\"]\n\tevent = pre-push\n\tcommand = tools/bin/itos hook pre-push\n"
  - name: --print --json gives the entries as data, and writes nothing
    argv: [hook, install, --print, --json]
    git_config_after: *stand-ins
    exit: 0
    json:
      schema: 1
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: tools/bin/itos hook commit-msg
          action: printed
        - name: itos-pre-push
          event: pre-push
          command: tools/bin/itos hook pre-push
          action: printed
    stderr: ""
  - name: an entry under itos's name that does not call itos is never replaced without --force
    argv: [hook, install, --json]
    git:
      - run: git config hook.itos-commit-msg.command 'sh tools/own-check.sh'
    git_config_after:
      hook.itos-commit-msg.event: commit-msg
      hook.itos-commit-msg.command: sh tools/own-check.sh
      hook.itos-pre-push.event: pre-push
      hook.itos-pre-push.command: tools/bin/itos hook pre-push
    exit: 1
    json:
      schema: 1
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: tools/bin/itos hook commit-msg
          action: refused
        - name: itos-pre-push
          event: pre-push
          command: tools/bin/itos hook pre-push
          action: wrote
    stderr: |
      hook.itos-commit-msg does not call itos; pass --force to replace it
      wrote hook.itos-pre-push
  - name: --force replaces an entry that does not call itos
    argv: [hook, install, --force, --json]
    git:
      - run: git config hook.itos-commit-msg.command 'sh tools/own-check.sh'
    git_config_after: *declared
    exit: 0
    json:
      schema: 1
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: tools/bin/itos hook commit-msg
          action: replaced
        - name: itos-pre-push
          event: pre-push
          command: tools/bin/itos hook pre-push
          action: wrote
    stderr: |
      replaced hook.itos-commit-msg
      wrote hook.itos-pre-push
  - name: --json of the entries
    argv: [hook, install, --json]
    git:
      - run: git config hook.itos-pre-push.command 'tools/bin/itos hook pre-push'
    git_config_after: *declared
    exit: 0
    json:
      schema: 1
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: tools/bin/itos hook commit-msg
          action: wrote
        - name: itos-pre-push
          event: pre-push
          command: tools/bin/itos hook pre-push
          action: unchanged
    stderr: |
      wrote hook.itos-commit-msg
      unchanged hook.itos-pre-push
  - name: a stealth config declares the hooks the same way, with its own hooks.bin
    argv: [hook, install, --json]
    files:
      itos.yaml: null
      .git/itos/itos.yaml: "version: 1\nhooks: { bin: itos }\n"
    git_config_after:
      hook.itos-commit-msg.event: commit-msg
      hook.itos-commit-msg.command: itos hook commit-msg
      hook.itos-pre-push.event: pre-push
      hook.itos-pre-push.command: itos hook pre-push
    exit: 0
    json:
      schema: 1
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: itos hook commit-msg
          action: wrote
        - name: itos-pre-push
          event: pre-push
          command: itos hook pre-push
          action: wrote
    stderr: |
      wrote hook.itos-commit-msg
      wrote hook.itos-pre-push
  - name: a git that runs no hook its config declares makes hook install exit 3, naming the git to upgrade to
    argv: [hook, install]
    files:
      old-git: &old-git
        text: |
          #!/bin/sh
          # A git older than 2.54.0: no git hook list.
          previous=
          for word in "$@"; do
            if [ "$previous" = hook ] && [ "$word" = list ]; then
              echo "git: 'hook' is not a git command. See 'git --help'." >&2
              exit 1
            fi
            previous=$word
          done
          if [ "$1" = --version ]; then echo "git version 2.30.0"; exit 0; fi
          exec {{git}} "$@"
        executable: true
    env: { ITOS_GIT: "{{dir}}/old-git" }
    git_config_after: *stand-ins
    exit: 3
    stderr: |
      itos: hook install: git 2.30.0 runs no hook its config declares, so it would run none of itos's checks: upgrade git to 2.54.0 or later
  - name: itos commit refuses, exit 3, where the git config declares no commit-msg hook of itos's, and commits nothing
    argv: [commit, -m, "docs: tidy"]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
        label: base
      - run: git config --remove-section hook.itos-commit-msg
      - stage: { README.md: "tidier\n" }
    exit: 3
    stderr: |
      itos: itos's commit-msg hook is not declared in this clone's git config, so git would run none of its checks: run itos hook install once in the clone (its worktrees share it), then run this again
  - name: itos commit refuses, exit 3, with a git that runs no hook its config declares
    argv: [commit, -m, "docs: tidy"]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { README.md: "tidier\n" }
    files: { old-git: *old-git }
    env: { ITOS_GIT: "{{dir}}/old-git" }
    exit: 3
    stderr: |
      itos: git 2.30.0 runs no hook its config declares, so it would run none of itos's checks: upgrade git to 2.54.0 or later
  - name: itos push refuses, exit 3, where the git config declares no pre-push hook of itos's
    argv: [--json, push]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - run: git config --remove-section hook.itos-pre-push
    exit: 3
    json:
      schema: 1
      ok: false
      outcome: hooks-not-run
    stderr: |
      itos: itos's pre-push hook is not declared in this clone's git config, so git would run none of its checks: run itos hook install once in the clone (its worktrees share it), then run this again
  - name: commit-msg rejects a staged path the type may not touch
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { src/a.ts: "export {};\n" }
    files: { msg: "docs: touch the source\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - docs commits may not touch src/a.ts
  - name: commit-msg runs the kind's staged range check for the commit's type
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { tools/moved.ts: "export {};\n", README.test.ts: "" }
    files: { msg: "test: move\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - a test commit changes the live scenario ID-A-01
        - a test commit loses the scenario ID-A-02
  - name: a type the range check leaves out skips it
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { tools/moved.ts: "export {};\n" }
    files: { msg: "feat: move\n" }
    exit: 0
    stderr: ""
  - name: commit-msg then runs the footer rules when there is no header lint
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { tools/a.sh: "true\n" }
    files: { msg: "build: a script\n" }
    exit: 1
    stderr: |
      ✖   build commits need a "Task: T-…" footer [task-footer]
  - name: a sound commit passes
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { tools/a.sh: "true\n" }
    files: { msg: "build: a script\n\nTask: T-001\n" }
    exit: 0
  - name: a docs commit may name a task it need not carry
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { README.md: "more\n" }
    files: { msg: "docs: say more\n\nTask: T-001\n" }
    exit: 0
    stderr: ""
  # itos's own data, as staged: the working tree's copy is sound in each
  # case (the files written after the repository), so a rejection shows the
  # index was read.
  - name: commit-msg rejects a staged ledger with a problem, read from the index
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: &data
          README.md: "scratch\n"
          people.yaml: "- someone\n"
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems: []\n"
      - stage: { tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, titel: One }\n" }
    files: { msg: "docs: retitle the task\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - T-001: unknown key titel
  - name: commit-msg rejects a staged registry with a problem
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: W-1, title: One, phase: 1, owner: null, status: lost, depends_on: [] }\n"
    files: { msg: "docs: plan the work\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - W-1: unknown status "lost"
  - name: commit-msg rejects a staged itos.yaml with an unknown key, naming the key
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage: { itos.yaml: "version: 1\ncolour: true\n" }
    files: { msg: "build: colour the config\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - itos.yaml: unknown key colour
  # The people file is config check's alone to report, as a warning: a
  # commit whose index lacks it is not refused for it.
  - name: staged data whose index holds no people file is not refused for it
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { tasks/work-items.yaml: "phases: {}\nitems: []\n" }
    files: { msg: "docs: plan the work\n", people.yaml: "- someone\n" }
    exit: 0
    stderr: ""
  - name: staged data that cannot be read is rejected, saying why
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { tasks/work-items.yaml: "phases: [\n" }
    files: { msg: "docs: plan the work\n", tasks/work-items.yaml: "phases: {}\nitems: []\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - yaml: line 1: did not find expected node content
  - name: a commit that stages none of itos's data leaves it unchecked
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files:
          README.md: "scratch\n"
          people.yaml: "- someone\n"
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: W-1, title: One, phase: 1, owner: null, status: lost, depends_on: [] }\n"
      - stage: { README.md: "more\n" }
    files: { msg: "docs: write the readme\n" }
    exit: 0
  # The static checks of the tasks the Task: footer names, last: the ledger
  # and the registry as staged (the working tree's ledger, written after the
  # repository, has no checks), each check's output under its task and command.
  - name: a done task whose static check fails rejects the commit, with the check's output
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"echo broken; exit 3\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      T-001 One
        $ echo broken; exit 3
      broken
      Commit rejected:
        - failing T-001: `echo broken; exit 3` exited 3, and tasks/work-items.yaml says T-001 is done
  - name: a task in progress whose static check fails is reported, and the commit goes through
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"exit 3\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: doing, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 0
    stderr: |
      T-001 One
        $ exit 3
      failing T-001: `exit 3` exited 3; T-001 is doing in tasks/work-items.yaml, so the commit goes through, and CI judges the push
  - name: a task with no work item counts as in progress
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ fails: \"true\", cost: static }] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 0
    stderr: |
      T-001 One
        $ true   (must fail)
      failing T-001: `true` passed, and must fail; T-001 has no item in tasks/work-items.yaml, so the commit goes through, and CI judges the push
  - name: a task stops at its first failing check, and its checks that pass print nothing
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"echo fine\", cost: static }, { run: \"exit 4\", cost: static }, { run: \"echo never; exit 5\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      T-001 One
        $ exit 4
      Commit rejected:
        - failing T-001: `exit 4` exited 4, and tasks/work-items.yaml says T-001 is done
  - name: the checks stop at a task's first late one, by its cost or the patterns'
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"true\", cost: static }, { run: \"exit 6\" }, { run: \"exit 7\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 0
  - name: an after push check waits, since the commit being made is not pushed
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - run: git update-ref refs/remotes/origin/main HEAD
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"exit 5\", cost: static, after: push }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 0
  - name: a check that outlasts hooks.commit_msg.check_timeout fails, naming the key
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"sleep 5\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files:
      msg: "docs: note the check\n\nTask: T-001\n"
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [feat, build, docs, test]
          footers:
            Task: { source: ledger, required_for: [build, test], validate_for: all, read_at: commit }
          scopes:
            docs: { only: ["**/*.md", "tasks/**"] }
        work: { people: { source: yaml, file: people.yaml } }
        hooks:
          commit_msg: { check_timeout: 1 }
    exit: 1
    stderr: |
      T-001 One
        $ sleep 5
      Commit rejected:
        - failing T-001: `sleep 5` ran past hooks.commit_msg.check_timeout (1s), and tasks/work-items.yaml says T-001 is done
  - name: a check's own shorter timeout is not the key's to name
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"sleep 5\", cost: static, timeout: 1 }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      T-001 One
        $ sleep 5
      Commit rejected:
        - failing T-001: `sleep 5` ran past its timeout (1s), and tasks/work-items.yaml says T-001 is done
  - name: hooks.commit_msg.task_checks false runs no task check
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"exit 3\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files:
      msg: "docs: note the check\n\nTask: T-001\n"
