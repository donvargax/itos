# The hooks: `hooks install` taking the hook manager --manager or
# hooks.manager names, else the git config for a stealth config, else finding it by its markers, and writing one-line shims
# (never over a hook of the project's own without --force), printing the snippet a config-file manager takes, or declaring
# the hooks in the git config; `hook
# commit-msg` (the staged paths, each kind's staged range check, then the
# header lint, if any, built in or a delegate, and the footer rules, always);
# `hook pre-push` (git's ref lines on stdin,
# or pre-commit's environment: once per remote base, else the whole run, and
# nothing for a deleted branch), after verifying the commits each pushed ref adds, printing
# nothing for those that pass and refusing the push, running no command, for one that fails.
git:
  - commit: "docs: start"
    files: { README.md: "scratch\n" }
    label: base
  - commit: "docs: more"
    files: { README.md: "more\n" }
    label: more
files:
  itos.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
    commits:
      types: [feat, build, docs, test]
      footers:
        Task: { source: ledger, required_for: [build, test], validate_for: all, read_at: commit }
      scopes:
        build: { only: ["tools/**", "*.json"] }
        docs: { only: ["**/*.md", "tasks/**"] }
        test: { only: ["tools/**", "**/*.test.ts"] }
    tests:
      scenario:
        root: features
        id: "ID-[A-Z]+-\\d+"
        range_checks:
          - name: moves
            except_types: [feat]
            staged: "sh moves.sh {type}"
    work: { people: { source: yaml, file: people.yaml } }
    hooks:
      bin: tools/bin/itos
      pre_push: { per_base: "echo tests since {base}", whole: "echo every test" }
  moves.sh: |
    # A staged range check: fails for a test commit that stages tools/moved.ts.
    if [ "$1" = test ] && git diff --cached --name-only | grep -qx tools/moved.ts; then
      echo "Scenarios moved badly:" >&2
      echo "  - a test commit changes the live scenario ID-A-01" >&2
      echo "  - a test commit loses the scenario ID-A-02" >&2
      exit 1
    fi
  tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n"
cases:
  - name: Vite+ is found by its folder, and the shims written there
    argv: [hooks, install]
    files: { .vite-hooks/: "" }
    files_after:
      .vite-hooks/commit-msg: "exec tools/bin/itos hook commit-msg \"$1\"\n"
      .vite-hooks/pre-push: "exec tools/bin/itos hook pre-push \"$@\"\n"
    exit: 0
    stdout: |
      Found Vite+ (.vite-hooks/)
      wrote .vite-hooks/commit-msg
      wrote .vite-hooks/pre-push
  - name: Vite+ is found by core.hooksPath, as vp config sets it
    argv: [hooks, install, --print]
    git:
      - run: git config core.hooksPath .vite-hooks/_
    exit: 0
    stdout: |
      Found Vite+ (core.hooksPath .vite-hooks/_)
      ==> .vite-hooks/commit-msg
      exec tools/bin/itos hook commit-msg "$1"
      ==> .vite-hooks/pre-push
      exec tools/bin/itos hook pre-push "$@"
  - name: Vite+ wins over the other managers' markers beside it
    argv: [hooks, install, --print]
    files: { .vite-hooks/: "", .husky/: "", lefthook.yml: "" }
    exit: 0
    stdout: |
      Found Vite+ (.vite-hooks/)
      ==> .vite-hooks/commit-msg
      exec tools/bin/itos hook commit-msg "$1"
      ==> .vite-hooks/pre-push
      exec tools/bin/itos hook pre-push "$@"
  - name: --print prints the shims and writes nothing
    argv: [hooks, install, --print]
    files: { .husky/: "" }
    files_after:
      .husky/commit-msg: null
    exit: 0
    stdout: |
      Found husky (.husky/)
      ==> .husky/commit-msg
      exec tools/bin/itos hook commit-msg "$1"
      ==> .husky/pre-push
      exec tools/bin/itos hook pre-push "$@"
  - name: husky is found by its folder
    argv: [hooks, install]
    files: { .husky/: "" }
    files_after:
      .husky/commit-msg: "exec tools/bin/itos hook commit-msg \"$1\"\n"
    exit: 0
    stdout: |
      Found husky (.husky/)
      wrote .husky/commit-msg
      wrote .husky/pre-push
  - name: husky is found by core.hooksPath
    argv: [hooks, install, --print]
    git:
      - run: git config core.hooksPath .husky/_
    exit: 0
    stdout: |
      Found husky (core.hooksPath .husky/_)
      ==> .husky/commit-msg
      exec tools/bin/itos hook commit-msg "$1"
      ==> .husky/pre-push
      exec tools/bin/itos hook pre-push "$@"
  - name: plain git without any marker, its hooks executable in the repository's hooks folder
    argv: [hooks, install]
    files_after:
      .git/hooks/commit-msg: { text: "#!/bin/sh\nexec tools/bin/itos hook commit-msg \"$1\"\n", executable: true }
      .git/hooks/pre-push: { text: "#!/bin/sh\nexec tools/bin/itos hook pre-push \"$@\"\n", executable: true }
    exit: 0
    stdout: |
      Found plain git (no hook manager's marker)
      wrote .git/hooks/commit-msg
      wrote .git/hooks/pre-push
  - name: hooks.manager names the manager over the markers found
    argv: [hooks, install, --config, managed.yaml]
    files:
      .husky/: ""
      managed.yaml: "version: 1\nhooks: { manager: git }\n"
    files_after:
      .git/hooks/commit-msg: { text: "#!/bin/sh\nexec tools/bin/itos hook commit-msg \"$1\"\n", executable: true }
      .husky/commit-msg: null
    exit: 0
    stdout: |
      Using plain git (hooks.manager git)
      wrote .git/hooks/commit-msg
      wrote .git/hooks/pre-push
  - name: --manager names it over hooks.manager
    argv: [hooks, install, --print, --manager, husky, --config, managed.yaml]
    files:
      managed.yaml: "version: 1\nhooks: { manager: git }\n"
    exit: 0
    stdout: |
      Using husky (--manager husky)
      ==> .husky/commit-msg
      exec tools/bin/itos hook commit-msg "$1"
      ==> .husky/pre-push
      exec tools/bin/itos hook pre-push "$@"
  - name: a hook of the project's own is never replaced without --force
    argv: [hooks, install]
    files:
      .husky/commit-msg: &foreign "sh tools/own-check.sh \"$1\" || exit $?\nvp exec commitlint --edit \"$1\"\n"
    files_after:
      .husky/commit-msg: *foreign
      .husky/pre-push: "exec tools/bin/itos hook pre-push \"$@\"\n"
    exit: 1
    stdout: |
      Found husky (.husky/)
      wrote .husky/pre-push
    stderr: |
      .husky/commit-msg is not an itos shim; pass --force to replace it
  - name: --force replaces it
    argv: [hooks, install, --force]
    files:
      .husky/commit-msg: *foreign
    files_after:
      .husky/commit-msg: "exec tools/bin/itos hook commit-msg \"$1\"\n"
    exit: 0
    stdout: |
      Found husky (.husky/)
      replaced .husky/commit-msg
      wrote .husky/pre-push
  - name: a shim with a shebang and a comment is a shim, and is rewritten
    argv: [hooks, install]
    files:
      .vite-hooks/commit-msg: "#!/bin/sh\n# written by hand\nexec .tools/bin/itos hook commit-msg \"$1\"\n"
      .vite-hooks/pre-push: "exec tools/bin/itos hook pre-push \"$@\"\n"
    files_after:
      .vite-hooks/commit-msg: "exec tools/bin/itos hook commit-msg \"$1\"\n"
    exit: 0
    stdout: |
      Found Vite+ (.vite-hooks/)
      wrote .vite-hooks/commit-msg
      unchanged .vite-hooks/pre-push
  - name: a shim with a second command is not a shim
    argv: [hooks, install]
    files:
      .vite-hooks/commit-msg: "exec tools/bin/itos hook commit-msg \"$1\"\necho more\n"
    exit: 1
    stdout: |
      Found Vite+ (.vite-hooks/)
      wrote .vite-hooks/pre-push
    stderr: |
      .vite-hooks/commit-msg is not an itos shim; pass --force to replace it
  - name: hooks.bin names what the shims call
    argv: [hooks, install, --print, --manager, vp]
    files:
      itos.yaml: "version: 1\nhooks: { bin: .tools/bin/itos }\n"
    exit: 0
    stdout: |
      Using Vite+ (--manager vp)
      ==> .vite-hooks/commit-msg
      exec .tools/bin/itos hook commit-msg "$1"
      ==> .vite-hooks/pre-push
      exec .tools/bin/itos hook pre-push "$@"
  - name: lefthook's snippet is printed, its config left alone
    argv: [hooks, install]
    files: { lefthook.yml: "pre-commit:\n" }
    files_after:
      lefthook.yml: "pre-commit:\n"
    exit: 0
    stdout: |
      Found lefthook (lefthook.yml)
      Add this to lefthook.yml:
      commit-msg:
        commands:
          itos:
            run: tools/bin/itos hook commit-msg {1}
      pre-push:
        commands:
          itos:
            run: tools/bin/itos hook pre-push {1} {2}
            use_stdin: true
  - name: a lefthook config that already calls itos
    argv: [hooks, install]
    files: { .lefthook.yaml: "commit-msg:\n  commands:\n    itos:\n      run: tools/bin/itos hook commit-msg {1}\n" }
    exit: 0
    stdout: |
      Found lefthook (.lefthook.yaml)
      .lefthook.yaml already calls itos; its snippet:
      commit-msg:
        commands:
          itos:
            run: tools/bin/itos hook commit-msg {1}
      pre-push:
        commands:
          itos:
            run: tools/bin/itos hook pre-push {1} {2}
            use_stdin: true
  - name: pre-commit's snippet
    argv: [hooks, install]
    files: { .pre-commit-config.yaml: "repos: []\n" }
    exit: 0
    stdout: |
      Found pre-commit (.pre-commit-config.yaml)
      Add this to .pre-commit-config.yaml:
      default_install_hook_types: [pre-commit, commit-msg, pre-push]
      repos:
        - repo: local
          hooks:
            - id: itos-commit-msg
              name: itos hook commit-msg
              entry: tools/bin/itos hook commit-msg
              language: system
              stages: [commit-msg]
            - id: itos-pre-push
              name: itos hook pre-push
              entry: tools/bin/itos hook pre-push
              language: system
              stages: [pre-push]
              pass_filenames: false
              always_run: true
  - name: prek, named by --manager, takes pre-commit's snippet
    argv: [hooks, install, --manager, prek]
    files: { .pre-commit-config.yaml: "repos: []\n" }
    exit: 0
    stdout: |
      Using prek (--manager prek)
      Add this to .pre-commit-config.yaml:
      default_install_hook_types: [pre-commit, commit-msg, pre-push]
      repos:
        - repo: local
          hooks:
            - id: itos-commit-msg
              name: itos hook commit-msg
              entry: tools/bin/itos hook commit-msg
              language: system
              stages: [commit-msg]
            - id: itos-pre-push
              name: itos hook pre-push
              entry: tools/bin/itos hook pre-push
              language: system
              stages: [pre-push]
              pass_filenames: false
              always_run: true
  - name: --json of the shims
    argv: [hooks, install, --json]
    files: { .vite-hooks/: "", .vite-hooks/pre-push: "exec tools/bin/itos hook pre-push \"$@\"\n" }
    exit: 0
    json:
      schema: 1
      manager: vp
      marker: .vite-hooks/
      files:
        - path: .vite-hooks/commit-msg
          content: |
            exec tools/bin/itos hook commit-msg "$1"
          action: wrote
        - path: .vite-hooks/pre-push
          content: |
            exec tools/bin/itos hook pre-push "$@"
          action: unchanged
    stderr: |
      Found Vite+ (.vite-hooks/)
      wrote .vite-hooks/commit-msg
      unchanged .vite-hooks/pre-push
  - name: --json of a snippet
    argv: [hooks, install, --json, --manager, lefthook]
    exit: 0
    json:
      schema: 1
      manager: lefthook
      marker: --manager lefthook
      file: lefthook.yml
      snippet: |-
        commit-msg:
          commands:
            itos:
              run: tools/bin/itos hook commit-msg {1}
        pre-push:
          commands:
            itos:
              run: tools/bin/itos hook pre-push {1} {2}
              use_stdin: true
      installed: false
    stderr: |
      Using lefthook (--manager lefthook)
  - name: the git config's entries, printed
    argv: [hooks, install, --print, --manager, git-config]
    exit: 0
    stdout: "Using the git config (--manager git-config)\n[hook \"itos-commit-msg\"]\n\tevent = commit-msg\n\tcommand = tools/bin/itos hook commit-msg\n[hook \"itos-pre-push\"]\n\tevent = pre-push\n\tcommand = tools/bin/itos hook pre-push\n"
  - name: a stealth config declares the hooks in the git config, over the markers, and no pre-push entry without hooks.pre_push
    argv: [hooks, install, --json]
    files:
      itos.yaml: null
      .husky/: ""
      .git/itos/itos.yaml: "version: 1\nhooks: { bin: itos }\n"
    files_after:
      .husky/commit-msg: null
    exit: 0
    json:
      schema: 1
      manager: git-config
      marker: stealth config .git/itos/itos.yaml
      hooks:
        - name: itos-commit-msg
          event: commit-msg
          command: itos hook commit-msg
          action: wrote
    stderr: |
      Using the git config (stealth config .git/itos/itos.yaml)
      wrote hook.itos-commit-msg
  - name: commit-msg rejects a staged path the type may not touch
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { src/a.ts: "export {};\n" }
    files: { msg: "docs: touch the source\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - docs commits may not touch src/a.ts
  - name: commit-msg runs the kind's staged range check for the commit's type
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { tools/moved.ts: "export {};\n", README.test.ts: "" }
    files: { msg: "test: move\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - a test commit changes the live scenario ID-A-01
        - a test commit loses the scenario ID-A-02
  - name: a type the range check leaves out skips it
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { tools/moved.ts: "export {};\n" }
    files: { msg: "feat: move\n" }
    exit: 0
    stderr: ""
  - name: commit-msg then runs the footer rules when there is no header lint
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - stage: { tools/a.sh: "true\n" }
    files: { msg: "build: a script\n" }
    exit: 1
    stderr: |
      ✖   build commits need a "Task: T-…" footer [task-footer]
  - name: a sound commit passes
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { tools/a.sh: "true\n" }
    files: { msg: "build: a script\n\nTask: T-001\n" }
    exit: 0
  - name: a docs commit may name a task it need not carry
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { README.md: "more\n" }
    files: { msg: "docs: say more\n\nTask: T-001\n" }
    exit: 0
    stderr: ""
  # itos's own data, as staged: the working tree's copy is sound in each
  # case (the files written after the repository), so a rejection shows the
  # index was read.
  - name: commit-msg rejects a staged ledger with a problem, read from the index
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: &data
          README.md: "scratch\n"
          people.yaml: "- someone\n"
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems: []\n"
      - stage: { tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, titel: One }\n" }
    files: { msg: "docs: retitle the task\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - T-001: unknown key titel
  - name: commit-msg rejects a staged registry with a problem
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: W-1, title: One, phase: 1, owner: null, status: lost, depends_on: [] }\n"
    files: { msg: "docs: plan the work\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - W-1: unknown status "lost"
  - name: commit-msg rejects a staged itos.yaml with an unknown key, naming the key
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage: { itos.yaml: "version: 1\ncolour: true\n" }
    files: { msg: "build: colour the config\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - itos.yaml: unknown key colour
  # The people file is config check's alone to report, as a warning: a
  # commit whose index lacks it is not refused for it.
  - name: staged data whose index holds no people file is not refused for it
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { tasks/work-items.yaml: "phases: {}\nitems: []\n" }
    files: { msg: "docs: plan the work\n", people.yaml: "- someone\n" }
    exit: 0
    stderr: ""
  - name: staged data that cannot be read is rejected, saying why
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { tasks/work-items.yaml: "phases: [\n" }
    files: { msg: "docs: plan the work\n", tasks/work-items.yaml: "phases: {}\nitems: []\n" }
    exit: 1
    stderr: |
      Commit rejected:
        - yaml: line 1: did not find expected node content
  - name: a commit that stages none of itos's data leaves it unchecked
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files:
          README.md: "scratch\n"
          people.yaml: "- someone\n"
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: W-1, title: One, phase: 1, owner: null, status: lost, depends_on: [] }\n"
      - stage: { README.md: "more\n" }
    files: { msg: "docs: write the readme\n" }
    exit: 0
  # The static checks of the tasks the Task: footer names, last: the ledger
  # and the registry as staged (the working tree's ledger, written after the
  # repository, has no checks), each check's output under its task and command.
  - name: a done task whose static check fails rejects the commit, with the check's output
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"echo broken; exit 3\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      T-001 One
        $ echo broken; exit 3
      broken
      Commit rejected:
        - failing T-001: `echo broken; exit 3` exited 3, and tasks/work-items.yaml says T-001 is done
  - name: a task in progress whose static check fails is reported, and the commit goes through
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"exit 3\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: doing, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 0
    stderr: |
      T-001 One
        $ exit 3
      failing T-001: `exit 3` exited 3; T-001 is doing in tasks/work-items.yaml, so the commit goes through, and CI judges the push
  - name: a task with no work item counts as in progress
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ fails: \"true\", cost: static }] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 0
    stderr: |
      T-001 One
        $ true   (must fail)
      failing T-001: `true` passed, and must fail; T-001 has no item in tasks/work-items.yaml, so the commit goes through, and CI judges the push
  - name: a task stops at its first failing check, and its checks that pass print nothing
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"echo fine\", cost: static }, { run: \"exit 4\", cost: static }, { run: \"echo never; exit 5\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 1
    stderr: |
      T-001 One
        $ exit 4
      Commit rejected:
        - failing T-001: `exit 4` exited 4, and tasks/work-items.yaml says T-001 is done
  - name: the checks stop at a task's first late one, by its cost or the patterns'
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"true\", cost: static }, { run: \"exit 6\" }, { run: \"exit 7\", cost: static }] }\n"
          tasks/work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
    files: { msg: "docs: note the check\n\nTask: T-001\n" }
    exit: 0
  - name: an after push check waits, since the commit being made is not pushed
    argv: [hook, commit-msg, msg]
    git:
      - commit: "docs: start"
        files: *data
      - run: git update-ref refs/remotes/origin/main HEAD
      - stage:
          tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: \"exit 5\", cost: static, after: push }] }\n"
