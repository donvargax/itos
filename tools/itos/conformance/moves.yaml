# The built-in moves rule, a Gherkin kind's range check { name, builtin:
# moves, except_types, allowed_renames }: the commit-msg hook judging HEAD
# against the index for a type except_types does not name (and, when
# commits.types lists the types, one of them), verify judging each commit of
# its range against its parent, a root commit against the empty tree, and
# `itos tests moves <kind>` judging HEAD against the index by hand; live
# scenarios keep their ID, name, tags and steps, none is lost or added, none
# is turned wip, moved or not (bug 108), a file with a live scenario keeps its
# header; @wip ones, comment lines and a
# feature's description (the free text under its Feature line) are free;
# a rename allowed_renames lists passes. A scenario going live, a new live
# one or a wip one made live, is refused outside except_types unless the
# check sets code (globs or $path_sets) and the commit's Scenarios: footer
# names it and it changes none of that code (slice 134); verify reads each
# commit's own footers and paths. config check refuses builtin with a
# command, on a command kind without supports_at: true (slice 82), and
# allowed_renames or code without it.
#
# Every case starts from one feat committing features/a.feature, a live
# scenario and a @wip one, and the ledger.
git:
  - &base
    commit: "feat: start\n\nTask: T-001\n"
    files:
      features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n"
      tasks/phase-1.yaml: "- { id: T-001, type: test, title: One }\n"
    label: base
files:
  itos.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
    commits:
      types: [feat, fix, test, docs]
      footers:
        Task: { source: ledger, required_for: [test, docs], validate_for: all, read_at: commit }
    tests:
      scenario:
        root: features
        id: "ID-[A-Z]+-\\d+"
        range_checks:
          - name: moves
            builtin: moves
            except_types: [feat, fix]
            allowed_renames: { ID-A-01: "Opens again" }
      command:
        adapter: { command: "sh list.sh" }
      rootless:
        id: "ID-[A-Z]+-\\d+"
    ci: { steps: [] }
    work: { people: { source: yaml, file: people.yaml } }
  msg: "test: tidy the scenario\n\nTask: T-001\n"
cases:
  - name: commit-msg rejects a test commit that changes a live scenario's steps
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it twice\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 1
    stderr_has: [ID-A-01, features/a.feature]
  - name: a type except_types names is left to its own rules
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it twice\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    files: { msg: "feat: change what the scenario checks\n" }
    exit: 0
  - name: a message whose type is not one of commits.types is the header lint's, as a merge's is
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it twice\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    files: { msg: "Merge branch 'other'\n" }
    exit: 0
  - name: a live scenario moved unchanged to a new file, the old one deleted, passes
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage:
          features/a.feature: null
          features/b.feature: "@phase-2\nFeature: B\n\n  Background:\n    Given it is closed\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n"
    exit: 0
  - name: "@wip scenarios may change, and comment lines are never compared"
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  # why it opens\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it at once\n\n  @ID-A-03 @wip\n  Scenario: Locks\n    When I lock it\n" }
    exit: 0
  - name: a feature's description reworded is never compared
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n  What opens, and what closes,\n\n  told another way.\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 0
  - name: a description reworded beside a tag added above the Feature line is a changed header
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "@phase-2\nFeature: A\n  What opens, told another way.\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 1
    stderr_has: features/a.feature
  - name: the rename allowed_renames lists passes
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens again\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 0
  - name: a rename allowed_renames does not list is a change
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens at last\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 1
    stderr_has: ID-A-01
  - name: commit-msg rejects a test commit that turns a live scenario wip
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01 @wip\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 1
    stderr_has: [ID-A-01, wip]
  - name: a live scenario moved to a new file whose @wip covers it is turned wip
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage:
          features/a.feature: null
          features/b.feature: "@wip\nFeature: B\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n"
    exit: 1
    stderr_has: [ID-A-01, wip, features/b.feature]
  - name: an added and a lost live scenario and a changed header, each a problem
    argv: [hook, commit-msg, msg]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A, retitled\n\n  @ID-A-03\n  Scenario: Locks\n    When I lock it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 1
    stderr_has: [ID-A-03, ID-A-01, features/a.feature]
  - name: verify judges each commit against its parent, skipping except_types, and names a failing one under its report
    argv: [verify, "", HEAD, --json]
    git:
      - *base
      - commit: "feat: change what the scenario checks\n"
        files: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it twice\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
        label: change
      - commit: "test: tidy the scenario\n\nTask: T-001\n"
        files: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it at once\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
        label: tidy
      - commit: "test: move the scenario\n\nTask: T-001\n"
        files: { features/a.feature: null, features/b.feature: "Feature: B\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it at once\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
        label: move
    exit: 1
    json:
      schema: 1
      range: { from: "", to: HEAD }
      commits:
        - { sha: "{{sha.base}}", header: "feat: start", ok: true }
        - { sha: "{{sha.change}}", header: "feat: change what the scenario checks", ok: true }
        - { sha: "{{sha.tidy}}", header: "test: tidy the scenario", ok: false }
        - { sha: "{{sha.move}}", header: "test: move the scenario", ok: true }
      passed: 3
      total: 4
      range_checks: true
    stderr_has: ["ID-A-01", "{{short.tidy}}"]
  - name: a root commit is judged against the empty tree
    argv: [verify, "", HEAD, --json]
    git:
      - commit: "docs: start\n\nTask: T-001\n"
        files:
          features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n"
          tasks/phase-1.yaml: "- { id: T-001, type: test, title: One }\n"
        label: root
    exit: 1
    json:
      schema: 1
      range: { from: "", to: HEAD }
      commits: [{ sha: "{{sha.root}}", header: "docs: start", ok: false }]
      passed: 0
      total: 1
      range_checks: true
    stderr_has: ID-A-01
  - name: verify lets a test commit bring a wip scenario live that its Scenarios footer names, changing none of code
    argv: ["verify", "{{sha.base}}", HEAD, --json]
    files:
      itos.yaml: &live |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [feat, fix, test, docs]
          path_sets: { app: ["src/**"] }
          footers:
            Task: { source: ledger, required_for: [test, docs], validate_for: all, read_at: commit }
            Scenarios: { source: { tests: scenario }, strip_prefix: "@", validate_for: [feat, fix] }
        tests:
          scenario:
            root: features
            id: "ID-[A-Z]+-\\d+"
            range_checks: [{ name: moves, builtin: moves, except_types: [feat, fix], code: [$app] }]
        ci: { steps: [] }
        work: { people: { source: yaml, file: people.yaml } }
    git:
      - *base
      - commit: "test: describe what closing does\n\nTask: T-001\nScenarios: @ID-A-02\n"
        files: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02\n  Scenario: Closes\n    When I close it\n" }
        label: closing
    exit: 0
    json:
      schema: 1
      range: { from: "{{sha.base}}", to: HEAD }
      commits: [{ sha: "{{sha.closing}}", header: "test: describe what closing does", ok: true }]
      passed: 1
      total: 1
      range_checks: true
  - name: verify refuses a commit that brings a named scenario live and changes the code under test, naming that code
    argv: ["verify", "{{sha.base}}", HEAD, --json]
    files: { itos.yaml: *live }
    git:
      - *base
      - commit: "test: describe what closing does now\n\nTask: T-001\nScenarios: @ID-A-02\n"
        files: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02\n  Scenario: Closes\n    When I close it\n", src/app.go: "package app\n" }
        label: live
    exit: 1
    json:
      schema: 1
      range: { from: "{{sha.base}}", to: HEAD }
      commits: [{ sha: "{{sha.live}}", header: "test: describe what closing does now", ok: false }]
      passed: 0
      total: 1
      range_checks: true
    stderr_has: [ID-A-02, src/app.go]
  - name: commit-msg refuses a new live scenario its message does not name, under code
    argv: [hook, commit-msg, msg]
    files: { itos.yaml: *live }
    git:
      - *base
      - stage: { features/b.feature: "Feature: B\n\n  @ID-B-01\n  Scenario: Locks\n    When I lock it\n" }
    exit: 1
    stderr_has: [ID-B-01, "Scenarios:"]
  - name: tests moves reports a scenario going live, saying how a commit's footer allows it under code
    argv: [tests, moves, scenario, --json]
    files: { itos.yaml: *live }
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02\n  Scenario: Closes\n    When I close it\n" }
    exit: 1
    json: { schema: 1, kind: scenario, ok: false, problems: [{ rule: moves }] }
    stdout_has: [ID-A-02, "Scenarios:"]
  - name: tests moves reports a scenario going live without code as needing it
    argv: [tests, moves, scenario, --json]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n\n  @ID-A-02\n  Scenario: Closes\n    When I close it\n" }
    exit: 1
    json: { schema: 1, kind: scenario, ok: false, problems: [{ rule: moves }] }
    stdout_has: ID-A-02
  - name: tests moves with nothing staged
    argv: [tests, moves, scenario, --json]
    exit: 0
    json: { schema: 1, kind: scenario, ok: true, problems: [] }
  - name: tests moves names each problem of the staged feature files
    argv: [tests, moves, scenario, --json]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it twice\n" }
    exit: 1
    json: { schema: 1, kind: scenario, ok: false, problems: [{ rule: moves }] }
    stdout_has: ID-A-01
  - name: tests moves allows the kind's allowed renames
    argv: [tests, moves, scenario, --json]
    git:
      - *base
      - stage: { features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens again\n    When I open it\n\n  @ID-A-02 @wip\n  Scenario: Closes\n    When I close it\n" }
    exit: 0
    json: { schema: 1, kind: scenario, ok: true, problems: [] }
  - name: tests moves needs a kind
    argv: [tests, moves]
    exit: 2
    stderr_has: <kind>
  - name: tests moves of a kind the config does not have
    argv: [tests, moves, nope, --json]
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: config-invalid }] }
    stdout_has: tests.nope
  - name: tests moves of a kind whose adapter is a command
    argv: [tests, moves, command, --json]
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: moves-not-gherkin }] }
    stdout_has: tests.command.adapter
  - name: tests moves of a kind without a root, which has no default
    argv: [tests, moves, rootless, --json]
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: config-invalid }] }
    stdout_has: tests.rootless.root
  - name: config check refuses builtin beside a command, on a command kind without supports_at, and allowed_renames without builtin
    argv: [config, check, --config, refused.yaml, --json]
    files:
      refused.yaml: |
        version: 1
        tests:
          scenario:
            root: features
            id: "ID-[A-Z]+-\\d+"
            range_checks:
              - { name: both, builtin: moves, staged: "sh moves.sh", range: "sh moves.sh {from} {to}" }
              - { name: renames, staged: "sh moves.sh", allowed_renames: { ID-A-01: Opens again } }
          command:
            adapter: { command: "sh list.sh" }
            range_checks: [{ name: moves, builtin: moves }]
    exit: 2
    json:
      schema: 1
      config: refused.yaml
      valid: false
      problems:
        - { rule: config-range-check-builtin, area: config }
        - { rule: config-range-check-builtin, area: config }
        - { rule: config-range-check-builtin, area: config }
    stdout_has: ["tests.scenario.range_checks[0]", "tests.scenario.range_checks[1]", "tests.command.range_checks[0]"]
  - name: config check refuses code without builtin, and a $path_set code names that commits.path_sets lacks
    argv: [config, check, --config, code.yaml, --json]
    files:
      code.yaml: |
        version: 1
        tests:
          scenario:
            root: features
            id: "ID-[A-Z]+-\\d+"
            range_checks:
              - { name: code, staged: "sh moves.sh", code: ["src/**"] }
              - { name: moves, builtin: moves, code: [$app] }
    exit: 2
    json:
      schema: 1
      config: code.yaml
      valid: false
      problems: [{ rule: config-path-set, area: config }, { rule: config-range-check-builtin, area: config }]
    stdout_has: ["tests.scenario.range_checks[1].code", "$app", "tests.scenario.range_checks[0]"]
  - name: builtin takes only moves
    argv: [config, check, --config, other.yaml, --json]
    files:
      other.yaml: |
        version: 1
        tests:
          scenario:
            root: features
            id: "ID-[A-Z]+-\\d+"
            range_checks: [{ name: other, builtin: other }]
    exit: 2
    json: { schema: 1, config: other.yaml, valid: false, problems: [{ rule: config-enum, area: config }] }
    stdout_has: "tests.scenario.range_checks[0].builtin"
