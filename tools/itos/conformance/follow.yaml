# itos followup (slice 61): the person's threads with people, in follow-ups.yaml
# of itos's folder in the git common dir, never committed, no config read.
# Every case that prints or writes a date reads a stored file, so no case
# reads the clock: the list, show and doc of the threads below, and the
# subcommands that write only by what they print and refuse. That follow needs
# a git repository is cli.yaml's, whose cases have none. Times print in the
# reader's zone (bug 16), so every case reads in the zone the stored stamps
# were written in, -07:00.
git: []
env: { TZ: Etc/GMT+7 }
files:
  .git/itos/follow-ups.yaml: &threads |
    # itos followup's threads: this clone's own, never committed (itos help followup).
    threads:
      - id: sync-ana
        with: ana
        title: The sync design
        status: open
        notes:
          - at: "2026-10-04T09:30:15-07:00"
            text: She covered the retries, not the backoff.
          - at: "2026-10-04T11:05:00-07:00"
            text: |-
              Backoff agreed: exponential,
              capped at a minute.
      - id: flaky-bo
        with: bo
        title: The flaky login test
        status: closed
        closed: "2026-10-05T16:00:00-07:00"
        notes:
          - at: "2026-10-04T10:00:00-07:00"
            text: Started.
          - at: "2026-10-05T16:00:00-07:00"
            text: Fixed by the retry.
cases:
  - name: followup --all lists the closed threads after the open ones
    argv: [followup, --all, --json]
    exit: 0
    json:
      schema: 1
      threads:
      - id: sync-ana
        with: ana
        title: The sync design
        status: open
        opened: '2026-10-04T09:30:15-07:00'
        last: '2026-10-04T11:05:00-07:00'
        notes: 2
      - id: flaky-bo
        with: bo
        title: The flaky login test
        status: closed
        opened: '2026-10-04T10:00:00-07:00'
        last: '2026-10-05T16:00:00-07:00'
        notes: 2
  - name: followup --json lists the open threads
    argv: [followup, --json]
    exit: 0
    json:
      schema: 1
      threads:
        - id: sync-ana
          with: ana
          title: The sync design
          status: open
          opened: "2026-10-04T09:30:15-07:00"
          last: "2026-10-04T11:05:00-07:00"
          notes: 2
  - name: followup with no threads says so
    files:
      .git/itos/follow-ups.yaml: null
    argv: [followup, --json]
    exit: 0
    json:
      schema: 1
      threads: []
  - name: followup has no subcommand it does not know
    argv: [followup, list]
    exit: 2
    stderr_has: list
  - name: followup refuses a follow-ups.yaml it does not write
    files:
      .git/itos/follow-ups.yaml: "threads:\n  - { id: a, with: x, title: t, status: done }\n"
    argv: [followup]
    exit: 2
    stderr_has: ["{{dir}}/.git/itos/follow-ups.yaml", done]
  - name: followup refuses a follow-ups.yaml holding a second document, and leaves it as it is
    files:
      .git/itos/follow-ups.yaml: &two "threads: []\n---\nthreads: []\n"
    argv: [followup, note, sync-ana, Hello.]
    exit: 2
    stderr_has: "{{dir}}/.git/itos/follow-ups.yaml"
    files_after:
      .git/itos/follow-ups.yaml: *two
  - name: followup refuses an empty follow-ups.yaml, which itos never writes, and leaves it as it is
    files:
      .git/itos/follow-ups.yaml: ""
    argv: [followup, add, ci-cy, --with, cy, --title, The CI runner, --note, Asked.]
    exit: 2
    stderr_has: "{{dir}}/.git/itos/follow-ups.yaml"
    files_after:
      .git/itos/follow-ups.yaml: ""
  - name: followup show prints the whole thread, every note in order
    argv: [followup, show, sync-ana, --json]
    exit: 0
    json:
      schema: 1
      ok: true
      thread:
        id: sync-ana
        with: ana
        title: The sync design
        status: open
        notes:
        - at: '2026-10-04T09:30:15-07:00'
          text: She covered the retries, not the backoff.
        - at: '2026-10-04T11:05:00-07:00'
          text: "Backoff agreed: exponential,\ncapped at a minute."
  - name: followup show --json is the thread as the file holds it
    argv: [followup, show, flaky-bo, --json]
    exit: 0
    json:
      schema: 1
      ok: true
      thread:
        id: flaky-bo
        with: bo
        title: The flaky login test
        status: closed
        closed: "2026-10-05T16:00:00-07:00"
        notes:
          - { at: "2026-10-04T10:00:00-07:00", text: Started. }
          - { at: "2026-10-05T16:00:00-07:00", text: Fixed by the retry. }
  - name: followup show refuses an id no thread has
    argv: [followup, show, nobody, --json]
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
      - rule: follow-no-thread
  - name: followup doc writes the thread as Markdown, its folders made, and the thread records it
    argv: [followup, doc, sync-ana, notes/design/sync.md, --json]
    exit: 0
    files_after:
      notes/design/sync.md: |
        # The sync design

        A thread with ana, open (itos followup show sync-ana).

        ## 2026-10-04 09:30

        She covered the retries, not the backoff.

        ## 2026-10-04 11:05

        Backoff agreed: exponential,
        capped at a minute.
      .git/itos/follow-ups.yaml: |
        # itos followup's threads: this clone's own, never committed (itos help followup).
        threads:
          - id: sync-ana
            with: ana
            title: The sync design
            status: open
            notes:
              - at: "2026-10-04T09:30:15-07:00"
                text: She covered the retries, not the backoff.
              - at: "2026-10-04T11:05:00-07:00"
                text: |-
                  Backoff agreed: exponential,
                  capped at a minute.
            docs:
              - {{dir}}/notes/design/sync.md
          - id: flaky-bo
            with: bo
            title: The flaky login test
            status: closed
            closed: "2026-10-05T16:00:00-07:00"
            notes:
              - at: "2026-10-04T10:00:00-07:00"
                text: Started.
              - at: "2026-10-05T16:00:00-07:00"
                text: Fixed by the retry.
    stderr_has: notes/design/sync.md
    json_has:
      schema: 1
      ok: true
      thread: { id: sync-ana, docs: ["{{dir}}/notes/design/sync.md"] }
      path: "{{dir}}/notes/design/sync.md"
  - name: followup doc to - prints the Markdown, writes no file and records nothing
    argv: [followup, doc, flaky-bo, "-", --json]
    exit: 0
    files_after:
      "-": null
      .git/itos/follow-ups.yaml: *threads
    json:
      schema: 1
      ok: true
      thread:
        id: flaky-bo
        with: bo
        title: The flaky login test
        status: closed
        closed: '2026-10-05T16:00:00-07:00'
        notes:
        - at: '2026-10-04T10:00:00-07:00'
          text: Started.
        - at: '2026-10-05T16:00:00-07:00'
          text: Fixed by the retry.
      markdown: "# The flaky login test\n\nA thread with bo, closed 2026-10-05 16:00 (itos followup show flaky-bo).\n\n## 2026-10-04 10:00\n\nStarted.\n\n## 2026-10-05 16:00\n\nFixed by the retry.\n"
  - name: followup doc to - --json gives the Markdown beside the thread
    argv: [followup, doc, sync-ana, "-", --json]
    exit: 0
    json:
      schema: 1
      ok: true
      thread:
        id: sync-ana
        with: ana
        title: The sync design
        status: open
        notes:
          - { at: "2026-10-04T09:30:15-07:00", text: "She covered the retries, not the backoff." }
          - { at: "2026-10-04T11:05:00-07:00", text: "Backoff agreed: exponential,\ncapped at a minute." }
      markdown: "# The sync design\n\nA thread with ana, open (itos followup show sync-ana).\n\n## 2026-10-04 09:30\n\nShe covered the retries, not the backoff.\n\n## 2026-10-04 11:05\n\nBackoff agreed: exponential,\ncapped at a minute.\n"
  - name: followup doc writes nothing over a file already there
    files:
      notes/sync.md: "mine\n"
    argv: [followup, doc, sync-ana, notes/sync.md, --json]
    exit: 1
    files_after:
      notes/sync.md: "mine\n"
      .git/itos/follow-ups.yaml: *threads
    json:
      schema: 1
      ok: false
      problems:
      - rule: follow-doc-exists
  - name: followup doc --force writes over a file already there
    files:
      sync.md: "mine\n"
    argv: [followup, doc, flaky-bo, sync.md, --force, --json]
    exit: 0
    files_after:
      sync.md: |
        # The flaky login test

        A thread with bo, closed 2026-10-05 16:00 (itos followup show flaky-bo).

        ## 2026-10-04 10:00

        Started.

        ## 2026-10-05 16:00

        Fixed by the retry.
    json_has:
      schema: 1
      ok: true
      thread: { id: flaky-bo, docs: ["{{dir}}/sync.md"] }
      path: "{{dir}}/sync.md"
  - name: followup add opens a thread
    argv: [followup, add, ci-cy, --with, cy, --title, The CI runner, --note, Asked for a second runner., --json]
    exit: 0
    json_has:
      schema: 1
      ok: true
      thread:
        id: ci-cy
        with: cy
        title: The CI runner
        status: open
        notes: [{ at: "<any>", text: Asked for a second runner. }]
  - name: followup add refuses an id a thread has, closed or not, and writes nothing
    argv: [followup, add, flaky-bo, --with, cy, --title, Another, --note, Again., --json]
    exit: 1
    files_after:
      .git/itos/follow-ups.yaml: *threads
    json:
      schema: 1
      ok: false
      problems:
      - rule: follow-id-taken
  - name: followup add needs a person, a title and a note
    argv: [followup, add, ci-cy, --with, cy]
    exit: 2
    stderr_has: [--title, --note]
  - name: followup add takes an id a command line can type
    argv: [followup, add, ci cy, --with, cy, --title, t, --note, n]
    exit: 2
    stderr_has: ci cy
  - name: followup note adds a note, its words joined
    argv: [followup, note, sync-ana, Tested, on, staging., --json]
    exit: 0
    json_has:
      schema: 1
      ok: true
      thread: { id: sync-ana, status: open, notes: [{ at: "<any>", text: Tested on staging. }] }
  - name: followup note refuses an id no thread has
    argv: [followup, note, nobody, Hello., --json]
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
      - rule: follow-no-thread
  - name: followup note needs a text
    argv: [followup, note, sync-ana]
    exit: 2
    stderr_has: <text>
  - name: followup close closes a thread
    argv: [followup, close, sync-ana, --note, Shipped., --json]
    exit: 0
    json_has:
      schema: 1
      ok: true
      thread: { id: sync-ana, status: closed, closed: "<any>", notes: [{ at: "<any>", text: Shipped. }] }
  - name: followup close refuses a thread already closed, and writes nothing
    argv: [followup, close, flaky-bo, --json]
    exit: 1
    files_after:
      .git/itos/follow-ups.yaml: *threads
    json:
      schema: 1
      ok: false
      problems:
      - rule: follow-closed
