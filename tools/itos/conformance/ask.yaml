# itos decision (slice 62): the questions waiting on the person the work is for,
# in work.asks, by default asks.yaml beside the work registry (here
# work-items.yaml, so asks.yaml): the open ones listed, every one with --all,
# one shown, each as --json; add and answer, each committing the file alone,
# the first add making it, and their refusals (an item the registry does not
# have, no question with the id, one already answered, a file with changes no
# commit holds, a file itos did not write whole); a stealth config's
# questions beside its registry in the git folder, nothing committed; and
# work.asks moving the file. Slice 69's: --all and show giving each answered
# question's decision, a record's number or none;
# record writing the next decision record, its index and the decision on the
# question, committing them together, a supersede setting the old record's
# status, --none, a stealth config's records in the git folder, and record's
# refusals. Slice 71's: the records MADR 4's, in docs/decisions or the folder
# work.decisions names, a .adr-dir no longer read.
files:
  itos.yaml: |
    version: 1
    work:
      registry: work-items.yaml
      people: { source: yaml, file: people.yaml }
  people.yaml: "- a\n"
  work-items.yaml: &registry "phases: { 1: a }\nitems:\n  - { id: x, title: X, phase: 1, owner: a, status: todo }\n"
  asks.yaml: &asks |
    # The questions to the person the work is for, written by itos decision (itos help decision).
    questions:
      - id: q-1
        item: "x"
        question: "Labels or Projects?"
        answer: "Labels, with trust by who acted."
      - id: q-2
        item: "x"
        question: "Is the archive\nworth it?"
      - id: q-3
        question: "Which way?"
cases:
  - name: decision --all lists the answered questions after the open ones, each with its answer
    argv: [decision, --all, --json]
    exit: 0
    json:
      schema: 1
      questions:
      - id: q-2
        item: x
        question: "Is the archive\nworth it?"
        status: open
      - id: q-3
        question: Which way?
        status: open
      - id: q-1
        item: x
        question: Labels or Projects?
        status: answered
        answer: Labels, with trust by who acted.
  - name: decision show gives the question's decision
    argv: [decision, show, q-1, --json]
    files:
      asks.yaml: "questions:\n  - { id: q-1, question: a, answer: b, decision: 3 }\n"
    exit: 0
    json:
      schema: 1
      ok: true
      question:
        id: q-1
        question: a
        status: answered
        answer: b
        decision: 3
  - name: decision --json gives each question's decision, a number or none
    argv: [decision, --all, --json]
    files:
      asks.yaml: "questions:\n  - { id: q-1, question: a, answer: b, decision: 3 }\n  - { id: q-2, question: c, answer: d, decision: none }\n"
    exit: 0
    json:
      schema: 1
      questions:
        - { id: q-1, question: a, status: answered, answer: b, decision: 3 }
        - { id: q-2, question: c, status: answered, answer: d, decision: none }
  - name: decision refuses a decision that is neither a record's number nor none, and leaves the file as it is
    argv: [decision, add, "Which way?"]
    files:
      asks.yaml: &baddecision "questions:\n  - { id: q-1, question: a, answer: b, decision: \"0003\" }\n"
    exit: 2
    stderr_has: [asks.yaml, q-1, "0003"]
    files_after:
      asks.yaml: *baddecision
  - name: decision --json lists the open questions
    argv: [decision, --json]
    exit: 0
    json:
      schema: 1
      questions:
        - { id: q-2, item: x, question: "Is the archive\nworth it?", status: open }
        - { id: q-3, question: "Which way?", status: open }
  - name: decision with no questions file says there are none
    argv: [decision, --all, --json]
    files:
      asks.yaml: null
    exit: 0
    json:
      schema: 1
      questions: []
  - name: decision show prints an open question, its lines kept
    argv: [decision, show, q-2, --json]
    exit: 0
    json:
      schema: 1
      ok: true
      question:
        id: q-2
        item: x
        question: "Is the archive\nworth it?"
        status: open
  - name: decision show --json gives the question
    argv: [decision, show, q-1, --json]
    exit: 0
    json:
      schema: 1
      ok: true
      question: { id: q-1, item: x, question: "Labels or Projects?", status: answered, answer: "Labels, with trust by who acted." }
  - name: decision show refuses an id no question has
    argv: [decision, show, q-9, --json]
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-no-question
  - name: decision show takes only a question's id
    argv: [decision, show, x]
    exit: 2
    stderr_has: '"x"'
  - name: decision has no subcommand it does not know
    argv: [decision, list]
    exit: 2
    stderr_has: list
  - name: decision add needs the question
    argv: [decision, add, --item, x]
    exit: 2
    stderr_has: <text>
  - name: decision add asks with the next free id, and commits the file alone, what else is staged left staged
    argv: [decision, add, Should, docs, "need a footer?", --item, x, --json]
    git:
      - commit: "docs: start"
        files: { asks.yaml: *asks }
      - stage: { README.md: "staged\n" }
    exit: 0
    files_after:
      asks.yaml: |
        # The questions to the person the work is for, written by itos decision (itos help decision).
        questions:
          - id: q-1
            item: "x"
            question: "Labels or Projects?"
            answer: "Labels, with trust by who acted."
          - id: q-2
            item: "x"
            question: "Is the archive\nworth it?"
          - id: q-3
            question: "Which way?"
          - id: q-4
            item: "x"
            question: "Should docs need a footer?"
    json_has:
      schema: 1
      ok: true
      question:
        id: q-4
        item: x
        question: Should docs need a footer?
        status: open
      commit: "<any>"
  - name: the first decision add makes the file, its id q-1
    argv: [decision, add, "Which way?", --json]
    git:
      - commit: "docs: start"
        files: { README.md: "start\n" }
    files:
      asks.yaml: null
    exit: 0
    files_after:
      asks.yaml: "# The questions to the person the work is for, written by itos decision (itos help decision).\nquestions:\n  - id: q-1\n    question: \"Which way?\"\n"
    json_has:
      schema: 1
      ok: true
      question:
        id: q-1
        question: Which way?
        status: open
      commit: "<any>"
  - name: decision add refuses an item the registry does not have, and writes nothing
    argv: [decision, add, "Which way?", --item, nope, --json]
    files:
      asks.yaml: null
    exit: 1
    files_after:
      asks.yaml: null
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-unknown-item
  - name: decision add refuses a questions file with changes no commit holds
    argv: [decision, add, "Which way?", --json]
    git: []
    exit: 1
    files_after:
      asks.yaml: *asks
    json:
      schema: 1
      ok: false
      problems:
      - rule: asks-file-uncommitted
  - name: decision add refuses a questions file itos did not write whole, and leaves it as it is
    argv: [decision, add, "Which way?"]
    files:
      asks.yaml: &unknown "questions:\n  - { id: q-1, question: a, status: open }\n"
    exit: 2
    stderr_has: [asks.yaml, status]
    files_after:
      asks.yaml: *unknown
  - name: decision answer keeps the answer beside the question, and commits the file alone
    argv: [decision, answer, q-3, This, way., --json]
    git:
      - commit: "docs: start"
        files: { asks.yaml: *asks }
    exit: 0
    files_after:
      asks.yaml: |
        # The questions to the person the work is for, written by itos decision (itos help decision).
        questions:
          - id: q-1
            item: "x"
            question: "Labels or Projects?"
            answer: "Labels, with trust by who acted."
          - id: q-2
            item: "x"
            question: "Is the archive\nworth it?"
          - id: q-3
            question: "Which way?"
            answer: "This way."
    json_has:
      schema: 1
      ok: true
      question:
        id: q-3
        question: Which way?
        status: answered
        answer: This way.
      commit: "<any>"
  - name: decision answer refuses a question already answered
    argv: [decision, answer, q-1, Projects., --json]
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-answered
  - name: decision answer refuses an id no question has
    argv: [decision, answer, q-7, Yes., --json]
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-no-question
  - name: decision answer needs the answer
    argv: [decision, answer, q-3]
    exit: 2
    stderr_has: <text>
  - name: under a stealth config decision add writes the questions beside its registry and commits nothing
    argv: [decision, add, "Which way?", --item, x, --json]
    git: []
    files:
      itos.yaml: null
      asks.yaml: null
      .git/itos/itos.yaml: "version: 1\nwork: { registry: work-items.yaml }\n"
      .git/itos/work-items.yaml: *registry
    exit: 0
    files_after:
      .git/itos/asks.yaml: "# The questions to the person the work is for, written by itos decision (itos help decision).\nquestions:\n  - id: q-1\n    item: \"x\"\n    question: \"Which way?\"\n"
      .git/itos/work-items.yaml.lock: null
      asks.yaml: null
    json:
      schema: 1
      ok: true
      question:
        id: q-1
        item: x
        question: Which way?
        status: open
      commit: null
  - name: under a stealth config decision answer --json gives the question and no commit
    argv: [decision, answer, q-3, This way., --json]
    git: []
    files:
      itos.yaml: null
      asks.yaml: null
      .git/itos/itos.yaml: "version: 1\nwork: { registry: work-items.yaml }\n"
      .git/itos/asks.yaml: *asks
    exit: 0
    json:
      schema: 1
      ok: true
      question: { id: q-3, question: "Which way?", status: answered, answer: This way. }
      commit: null
  - name: work.asks moves the questions file
    argv: [decision, --all, --json]
    files:
      itos.yaml: "version: 1\nwork: { registry: work-items.yaml, asks: docs/questions.yaml, people: { source: yaml, file: people.yaml } }\n"
      docs/questions.yaml: "questions:\n  - { id: q-5, question: \"Moved?\" }\n"
    exit: 0
    json:
      schema: 1
      questions:
      - id: q-5
        question: Moved?
        status: open
  - name: decision record writes the answer as the first decision record, makes the index, notes the decision and commits them
    argv: [decision, record, q-1, --title, Triage issues with labels, --json]
    git:
      - commit: "docs: start"
        files: { asks.yaml: *asks }
    exit: 0
    files_after:
      asks.yaml: |
        # The questions to the person the work is for, written by itos decision (itos help decision).
        questions:
          - id: q-1
            item: "x"
            question: "Labels or Projects?"
            answer: "Labels, with trust by who acted."
            decision: 1
          - id: q-2
            item: "x"
            question: "Is the archive\nworth it?"
          - id: q-3
            question: "Which way?"
      docs/decisions/README.md: |
        # Decisions

        The decisions that still stand, one record each. A record superseded keeps its
        file and leaves this list, which itos decision record writes.

        <!-- itos:decisions:begin -->

        - [ADR-0001: Triage issues with labels](0001-triage-issues-with-labels.md)

        <!-- itos:decisions:end -->
    json_has:
      schema: 1
      ok: true
      question:
        id: q-1
        item: x
        question: Labels or Projects?
        status: answered
        answer: Labels, with trust by who acted.
        decision: 1
      record: docs/decisions/0001-triage-issues-with-labels.md
      commit: "<any>"
  - name: decision record --supersedes sets the old record's status, and the index keeps its own text and drops it
    argv: [decision, record, q-1, --title, Use labels, --supersedes, "4", --json]
    git:
      - commit: "docs: start"
        files:
          asks.yaml: *asks
          docs/decisions/0004-use-projects.md: "---\nstatus: \"accepted\"\ndate: 2020-01-02\n---\n\n# Use Projects\n\n## Context and Problem Statement\n\nc\n\n## Decision Outcome\n\nd\n"
          docs/decisions/0005-use-go.md: "---\nstatus: accepted\n---\n\n# Use Go\n"
          docs/decisions/README.md: "# Our records\n\n<!-- itos:decisions:begin -->\n- old\n<!-- itos:decisions:end -->\n\nKept.\n"
    exit: 0
    files_after:
      docs/decisions/0004-use-projects.md: "---\nstatus: superseded by ADR-0006\ndate: 2020-01-02\n---\n\n# Use Projects\n\n## Context and Problem Statement\n\nc\n\n## Decision Outcome\n\nd\n"
      docs/decisions/README.md: "# Our records\n\n<!-- itos:decisions:begin -->\n\n- [ADR-0005: Use Go](0005-use-go.md)\n- [ADR-0006: Use labels](0006-use-labels.md)\n\n<!-- itos:decisions:end -->\n\nKept.\n"
    json_has:
      schema: 1
      ok: true
      question:
        id: q-1
        item: x
        question: Labels or Projects?
        status: answered
        answer: Labels, with trust by who acted.
        decision: 6
      record: docs/decisions/0006-use-labels.md
      commit: "<any>"
  - name: decision record writes in the folder work.decisions names, numbered past the highest name there, and reads no .adr-dir
    argv: [decision, record, q-1, --title, Labels!, --option, Labels, --option, Projects, --consequences, Projects stay unused., --json]
    files:
      itos.yaml: "version: 1\nwork: { registry: work-items.yaml, decisions: notes/decisions, people: { source: yaml, file: people.yaml } }\n"
    git:
      - commit: "docs: start"
        files:
          asks.yaml: *asks
          .adr-dir: "elsewhere\n"
          notes/decisions/0008-bare.md: "# Bare\n"
          notes/decisions/0009-old.md: "---\nstatus: superseded by ADR-0010\n---\n\n# Old\n"
          notes/decisions/0010-new.md: "---\nstatus: accepted\n---\n\n# New\n"
          docs/decisions/0042-elsewhere.md: "---\nstatus: accepted\n---\n\n# Elsewhere\n"
    exit: 0
    files_after:
      notes/decisions/README.md: |
        # Decisions

        The decisions that still stand, one record each. A record superseded keeps its
        file and leaves this list, which itos decision record writes.

        <!-- itos:decisions:begin -->

        - [ADR-0008: Bare](0008-bare.md)
        - [ADR-0010: New](0010-new.md)
        - [ADR-0011: Labels!](0011-labels.md)

        <!-- itos:decisions:end -->
      docs/decisions/README.md: null
      elsewhere/README.md: null
    json_has:
      schema: 1
      ok: true
      question:
        id: q-1
        item: x
        question: Labels or Projects?
        status: answered
        answer: Labels, with trust by who acted.
        decision: 11
      record: notes/decisions/0011-labels.md
      commit: "<any>"
  - name: decision record --none marks the answer as recorded nowhere, writes no record and commits the questions alone
    argv: [decision, record, q-1, --none, --json]
    git:
      - commit: "docs: start"
        files: { asks.yaml: *asks }
    exit: 0
    files_after:
      asks.yaml: |
        # The questions to the person the work is for, written by itos decision (itos help decision).
        questions:
          - id: q-1
            item: "x"
            question: "Labels or Projects?"
            answer: "Labels, with trust by who acted."
            decision: none
          - id: q-2
            item: "x"
            question: "Is the archive\nworth it?"
          - id: q-3
            question: "Which way?"
      docs/decisions/README.md: null
    json_has:
      schema: 1
      ok: true
      question:
        id: q-1
        item: x
        question: Labels or Projects?
        status: answered
        answer: Labels, with trust by who acted.
        decision: none
      record: null
      commit: "<any>"
  - name: decision record refuses a question not answered
    argv: [decision, record, q-2, --title, Archive, --json]
    exit: 1
    files_after:
      docs/decisions/README.md: null
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-unanswered
  - name: decision record refuses a question already recorded
    argv: [decision, record, q-1, --none, --json]
    files:
      asks.yaml: "questions:\n  - { id: q-1, question: a, answer: b, decision: 3 }\n"
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-recorded
  - name: decision record refuses to supersede a record the folder does not have, and writes nothing
    argv: [decision, record, q-1, --title, Labels, --supersedes, "2", --json]
    git:
      - commit: "docs: start"
        files: { asks.yaml: *asks }
    exit: 1
    files_after:
      asks.yaml: *asks
      docs/decisions/README.md: null
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-no-decision
  - name: decision record refuses to supersede a record already superseded, and writes nothing
    argv: [decision, record, q-1, --title, Labels, --supersedes, "4", --json]
    git:
      - commit: "docs: start"
        files:
          asks.yaml: *asks
          docs/decisions/0004-use-projects.md: "---\nstatus: superseded by ADR-0005\n---\n\n# Use Projects\n"
          docs/decisions/0005-use-go.md: "---\nstatus: accepted\n---\n\n# Use Go\n"
    exit: 1
    files_after:
      asks.yaml: *asks
      docs/decisions/0004-use-projects.md: "---\nstatus: superseded by ADR-0005\n---\n\n# Use Projects\n"
      docs/decisions/0006-labels.md: null
    json:
      schema: 1
      ok: false
      problems:
      - rule: ask-superseded
  - name: decision record refuses an index with changes no commit holds, and writes nothing
    argv: [decision, record, q-1, --title, Labels, --json]
    git:
      - commit: "docs: start"
        files: { asks.yaml: *asks }
    files:
      docs/decisions/README.md: "mine\n"
    exit: 1
    files_after:
      asks.yaml: *asks
      docs/decisions/README.md: "mine\n"
      docs/decisions/0001-labels.md: null
    json:
      schema: 1
      ok: false
      problems:
      - rule: decision-index-uncommitted
  - name: decision record needs a title, or --none
    argv: [decision, record, q-1]
    exit: 2
    stderr_has: [--title, --none]
  - name: decision record --none takes no title
    argv: [decision, record, q-1, --none, --title, Labels]
    exit: 2
    stderr_has: [--none, --title]
  - name: decision record --option needs a value
    argv: [decision, record, q-1, --title, Labels, --option]
    exit: 2
    stderr_has: --option
  - name: decision record --supersedes takes a record's number
    argv: [decision, record, q-1, --title, Labels, --supersedes, "0004-use-projects"]
    exit: 2
    stderr_has: 0004-use-projects
  - name: under a stealth config decision record writes the records in the git folder and commits nothing
    argv: [decision, record, q-1, --title, Labels, --json]
    git: []
    files:
      itos.yaml: null
      asks.yaml: null
      .git/itos/itos.yaml: "version: 1\nwork: { registry: work-items.yaml }\n"
      .git/itos/asks.yaml: *asks
    exit: 0
    json:
      schema: 1
      ok: true
      question: { id: q-1, item: x, question: "Labels or Projects?", status: answered, answer: "Labels, with trust by who acted.", decision: 1 }
      record: .git/itos/decisions/0001-labels.md
      commit: null
    files_after:
      .git/itos/decisions/README.md: |
        # Decisions

        The decisions that still stand, one record each. A record superseded keeps its
        file and leaves this list, which itos decision record writes.

        <!-- itos:decisions:begin -->

        - [ADR-0001: Labels](0001-labels.md)

        <!-- itos:decisions:end -->
      .git/itos/work-items.yaml.lock: null
      docs/decisions/README.md: null
