# Each commit type's path rules as the project template sets them (itos.yaml's
# `commits`, tasks/README.md's table), the traps they set when a piece of work
# is split into commits, each problem's rule in --json, the config's
# reject_message heading the rejection, a never with an except that takes
# paths back out of it, and another project's rules (the rules are the
# config's).
files:
  itos.yaml: |
    version: 1
    commits:
      types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
      path_sets:
        config:
          - "*.{json,yaml,yml,ts,toml}"
          - .gitignore
          - .editorconfig
          - ".vite-hooks/**"
          - ".github/**"
          - "tools/**"
          - .claude/settings.json
          - index.html
          - src/main.ts
      scopes:
        feat: { must_touch: ["src/**", "e2e/**"] }
        fix: { must_touch: ["src/**"] }
        refactor: { never: ["e2e/features/**"] }
        perf: { never: ["e2e/features/**"] }
        test: { only: ["e2e/**", "**/*.test.ts", "tools/**", playwright.config.ts] }
        build: { only: [$config] }
        ci: { only: [$config] }
        chore: { never: ["src/**"] }
        docs: { only: ["**/*.md", "docs/**", "tasks/**", "e2e/features/**"] }
        style: {}
      reject_message: "Commit rejected (see tasks/README.md):"
cases:
  - name: docs may touch prose, the ledger and the feature files
    argv: [commit, check-paths, --type, docs, PLAN.md, tasks/phase-0.yaml, tasks/work-items.yaml, e2e/features/list.feature, tools/README.md]
    exit: 0
  - name: docs may not touch config, tools or source
    argv: [commit, check-paths, --json, --type, docs, vite.config.ts, tools/itos/main.ts, src/app/view.ts]
    exit: 1
    json:
      schema: 1
      type: docs
      files: [vite.config.ts, tools/itos/main.ts, src/app/view.ts]
      ok: false
      problems:
        - rule: scope-only
        - rule: scope-only
        - rule: scope-only
  # From a subfolder itos runs at the repository's top, where itos.yaml is
  # (slice 40), and reads a path typed there from the subfolder, as git
  # reads one, naming it from the top.
  - name: from a subfolder, a path is read from it and named from the top
    argv: [commit, check-paths, --json, --type, docs, list.feature, ../../src/app/view.ts]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
    files: { e2e/features/: "" }
    cwd: e2e/features
    exit: 1
    json:
      schema: 1
      type: docs
      files: [e2e/features/list.feature, src/app/view.ts]
      ok: false
      problems:
        - rule: scope-only
  - name: build may touch the root config, hooks, workflows, tools, index.html and src/main.ts
    argv: [commit, check-paths, --type, build, package.json, vite.config.ts, .vite-hooks/pre-push, .github/workflows/ci.yml, tools/itos/main.ts, index.html, src/main.ts, .claude/settings.json, .gitignore]
    exit: 0
  - name: build may not touch the ledger, nor source beyond src/main.ts
    argv: [commit, check-paths, --json, --type, build, tasks/phase-3.yaml, src/app/view.ts, docs/config.yaml]
    exit: 1
    json:
      schema: 1
      type: build
      files: [tasks/phase-3.yaml, src/app/view.ts, docs/config.yaml]
      ok: false
      problems:
        - rule: scope-only
        - rule: scope-only
        - rule: scope-only
  # A problem names no path but in its message, so a case whose paths are
  # held apart shows which: those that pass in one, those refused in another.
  - name: ci may touch what build may
    argv: [commit, check-paths, --type, ci, .github/workflows/nightly.yml]
    exit: 0
  - name: ci may not touch what build may not
    argv: [commit, check-paths, --json, --type, ci, tasks/phase-3.yaml]
    exit: 1
    json:
      schema: 1
      type: ci
      files: [tasks/phase-3.yaml]
      ok: false
      problems:
        - rule: scope-only
  - name: refactor may not touch the feature files
    argv: [commit, check-paths, --json, --type, refactor, e2e/features/list.feature]
    exit: 1
    json:
      schema: 1
      type: refactor
      files: [e2e/features/list.feature]
      ok: false
      problems:
        - rule: scope-never
  - name: perf may not touch the feature files
    argv: [commit, check-paths, --json, --type, perf, e2e/features/list.feature]
    exit: 1
    json:
      schema: 1
      type: perf
      files: [e2e/features/list.feature]
      ok: false
      problems:
        - rule: scope-never
  - name: test may touch e2e, unit tests, tools and the Playwright config
    argv: [commit, check-paths, --type, test, e2e/steps/a.ts, src/a.test.ts, tools/x.ts, playwright.config.ts]
    exit: 0
  - name: test may not touch source or prose
    argv: [commit, check-paths, --json, --type, test, src/a.ts, README.md]
    exit: 1
    json:
      schema: 1
      type: test
      files: [src/a.ts, README.md]
      ok: false
      problems:
        - rule: scope-only
        - rule: scope-only
  - name: feat must change src or e2e
    argv: [commit, check-paths, --json, --type, feat, docs/a.md]
    exit: 1
    json:
      schema: 1
      type: feat
      files: [docs/a.md]
      ok: false
      problems:
        - rule: scope-must-touch
  - name: feat that changes e2e passes
    argv: [commit, check-paths, --type, feat, e2e/features/list.feature, docs/a.md]
    exit: 0
  - name: fix must change src
    argv: [commit, check-paths, --json, --type, fix, e2e/steps/a.ts]
    exit: 1
    json:
      schema: 1
      type: fix
      files: [e2e/steps/a.ts]
      ok: false
      problems:
        - rule: scope-must-touch
  - name: chore may touch anything but src
    argv: [commit, check-paths, --type, chore, package.json, docs/a.md]
    exit: 0
  - name: chore may not touch src
    argv: [commit, check-paths, --json, --type, chore, src/a.ts]
    exit: 1
    json:
      schema: 1
      type: chore
      files: [src/a.ts]
      ok: false
      problems:
        - rule: scope-never
  - name: style has no rule
    argv: [commit, check-paths, --type, style, src/a.ts, tasks/phase-1.yaml]
    exit: 0
  - name: a type with no scope passes any path (the header lint's business)
    argv: [commit, check-paths, --type, revert, src/a.ts, tasks/phase-1.yaml]
    exit: 0
  - name: a type the config does not know passes any path
    argv: [commit, check-paths, --type, wip, src/a.ts]
    exit: 0
  - name: --json of a split that holds
    argv: [commit, check-paths, --type, test, --json, tools/itos/run.ts]
    exit: 0
    json:
      schema: 1
      type: test
      files: [tools/itos/run.ts]
      ok: true
      problems: []
  # Slice 81: a scope's except takes paths back out of its never, and
  # $sets work in it as in never.
  - name: except takes a path back out of never
    argv: [commit, check-paths, --type, chore, src/games/cielo/themes/colours.ts, package.json]
    env: { ITOS_CONFIG: themes.yaml }
    files:
      themes.yaml: &themes |
        version: 1
        commits:
          types: [feat, chore, docs]
          path_sets:
            themes: ["src/games/*/themes/**"]
          scopes:
            feat: {}
            chore: { never: ["src/**"], except: [$themes] }
            docs: { only: ["**/*.md"] }
    exit: 0
  - name: --json of a path under never that except does not name
    argv: [commit, check-paths, --type, chore, --json, src/games/cielo/sim/nudo.ts]
    env: { ITOS_CONFIG: themes.yaml }
    files:
      themes.yaml: *themes
    exit: 1
    json:
      schema: 1
      type: chore
      files: [src/games/cielo/sim/nudo.ts]
      ok: false
      problems:
        - rule: scope-never
  - name: another project's rules, from the config ITOS_CONFIG names (lax-refactor)
    argv: [commit, check-paths, --type, refactor, e2e/features/list.feature]
    env: { ITOS_CONFIG: lax.yaml }
    files:
      lax.yaml: &lax |
        version: 1
        commits:
          types: [feat, fix, refactor, docs]
          scopes:
            refactor: { never: ["data/**"] }
    exit: 0
  - name: another project's never rejects what it names
    argv: [commit, check-paths, --json, --type, refactor, data/a.json]
    env: { ITOS_CONFIG: lax.yaml }
    files:
      lax.yaml: *lax
    exit: 1
    json:
      schema: 1
      type: refactor
      files: [data/a.json]
      ok: false
      problems:
        - rule: scope-never
  # reject_message is a sentence for people, so the case holds only that the
  # config's own heads the rejection.
  - name: the config's reject_message heads the rejection
    argv: [commit, check-paths, --type, docs, src/a.ts]
    exit: 1
    stderr_has: "Commit rejected (see tasks/README.md):"
  - name: a scope for a type that is not a commit type is a config error
    argv: [commit, check-paths, --json, --type, docs, a.md]
    files:
      itos.yaml: |
        version: 1
        commits:
          types: [docs]
          scopes:
            doc: { only: ["**/*.md"] }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - rule: config-scope-type
  - name: a config without commits cannot check paths
    argv: [commit, check-paths, --json, --type, docs, a.md]
    files:
      itos.yaml: "version: 1\n"
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - rule: config-missing-section
