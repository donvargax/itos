# The CI driver (`ci run`): the plan carried out in cost order with the
# config's `ci.env`, the first failure ending the run (a failing step's
# own exit code, a task check's 1, unknown tasks before anything runs, named
# against the ledger's folder; the nightly goes on past a failing step and
# names each later one), the tasks read from the footer whose source is
# the ledger whatever its key, a
# check recognized as the smoke run merged when there is a run of named tests
# and run as itself when there is none, the nightly's tasks step refused
# before any step runs, a missing ledger folder stopping it at the plan (2), a named task waiting on
# the registry beside the ledger, --tests running the run of named tests alone,
# each case judged by --json's verdict, whose failures lists every failure; the steps and checks are `echo`s, so the log on stderr shows loosely what ran.
git:
  - commit: "build: the scratch project"
    files:
      e2e/smoke.yaml: "- file: a.feature\n  scenarios: [{ id: \"@ID-A-01\", why: opens }]\n"
      e2e/features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: One\n    When I press one\n\n  @ID-A-02\n  Scenario: Two\n    When I press two\n"
      tasks/work-items.yaml: "items:\n  - { id: T-040, status: todo }\n"
      tasks/phase-1.yaml: |
        - id: T-010
          type: build
          title: Every kind of check
          done_when:
            - run: echo a static check
              cost: static
            - run: vp test run
            - run: echo "a late check sees CI=$CI"
            - run: run-scenarios "@ID-A-02"
            - run: sh gates.sh
            - fails: "false"
            - run: echo only after the push
              after: push
        - id: T-011
          type: build
          title: A check that fails
          done_when:
            - run: echo first
            - run: sh -c 'echo broken; exit 4'
            - run: echo never
        - { id: T-040, type: build, title: Not started, done_when: [{ run: echo waits }] }
        - id: T-041
          type: build
          title: Prose and code
          done_when:
            - run: echo reads prose
              prose: true
            - run: echo reads code
        - id: T-012
          type: build
          title: The smoke run
          done_when:
            - run: sh run-smoke.sh
    label: base
  - commit: "build: every kind\n\nTask: T-010\n"
    files: { tools/a.sh: "1\n" }
    label: every
  - commit: "build: a failing check\n\nTask: T-011\n"
    files: { tools/a.sh: "2\n" }
    label: failing
  - commit: "build: unknown and not started\n\nTask: T-044, T-040\n"
    files: { tools/a.sh: "3\n" }
    label: unknown
  - commit: "build: not started\n\nTask: T-040\n"
    files: { tools/a.sh: "4\n" }
    label: waiting
  - commit: "docs: prose\n\nTask: T-041\n"
    files: { docs/a.md: "# A\n" }
    label: prose
  - commit: "build: the smoke run\n\nTask: T-012\n"
    files: { tools/a.sh: "5\n" }
    label: smoke
  - commit: "build: named in another footer\n\nWork: T-041\n"
    files: { tools/a.sh: "6\n" }
    label: work
  - commit: "feat: code\n"
    files: { tools/a.sh: "7\n" }
    label: code
files:
  itos.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
    commits:
      footers:
        Task: { source: ledger, validate_for: all, read_at: commit }
    tests:
      scenario:
        root: e2e/features
        id: "ID-[A-Z]+-\\d+"
        tag_prefix: "@"
        run: { whole: "echo run every scenario", select: "printf 'run %s\\n' {pattern}", ids_pattern: "@(?:{ids})\\b" }
        recognize:
          - { command: "run-scenarios {pattern}", as: pattern }
          - { command: "sh run-smoke.sh", as: smoke }
        smoke: { file: e2e/smoke.yaml }
    ci:
      env: { CI: "1" }
      steps:
        - { run: echo lint, cost: static }
        - { run: echo unit tests, cost: late }
        - { tests: scenario }
      prose: { paths: ["**/*.md", "docs/**"], steps: [echo lint] }
      cost: { static: ["^echo lint$"], keep_written_order: true }
      covers: [{ by: echo unit tests, matches: "^vp test run$" }]
      nightly_only: [sh gates.sh]
      nightly: { steps: [{ tests: scenario, whole: true }, sh gates.sh] }
    work: { registry: tasks/work-items.yaml }
  gates.sh: "echo the gates self-test\n"
  run-smoke.sh: "echo the smoke run as itself\n"
cases:
  - name: a push's run runs the plan's steps and checks with ci.env, the named tests in one merged run
    argv: [ci, run, "{{sha.base}}", "{{sha.every}}", --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: ["\nlint\n", "\na static check\n", "\nunit tests\n", "\nrun @(?:ID-A-01)\\b|@ID-A-02\n", "\na late check sees CI=1\n"]
    stderr_lacks: "\nrun @ID-A-02\n"
  - name: --tests runs the range's run of named tests alone, merged as the run merges it
    argv: [ci, run, "{{sha.base}}", "{{sha.every}}", --tests, --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: "\nrun @(?:ID-A-01)\\b|@ID-A-02\n"
    stderr_lacks: ["\nlint\n", "\na static check\n", "\nunit tests\n", "\na late check sees CI=1\n"]
  - name: --tests with no run of named tests for the range runs nothing and says so
    argv: [ci, run, "{{sha.prose}}", "{{sha.smoke}}", --tests, --json]
    files: { e2e/smoke.yaml: "[]\n" }
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: "no named tests"
    stderr_lacks: ["\nlint\n", "\nunit tests\n", "\nthe smoke run as itself\n"]
  - name: --tests with --nightly runs the nightly's tests step alone
    argv: [ci, run, --nightly, --tests, --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: "\nrun every scenario\n"
    stderr_lacks: "\nthe gates self-test\n"
  - name: a check recognized as the smoke run is in the run of named tests
    argv: [ci, run, "{{sha.prose}}", "{{sha.smoke}}", --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: "\nrun @(?:ID-A-01)\\b\n"
    stderr_lacks: "\nthe smoke run as itself\n"
  - name: with an empty smoke set and no test named there is no such run, so the check runs as itself
    argv: [ci, run, "{{sha.prose}}", "{{sha.smoke}}", --json]
    files: { e2e/smoke.yaml: "[]\n" }
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: "\nthe smoke run as itself\n"
    stderr_lacks: "\nrun @"
  - name: a failing check ends the run, naming the task
    argv: [ci, run, "{{sha.every}}", "{{sha.failing}}", --json]
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { task: T-011, title: A check that fails, command: sh -c 'echo broken; exit 4', code: 1 }
      failures: [{ task: T-011, title: A check that fails, command: sh -c 'echo broken; exit 4', code: 1 }]
    stderr_has: ["\nfirst\n", "\nbroken\n"]
    stderr_lacks: ["echo never", "\nnever\n"]
  - name: a failing step ends the run with exit 1, naming its own exit code
    argv: [ci, run, "{{sha.every}}", "{{sha.failing}}", --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps:
            - { run: echo lint, cost: static }
            - { run: "sh -c 'echo tests fail; exit 3'", cost: late }
            - { run: echo never, cost: late }
        tests:
          scenario: { root: e2e/features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: e2e/smoke.yaml } }
        work: { registry: tasks/work-items.yaml }
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { step: sh -c 'echo tests fail; exit 3', code: 3 }
      failures: [{ step: sh -c 'echo tests fail; exit 3', code: 3 }]
    stderr_has: "\ntests fail\n"
    stderr_lacks: ["echo never", "\nnever\n", "\nfirst\n"]
  - name: with ci.stop_at_first_failure false every step and check runs, and the first failure is named
    argv: [ci, run, "{{sha.every}}", "{{sha.failing}}", --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps:
            - { run: echo lint, cost: static }
            - { run: "sh -c 'echo tests fail; exit 3'", cost: late }
            - { run: echo still runs, cost: late }
          stop_at_first_failure: false
        tests:
          scenario: { root: e2e/features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: e2e/smoke.yaml } }
        work: { registry: tasks/work-items.yaml }
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { step: sh -c 'echo tests fail; exit 3', code: 3 }
      failures:
        - { step: sh -c 'echo tests fail; exit 3', code: 3 }
        - { task: T-011, title: A check that fails, command: sh -c 'echo broken; exit 4', code: 1 }
    stderr_has: ["\ntests fail\n", "\nstill runs\n", "\nfirst\n", "\nbroken\n", "\nnever\n"]
  - name: a code proof that finds a survivor fails the run, naming the problem, and --json carries it
    argv: [ci, run, "{{sha.smoke}}", "{{sha.code}}", --json]
    files:
      proof.sh: |
        printf '%s\n' '{"schema":1,"ok":false,"problems":[{"rule":"mutation.survived","message":"src/a.ts:3:9: a mutant of Total survived","fix":"test it"}]}'
        exit 1
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps:
            - { run: echo lint, cost: static }
            - { run: echo unit, cost: late }
          cost: { static: ["^echo lint$"] }
        proof:
          code:
            paths: ["tools/**"]
            check: "sh proof.sh mutation check --since {base} --fail-uncovered --json"
        work: { registry: tasks/work-items.yaml }
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at:
        step: sh proof.sh mutation check --since {{sha.smoke}} --fail-uncovered --json
        problems: [{ rule: mutation.survived }]
        code: 1
      failures:
        - step: sh proof.sh mutation check --since {{sha.smoke}} --fail-uncovered --json
          problems: [{ rule: mutation.survived }]
          code: 1
      proof:
        command: sh proof.sh mutation check --since {{sha.smoke}} --fail-uncovered --json
        from: "{{sha.smoke}}"
        to: "{{sha.code}}"
        outcome: refused
        summary: null
    stdout_has: "src/a.ts:3:9"

  - name: a code proof that reports what it judged logs it, and --json carries it
    argv: [ci, run, "{{sha.smoke}}", "{{sha.code}}", --json]
    files:
      proof.sh: |
        printf '%s\n' '{"itos_proof":{"version":1,"judged":3,"unit":"function","killed":7}}'
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps:
            - { run: echo lint, cost: static }
          cost: { static: ["^echo lint$"] }
        proof:
          code:
            paths: ["tools/**"]
            check: "sh proof.sh --since {base} --json"
        work: { registry: tasks/work-items.yaml }
    exit: 0
    json:
      schema: 1
      ok: true
      proof:
        command: sh proof.sh --since {{sha.smoke}} --json
        from: "{{sha.smoke}}"
        to: "{{sha.code}}"
        outcome: passed
        summary:
          version: 1
          judged: 3
          unit: function
          files: null
          killed: 7
          survived: null
          excepted: null
          uncovered: null
    stderr_has: ["\nCode proof summary: judged=3; unit=function; killed=7\n"]

  - name: a code proof that cannot run fails the run, never a pass
    argv: [ci, run, "{{sha.smoke}}", "{{sha.code}}", --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps:
            - { run: echo lint, cost: static }
          cost: { static: ["^echo lint$"] }
        proof:
          code:
            paths: ["tools/**"]
            check: "sh -c 'exit 3' --since {base}"
        work: { registry: tasks/work-items.yaml }
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { step: "sh -c 'exit 3' --since {{sha.smoke}}", problems: [{ rule: ci-code-proof }], code: 1 }
      failures: [{ step: "sh -c 'exit 3' --since {{sha.smoke}}", problems: [{ rule: ci-code-proof }], code: 1 }]
      proof:
        command: "sh -c 'exit 3' --since {{sha.smoke}}"
        from: "{{sha.smoke}}"
        to: "{{sha.code}}"
        outcome: cannot-run
        summary: null

  - name: a CI with no tests step reads no kind of named tests and no smoke set
    argv: [ci, run, "{{sha.unknown}}", "{{sha.waiting}}", --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps: [echo lint]
        work: { registry: tasks/work-items.yaml }
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: "\nlint\n"
    stderr_lacks: "\nrun @"
  - name: a step and a check run through the config's shell
    argv: [ci, run, "{{sha.every}}", "{{sha.failing}}", --json]
    files:
      itos.yaml: |
        version: 1
        shell: [sh, -c, 'echo "through the shell: $1"; eval "$1"', sh]
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps:
            - { run: echo lint, cost: static }
        tests:
          scenario: { root: e2e/features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: e2e/smoke.yaml } }
        work: { registry: tasks/work-items.yaml }
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { task: T-011, title: A check that fails, command: sh -c 'echo broken; exit 4', code: 1 }
      failures: [{ task: T-011, title: A check that fails, command: sh -c 'echo broken; exit 4', code: 1 }]
    stderr_has: ["through the shell: echo lint", "through the shell: echo first", "through the shell: sh -c 'echo broken; exit 4'"]
  - name: a task no task file has fails the run before anything runs
    argv: [ci, run, "{{sha.failing}}", "{{sha.unknown}}", --json]
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { unknown: [T-044], code: 1 }
      failures: [{ unknown: [T-044], code: 1 }]
    stderr_has: tasks/
    stderr_lacks: ["\nlint\n", "\nunit tests\n"]
  - name: a task the ledger lacks is reported against the ledger's own folder
    argv: [ci, run, "{{sha.failing}}", "{{sha.unknown}}", --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "work/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps: [echo lint]
        work: { registry: tasks/work-items.yaml }
      work/phase-1.yaml: "- { id: T-040, type: build, title: Not started }\n"
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { unknown: [T-044], code: 1 }
      failures: [{ unknown: [T-044], code: 1 }]
    stderr_has: work/
  - name: without work.registry, a named task waits on the registry beside a ledger in another folder
    argv: [ci, run, "{{sha.unknown}}", "{{sha.waiting}}", --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "work/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps: [echo lint]
        work: {}
      work/phase-1.yaml: "- { id: T-040, type: build, title: Not started, done_when: [{ run: echo waits }] }\n"
      work/work-items.yaml: "items:\n  - { id: T-040, status: todo }\n"
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: [T-040, work/work-items.yaml, "\nlint\n"]
    stderr_lacks: "\nwaits\n"
  - name: the tasks a range names are read from the ledger footer, whatever its key
    argv: [ci, run, "{{sha.smoke}}", "{{sha.work}}", --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Work: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps: [echo lint]
        work: { registry: tasks/work-items.yaml }
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: ["\nreads prose\n", "\nreads code\n"]
  - name: the ledger folder missing stops the run at the plan, before any step
    argv: [ci, run, "{{sha.base}}", "{{sha.every}}", --json]
    files: { tasks: null }
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: ledger-folder-missing }] }
    stderr_lacks: ["\nlint\n", "\na static check\n"]
  - name: a task not started is named, and its checks wait
    argv: [ci, run, "{{sha.unknown}}", "{{sha.waiting}}", --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: [T-040, tasks/work-items.yaml, "\nrun @(?:ID-A-01)\\b\n"]
    stderr_lacks: "\nwaits\n"
  - name: a prose-only range runs the prose steps and the prose checks
    argv: [ci, run, "{{sha.waiting}}", "{{sha.prose}}", --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: ["\nlint\n", "\nreads prose\n"]
    stderr_lacks: ["\nreads code\n", "\nunit tests\n"]
  - name: the nightly runs every scenario, then its own steps
    argv: [ci, run, --nightly, --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: ["\nrun every scenario\n", "\nthe gates self-test\n"]
  - name: the nightly refuses a tasks step, which v8 removed, before any step runs
    argv: [ci, run, --nightly, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        tests:
          scenario:
            root: e2e/features
            id: "ID-[A-Z]+-\\d+"
            tag_prefix: "@"
            run: { whole: "echo run every scenario", select: "printf 'run %s\\n' {pattern}", ids_pattern: "@(?:{ids})\\b" }
            recognize:
              - { command: "run-scenarios {pattern}", as: pattern }
              - { command: "sh run-smoke.sh", as: smoke }
            smoke: { file: e2e/smoke.yaml }
        ci:
          env: { CI: "1" }
          steps:
            - { run: echo lint, cost: static }
            - { run: echo unit tests, cost: late }
            - { tests: scenario }
          prose: { paths: ["**/*.md", "docs/**"], steps: [echo lint] }
          cost: { static: ["^echo lint$"], keep_written_order: true }
          covers: [{ by: echo unit tests, matches: "^vp test run$" }]
          nightly_only: [sh gates.sh]
          nightly: { steps: [{ tests: scenario, whole: true }, sh gates.sh, { tasks: done }] }
        work: { registry: tasks/work-items.yaml }
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: config-step-tasks }] }
    stderr_lacks: ["\nrun every scenario\n", "\nthe gates self-test\n"]
  - name: the nightly goes on past a failing step though ci.stop_at_first_failure is true, naming each failure
    argv: [ci, run, --nightly, --json]
    files:
      itos.yaml: &nightly-fails |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: commit }
        ci:
          steps: [echo lint]
          stop_at_first_failure: true
          nightly: { steps: ["sh -c 'echo first fails; exit 3'", echo still runs, "sh -c 'echo second fails; exit 4'"] }
        work: { registry: tasks/work-items.yaml }
    exit: 1
    json:
      schema: 1
      ok: false
      failed_at: { step: sh -c 'echo first fails; exit 3', code: 3 }
      failures:
        - { step: sh -c 'echo first fails; exit 3', code: 3 }
        - { step: sh -c 'echo second fails; exit 4', code: 4 }
    stderr_has: ["\nfirst fails\n", "\nstill runs\n", "\nsecond fails\n"]
  - name: with no range, every step and every test
    argv: [ci, run, --json]
    exit: 0
    json: { schema: 1, ok: true }
    stderr_has: ["\nlint\n", "\nunit tests\n", "\nrun every scenario\n"]
