# itos status (slice 67): where the work stands, for the person a session
# works for (--as, else the identity provider): the remote branch's head,
# asked of the remote, else as last fetched, and its CI run, looked at once
# through ci.watch's provider and never waited for, a run still going said to
# be going; the person's items in progress; the next ones they can start,
# theirs and the unowned, in the queue's order and the unqueued after, five
# at most; the open questions. What cannot be reached (no remote, a remote
# that does not answer, ci.watch.provider none, a provider that cannot look)
# is a line, and the rest prints, exit 0. itos go prints it after the guide,
# and skips one that cannot be computed with a line on stderr.
#
# Slice 70: after the head and its CI run, the newest release, the highest tag
# v<semver> on the remote (asked of it as the head is, else as last fetched),
# and the commits since it the next release would carry, the feat, fix and
# breaking ones as tools/bin/release-version counts them, read from the
# commits as fetched here, saying they may be behind when the head is not.
#
# Slice 72: after the head's CI run, the last nightly's, looked at once
# through the same provider: the newest run of ci.watch.github.nightly_workflow
# on the branch. A provider naming no nightly prints no nightly line.
#
# Slice 73: while the head's run is going or did not pass, the commit main
# last proved follows it, as ci.range's provider names it, read once: the
# nearest of the head's first parents, the head included, with a green run
# (bug 24); its header when it is fetched here, its SHA alone when not; a
# provider that fails is a line, and provider none prints nothing.
#
# The remote is a bare one in the git folder, .git/origin.git, holding the
# repository's one commit. GitHub is the runner's fake (tools/bin/conformance), its run
# answering for any commit, and the person is the one a fake gh, bin/gh, says
# it is signed in as (work.identity's github provider): v5.0.0 removed the
# command providers this corpus faked them with (slice 85).
files:
  itos.yaml: |
    version: 1
    work:
      registry: work-items.yaml
      people: { source: yaml, file: people.yaml }
    ci:
      steps: []
      watch: { provider: github, interval: 0 }
  bin/gh: { text: "#!/bin/sh\necho a\n", executable: true }
  people.yaml: "- a\n- b\n"
  work-items.yaml: |
    phases: { 1: a, 2: null }
    queue: [free, phased]
    items:
      - { id: busy, title: Busy, phase: 1, owner: a, status: doing, depends_on: [] }
      - { id: ready, title: Ready, phase: 1, owner: a, status: todo, depends_on: [] }
      - { id: later, title: Later, phase: 1, owner: a, status: todo, depends_on: [ready] }
      - { id: phased, title: Owned by the phase, phase: 1, owner: null, status: todo, depends_on: [] }
      - { id: free, title: Free, phase: 2, owner: null, status: todo, depends_on: [] }
      - { id: theirs, title: Theirs, phase: 1, owner: b, status: todo, depends_on: [] }
      - { id: idea, title: An idea, phase: 1, owner: a, status: todo, kind: idea, depends_on: [] }
  asks.yaml: |
    # The questions to the person the work is for, written by itos decision (itos help decision).
    questions:
      - id: q-1
        question: "Labels or Projects?"
        answer: "Labels."
      - id: q-2
        item: "ready"
        question: "Which way?"
env: { PATH: "{{dir}}/bin:{{PATH}}" }
github:
  runs:
    - head_sha: "*"
      html_url: "https://ci.example/runs/{sha}"
      status: completed
      conclusion: success
      jobs: [{ name: ci, status: completed, conclusion: success }]
git:
  - commit: "chore: first"
    files: { README.md: "first\n" }
  - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    label: head
cases:
  - name: status --as lists another person's work
    argv: [status, --as, b, --json]
    exit: 0
    json_has:
      person: b
      doing: []
      next: [{ id: free, owner: null }, { id: theirs, owner: b }]
      more: 0
  - name: a run still going is said to be going, never waited for
    argv: [status, --json]
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
    exit: 0
    json_has:
      ci: { result: going, run: { url: "https://ci.example/runs/1", status: in_progress } }
  - name: a run that failed names the jobs that failed
    argv: [status, --json]
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: failure
          jobs:
            - { name: ci, status: completed, conclusion: failure }
            - { name: platform, status: completed, conclusion: success }
    exit: 0
    json_has:
      ci:
        result: failure
        run: { url: "https://ci.example/runs/1", conclusion: failure, jobs: [{ name: ci, conclusion: failure }, { name: platform, conclusion: success }] }
  - name: the last nightly's run follows the head's, the jobs that failed named
    argv: [status, --json]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/7"
          status: completed
          conclusion: failure
          jobs: [{ name: nightly, status: completed, conclusion: failure }]
    exit: 0
    json_has:
      ci: { result: success }
      nightly: { url: "https://ci.example/nightly/7", conclusion: failure, jobs: [{ name: nightly, conclusion: failure }] }
      release: null
  - name: a nightly still going is said to be going
    argv: [status, --json]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/8"
          status: in_progress
          jobs: [{ name: nightly, status: in_progress }]
    exit: 0
    json_has:
      nightly: { url: "https://ci.example/nightly/8", status: in_progress }
  - name: a refusal from GitHub's API is a line for the run and the nightly, and the rest prints
    argv: [status, --json]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github: { refuse: true }
    exit: 0
    json_has:
      head: { commit: "{{sha.head}}", header: "chore: first" }
      ci: null
      nightly: null
      doing: [{ id: busy }]
    stdout_has: [401 Unauthorized, /repos/owner/name/actions/workflows/ci.yml/runs, /repos/owner/name/actions/workflows/nightly.yml/runs]
  - name: with ci.watch.provider none the CI run is not read
    argv: [status, --json]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
    exit: 0
    json_has:
      head: { commit: "{{sha.head}}", header: "chore: first" }
      ci: null
    stdout_has: ci.watch.provider
  - name: while the head's run is going, main's last green commit follows it, before the nightly
    argv: [status, --json]
    git:
      - commit: "fix: one"
        files: { a.txt: "one\n" }
        label: green
      - commit: "feat: two"
        files: { b.txt: "two\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
        - { head_sha: "{{sha.green}}", status: completed, conclusion: success }
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/7"
          status: completed
          conclusion: success
          jobs: [{ name: nightly, status: completed, conclusion: success }]
    exit: 0
    json_has:
      head: { commit: "{{sha.head}}", header: "feat: two" }
      ci: { result: going, run: { url: "https://ci.example/runs/1" } }
      last_green: { commit: "{{sha.green}}", header: "fix: one" }
      nightly: { url: "https://ci.example/nightly/7", conclusion: success }
  - name: a head's run that failed is followed by main's last green commit
    argv: [status, --json]
    git:
      - commit: "fix: one"
        files: { a.txt: "one\n" }
        label: green
      - commit: "feat: two"
        files: { b.txt: "two\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0 }
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: failure
          jobs: [{ name: ci, status: completed, conclusion: failure }]
        - { head_sha: "{{sha.green}}", status: completed, conclusion: success }
    exit: 0
    json_has:
      ci: { result: failure, run: { url: "https://ci.example/runs/1" } }
      last_green: { commit: "{{sha.green}}", header: "fix: one" }
      release: null
  - name: no green run of the head's first parents names no last green commit
    argv: [status]
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
    exit: 0
    stdout_has: "Last green: none found"
  - name: with ci.range's provider none no last green commit is read
    argv: [status, --json]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          range: { provider: none }
          watch: { provider: github, interval: 0 }
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
    exit: 0
    json_has:
      ci: { result: going }
      last_green: null
  - name: when the head's run passed no last green commit is read
    argv: [status, --json]
    exit: 0
    json_has:
      ci: { result: success }
      last_green: null
  - name: with no remote neither the head nor its CI run is read, and the rest prints
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
    exit: 0
    json_has:
      head: null
      ci: null
      doing: [{ id: busy }]
      next: [{ id: free }, { id: phased }, { id: ready }]
      questions: [{ id: q-2 }]
    stdout_has: origin
  - name: a remote that cannot be reached is read as last fetched
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
        label: head
      - run: git remote add origin .git/nowhere.git && git update-ref refs/remotes/origin/main HEAD
    exit: 0
    json_has:
      head: { commit: "{{sha.head}}", header: "chore: first", last_fetched: true }
      ci: { result: success, run: { url: "https://ci.example/runs/{{sha.head}}" } }
  - name: a remote without the branch has no head to read
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    exit: 0
    json_has:
      head: null
      ci: null
    stdout_has: [origin, main]
  - name: status lists five of the next items, and says how many more
    argv: [status, --json]
    files:
      work-items.yaml: |
        phases: { 1: a }
        items:
          - { id: n1, title: One, phase: 1, owner: a, status: todo }
          - { id: n2, title: Two, phase: 1, owner: a, status: todo }
          - { id: n3, title: Three, phase: 1, owner: a, status: todo }
          - { id: n4, title: Four, phase: 1, owner: a, status: todo }
          - { id: n5, title: Five, phase: 1, owner: a, status: todo }
          - { id: n6, title: Six, phase: 1, owner: a, status: todo }
          - { id: n7, title: Seven, phase: 1, owner: a, status: todo }
      asks.yaml: null
    exit: 0
    json_has:
      schema: 1
      person: a
      head:
        remote: origin
        branch: main
        commit: "{{sha.head}}"
        header: "chore: first"
        last_fetched: false
      ci:
        result: success
        run:
          url: https://ci.example/runs/{{sha.head}}
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly: null
      release: null
      unreleased: null
      itos: null
      agent_rules: null
      doing: []
      next:
        - { id: n1, title: One, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
        - { id: n2, title: Two, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
        - { id: n3, title: Three, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
        - { id: n4, title: Four, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
        - { id: n5, title: Five, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
      more: 2
      questions: []
      drafts: []
    stdout_lacks: ['"n6"', '"n7"']
  - name: a long question is cut short
    argv: [status]
    files:
      asks.yaml: |
        # The questions to the person the work is for, written by itos decision (itos help decision).
        questions:
          - id: q-1
            question: "Should the status print a question in full, however long it is, or cut it short so it reads at a glance?"
    exit: 0
    stdout_has: "or cut it short…"
  - name: status --json
    argv: [status, --json]
    exit: 0
    json_has:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "chore: first", last_fetched: false }
      ci:
        result: success
        run:
          url: "https://ci.example/runs/{{sha.head}}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly: null
      release: null
      unreleased: null
      itos: null
      agent_rules: null
      doing: [{ id: busy, title: Busy, phase: 1, owner: a, status: doing, depends_on: [], tags: [] }]
      next:
        - { id: free, title: Free, phase: 2, owner: null, status: todo, depends_on: [], tags: [] }
        - { id: phased, title: Owned by the phase, phase: 1, owner: null, status: todo, depends_on: [], tags: [] }
        - { id: ready, title: Ready, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
      more: 0
      questions: [{ id: q-2, item: ready, question: "Which way?", status: open }]
      drafts: []
  - name: status --json lists what could not be reached
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
    files:
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    exit: 0
    json_has:
      schema: 1
      person: a
      head: null
      ci: null
      last_green: null
      nightly: null
      release: null
      unreleased: null
      itos: null
      agent_rules: null
      doing: []
      next: []
      more: 0
      questions: []
      drafts: []
    stdout_has: origin
  # Slice 135: the head's line names the repository's visibility, as
  # ci.watch's provider tells it (GitHub's repository, its visibility), and
  # --json's head holds it; a provider that cannot tell it, as the fake GitHub
  # answering the repository 404 above, says nothing of it.
  - name: status names a public repository on the main branch's line
    argv: [status, --json]
    github:
      visibility: public
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
    exit: 0
    json_has:
      head: { commit: "{{sha.head}}", visibility: public }
  - name: status --json gives the repository's visibility in its head
    argv: [status, --json]
    github:
      visibility: private
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
    exit: 0
    json_has:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "chore: first", last_fetched: false, visibility: private }
      ci:
        result: success
        run:
          url: "https://ci.example/runs/{{sha.head}}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly: null
      release: null
      unreleased: null
      itos: null
      agent_rules: null
      doing: [{ id: busy, title: Busy, phase: 1, owner: a, status: doing, depends_on: [], tags: [] }]
      next:
        - { id: free, title: Free, phase: 2, owner: null, status: todo, depends_on: [], tags: [] }
        - { id: phased, title: Owned by the phase, phase: 1, owner: null, status: todo, depends_on: [], tags: [] }
        - { id: ready, title: Ready, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
      more: 0
      questions: [{ id: q-2, item: ready, question: "Which way?", status: open }]
      drafts: []
  # Slice 124: a block of itos's rules for agents other than the one this
  # itos writes is one line naming itos init --agent-rules, and --json's
  # agent_rules names the files that hold it.
  - name: status --json names the files holding a block another itos wrote
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
    files:
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
      AGENTS.md: "Mine.\n\n<!-- itos:begin -->\n\n## The rules itos holds this repository to\n\n<!-- itos:end -->\n"
    exit: 0
    json_has:
      schema: 1
      person: a
      head: null
      ci: null
      last_green: null
      nightly: null
      release: null
      unreleased: null
      itos: null
      agent_rules: { stale: [AGENTS.md] }
      doing: []
      next: []
      more: 0
      questions: []
      drafts: []
  - name: status --json gives the last nightly's run
    argv: [status, --json]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/7"
          status: completed
          conclusion: success
          jobs: [{ name: nightly, status: completed, conclusion: success }]
    exit: 0
    json_has:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "chore: first", last_fetched: false }
      ci:
        result: success
        run:
          url: "https://ci.example/runs/{{sha.head}}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly:
        url: "https://ci.example/nightly/7"
        status: completed
        conclusion: success
        jobs: [{ name: nightly, status: completed, conclusion: success }]
      release: null
      unreleased: null
      itos: null
      agent_rules: null
      doing: []
      next: []
      more: 0
      questions: []
      drafts: []
  - name: status --json gives main's last green commit while the head's run is going
    argv: [status, --json]
    git:
      - commit: "fix: one"
        files: { a.txt: "one\n" }
        label: green
      - commit: "feat: two"
        files: { b.txt: "two\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0 }
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
        - { head_sha: "{{sha.green}}", status: completed, conclusion: success }
    exit: 0
    json_has:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "feat: two", last_fetched: false }
      ci:
        result: going
        run:
          url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
      last_green: { commit: "{{sha.green}}", header: "fix: one" }
      nightly: null
      release: null
      unreleased: null
      itos: null
      agent_rules: null
      doing: []
      next: []
      more: 0
      questions: []
      drafts: []
  - name: status names the newest release and the feat, fix and breaking commits since it
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
        label: release
      - run: git tag v1.2.0-rc.1 && git tag -a v1.2.0 -m v1.2.0 && git tag v1.1.0 && git tag v1.3
      - commit: "feat: add the archive"
        files: { a.txt: "a\n" }
      - commit: "docs: describe the archive"
        files: { b.md: "b\n" }
      - commit: "fix(cli): mend the archive"
        files: { a.txt: "a2\n" }
      - commit: "refactor!: rename the archive"
        files: { a.txt: "a3\n" }
      - run: 'git commit -q --allow-empty -m "chore: drop the old name" -m "Why it goes." -m "BREAKING-CHANGE: the old name is gone" && git tag latest'
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q --tags origin main
    exit: 0
    json_has:
      schema: 1
      person: a
      head:
        remote: origin
        branch: main
        commit: "{{sha.head}}"
        header: "chore: drop the old name"
        last_fetched: false
      ci:
        result: success
        run:
          url: https://ci.example/runs/{{sha.head}}
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly: null
      release: { tag: v1.2.0, commit: "{{sha.release}}", last_fetched: false }
      unreleased:
        - "feat: add the archive"
        - "fix(cli): mend the archive"
        - "refactor!: rename the archive"
        - "chore: drop the old name"
      itos: null
      agent_rules: null
      doing: [{ id: busy, title: Busy, phase: 1, owner: a, status: doing, depends_on: [], tags: [] }]
      next:
        - { id: free, title: Free, phase: 2, owner: null, status: todo, depends_on: [], tags: [] }
        - id: phased
          title: Owned by the phase
          phase: 1
          owner: null
          status: todo
          depends_on: []
          tags: []
        - { id: ready, title: Ready, phase: 1, owner: a, status: todo, depends_on: [], tags: [] }
      more: 0
      questions: [{ id: q-2, item: ready, question: "Which way?", status: open }]
      drafts: []
    stdout_lacks: "docs: describe the archive"
  - name: the release is asked of the remote, whose tags this clone may not have
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: git tag v1.0.0 && git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main && git tag v2.0.0 && git push -q origin v2.0.0 && git tag -d v2.0.0 >/dev/null
    exit: 0
    json_has:
      release: { tag: v2.0.0, last_fetched: false }
      unreleased: []
  - name: a remote that cannot be reached gives its release as last fetched
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: git tag v1.2.0
      - commit: "feat: add the archive"
        files: { a.txt: "a\n" }
        label: head
      - run: git remote add origin .git/nowhere.git && git update-ref refs/remotes/origin/main HEAD
    exit: 0
    json_has:
      head: { commit: "{{sha.head}}", last_fetched: true }
      release: { tag: v1.2.0, last_fetched: true }
      unreleased: ["feat: add the archive"]
  - name: where the remote's head is not fetched here the commits since the release may be behind
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: 'git tag v1.2.0 && git init -q --bare -b main .git/origin.git && git remote add origin .git/origin.git && git push -q --tags origin main && git fetch -q origin && t=$(printf "100644 blob 0123456789abcdef0123456789abcdef01234567\tlost.txt\n" | git -C .git/origin.git mktree --missing) && c=$(git -C .git/origin.git commit-tree -p main -m "feat: add the archive" $t) && git -C .git/origin.git update-ref refs/heads/main $c'
    exit: 0
    json_has:
      release: { tag: v1.2.0, last_fetched: false }
      unreleased: []
    stdout_has: origin/main cannot be fetched
  - name: status --json gives the newest release and the headers of the commits since it
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
        label: release
      - run: git tag -a v1.2.0 -m v1.2.0
      - commit: "feat: add the archive"
        files: { a.txt: "a\n" }
      - commit: "docs: describe the archive"
        files: { b.md: "b\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q --tags origin main
    files:
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    exit: 0
    json_has:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "docs: describe the archive", last_fetched: false }
      ci:
        result: success
        run:
          url: "https://ci.example/runs/{{sha.head}}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly: null
      release: { tag: v1.2.0, commit: "{{sha.release}}", last_fetched: false }
      unreleased: ["feat: add the archive"]
      itos: null
      agent_rules: null
      doing: []
      next: []
      more: 0
      questions: []
      drafts: []
  - name: status takes no arguments
    argv: [status, work]
    exit: 2
    stderr_has: work
  - name: status --as someone not among the people is a missing environment
    argv: [status, --as, c]
    exit: 3
    stderr_has: '"c"'
  - name: status with no work registry is refused
    argv: [status, --json]
    files:
      work-items.yaml: null
    exit: 1
    json: { schema: 1, ok: false, problems: [{ rule: work-registry-missing }] }
    stdout_has: work-items.yaml
  - name: go with no work registry prints the guide and says the status is left out
    argv: [go, --json]
    files:
      work-items.yaml: null
    exit: 0
    json: { schema: 1, guide: coordinate }
  - name: go --json gives the status as its object
    argv: [go, --json]
    exit: 0
    json_has:
      guide: coordinate
      status: { person: a, head: { commit: "{{sha.head}}" }, ci: { result: success }, doing: [{ id: busy }] }
