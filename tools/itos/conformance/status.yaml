# itos status (slice 67): where the work stands, for the person a session
# works for (--as, else the identity provider): the remote branch's head,
# asked of the remote, else as last fetched, and its CI run, looked at once
# through ci.watch's provider and never waited for, a run still going said to
# be going; the person's items in progress; the next ones they can start,
# theirs and the unowned, in the queue's order and the unqueued after, five
# at most; the open questions. What cannot be reached (no remote, a remote
# that does not answer, ci.watch.provider none, a provider that cannot look)
# is a line, and the rest prints, exit 0. itos go prints it after the guide,
# and skips one that cannot be computed with a line on stderr.
#
# Slice 70: after the head and its CI run, the newest release, the highest tag
# v<semver> on the remote (asked of it as the head is, else as last fetched),
# and the commits since it the next release would carry, the feat, fix and
# breaking ones as tools/bin/release-version counts them, read from the
# commits as fetched here, saying they may be behind when the head is not.
#
# Slice 72: after the head's CI run, the last nightly's, looked at once
# through the same provider: the newest run of ci.watch.github.nightly_workflow
# on the branch. A provider naming no nightly prints no nightly line.
#
# Slice 73: while the head's run is going or did not pass, the commit main
# last proved follows it, as ci.range's provider names it, read once: the
# nearest of the head's first parents, the head included, with a green run
# (bug 24); its header when it is fetched here, its SHA alone when not; a
# provider that fails is a line, and provider none prints nothing.
#
# The remote is a bare one in the git folder, .git/origin.git, holding the
# repository's one commit. GitHub is the runner's fake (run.ts), its run
# answering for any commit, and the person is the one a fake gh, bin/gh, says
# it is signed in as (work.identity's github provider): v5.0.0 removed the
# command providers this corpus faked them with (slice 85).
files:
  itos.yaml: |
    version: 1
    work:
      registry: work-items.yaml
      people: { source: yaml, file: people.yaml }
    ci:
      steps: []
      watch: { provider: github, interval: 0 }
  bin/gh: { text: "#!/bin/sh\necho a\n", executable: true }
  people.yaml: "- a\n- b\n"
  work-items.yaml: |
    phases: { 1: a, 2: null }
    queue: [free, phased]
    items:
      - { id: busy, title: Busy, phase: 1, owner: a, status: doing, depends_on: [] }
      - { id: ready, title: Ready, phase: 1, owner: a, status: todo, depends_on: [] }
      - { id: later, title: Later, phase: 1, owner: a, status: todo, depends_on: [ready] }
      - { id: phased, title: Owned by the phase, phase: 1, owner: null, status: todo, depends_on: [] }
      - { id: free, title: Free, phase: 2, owner: null, status: todo, depends_on: [] }
      - { id: theirs, title: Theirs, phase: 1, owner: b, status: todo, depends_on: [] }
      - { id: idea, title: An idea, phase: 1, owner: a, status: todo, kind: idea, depends_on: [] }
  asks.yaml: |
    # itos ask's questions to the person the work is for, written by itos ask (itos help ask).
    questions:
      - id: q-1
        question: "Labels or Projects?"
        answer: "Labels."
      - id: q-2
        item: "ready"
        question: "Which way?"
env: { PATH: "{{dir}}/bin:{{PATH}}" }
github:
  runs:
    - head_sha: "*"
      html_url: "https://ci.example/runs/{sha}"
      status: completed
      conclusion: success
      jobs: [{ name: ci, status: completed, conclusion: success }]
git:
  - commit: "chore: first"
    files: { README.md: "first\n" }
  - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    label: head
cases:
  - name: status prints the remote's head and its CI run, the work and the open questions
    argv: [status]
    exit: 0
    stdout: |
      # Where things stand

      origin/main: {{short.head}} chore: first
      CI: success, https://ci.example/runs/{{sha.head}}

      Newest release: no release yet.

      In progress for a:
        busy  Busy
      Next for a, in the queue's order:
        free  Free  (unowned)
        phased  Owned by the phase
        ready  Ready
      Open questions:
        q-2  Which way?  (ready)
    stderr: ""
  - name: status --as lists another person's work
    argv: [status, --as, b]
    exit: 0
    stdout_has: "Nothing in progress for b.\nNext for b, in the queue's order:\n  free  Free  (unowned)\n  theirs  Theirs\n"
  - name: a run still going is said to be going, never waited for
    argv: [status]
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
    exit: 0
    stdout_has: "CI: going, https://ci.example/runs/1\n"
  - name: a run that failed names the jobs that failed
    argv: [status]
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: failure
          jobs:
            - { name: ci, status: completed, conclusion: failure }
            - { name: platform, status: completed, conclusion: success }
    exit: 0
    stdout_has: "CI: failure, https://ci.example/runs/1; failed jobs: ci\n"
  - name: the last nightly's run follows the head's, the jobs that failed named
    argv: [status]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/7"
          status: completed
          conclusion: failure
          jobs: [{ name: nightly, status: completed, conclusion: failure }]
    exit: 0
    stdout_has: "CI: success, https://ci.example/runs/{{sha.head}}\nNightly: failure, https://ci.example/nightly/7; failed jobs: nightly\n\nNewest release: no release yet.\n"
  - name: a nightly still going is said to be going
    argv: [status]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/8"
          status: in_progress
          jobs: [{ name: nightly, status: in_progress }]
    exit: 0
    stdout_has: "Nightly: going, https://ci.example/nightly/8\n"
  - name: a refusal from GitHub's API is a line for the run and the nightly, and the rest prints
    argv: [status]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github: { refuse: true }
    exit: 0
    stdout_has:
      - "origin/main: {{short.head}} chore: first\nCI cannot be read: GitHub's API answered 401 Unauthorized for "
      - "The nightly cannot be read: GitHub's API answered 401 Unauthorized for "
      - "In progress for a:\n  busy  Busy\n"
  - name: with ci.watch.provider none the CI run is not read
    argv: [status]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
    exit: 0
    stdout_has: "origin/main: {{short.head}} chore: first\nCI is not read: ci.watch.provider is none.\n"
  - name: while the head's run is going, main's last green commit follows it, before the nightly
    argv: [status]
    git:
      - commit: "fix: one"
        files: { a.txt: "one\n" }
        label: green
      - commit: "feat: two"
        files: { b.txt: "two\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
        - { head_sha: "{{sha.green}}", status: completed, conclusion: success }
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/7"
          status: completed
          conclusion: success
          jobs: [{ name: nightly, status: completed, conclusion: success }]
    exit: 0
    stdout_has: "origin/main: {{short.head}} feat: two\nCI: going, https://ci.example/runs/1\nLast green: {{short.green}} fix: one\nNightly: success, https://ci.example/nightly/7\n"
  - name: a head's run that failed is followed by main's last green commit
    argv: [status]
    git:
      - commit: "fix: one"
        files: { a.txt: "one\n" }
        label: green
      - commit: "feat: two"
        files: { b.txt: "two\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0 }
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: failure
          jobs: [{ name: ci, status: completed, conclusion: failure }]
        - { head_sha: "{{sha.green}}", status: completed, conclusion: success }
    exit: 0
    stdout_has: "CI: failure, https://ci.example/runs/1; failed jobs: ci\nLast green: {{short.green}} fix: one\n\nNewest release: no release yet.\n"
  - name: no green run of the head's first parents names no last green commit
    argv: [status]
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
    exit: 0
    stdout_has: "CI: going, https://ci.example/runs/1\nLast green: none found\n"
  - name: with ci.range's provider none no last green commit is read
    argv: [status]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          range: { provider: none }
          watch: { provider: github, interval: 0 }
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
    exit: 0
    stdout_has: "CI: going, https://ci.example/runs/1\n\nNewest release: no release yet.\n"
  - name: when the head's run passed no last green commit is read
    argv: [status]
    exit: 0
    stdout_has: "CI: success, https://ci.example/runs/{{sha.head}}\n\nNewest release: no release yet.\n"
  - name: with no remote neither the head nor its CI run is read, and the rest prints
    argv: [status]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
    exit: 0
    stdout: |
      # Where things stand

      No remote origin, so neither its head nor its CI run is read.

      In progress for a:
        busy  Busy
      Next for a, in the queue's order:
        free  Free  (unowned)
        phased  Owned by the phase
        ready  Ready
      Open questions:
        q-2  Which way?  (ready)
  - name: a remote that cannot be reached is read as last fetched
    argv: [status]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
        label: head
      - run: git remote add origin .git/nowhere.git && git update-ref refs/remotes/origin/main HEAD
    exit: 0
    stdout_has: "origin cannot be reached, so its main is as last fetched.\norigin/main: {{short.head}} chore: first\nCI: success, https://ci.example/runs/{{sha.head}}\n"
  - name: a remote without the branch has no head to read
    argv: [status]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    exit: 0
    stdout_has: "origin has no branch main yet, so there is no CI run to read.\n"
  - name: status lists five of the next items, and says how many more
    argv: [status]
    files:
      work-items.yaml: |
        phases: { 1: a }
        items:
          - { id: n1, title: One, phase: 1, owner: a, status: todo }
          - { id: n2, title: Two, phase: 1, owner: a, status: todo }
          - { id: n3, title: Three, phase: 1, owner: a, status: todo }
          - { id: n4, title: Four, phase: 1, owner: a, status: todo }
          - { id: n5, title: Five, phase: 1, owner: a, status: todo }
          - { id: n6, title: Six, phase: 1, owner: a, status: todo }
          - { id: n7, title: Seven, phase: 1, owner: a, status: todo }
      asks.yaml: null
    exit: 0
    stdout_has: "Nothing in progress for a.\nNext for a, in the queue's order:\n  n1  One\n  n2  Two\n  n3  Three\n  n4  Four\n  n5  Five\n  and 2 more: itos work\nNo open questions.\n"
  - name: a long question is cut short
    argv: [status]
    files:
      asks.yaml: |
        # itos ask's questions to the person the work is for, written by itos ask (itos help ask).
        questions:
          - id: q-1
            question: "Should the status print a question in full, however long it is, or cut it short so it reads at a glance?"
    exit: 0
    stdout_has: "  q-1  Should the status print a question in full, however long it is, or cut it short…\n"
  - name: status --json
    argv: [status, --json]
    exit: 0
    json:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "chore: first", last_fetched: false }
      ci:
        result: success
        run:
          url: "https://ci.example/runs/{{sha.head}}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly: null
      release: null
      unreleased: null
      doing: [{ id: busy, title: Busy, phase: 1, owner: a, status: doing, depends_on: [] }]
      next:
        - { id: free, title: Free, phase: 2, owner: null, status: todo, depends_on: [] }
        - { id: phased, title: Owned by the phase, phase: 1, owner: null, status: todo, depends_on: [] }
        - { id: ready, title: Ready, phase: 1, owner: a, status: todo, depends_on: [] }
      more: 0
      questions: [{ id: q-2, item: ready, question: "Which way?", status: open }]
      unread: []
  - name: status --json lists what could not be reached
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
    files:
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    exit: 0
    json:
      schema: 1
      person: a
      head: null
      ci: null
      last_green: null
      nightly: null
      release: null
      unreleased: null
      doing: []
      next: []
      more: 0
      questions: []
      unread: ["No remote origin, so neither its head nor its CI run is read."]
  - name: status --json gives the last nightly's run
    argv: [status, --json]
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0, github: { nightly_workflow: nightly.yml } }
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/{sha}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
        - workflow: nightly.yml
          head_sha: "0000000000000000000000000000000000000000"
          html_url: "https://ci.example/nightly/7"
          status: completed
          conclusion: success
          jobs: [{ name: nightly, status: completed, conclusion: success }]
    exit: 0
    json:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "chore: first", last_fetched: false }
      ci:
        result: success
        run:
          url: "https://ci.example/runs/{{sha.head}}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly:
        url: "https://ci.example/nightly/7"
        status: completed
        conclusion: success
        jobs: [{ name: nightly, status: completed, conclusion: success }]
      release: null
      unreleased: null
      doing: []
      next: []
      more: 0
      questions: []
      unread: []
  - name: status --json gives main's last green commit while the head's run is going
    argv: [status, --json]
    git:
      - commit: "fix: one"
        files: { a.txt: "one\n" }
        label: green
      - commit: "feat: two"
        files: { b.txt: "two\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    files:
      itos.yaml: |
        version: 1
        work:
          registry: work-items.yaml
          people: { source: yaml, file: people.yaml }
        ci:
          steps: []
          watch: { provider: github, interval: 0 }
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
        - { head_sha: "{{sha.green}}", status: completed, conclusion: success }
    exit: 0
    json:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "feat: two", last_fetched: false }
      ci:
        result: going
        run:
          url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
      last_green: { commit: "{{sha.green}}", header: "fix: one" }
      nightly: null
      release: null
      unreleased: null
      doing: []
      next: []
      more: 0
      questions: []
      unread: []
  - name: status names the newest release and the feat, fix and breaking commits since it
    argv: [status]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: git tag v1.2.0-rc.1 && git tag -a v1.2.0 -m v1.2.0 && git tag v1.1.0 && git tag v1.3
      - commit: "feat: add the archive"
        files: { a.txt: "a\n" }
      - commit: "docs: describe the archive"
        files: { b.md: "b\n" }
      - commit: "fix(cli): mend the archive"
        files: { a.txt: "a2\n" }
      - commit: "refactor!: rename the archive"
        files: { a.txt: "a3\n" }
      - run: 'git commit -q --allow-empty -m "chore: drop the old name" -m "Why it goes." -m "BREAKING-CHANGE: the old name is gone" && git tag latest'
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q --tags origin main
    exit: 0
    stdout_has: "CI: success, https://ci.example/runs/{{sha.head}}\n\nNewest release: v1.2.0\nUnreleased since v1.2.0, oldest first:\n  feat: add the archive\n  fix(cli): mend the archive\n  refactor!: rename the archive\n  chore: drop the old name\n\nIn progress for a:\n"
  - name: the release is asked of the remote, whose tags this clone may not have
    argv: [status]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: git tag v1.0.0 && git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main && git tag v2.0.0 && git push -q origin v2.0.0 && git tag -d v2.0.0 >/dev/null
    exit: 0
    stdout_has: "Newest release: v2.0.0\nNothing unreleased since v2.0.0.\n"
  - name: a remote that cannot be reached gives its release as last fetched
    argv: [status]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: git tag v1.2.0
      - commit: "feat: add the archive"
        files: { a.txt: "a\n" }
        label: head
      - run: git remote add origin .git/nowhere.git && git update-ref refs/remotes/origin/main HEAD
    exit: 0
    stdout_has: "CI: success, https://ci.example/runs/{{sha.head}}\n\nNewest release: v1.2.0 (as last fetched)\nUnreleased since v1.2.0, oldest first:\n  feat: add the archive\n"
  - name: where the remote's head is not fetched here the commits since the release may be behind
    argv: [status]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
      - run: 'git tag v1.2.0 && git init -q --bare -b main .git/origin.git && git remote add origin .git/origin.git && git push -q --tags origin main && git fetch -q origin && git clone -q .git/origin.git .git/other && git -C .git/other commit -q --allow-empty -m "feat: add the archive" && git -C .git/other push -q origin main && rm -rf .git/other'
    exit: 0
    stdout_has: "Newest release: v1.2.0\norigin/main is not fetched here up to its head, so the commits since v1.2.0 may be behind.\nNothing unreleased since v1.2.0, as fetched here.\n"
  - name: status --json gives the newest release and the headers of the commits since it
    argv: [status, --json]
    git:
      - commit: "chore: first"
        files: { README.md: "first\n" }
        label: release
      - run: git tag -a v1.2.0 -m v1.2.0
      - commit: "feat: add the archive"
        files: { a.txt: "a\n" }
      - commit: "docs: describe the archive"
        files: { b.md: "b\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q --tags origin main
    files:
      work-items.yaml: "phases: { 1: a }\nitems: []\n"
      asks.yaml: null
    exit: 0
    json:
      schema: 1
      person: a
      head: { remote: origin, branch: main, commit: "{{sha.head}}", header: "docs: describe the archive", last_fetched: false }
      ci:
        result: success
        run:
          url: "https://ci.example/runs/{{sha.head}}"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
      last_green: null
      nightly: null
      release: { tag: v1.2.0, commit: "{{sha.release}}", last_fetched: false }
      unreleased: ["feat: add the archive"]
      doing: []
      next: []
      more: 0
      questions: []
      unread: []
  - name: status takes no arguments
    argv: [status, work]
    exit: 2
    stderr: |
      itos: status takes no arguments: work (itos --help)
  - name: status --as someone not among the people is a missing environment
    argv: [status, --as, c]
    exit: 3
    stderr: |
      "c" is not in people.yaml
  - name: status with no work registry is refused
    argv: [status]
    files:
      work-items.yaml: null
    exit: 1
    stderr: |
      no work registry at work-items.yaml
        fix: move the registry to work-items.yaml, or set work.registry to where it is
  - name: go ends with where things stand, after a line of ---
    argv: [go]
    exit: 0
    stdout_has: ["# Coordinating with itos\n", "\n---\n\n# Where things stand\n\norigin/main: {{short.head}} chore: first\n"]
  - name: go with no work registry prints the guide and says the status is left out
    argv: [go]
    files:
      work-items.yaml: null
    exit: 0
    stdout_has: "# Coordinating with itos\n"
    stderr: |
      itos: where things stand is not printed: no work registry at work-items.yaml (itos work check)
  - name: go --json gives the status as its object
    argv: [go, --json]
    exit: 0
    stdout_has: ['"guide": "coordinate"', '"status": {', '"person": "a"', '"result": "success"']
