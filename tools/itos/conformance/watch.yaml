# Waiting for a commit's CI run (slice 51): itos ci watch [<sha>], HEAD's by
# default, and itos push after it pushed, with ci.watch's provider. The github
# provider asks GitHub's API for the run of ci.watch.github.workflow for the
# commit's full SHA, once a look; --json gives the run, its address and its
# jobs; the exit is the run's result, 75 for a run
# still going after ci.watch.timeout, 3 for a refusal from the API and github
# with no token, whose reason --json does not give yet (p1-json-gaps). ci.watch's provider is none by default, and push then returns as
# before (push.yaml). The command provider went in v5.0.0 (slice 85). A run a
# newer push cancelled is followed by the newer run that has the commit, or
# exits 75 when none does (bug 41).
#
# GitHub here is the runner's fake (tools/bin/conformance): its one run answers for any
# commit, the commit asked about in its address.
files:
  itos.yaml: |
    version: 1
    ci:
      steps: []
      watch: { provider: github, interval: 0 }
github:
  runs:
    - head_sha: "*"
      html_url: "https://ci.example/runs/{sha}"
      status: completed
      conclusion: success
      jobs:
        - { name: ci, status: completed, conclusion: success }
        - { name: platform, status: completed, conclusion: success }
git:
  - commit: "chore: first"
    files: { README.md: "first\n" }
    label: first
  - commit: "chore: second"
    files: { README.md: "second\n" }
    label: head
cases:
  - name: ci watch <sha> watches that commit, asked of GitHub in full
    argv: [ci, watch, "{{short.first}}", --json]
    exit: 0
    json:
      schema: 1
      ok: true
      commit: '{{sha.first}}'
      ci: success
      run:
        url: https://ci.example/runs/{{sha.first}}
        status: completed
        conclusion: success
        jobs:
        - name: ci
          status: completed
          conclusion: success
        - name: platform
          status: completed
          conclusion: success
  - name: a run that failed exits 1, naming the failed jobs
    argv: [ci, watch, --json]
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: failure
          jobs:
            - { name: ci, status: completed, conclusion: failure }
            - { name: platform, status: completed, conclusion: success }
    exit: 1
    json:
      schema: 1
      ok: false
      commit: '{{sha.head}}'
      ci: failure
      run:
        url: https://ci.example/runs/1
        status: completed
        conclusion: failure
        jobs:
        - name: ci
          status: completed
          conclusion: failure
          log: unreadable
        - name: platform
          status: completed
          conclusion: success
  - name: a queued run is waited for
    argv: [ci, watch, --json]
    github:
      runs:
        - head_sha: "*"
          looks:
            - { html_url: "", status: queued, jobs: [] }
            - html_url: "https://ci.example/runs/1"
              status: in_progress
              jobs:
                - { name: ci, status: completed, conclusion: success }
                - { name: platform, status: in_progress }
            - html_url: "https://ci.example/runs/1"
              status: in_progress
              jobs:
                - { name: ci, status: completed, conclusion: success }
                - { name: platform, status: in_progress }
            - html_url: "https://ci.example/runs/1"
              status: completed
              conclusion: success
              jobs:
                - { name: ci, status: completed, conclusion: success }
                - { name: platform, status: completed, conclusion: success }
    exit: 0
    json:
      schema: 1
      ok: true
      commit: '{{sha.head}}'
      ci: success
      run:
        url: https://ci.example/runs/1
        status: completed
        conclusion: success
        jobs:
        - name: ci
          status: completed
          conclusion: success
        - name: platform
          status: completed
          conclusion: success
  - name: ci watch waits for HEAD's run and exits 0 when it succeeded
    argv: [ci, watch, --json]
    exit: 0
    json:
      schema: 1
      ok: true
      commit: "{{sha.head}}"
      ci: success
      run:
        url: "https://ci.example/runs/{{sha.head}}"
        status: completed
        conclusion: success
        jobs:
          - { name: ci, status: completed, conclusion: success }
          - { name: platform, status: completed, conclusion: success }
  - name: a run still going after ci.watch.timeout exits 75, ci timeout
    argv: [ci, watch, --json]
    files:
      itos.yaml: |
        version: 1
        ci:
          steps: []
          watch: { provider: github, interval: 0.05, timeout: 0.2 }
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: in_progress
          jobs: [{ name: ci, status: in_progress }]
    exit: 75
    json:
      schema: 1
      ok: false
      commit: '{{sha.head}}'
      ci: timeout
      run:
        url: https://ci.example/runs/1
        status: in_progress
        jobs:
        - name: ci
          status: in_progress
  - name: a run a newer push cancelled is judged by the newer run, which --json names
    argv: [ci, watch, --json, "{{short.first}}"]
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/2"
          status: completed
          conclusion: success
          jobs: [{ name: ci, status: completed, conclusion: success }]
        - head_sha: "{{sha.first}}"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: cancelled
          jobs: [{ name: ci, status: completed, conclusion: cancelled }]
    exit: 0
    json:
      schema: 1
      ok: true
      commit: "{{sha.first}}"
      ci: success
      run:
        url: "https://ci.example/runs/2"
        status: completed
        conclusion: success
        jobs: [{ name: ci, status: completed, conclusion: success }]
      superseded: "https://ci.example/runs/1"
  - name: a cancelled run with no newer run to follow exits 75, ci cancelled
    argv: [ci, watch, --json]
    github:
      runs:
        - head_sha: "{{sha.head}}"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: cancelled
          jobs: [{ name: ci, status: completed, conclusion: cancelled }]
    exit: 75
    json:
      schema: 1
      ok: false
      commit: "{{sha.head}}"
      ci: cancelled
      run:
        url: "https://ci.example/runs/1"
        status: completed
        conclusion: cancelled
        jobs: [{ name: ci, status: completed, conclusion: cancelled }]
  - name: a refusal from GitHub's API exits 3
    argv: [ci, watch, --json]
    github: { refuse: true }
    exit: 3
    stderr_has: "401"
    json:
      schema: 1
      ok: false
      commit: '{{sha.head}}'
      ci: error
  - name: what is not a commit is a usage error
    argv: [ci, watch, nope]
    exit: 2
    stderr_has: nope
  - name: with ci.watch's provider none there is no run to watch
    argv: [ci, watch, --json]
    files:
      itos.yaml: "version: 1\nci: { steps: [] }\n"
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
      - rule: config-invalid
  - name: github with no token and no gh exits 3 before any request, naming both ways to sign in
    argv: [ci, watch, --json]
    github: null
    env: { GH_TOKEN: "" }
    hide: [gh]
    exit: 3
    stderr_has: [GITHUB_TOKEN, gh auth login]
    json:
      schema: 1
      ok: false
      commit: '{{sha.head}}'
      ci: error
  - name: github with a token and no GitHub remote exits 3, naming the repository variable
    argv: [ci, watch, --json]
    github: null
    env: { GH_TOKEN: "a-token" }
    hide: [gh]
    exit: 3
    stderr_has: GITHUB_REPOSITORY
    json:
      schema: 1
      ok: false
      commit: '{{sha.head}}'
      ci: error
  - name: the command provider and its keys were removed in v5
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ci:
          steps: []
          watch: { provider: command, command: "sh report.sh {sha}", nightly_command: "cat nightly.json" }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
      - rule: config-removed
        area: config
      - rule: config-removed
        area: config
      - rule: config-removed
        area: config
  - name: the interval and the timeout have their bounds
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ci:
          steps: []
          watch: { provider: github, interval: -1, timeout: 0 }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
      - rule: config-watch-interval
        area: config
      - rule: config-watch-timeout
        area: config
  # itos push waits for the run of the commit it pushed; the commits are on
  # the remote whatever the run says.
  - name: push waits for the run of the commit it pushed
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    exit: 0
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.head}}\n"
    json:
      schema: 1
      ok: true
      outcome: pushed
      remote: origin
      branch: main
      commit: "{{sha.head}}"
      ci: success
      run:
        url: "https://ci.example/runs/{{sha.head}}"
        status: completed
        conclusion: success
        jobs:
          - { name: ci, status: completed, conclusion: success }
          - { name: platform, status: completed, conclusion: success }
  - name: a push whose run fails exits 1, its commit pushed
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    github:
      runs:
        - head_sha: "*"
          html_url: "https://ci.example/runs/1"
          status: completed
          conclusion: failure
          jobs: [{ name: ci, status: completed, conclusion: failure }]
    exit: 1
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.head}}\n"
    json:
      schema: 1
      ok: false
      outcome: pushed
      remote: origin
      branch: main
      commit: '{{sha.head}}'
      ci: failure
      run:
        url: https://ci.example/runs/1
        status: completed
        conclusion: failure
        jobs:
        - name: ci
          status: completed
          conclusion: failure
          log: unreadable
  - name: push --no-wait pushes and returns, no run looked at
    argv: [push, --no-wait, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    exit: 0
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.head}}\n"
    json:
      schema: 1
      ok: true
      outcome: pushed
      remote: origin
      branch: main
      commit: '{{sha.head}}'
  - name: nothing to push waits for no run
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    exit: 0
    json:
      schema: 1
      ok: true
      outcome: nothing-to-push
      remote: origin
      branch: main
  - name: a push whose watch cannot look exits 3, its commit pushed and itos ci watch named
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    github: null
    env: { GH_TOKEN: "" }
    hide: [gh]
    exit: 3
    stderr_has: "itos ci watch {{sha.head}}"
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.head}}\n"
    json:
      schema: 1
      ok: false
      outcome: pushed
      remote: origin
      branch: main
      commit: '{{sha.head}}'
      ci: error
