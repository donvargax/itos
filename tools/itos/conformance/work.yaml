  - name: work promote renames the idea in the questions that name it
    argv: [work, promote, p1-thing, --kind, slice, --json]
    git: []
    files:
      itos.yaml: null
      .git/itos/itos.yaml: *stealth
      .git/itos/work-items.yaml: "phases:\n  1: null\nitems:\n  - { id: p1-thing, title: A thing, phase: 1, status: todo, kind: idea, why: a gap }\n  - { id: slice-4, title: Four, phase: 1, status: todo, depends_on: [p1-thing] }\n"
      .git/itos/asks.yaml: "questions:\n  - { id: q-1, item: p1-thing, question: \"Which way?\" }\n"
    exit: 0
    json:
      schema: 1
      ok: true
      item: { id: slice-5, title: A thing, phase: 1, status: todo, kind: slice, why: Was p1-thing. a gap, depends_on: [], tags: [] }
      was: p1-thing
      rewritten: [slice-4]
      questions: [q-1]
      commit: null
  - name: work promote renames the idea in answered questions too, and keeps a question naming another item
    argv: [work, promote, p1-thing, --kind, slice, --json]
    git: []
    files:
