    argv: [work, done, T-1, --json]
    git:
      - commit: "docs: start"
        files:
          itos.yaml: &ledgered "version: 1\nledger: { files: \"tasks/phase-{group}.yaml\", id: \"T-\\\\d+\" }\nwork:\n  registry: work-items.yaml\n  people: { source: yaml, file: people.yaml }\n"
          work-items.yaml: &closableTask "phases: { 1: null }\nitems:\n  - { id: T-1, title: One, phase: 1, owner: null, status: doing, depends_on: [] }\n"
          tasks/phase-1.yaml: &checked "# phase 1\r\n- id: T-1\r\n  type: docs\r\n  title: One\r\n  why: The ledger says why.\r\n  done_when:\r\n    - run: \"true\" # passes\r\n  # kept\r\n- id: T-2\r\n  type: docs\r\n  title: Two\r\n  done_when:\r\n    - run: \"true\"\r\n"
    files:
      itos.yaml: *ledgered
      work-items.yaml: *closableTask
      tasks/phase-1.yaml: *checked
    exit: 0
    json_has:
      schema: 1
      ok: true
      item: { id: T-1, title: One, phase: 1, owner: null, status: done, depends_on: [], tags: [] }
      ci: unwatched
      commit: "<any>"
    stderr_has: "docs: close T-1"
    files_after:
      work-items.yaml: "phases: { 1: null }\nitems:\n  - { id: T-1, title: One, phase: 1, owner: null, status: done, depends_on: [] }\n"
      tasks/phase-1.yaml: "# phase 1\r\n- id: T-1\r\n  type: docs\r\n  title: One\r\n  why: The ledger says why.\r\n  # kept\r\n- id: T-2\r\n  type: docs\r\n  title: Two\r\n  done_when:\r\n    - run: \"true\"\r\n"
