      .git/itos/work-items.yaml: "phases:\n  1: null\nitems:\n  - id: p1-thing # the idea\n    title: A thing\n    phase: 1\n    status: todo\n    kind: idea\n    why: >\n      A gap\n      left behind.\n    tags: []\n  - { id: slice-4, title: Four, phase: 1, status: todo, depends_on: [p1-thing] }\n"
