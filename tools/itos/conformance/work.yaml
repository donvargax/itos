      .git/itos/itos.yaml: *stealth
      .git/itos/work-items.yaml: "phases:\n  1: null\nitems:\n  - { id: p1-thing, title: A thing, phase: 1, status: todo, kind: idea, why: a gap }\n  - { id: p1-other, title: Other, phase: 1, status: todo, kind: idea, why: another }\n"
      .git/itos/asks.yaml: "questions:\n  - { id: q-1, item: p1-thing, question: \"Which way?\" }\n  - { id: q-2, item: p1-other, question: \"Which other?\" }\n  - { id: q-3, item: p1-thing, question: \"Done?\", answer: \"Yes.\" }\n"
    exit: 0
    json:
      schema: 1
