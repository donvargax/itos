      .git/itos/work-items.yaml: "phases:\n  1: null\nitems:\n  - id: T-002 # the idea\n    title: A thing\n    phase: 1\n    status: todo\n    kind: task\n    tags: []\n  - { id: slice-4, title: Four, phase: 1, status: todo, depends_on: [T-002] }\n"
