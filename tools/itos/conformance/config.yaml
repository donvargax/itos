    stdout: |
      itos
  - name: config get prints a number default bare
    argv: [config, get, hooks.commit_msg.check_timeout]
    exit: 0
    stdout_contract: true
    stdout: |
      60
  - name: config get prints a boolean default
    argv: [config, get, ci.stop_at_first_failure]
    exit: 0
    stdout_contract: true
    stdout: |
      true
  - name: config get prints a kind's default under the kind the config has
    argv: [config, get, tests.scenario.wip_tag]
    exit: 0
    stdout_contract: true
    stdout: |
      @wip
  - name: config get prints a list as JSON on one line
    argv: [config, get, commits.types]
    exit: 0
    stdout_contract: true
    stdout: |
      ["build","docs"]
  - name: config get prints a mapping as JSON on one line, defaults laid under it
    argv: [config, get, ledger.group]
    exit: 0
    stdout_contract: true
    stdout: |
      {"label":"phase","pattern":"\\d+","numeric":true}
  - name: config get prints nothing for a key with no value and no default
    argv: [config, get, pin]
    exit: 0
    stdout_contract: true
    stdout: ""
  - name: config get as --json
    argv: [config, get, hooks.bin, --json]
    exit: 0
    json:
      schema: 1
      key: hooks.bin
      value: itos
  - name: config get as --json, a key with no value null
    argv: [config, get, pin, --json]
    exit: 0
    json:
      schema: 1
      key: pin
      value: null
  - name: config get reads a stealth config, whose hooks.bin is itos whatever it says
    argv: [config, get, hooks.bin]
    git: []
    files:
      itos.yaml: null
      .git/itos/itos.yaml: "version: 1\nhooks: { bin: bin/mine }\n"
    exit: 0
    stdout_contract: true
    stdout: |
      itos
  - name: config get gives a stealth config's own data where itos reads it, beside it
    argv: [config, get, work.registry]
    git: []
    files:
      itos.yaml: null
      .git/itos/itos.yaml: "version: 1\nwork: { registry: work-items.yaml }\n"
    exit: 0
    stdout_contract: true
    stdout: |
      .git/itos/work-items.yaml
  - name: config get from a subfolder reads the config at the repository's top
    argv: [config, get, work.registry]
    git: []
    files:
      sub/: ""
    cwd: sub
    exit: 0
    stdout_contract: true
    stdout: |
      work-items.yaml
  - name: config get reads ci.watch's nightly workflow, a key itos status reads
    argv: [config, get, ci.watch.github.nightly_workflow]
    files:
      itos.yaml: |
        version: 1
        ci:
          steps: []
          watch: { provider: github, github: { nightly_workflow: nightly.yml } }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 0
    stdout_contract: true
    stdout: |
      nightly.yml
  - name: ci.watch's nightly workflow has no default, so status prints no nightly
    argv: [config, get, ci.watch.github.nightly_workflow]
    exit: 0
    stdout_contract: true
    stdout: ""
  - name: config get refuses a key v5 removed, saying what to do instead
    argv: [config, get, ci.watch.nightly_command]
    exit: 2
    stderr_has: [ci.watch.nightly_command, ci.watch.github.nightly_workflow]
  - name: config get refuses a key the config does not have, naming the keys there
    argv: [config, get, hooks.no_such_key]
    exit: 2
    stderr_has: [hooks.no_such_key, "bin, pre_push, commit_msg"]
  - name: config get refuses a key under a value that has none
    argv: [config, get, hooks.bin.x]
    exit: 2
    stderr_has: hooks.bin.x
  - name: config get needs one key
    argv: [config, get]
    exit: 2
    stderr_has: "<key>"
  - name: config get with no config to read fails as every command does
    argv: [config, get, hooks.bin, --json]
    files:
      itos.yaml: null
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: config-unreadable }] }
  # pin: the one release a repository runs (pin.feature). Pinned to the
  # binary's own version, so the launcher runs the binary itself and fetches
  # nothing; the malformed pins are read by no launcher either.
  - name: a pin of a release with the SHA-256 of its checksums.txt is sound
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        pin: { version: "{{version}}", checksums: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 0
    json: { schema: 1, config: itos.yaml, valid: true, problems: [] }
  - name: a pin needs both its version and its checksums
    argv: [config, check, --json, --config, pin.yaml]
    files:
      pin.yaml: "version: 1\npin: { version: \"{{version}}\" }\n"
    exit: 2
    json:
      schema: 1
      config: pin.yaml
      valid: false
      problems: [{ rule: config-missing-key, area: config }]
    stdout_has: pin.checksums
  - name: pin.version is a release's version and pin.checksums a SHA-256 in hex
    argv: [config, check, --json, --config, pin.yaml]
    files:
      pin.yaml: "version: 1\npin: { version: v2, checksums: ABC }\n"
    exit: 2
    json:
      schema: 1
      config: pin.yaml
      valid: false
      problems: [{ rule: config-pin, area: config }, { rule: config-pin, area: config }]
    stdout_has: [pin.version, pin.checksums]
