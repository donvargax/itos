          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 2
    stderr: |
      FAIL since.yaml: commits.since names {{sha.first}}, which this clone does not have: the clone is shallow, and the commit may lie beyond its history. Fetch the whole history with git fetch --unshallow, or with fetch-depth: 0 for actions/checkout
  - name: commits.since beyond a shallow clone's history, as JSON with its fix
    argv: [config, check, --config, since.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
        label: first
      - commit: "docs: write the readme"
