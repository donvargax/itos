  # A footer of free text (source: text) says what a consumer must do, or
  # none: it has no IDs, so the keys that say how IDs are written and read
  # would be read by nothing. Its since is checked as commits.since is.
  - name: a footer of free text with a since naming a commit of the repository
    argv: [config, check, --config, text.yaml]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
        label: start
    files:
      text.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits:
          types: [build, docs]
          footers:
            Upgrading: { source: text, required_for: [build], validate_for: all, since: "{{sha.start}}" }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 0
    stdout: |
      text.yaml is valid, and so are the 2 ledger files it reads
      work-items.yaml: sound
      smoke.yaml: every file has a smoke test (1 in all)
  - name: a footer of free text takes no key that reads IDs, and its since is a full SHA
    argv: [config, check, --json, --config, text.yaml]
    files:
      text.yaml: |
        version: 1
        commits:
          types: [build, docs]
          footers:
            Upgrading: { source: text, strip_prefix: "@", required_for: [build], must_be_live: false, read_at: commit, since: abc1234 }
    exit: 2
    json:
      schema: 1
      config: text.yaml
      valid: false
      problems:
        - rule: config-since
          message: "text.yaml: commits.footers.Upgrading.since is not the full SHA of a commit: abc1234"
          fix: set commits.footers.Upgrading.since to the commit's full SHA, as `git rev-parse <commit>` prints it
          area: config
        - rule: config-footer-text
          message: "text.yaml: commits.footers.Upgrading.strip_prefix is for a footer of IDs, and commits.footers.Upgrading is free text (source: text)"
          fix: remove commits.footers.Upgrading.strip_prefix
          area: config
        - rule: config-footer-text
          message: "text.yaml: commits.footers.Upgrading.must_be_live is for a footer of IDs, and commits.footers.Upgrading is free text (source: text)"
          fix: remove commits.footers.Upgrading.must_be_live
          area: config
        - rule: config-footer-text
          message: "text.yaml: commits.footers.Upgrading.read_at is for a footer of IDs, and commits.footers.Upgrading is free text (source: text)"
          fix: remove commits.footers.Upgrading.read_at
          area: config
  - name: a footer's since naming no commit of the repository
    argv: [config, check, --config, text.yaml]
