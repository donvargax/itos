          commit_msg:
            task_checks: true
            check_timeout: 60
        push:
          mode: trunk
          pr:
            draft: false
            review_by: []
            review_stall: 0
            ready_wait: 540
            direct:
              types: []
              except: []
        guide:
          orchestrating: docs/ORCHESTRATING.md
  # config get: a key's value as the tools read it, for a program beside itos
