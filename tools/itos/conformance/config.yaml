# The config and what it names (`itos config check`): a sound
# config, ledger, registry and smoke set; each config problem by its rule
# (an unknown key and the key it misspells, a wrong type, a value not
# allowed, a missing key, a pattern that does not compile as RE2 (a lookaround,
# a backreference, a repeat count above 1000, a letter escape, an empty class,
# a kind's ID pattern among them), a name that refers
# to nothing, a commits.since or a footer's since that is no full SHA or no
# commit here, a footer of free text with a key that reads IDs, a scope's except
# without a never), exit 2;
# a missing ledger folder, one problem naming it, exit 2; each ledger problem (written order among them, a check that calls hooks.bin read as itos), exit 1;
# a check static by a ci.cost.static pattern that written order runs late, a warning that passes;
# the registry's and the smoke set's problems beside them; the decision
# records' (a number twice, a supersede link to no record); a project's people
# file missing or unreadable, a warning that passes; a tasks step, which v8
# removed, refused wherever it is written; the values a command misbehaves on,
# refused when the config loads, exit 2, and those nothing reads as written,
# exit 1; ledger layouts that read nothing or read the registry, exit 1; the
# questions' file's problems, exit 1; --print-defaults,
# work.registry's beside the config's ledger, and work.asks beside the registry;
# config get, a key's value as the tools read it (the config's, a default, a stealth config's own, from a
# subfolder; a scalar bare, a mapping or a list as JSON, nothing for no value;
# an unknown key a usage error); a pin, its keys and their shapes.
files:
  itos.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
    commits: { types: [build, docs] }
    tests:
      scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
    ci:
      steps: [{ run: vp check, cost: static }]
      cost: { static: ["^vp check$"], keep_written_order: true }
    work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
  tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: vp check }] }\n"
  tasks/phase-2.yaml: "- { id: T-002, type: docs, title: Two }\n"
  work-items.yaml: "phases: { 1: a }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: a, status: done }\n"
  people.yaml: "- a\n"
  smoke.yaml: "- file: a.feature\n  scenarios: [{ id: \"@ID-A-01\", why: opens }]\n"
  features/a.feature: "Feature: A\n\n  @ID-A-01\n  Scenario: Opens\n    When I open it\n"
cases:
  - name: a sound config, ledger, registry and smoke set
    argv: [config, check, --json]
    exit: 0
    json: { schema: 1, config: itos.yaml, valid: true, problems: [] }
  - name: quietly
    argv: [config, check, -q]
    exit: 0
    stdout: ""
    stderr: ""
  # A project's people file missing or unreadable is a warning, which never
  # fails the run: without the people, the registry's owners go unchecked.
  - name: a missing people file is a warning, and the check passes
    argv: [config, check, --json]
    files: { people.yaml: null }
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      valid: true
      problems: []
      warnings: [{ rule: work-people-missing, area: people }]
    stdout_has: people.yaml
  - name: a YAML people file that is not a list is a warning, its owners unchecked
    argv: [config, check, --json]
    files:
      people.yaml: "people: [a]\n"
      work-items.yaml: "phases: { 1: z }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: q, status: done }\n"
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      valid: true
      problems: []
      warnings: [{ rule: work-people-unreadable, area: people }]
    stdout_has: people.yaml
  - name: a YAML people entry that is not a login is a warning
    argv: [config, check, -q, --json]
    files: { people.yaml: "- a\n- 3\n" }
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      valid: true
      problems: []
      warnings: [{ rule: work-people-unreadable, area: people }]
    stdout_has: "entry 1"
  - name: an .all-contributorsrc without a contributors list is a warning
    argv: [config, check, -q, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        work: { registry: work-items.yaml, people: { source: all-contributorsrc, file: .all-contributorsrc } }
      .all-contributorsrc: '{"projectName":"x"}'
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      valid: true
      problems: []
      warnings: [{ rule: work-people-unreadable, area: people }]
    stdout_has: ".all-contributorsrc"
  - name: an .all-contributorsrc contributor without a login is a warning
    argv: [config, check, -q, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        work: { registry: work-items.yaml, people: { source: all-contributorsrc, file: .all-contributorsrc } }
      .all-contributorsrc: '{"contributors":[{"name":"No Login"}]}'
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      valid: true
      problems: []
      warnings: [{ rule: work-people-unreadable, area: people }]
    stdout_has: "contributors[0]"
  - name: a misspelt key names the key it misspells (typo.yaml)
    argv: [config, check, --json, --config, typo.yaml]
    files:
      typo.yaml: "version: 1\nci:\n  steps: [{ run: vp check, cost: static }]\n  cost:\n    static: [\"^vp check$\"]\n    keep_writen_order: true\n"
    exit: 2
    json:
      schema: 1
      config: typo.yaml
      valid: false
      problems: [{ rule: config-unknown-key, area: config }]
    stdout_has: [ci.cost.keep_writen_order, keep_written_order]
  - name: an unknown key far from any lists the keys there are
    argv: [config, check, --json]
    files: { itos.yaml: "version: 1\nhooks: { shims: true }\n" }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: config-unknown-key, area: config }]
    stdout_has: [hooks.shims, "bin, pre_push, commit_msg"]
  # Slice 97: work.tags, the tags a work item may carry, are distinct names.
  - name: work.tags declares no empty tag and none twice
    argv: [config, check, --json]
    files: { itos.yaml: "version: 1\nwork: { tags: [plugin, '', plugin] }\n" }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: config-work-tag-empty, area: config }, { rule: config-work-tag-twice, area: config }]
    stdout_has: ["work.tags[1]", plugin]
  - name: the keys of features not built yet are unknown, header_lint.use is builtin or command, and hooks.manager, removed in v6, is unknown
    argv: [config, check, --json]
    files:
      itos.yaml: "version: 1\nledger: { files: \"tasks/phase-{group}.yaml\", check: { pushed: remote-branch-contains-head } }\ncommits:\n  header_lint: { use: both, alongside: builtin, stdin: lint }\nhooks: { manager: overcommit }\n"
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-unknown-key, area: config }
        - { rule: config-enum, area: config }
        - { rule: config-unknown-key, area: config }
        - { rule: config-unknown-key, area: config }
    stdout_has: [ledger.check.pushed, commits.header_lint.use, commits.header_lint.alongside, hooks.manager]
  - name: wrong types, a value not allowed, missing keys
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: "1"
        shell: sh
        ledger: { group: { numeric: "true" } }
        ci: { steps: [vp check], stop_at_first_failure: 1, range: { provider: gitlab } }
        work: { people: { file: people.yaml } }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-type, area: config }
        - { rule: config-type, area: config }
        - { rule: config-type, area: config }
        - { rule: config-missing-key, area: config }
        - { rule: config-type, area: config }
        - { rule: config-enum, area: config }
        - { rule: config-missing-key, area: config }
    stdout_has: [ledger.group.numeric, ledger.files, ci.stop_at_first_failure, ci.range.provider, work.people.source]
  - name: a config that is not a mapping
    argv: [config, check, --json]
    files: { itos.yaml: "- version: 1\n" }
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: config-type, area: config }] }
  - name: patterns that do not compile, and a ledger file name without its group
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: tasks/all.yaml, id: "T-(\\d+", group: { pattern: "[" } }
        ci:
          steps: [vp check]
          cost: { static: ["^vp check(" ] }
          covers: [{ by: vp check, matches: "*" }]
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-ledger-files, area: config }
    stdout_has: ["ci.cost.static[0]", "ci.covers[0].matches", ledger.id, ledger.group.pattern, tasks/all.yaml]
  # The config's patterns are RE2 in both implementations
  # (docs/decisions/0020-the-config-s-regular-expressions-are-re2.md): JavaScript compiles each of these, and the TypeScript refuses
  # them as RE2 does, a lookaround outside a class and a backreference in or out
  # of one; tests.<kind>.id is checked as the other four keys are.
  - name: patterns RE2 does not have, a lookaround and a backreference, and a kind's ID pattern
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/all-{group}.yaml", id: "T-(?!0)\\d+", group: { pattern: "(\\d)\\1*" } }
        tests:
          unit: { id: "U-(?<=U-)\\d+" }
          e2e: { id: "E-[\\1]" }
          spec: { id: "S-(?<n>\\d)\\k<n>" }
          fine: { id: "F-[(?=]\\(?!\\d+\\)" }
        ci:
          steps: [vp check]
          cost: { static: ["^vp check(?= )"] }
          covers: [{ by: vp check, matches: "^(\\w+) \\1$" }]
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
    stdout_has: ["ci.cost.static[0]", "ci.covers[0].matches", tests.unit.id, tests.e2e.id, tests.spec.id, ledger.id, ledger.group.pattern]
  # JavaScript compiles each of these too, and RE2 refuses them: a repeat count
  # above 1000, nested counted repeats multiplying, \c, a letter escape RE2 has
  # no reading for, [\b], [] and [^] (RE2 reads a ] right after [ or [^ as a
  # member), and a Unicode class RE2 has no name for. tests.fine.id is RE2's.
  - name: patterns RE2 does not have, a repeat count above 1000, letter escapes and empty classes
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/all-{group}.yaml", id: "T-\\e\\d+", group: { pattern: "\\d{1,1001}" } }
        tests:
          unit: { id: "U-\\cA" }
          e2e: { id: "E-[\\b]" }
          spec: { id: "S-[]" }
          story: { id: "N-[^]" }
          case: { id: "C-\\p{Foo}" }
          fine: { id: "F-[]a]\\pL\\x{41}" }
        ci:
          steps: [vp check]
          cost: { static: ["^vp check a{1001}"] }
          covers: [{ by: vp check, matches: "^(vp check {100}){11}$" }]
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
        - { rule: config-regexp, area: config }
    stdout_has: ["ci.cost.static[0]", "ci.covers[0].matches", tests.unit.id, tests.e2e.id, tests.spec.id, tests.story.id, tests.case.id, ledger.id, ledger.group.pattern]
  - name: names that refer to nothing
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        commits:
          types: [build]
          footers:
            Task: { source: tasks, required_for: [chore], validate_for: some }
            Tests: { source: { tests: e2e }, validate_for: [build, docs] }
          scopes:
            docs: { only: ["**/*.md"] }
        ci:
          steps: [{ run: a, tests: scenario }, { tests: unit }, { cost: late }]
        tests:
          unit: { id: "U-\\d+" }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-scope-type, area: config }
        - { rule: config-footer-source, area: config }
        - { rule: config-footer-types, area: config }
        - { rule: config-footer-types, area: config }
        - { rule: config-footer-source, area: config }
        - { rule: config-footer-types, area: config }
        - { rule: config-step, area: config }
        - { rule: config-step-tests, area: config }
        - { rule: config-step, area: config }
    stdout_has: [commits.scopes.docs, commits.footers.Task.source, commits.footers.Task.required_for, commits.footers.Task.validate_for, commits.footers.Tests.source, commits.footers.Tests.validate_for, tests.unit.run.whole]
  - name: an except in a scope with no never (config-scope-except)
    argv: [config, check, --json]
    files:
      itos.yaml: &except |
        version: 1
        commits:
          types: [chore, docs]
          scopes:
            chore: { except: ["src/games/*/themes/**"] }
            docs: { only: ["**/*.md"], never: [], except: ["docs/**"] }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: config-scope-except, area: config }, { rule: config-scope-except, area: config }]
    stdout_has: [commits.scopes.chore, commits.scopes.docs]
  - name: commit check-paths refuses a scope's except with no never, as config check does
    argv: [commit, check-paths, --type, chore, src/games/cielo/themes/colours.ts, --json]
    files:
      itos.yaml: *except
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: config-scope-except }, { rule: config-scope-except }]
    stdout_has: [commits.scopes.chore, commits.scopes.docs]
  - name: a static check written below a late one (static-after-late)
    argv: [config, check, --ledger, late.yaml, --json]
    files:
      late.yaml: |
        - id: T-090
          type: build
          title: A static check written below a late one
          done_when:
            - run: vp run changelog
            - run: sh -c 'test -s docs/changelog/CHANGELOG.md'
              cost: static
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: ledger-static-after-late, area: ledger }]
    stdout_has: T-090
  # Bug 27: a check static by a ci.cost.static pattern, written below a late
  # one, runs late just the same, and is a warning, never a failure: failing
  # ledgers that passed before would break every project holding one.
  - name: a check static by a pattern written below a late one is a warning (pattern-static-after-late)
    argv: [config, check, --ledger, pattern.yaml, --json]
    files:
      pattern.yaml: |
        - id: T-093
          type: build
          title: A check static by a pattern written below a late one
          done_when:
            - run: vp run changelog
            - run: vp check
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      valid: true
      problems: []
      warnings: [{ rule: ledger-pattern-static-after-late, area: ledger }]
    stdout_has: T-093
  - name: beside an explicit cost static below a late check, which still fails
    argv: [config, check, --ledger, both.yaml, --json]
    files:
      both.yaml: |
        - id: T-094
          type: build
          title: Explicit static below a late check
          done_when:
            - run: vp run changelog
            - { run: vp check, cost: static }
        - id: T-095
          type: build
          title: Pattern-static below a late check
          done_when:
            - run: vp run changelog
            - run: vp check
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: ledger-static-after-late, area: ledger }]
      warnings: [{ rule: ledger-pattern-static-after-late, area: ledger }]
    stdout_has: [T-094, T-095]
  - name: without keep_written_order, a check static by a pattern below a late one is not reported
    argv: [config, check, -q, --ledger, pattern.yaml, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: false }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
      pattern.yaml: |
        - id: T-093
          type: build
          title: A check static by a pattern written below a late one
          done_when:
            - run: vp run changelog
            - run: vp check
    exit: 0
    json: { schema: 1, config: itos.yaml, valid: true, problems: [] }
  - name: a check that calls hooks.bin is read as itos by the patterns, one under another path as written
    argv: [config, check, --ledger, bin.yaml, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$", "^itos work check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
        hooks: { bin: tools/bin/itos }
      bin.yaml: |
        - id: T-091
          type: build
          title: hooks.bin, tools/bin/itos, read as itos
          done_when:
            - run: tools/bin/itos work check
            - run: vp check
              cost: static
        - id: T-092
          type: build
          title: Another path, read as written, and late
          done_when:
            - run: other/itos work check
            - run: vp check
              cost: static
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: ledger-static-after-late, area: ledger }]
    stdout_has: T-092
  - name: every problem of a task, as --json
    argv: [config, check, --json, --ledger, bad.yaml]
    files:
      bad.yaml: |
        - id: T-1
          type: build
          title: Fine
        - id: T-1
          type: build
          title: Again
        - id: X-2
          type: feat
          title: 3
          why: [a]
          owner: someone
          done_when:
            - run: a
              fails: b
            - {}
            - run: [a]
            - run: a
              after: merge
              timeout: soon
              prose: maybe
              cost: cheap
              when: always
            - just a string
        - type: build
          done_when: nope
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: ledger-duplicate-id, area: ledger }
        - { rule: ledger-unknown-key, area: ledger }
        - { rule: ledger-id-pattern, area: ledger }
        - { rule: ledger-type, area: ledger }
        - { rule: ledger-no-title, area: ledger }
        - { rule: ledger-why, area: ledger }
        - { rule: ledger-check-run-or-fails, area: ledger }
        - { rule: ledger-check-run-or-fails, area: ledger }
        - { rule: ledger-check-command, area: ledger }
        - { rule: ledger-check-unknown-key, area: ledger }
        - { rule: ledger-check-value, area: ledger }
        - { rule: ledger-check-value, area: ledger }
        - { rule: ledger-check-value, area: ledger }
        - { rule: ledger-check-value, area: ledger }
        - { rule: ledger-check-shape, area: ledger }
        - { rule: ledger-no-id, area: ledger }
        - { rule: ledger-no-title, area: ledger }
        - { rule: ledger-done-when, area: ledger }
    stdout_has: [T-1, X-2, "task 4 of bad.yaml"]
  - name: a ledger file that is not a list, and one that cannot be read
    argv: [config, check, --json]
    files:
      tasks/phase-1.yaml: "id: T-001\n"
      tasks/phase-2.yaml: "- id: T-002\n  title: a: b\n"
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: ledger-not-a-list, area: ledger }, { rule: ledger-unreadable, area: ledger }]
    stdout_has: [tasks/phase-1.yaml, tasks/phase-2.yaml]
  - name: the registry's and the smoke set's problems beside the ledger's
    argv: [config, check, --json]
    files:
      work-items.yaml: "phases: { 1: a }\nitems:\n  - { id: T-001, title: One, phase: 1, owner: z, status: done }\n"
      smoke.yaml: "- file: a.feature\n  scenarios: [{ id: \"@ID-A-02\", why: gone }]\n"
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: work-unknown-owner, area: registry }, { rule: smoke-not-live, area: smoke }]
    stdout_has: [T-001, "@ID-A-02"]
  - name: no registry where itos looks is the registry's problem, naming the path
    argv: [config, check, --json]
    files:
      work-items.yaml: null
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: work-registry-missing, area: registry }]
    stdout_has: work-items.yaml
  # The decision records in the folder work.decisions names (slice 74): no
  # two share a number, and a record superseded names one the folder has.
  # The status is read from the frontmatter as YAML, its words in any case.
  - name: decision records that hold to both rules pass
    argv: [config, check, --json]
    files:
      docs/decisions/0001-use-go.md: "---\nstatus: SUPERSEDED BY adr-0002\n---\n\n# Use Go\n"
      docs/decisions/0002-use-rust.md: "# Use Rust\n"
      docs/decisions/README.md: "# Decisions\n"
    exit: 0
    json: { schema: 1, config: itos.yaml, valid: true, problems: [] }
  - name: decision records sharing a number, and one superseded by a record not there
    argv: [config, check, --json]
    files:
      docs/decisions/0001-use-go.md: "---\nstatus: superseded by ADR-0009\n---\n\n# Use Go\n"
      docs/decisions/0002-use-rust.md: "# Use Rust\n"
      docs/decisions/0002-use-zig.md: "# Use Zig\n"
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: decisions-number-twice, area: decisions }
        - { rule: decisions-superseded-by-missing, area: decisions }
    stdout_has: [docs/decisions/0002-use-zig.md, ADR-0009]
  - name: a smoke set that cannot be read is one problem
    argv: [config, check, --json]
    files:
      smoke.yaml: "file: a.feature\n"
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: smoke-unreadable, area: smoke }]
    stdout_has: smoke.yaml
  - name: a missing ledger folder is one problem naming it, exit 2
    argv: [config, check, --json]
    files: { tasks: null }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: ledger-folder-missing, area: ledger }]
    stdout_has: "folder tasks"
  - name: commits.since naming a commit of the repository
    argv: [config, check, --config, since.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
        label: start
    files:
      since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs], since: "{{sha.start}}" }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 0
    json: { schema: 1, config: since.yaml, valid: true, problems: [] }
  - name: commits.since that is not a full SHA
    argv: [config, check, --json, --config, since.yaml]
    files:
      since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs], since: "abc1234" }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 2
    json:
      schema: 1
      config: since.yaml
      valid: false
      problems: [{ rule: config-since, area: config }]
    stdout_has: abc1234
  - name: commits.since naming no commit of the repository
    argv: [config, check, --config, since.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
    files:
      since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs], since: "0123456789abcdef0123456789abcdef01234567" }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 2
    json:
      schema: 1
      config: since.yaml
      valid: false
      problems: [{ rule: config-since-commit, area: config }]
    stdout_has: 0123456789abcdef0123456789abcdef01234567
  # actions/checkout clones one commit deep by default: the clone lacks the
  # commit commits.since names, though the repository it was cloned from has it.
  - name: commits.since beyond a shallow clone's history
    argv: [config, check, --config, since.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
        label: first
      - commit: "docs: write the readme"
        files: { README.md: "scratch, written\n" }
      - run: "git clone -q --depth 1 'file://{{dir}}' shallow"
    cwd: shallow
    files:
      shallow/since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs], since: "{{sha.first}}" }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 2
    json:
      schema: 1
      config: since.yaml
      valid: false
      problems: [{ rule: config-since-commit, area: config }]
    stdout_has: ["{{sha.first}}", "git fetch --unshallow"]
  - name: a footer of free text with a since naming a commit of the repository
    argv: [config, check, --config, text.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
        label: start
    files:
      text.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits:
          types: [build, docs]
          footers:
            Upgrading: { source: text, required_for: [build], validate_for: all, since: "{{sha.start}}" }
        tests:
          scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", smoke: { file: smoke.yaml } }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 0
    json: { schema: 1, config: text.yaml, valid: true, problems: [] }
  - name: a footer of free text takes no key that reads IDs, and its since is a full SHA
    argv: [config, check, --json, --config, text.yaml]
    files:
      text.yaml: |
        version: 1
        commits:
          types: [build, docs]
          footers:
            Upgrading: { source: text, strip_prefix: "@", required_for: [build], must_be_live: false, read_at: commit, since: abc1234 }
    exit: 2
    json:
      schema: 1
      config: text.yaml
      valid: false
      problems:
        - { rule: config-since, area: config }
        - { rule: config-footer-text, area: config }
        - { rule: config-footer-text, area: config }
        - { rule: config-footer-text, area: config }
    stdout_has: [commits.footers.Upgrading.since, commits.footers.Upgrading.strip_prefix, commits.footers.Upgrading.must_be_live, commits.footers.Upgrading.read_at]
  - name: a footer's since naming no commit of the repository
    argv: [config, check, --config, text.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
    files:
      text.yaml: |
        version: 1
        commits:
          types: [build, docs]
          footers:
            Upgrading: { source: text, required_for: [build], since: "0123456789abcdef0123456789abcdef01234567" }
    exit: 2
    json:
      schema: 1
      config: text.yaml
      valid: false
      problems: [{ rule: config-since-commit, area: config }]
    stdout_has: commits.footers.Upgrading.since
  - name: a hooks.commit_msg.check_timeout of no seconds is refused, since it would be no timeout
    argv: [config, check, --config, hook.yaml, --json]
    files: { hook.yaml: "version: 1\nhooks: { commit_msg: { check_timeout: 0 } }\n" }
    exit: 2
    json:
      schema: 1
      config: hook.yaml
      valid: false
      problems: [{ rule: config-check-timeout, area: config }]
    stdout_has: hooks.commit_msg.check_timeout
  # Values a command misbehaves on (slice 129, moved to the loader in slice
  # 130): a number not finite, an empty shell, a ledger.check.timeout of 0 are
  # refused when the config loads, exit 2, by config check as by every
  # command, and nothing else is judged.
  - name: values a command misbehaves on are refused when the config loads, exit 2, each naming its key
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        shell: []
        ledger:
          files: "tasks/phase-{group}.yaml"
          group: { label: skip, pattern: "\\d+", numeric: true }
          id: "T-\\d+"
          check: { timeout: 0 }
        commits: { types: [build, docs] }
        ci:
          steps: []
          watch: { interval: .nan, timeout: .inf }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-number-finite, area: config }
        - { rule: config-number-finite, area: config }
        - { rule: config-shell, area: config }
        - { rule: config-check-timeout, area: config }
    stdout_has: [ci.watch.interval, ci.watch.timeout, ledger.check.timeout]
  - name: a value a command misbehaves on, as --json, the loader's problem with its rule and fix
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        shell: [""]
        ledger: { files: "tasks/phase-{group}.yaml", group: { label: "a phase", pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 2
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: config-shell, area: config }] }
  # Values a config loads with that nothing reads as written (slice 129):
  # config check names each, exit 1, beside the ledger's problems, and every
  # other command still reads the config.
  - name: values nothing reads as written are refused, exit 1, each naming its key
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ledger:
          files: "tasks/phase-{group}.yaml"
          group: { label: skip, pattern: "\\d+", numeric: true }
          id: "T-\\d+"
        commits: { types: [build, docs] }
        tests:
          scenario:
            root: features
            id: "ID-[A-Z]+-\\d+"
            tag_prefix: "@"
            smoke: { file: smoke.yaml }
            range_checks: [{ name: moves, builtin: moves, except_types: [biuld] }]
          unit: { adapter: { command: "true" }, wip_tag: "@wip" }
        ci:
          steps: [{ run: vp check, cost: static }]
          cost: { static: ["^vp check$"], keep_written_order: true }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
      tasks/phase-1.yaml: "- { id: T-001, type: build, title: One, done_when: [{ run: vp check, timeout: -1 }] }\n"
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-except-types, area: config }
        - { rule: config-wip-tag, area: config }
        - { rule: config-group-label, area: config }
        - { rule: ledger-check-value, area: ledger }
    stdout_has: ["tests.scenario.range_checks[0].except_types", tests.unit.wip_tag, ledger.group.label, T-001]
  - name: a value nothing reads as written, as --json, with its rule, its fix and the config's area
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { label: "a phase", pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: config-group-label, area: config }]
    stdout_has: ledger.group.label
  # Ledger layouts that read nothing, or read the registry (slice 130), are
  # judged before the ledger's folder is listed, exit 1, and no ledger file
  # is read.
  - name: a ledger.group.pattern with its own anchors and {group} as a folder are refused, exit 1
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/{group}/phase-{group}.yaml", group: { pattern: "^\\d+$" }, id: "T-\\d+" }
        commits: { types: [build, docs] }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - { rule: config-ledger-group-anchors, area: config }
        - { rule: config-ledger-files-folder, area: config }
    stdout_has: [ledger.group.pattern, ledger.files]
  - name: a ledger.files that matches work.registry is refused, naming both keys
    argv: [config, check, --json]
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "{group}.yaml", group: { pattern: "[a-z-]+" } }
        commits: { types: [build, docs] }
        work: { registry: work-items.yaml, people: { source: yaml, file: people.yaml } }
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: config-ledger-registry, area: config }]
    stdout_has: [ledger.files, work.registry]
  # The questions' file, work.asks, is judged as the ledger and the registry
  # are (slice 130): as itos decision writes it, each item it names one the
  # registry has.
  - name: a question naming an item the registry does not have, with its rule and the area asks
    argv: [config, check, --json]
    files:
      asks.yaml: "questions:\n  - { id: q-1, item: T-001, question: \"Which way?\" }\n  - { id: q-2, item: p1-gone, question: \"Which other?\" }\n"
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: asks-unknown-item, area: asks }]
    stdout_has: [q-2, p1-gone]
  # An answered question naming an item the registry does not have is a
  # warning, which never fails the run (bug 105): it is a record, its item
  # gone breaks nothing; an open one, which holds its item up, is a problem.
  - name: an answered question naming an item the registry does not have is a warning, and the check passes
    argv: [config, check, --json]
    files:
      asks.yaml: "questions:\n  - { id: q-1, item: p1-gone, question: \"Which way?\", answer: \"This way.\" }\n"
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      valid: true
      problems: []
      warnings: [{ rule: asks-answered-unknown-item, area: asks }]
    stdout_has: [q-1, p1-gone]
  - name: an open question naming a missing item is a problem, an answered one a warning, as --json
    argv: [config, check, --json]
    files:
      asks.yaml: "questions:\n  - { id: q-1, item: p1-gone, question: \"Which way?\", answer: \"This way.\", decision: none }\n  - { id: q-2, item: p1-gone, question: \"Which other?\" }\n"
    exit: 1
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems: [{ rule: asks-unknown-item, area: asks }]
      warnings: [{ rule: asks-answered-unknown-item, area: asks }]
    stdout_has: [q-1, q-2]
  - name: a questions' file giving an id twice is refused, naming it
    argv: [config, check, --json]
    files:
      asks.yaml: "questions:\n  - { id: q-1, question: \"Which way?\" }\n  - { id: q-1, question: \"Which other?\" }\n"
    exit: 1
    json: { schema: 1, config: itos.yaml, valid: false, problems: [{ rule: asks-invalid, area: asks }] }
    stdout_has: q-1
  - name: a nightly tasks step is refused as the step v8 removed, whatever its value
    argv: [config, check, --json, --config, nightly.yaml]
    files: { nightly.yaml: "version: 1\nci: { steps: [], nightly: { steps: [{ tasks: doing }] } }\n" }
    exit: 2
