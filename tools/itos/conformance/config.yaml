          nightly: { steps: [{ tasks: done, cost: late }, { tasks: done, run: vp check }, { cost: static }] }
    exit: 2
    json:
      schema: 1
      config: tasks.yaml
      valid: false
      problems:
        - { rule: config-step-tasks, area: config }
        - { rule: config-step-tasks, area: config }
        - { rule: config-step-tasks, area: config }
        - { rule: config-step, area: config }
  - name: the defaults put the registry in the folder of this config's ledger
    argv: [config, check, --print-defaults, --json]
    files:
      itos.yaml: "version: 1\nledger: { files: \"work/phase-{group}.yaml\" }\n"
    exit: 0
    json_has: { defaults: { work: { registry: work/work-items.yaml, asks: work/asks.yaml } } }
  - name: with no config to read, the defaults put the registry in tasks/
    argv: [config, check, --print-defaults, --json]
    files:
      itos.yaml: null
    exit: 0
    json_has: { defaults: { work: { registry: tasks/work-items.yaml, asks: tasks/asks.yaml } } }
  - name: the defaults as --json
    argv: [config, check, --print-defaults, --json]
    exit: 0
    json:
      schema: 1
      defaults:
        shell:
          - sh
          - -c
        ledger:
          group:
            label: phase
            pattern: "[^/]+"
            numeric: false
          check:
            timeout: 600
        commits:
          reject_message: "Commit rejected:"
        tests:
          <kind>:
            adapter: gherkin
            tag_prefix: "@"
            wip_tag: "@wip"
            run:
              join:
                each: "{p}"
                sep: "|"
            smoke:
              every_file: true
        ci:
          wait_on_status:
            - todo
          stop_at_first_failure: true
          range:
            provider: github
            github:
              workflow: ci.yml
              repository_env: GITHUB_REPOSITORY
              token_env:
                - GITHUB_TOKEN
                - GH_TOKEN
          watch:
            provider: none
            github:
              workflow: ci.yml
            interval: 10
            timeout: 1800
        work:
          registry: tasks/work-items.yaml
          asks: asks.yaml
          decisions: docs/decisions
          groups_key: phases
          statuses:
            - todo
            - doing
            - done
            - blocked
          people:
            source: all-contributors-md
            file: CONTRIBUTORS.md
          identity:
            provider: github
            hint: pass --as <handle>
        hooks:
