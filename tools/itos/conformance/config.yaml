      - run: "git clone -q --depth 1 'file://{{dir}}' shallow"
    cwd: shallow
    files:
      shallow/since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
        commits: { types: [build, docs], since: "{{sha.first}}" }
