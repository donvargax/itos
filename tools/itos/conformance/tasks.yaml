# The ledger and its checks (`itos task`, `task list`):
# checks run in written order, a `fails:` one must fail, `after: push` waits
# for a remote branch that holds HEAD, a check's timeout; verbose for one task,
# one status line per task; --group (or --phase), --skip, --pending; unknown
# IDs (1) and no match (2); a missing ledger folder, one problem naming it (2);
# --json with each check's result. One invocation
# runs each check (its command, whitespace collapsed, and its timeout) once,
# each task reading the exit status by its own run: or fails:; the counting
# checks append to `runs`, so files_after counts their runs. task list prints
# each task's status from the work registry, or "no item", and runs nothing.
git:
  - commit: "docs: start"
    files: { README.md: "scratch\n" }
files:
  itos.yaml: |
    version: 1
    ledger:
      files: "tasks/phase-{group}.yaml"
      group: { label: phase, pattern: "\\d+", numeric: true }
      id: "T-\\d+"
    commits: { types: [build, ci, docs, test] }
  tasks/phase-1.yaml: |
    - id: T-001
      type: build
      title: Checks that pass
      done_when:
        - run: echo first
        - fails: sh -c 'echo second; exit 1'
    - id: T-002
      type: ci
      title: A check that fails
      done_when:
        - run: "true"
        - run: sh -c 'echo broken >&2; exit 5'
        - run: echo still runs
    - id: T-003
      type: docs
      title: Reviewed by hand
      done_when: []
  tasks/phase-2.yaml: |
    - id: T-004
      type: ci
      title: Waits on the push
      done_when:
        - run: "true"
        - run: echo pushed
          after: push
    - id: T-005
      type: test
      title: A check past its timeout
      done_when:
        - run: sleep 5
          timeout: 1
  tasks/notes.yaml: "- { id: T-090, type: build, title: Not a ledger file }\n"
cases:
  - name: one task runs verbosely, then its status line
    argv: [task, T-001]
    exit: 0
    stdout: |

      T-001 Checks that pass
        $ echo first
      first
        $ sh -c 'echo second; exit 1'   (must fail)
      second

      done     T-001  build    Checks that pass
  - name: a failing check fails the task, the rest still run
    argv: [task, T-002]
    exit: 1
    stdout: |

      T-002 A check that fails
        $ true
        $ sh -c 'echo broken >&2; exit 5'
        $ echo still runs
      still runs

      failing  T-002  ci       A check that fails
    stderr: |
      broken
  - name: several tasks, one status line each
    argv: [task, T-001, T-003, T-004]
    exit: 0
    stdout: |

      done     T-001  build    Checks that pass
      review   T-003  docs     Reviewed by hand
      pending  T-004  ci       Waits on the push
  - name: after push waits while no remote branch holds HEAD
    argv: [task, T-004]
    exit: 0
    stdout: |

      T-004 Waits on the push
        $ true

      pending  T-004  ci       Waits on the push
  - name: after push runs once a remote branch holds HEAD
    argv: [task, T-004]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
      - run: git update-ref refs/remotes/origin/main HEAD
    exit: 0
    stdout: |

      T-004 Waits on the push
        $ true
        $ echo pushed
      pushed

      done     T-004  ci       Waits on the push
  - name: a check past its timeout fails
    argv: [task, T-005]
    exit: 1
    stdout: |

      T-005 A check past its timeout
        $ sleep 5

      failing  T-005  test     A check past its timeout
  - name: a group of tasks
    argv: [task, --group, "1"]
    exit: 1
    stdout: |

      done     T-001  build    Checks that pass
      failing  T-002  ci       A check that fails
      review   T-003  docs     Reviewed by hand
  - name: --phase is --group
    argv: [task, --phase, "2", --skip, T-005]
    exit: 0
    stdout: |

      T-004 Waits on the push
        $ true

      pending  T-004  ci       Waits on the push
  - name: --pending shows the tasks not done
    argv: [task, --pending, --skip, "T-005,T-002"]
    exit: 0
    stdout: |

      review   T-003  docs     Reviewed by hand
      pending  T-004  ci       Waits on the push
  - name: an ID the ledger does not have
    argv: [task, T-001, T-099]
    exit: 1
    stderr: |
      No task T-099 in tasks/
  - name: no task matches
    argv: [task, --group, "7"]
    exit: 2
    stderr: |
      No matching tasks. Usage: itos task <id>… | --group <g> [--skip <ids>] | --pending
  - name: a task run with the ledger folder missing is one problem naming it, exit 2
    argv: [task, T-001]
    files: { tasks: null }
    exit: 2
    stderr: |
      FAIL itos.yaml: the ledger's folder tasks does not exist
  - name: --json with each check's result, the verbose log on stderr
    argv: [task, T-002, --json]
    exit: 1
    json:
      schema: 1
      tasks:
        - id: T-002
          type: ci
          title: A check that fails
          group: 1
          status: failing
          checks:
            - command: "true"
              result: pass
            - command: sh -c 'echo broken >&2; exit 5'
              result: fail
            - command: echo still runs
              result: pass
    stderr: |

      T-002 A check that fails
        $ true
        $ sh -c 'echo broken >&2; exit 5'
      broken
        $ echo still runs
      still runs
  - name: --json for several tasks
    argv: [task, T-001, T-003, T-004, --json]
    exit: 0
    json:
      schema: 1
      tasks:
        - id: T-001
          type: build
          title: Checks that pass
          group: 1
          status: done
          checks:
            - command: echo first
              result: pass
            - command: sh -c 'echo second; exit 1'
              fails: true
              result: pass
        - id: T-003
          type: docs
          title: Reviewed by hand
          group: 1
          status: review
          checks: []
        - id: T-004
          type: ci
          title: Waits on the push
          group: 2
          status: pending
          checks:
            - command: "true"
              result: pass
            - command: echo pushed
              result: pending
  - name: task list
    argv: [task, list]
    exit: 0
    stdout: |
      no item  T-001  1   build    Checks that pass
      no item  T-002  1   ci       A check that fails
      no item  T-003  1   docs     Reviewed by hand
      no item  T-004  2   ci       Waits on the push
      no item  T-005  2   test     A check past its timeout
    stderr: |
      No work registry at tasks/work-items.yaml, so no task has an item.
  - name: task list with the ledger folder missing is one problem naming it, exit 2
    argv: [task, list]
    files: { tasks: null }
    exit: 2
    stderr: |
      FAIL itos.yaml: the ledger's folder tasks does not exist
  - name: task list --json with the ledger folder missing is the config error's report
    argv: [task, list, --json]
    files: { tasks: null }
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
        - rule: ledger-folder-missing
          message: "itos.yaml: the ledger's folder tasks does not exist"
          fix: "create tasks with the ledger's files (ledger.files is tasks/phase-{group}.yaml), or point ledger.files at the folder that holds them"
  - name: task list of a group
    argv: [task, list, --group, "2"]
    exit: 0
    stdout: |
      no item  T-004  2   ci       Waits on the push
      no item  T-005  2   test     A check past its timeout
  - name: task list --json
    argv: [task, list, --json]
    exit: 0
    json:
      schema: 1
      tasks:
        - id: T-001
          type: build
          title: Checks that pass
          group: 1
          checks: 2
          status: null
        - id: T-002
          type: ci
          title: A check that fails
          group: 1
          checks: 3
          status: null
        - id: T-003
          type: docs
          title: Reviewed by hand
          group: 1
          checks: 0
          status: null
        - id: T-004
          type: ci
          title: Waits on the push
          group: 2
          checks: 2
          status: null
        - id: T-005
          type: test
          title: A check past its timeout
          group: 2
          checks: 1
          status: null
  - name: task list with the work registry's statuses, running no check
    argv: [task, list]
    files:
      tasks/work-items.yaml: |
        phases: { 1: null, 2: null }
        items:
          - { id: T-001, title: One, phase: 1, owner: null, status: doing, depends_on: [] }
          - { id: T-004, title: Four, phase: 2, owner: null, status: done, depends_on: [] }
          - { id: W-1, title: Not a task, phase: 1, owner: null, status: todo, depends_on: [] }
      tasks/phase-1.yaml: |
        - id: T-001
          type: build
          title: Counts its runs
          done_when:
            - run: sh -c 'echo ran >> runs'
    exit: 0
    stdout: |
      doing    T-001  1   build    Counts its runs
      done     T-004  2   ci       Waits on the push
      no item  T-005  2   test     A check past its timeout
    stderr: ""
    files_after:
      runs: null
  - name: task list --json with the registry's statuses
    argv: [task, list, --group, "2", --json]
    files:
      tasks/work-items.yaml: |
        phases: { 2: null }
        items:
          - { id: T-004, title: Four, phase: 2, owner: null, status: blocked, depends_on: [] }
    exit: 0
    json:
      schema: 1
      tasks:
        - id: T-004
          type: ci
          title: Waits on the push
          group: 2
          checks: 2
          status: blocked
        - id: T-005
          type: test
          title: A check past its timeout
          group: 2
          checks: 1
          status: null
  - name: task list reads the registry work.registry names
    argv: [task, list, --group, "2"]
    files:
      itos.yaml: |
        version: 1
        ledger:
          files: "tasks/phase-{group}.yaml"
          group: { label: phase, pattern: "\\d+", numeric: true }
          id: "T-\\d+"
        commits: { types: [build, ci, docs, test] }
        work: { registry: plans/items.yaml }
      plans/items.yaml: "items:\n  - { id: T-005, status: todo }\n"
    exit: 0
    stdout: |
      no item  T-004  2   ci       Waits on the push
      todo     T-005  2   test     A check past its timeout
    stderr: ""
  - name: a check two tasks list runs once, and both read its result
    argv: [task, --group, "3"]
    files:
      tasks/phase-3.yaml: |
        - id: T-010
          type: build
          title: Counts
          done_when:
            - run: sh -c 'echo ran >> runs; exit 3'
        - id: T-011
          type: build
          title: Counts too
          done_when:
            - run: sh  -c 'echo ran >> runs; exit 3'
    exit: 1
    stdout: |

      failing  T-010  build    Counts
      failing  T-011  build    Counts too
    files_after:
      runs: "ran\n"
  - name: a command one task runs and another must fail runs once, each reading it its way
    argv: [task, T-010, T-011]
    files:
      tasks/phase-3.yaml: |
        - id: T-010
          type: build
          title: Must pass
          done_when:
            - run: sh -c 'echo ran >> runs; exit 3'
        - id: T-011
          type: build
          title: Must fail
          done_when:
            - fails: sh -c 'echo ran >> runs; exit 3'
    exit: 1
    stdout: |

      failing  T-010  build    Must pass
      done     T-011  build    Must fail
    files_after:
      runs: "ran\n"
  - name: the same command with another timeout is another check
    argv: [task, --group, "3"]
    files:
      tasks/phase-3.yaml: |
        - id: T-010
          type: build
          title: Counts
          done_when:
            - run: sh -c 'echo ran >> runs'
        - id: T-011
          type: build
          title: Counts with its own timeout
          done_when:
            - run: sh -c 'echo ran >> runs'
              timeout: 30
        - id: T-012
          type: build
          title: The ledger's timeout written out
          done_when:
            - run: sh -c 'echo ran >> runs'
              timeout: 600
    exit: 0
    stdout: |

      done     T-010  build    Counts
      done     T-011  build    Counts with its own timeout
      done     T-012  build    The ledger's timeout written out
    files_after:
      runs: "ran\nran\n"
  - name: one task listing a check twice runs it once and says the second is reused
    argv: [task, T-010]
    files:
      tasks/phase-3.yaml: |
        - id: T-010
          type: build
          title: Lists a check twice
          done_when:
            - run: sh -c 'echo ran >> runs; echo out'
            - fails: sh -c 'echo ran >> runs; echo out'
    exit: 1
    stdout: |

      T-010 Lists a check twice
        $ sh -c 'echo ran >> runs; echo out'
      out
        $ sh -c 'echo ran >> runs; echo out'   (must fail)   (ran above; its exit status reused)

      failing  T-010  build    Lists a check twice
    files_after:
      runs: "ran\n"
  - name: an after push check waits though another task ran its command
    argv: [task, T-001, T-004]
    files:
      tasks/phase-1.yaml: |
        - id: T-001
          type: build
          title: Runs what T-004 waits on
          done_when:
            - run: echo pushed
    exit: 0
    stdout: |

      done     T-001  build    Runs what T-004 waits on
      pending  T-004  ci       Waits on the push
  - name: a ledger whose groups are names
    argv: [task, list]
    files:
      itos.yaml: "version: 1\nledger: { files: \"work/{group}.yaml\" }\n"
      work/alpha.yaml: "- { id: A-1, type: build, title: First, done_when: [{ run: \"true\" }] }\n"
      work/beta.yaml: "- { id: B-1, type: build, title: Second }\n"
    exit: 0
    stdout: |
      no item  A-1  alpha build    First
      no item  B-1  beta build    Second
  - name: a group by its name
    argv: [task, --group, beta]
    files:
      itos.yaml: "version: 1\nledger: { files: \"work/{group}.yaml\" }\n"
      work/alpha.yaml: "- { id: A-1, type: build, title: First, done_when: [{ run: \"true\" }] }\n"
      work/beta.yaml: "- { id: B-1, type: build, title: Second }\n"
    exit: 0
    stdout: |

      review   B-1  build    Second
