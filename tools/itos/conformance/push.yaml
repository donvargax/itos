# itos push: the routine of pulling with a rebase and pushing, as one
# command. Every argument but --no-wait, --tag and --ref is refused, a
# forcing one saying why;
# tracked files with uncommitted changes refuse it before anything is
# fetched, untracked ones never; it rebases onto the upstream (origin and the
# branch's own name when there is none) whatever pull.rebase says, leaves a
# rebase that stops for the person and pushes nothing; it pushes HEAD to the
# upstream's branch alone, so a push refspec in the config sends nothing
# else, not even a tag push.followTags would send, and a push the pre-push
# hook refuses is reported with git's exit code. --tag and --ref push the
# tags and branches they name, alone, to origin's refs of their names.
# Waiting for the CI run it started (ci.watch) is watch.yaml's.
#
# Each repository's remote is a bare one in its own git folder,
# .git/origin.git, so git's output names it the same in every case.
cases:
  - name: push --force is a usage error naming why
    argv: [push, --force]
    exit: 2
    stderr_has: --force
  - name: push -f is a usage error naming why
    argv: [push, -f]
    exit: 2
    stderr_has: -f
  - name: push --force-with-lease is a usage error naming why
    argv: [push, --force-with-lease=main]
    exit: 2
    stderr_has: --force-with-lease=main
  - name: a + refspec is a usage error naming why
    argv: [push, +main]
    exit: 2
    stderr_has: +main
  - name: push takes no arguments but --no-wait, --tag and --ref
    argv: [push, --no-wait, origin, main]
    exit: 2
    stderr_has: [--no-wait, --tag, --ref]
  - name: push --tag needs a tag's name
    argv: [push, --tag]
    exit: 2
    stderr_has: --tag
  - name: push --ref takes a branch's name, not a refspec
    argv: [push, --ref, "HEAD:ci/windows"]
    exit: 2
    stderr_has: "HEAD:ci/windows"
  - name: push outside a git repository is a missing environment
    argv: [push]
    exit: 3
    stderr_has: git repository
  - name: uncommitted changes to tracked files refuse the push
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - write: { README.md: "changed\n" }
    exit: 1
    json:
      schema: 1
      ok: false
      outcome: uncommitted
  - name: a detached HEAD is refused
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - run: git checkout -q --detach
    exit: 1
    json:
      schema: 1
      ok: false
      outcome: detached
  - name: no upstream and no origin is a missing environment
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
    exit: 3
    json:
      schema: 1
      ok: false
      outcome: no-remote
      remote: origin
      branch: main
  - name: with no upstream it pushes to origin's branch of the same name, untracked files no reason to refuse
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: head
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    files:
      untracked.txt: "not committed\n"
    exit: 0
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.head}}\n"
    json:
      schema: 1
      ok: true
      outcome: pushed
      remote: origin
      branch: main
      commit: '{{sha.head}}'
  - name: push --tag pushes the tag alone, to origin's tag of its name, the branch left where it was
    argv: [push, --tag, v1, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: start
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q -u origin main
      - commit: "chore: more"
        files: { notes.md: "more\n" }
        label: more
      - run: git tag v1
    exit: 0
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.start}}\n"
      .git/origin.git/refs/tags/v1: "{{sha.more}}\n"
    json:
      schema: 1
      ok: true
      outcome: pushed
      remote: origin
      tags:
      - v1
  - name: nothing to push is success
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git && git push -q origin main
    exit: 0
    json: { schema: 1, ok: true, outcome: nothing-to-push, remote: origin, branch: main }
  - name: the remote's commits are fetched and the branch rebased onto them before the push, whatever pull.rebase says
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - run: >-
          git init -q --bare .git/origin.git && git remote add origin .git/origin.git &&
          git push -q -u origin main && git config pull.rebase false &&
          git checkout -q -b theirs && echo theirs > docs.md && git add docs.md &&
          git commit -q -m 'chore: theirs' && git push -q origin theirs:main &&
          git checkout -q main && git branch -q -D theirs
      - commit: "chore: ours"
        files: { notes.md: "ours\n" }
    exit: 0
    json_has: { schema: 1, ok: true, outcome: pushed, remote: origin, branch: main, commit: "<any>" }
  - name: a rebase that stops pushes nothing
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - run: >-
          git init -q --bare .git/origin.git && git remote add origin .git/origin.git &&
          git push -q -u origin main &&
          git checkout -q -b theirs && echo theirs > README.md &&
          git commit -q -am 'chore: theirs' && git push -q origin theirs:main &&
          git checkout -q main && git branch -q -D theirs
      - commit: "chore: ours"
        files: { README.md: "ours\n" }
        label: ours
    exit: 1
    json:
      schema: 1
      ok: false
      outcome: rebase-stopped
      remote: origin
      branch: main
  - name: a rebase in progress refuses the push
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - run: >-
          git init -q --bare .git/origin.git && git remote add origin .git/origin.git &&
          git push -q -u origin main &&
          git checkout -q -b theirs && echo theirs > README.md &&
          git commit -q -am 'chore: theirs' && git push -q origin theirs:main &&
          git checkout -q main && git branch -q -D theirs
      - commit: "chore: ours"
        files: { README.md: "ours\n" }
      - run: git fetch -q origin && ! git rebase -q origin/main >/dev/null 2>&1
    exit: 1
    json:
      schema: 1
      ok: false
      outcome: rebase-in-progress
  - name: a push the pre-push hook refuses is reported with git's exit code
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
      - run: git init -q --bare .git/origin.git && git remote add origin .git/origin.git
    files:
      .git/hooks/pre-push: { text: "#!/bin/sh\necho the hook says no >&2\nexit 1\n", executable: true }
    exit: 1
    stderr_has: "the hook says no\n"
    files_after:
      .git/origin.git/refs/heads/main: null
    json:
      schema: 1
      ok: false
      outcome: push-failed
      remote: origin
      branch: main
  - name: only HEAD is pushed, the itos notes left behind whatever the config's push refspec says
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: head
      - run: >-
          git init -q --bare .git/origin.git && git remote add origin .git/origin.git &&
          git config remote.origin.push 'refs/notes/*:refs/notes/*' &&
          git notes --ref=refs/notes/itos add -m 'Task: T-001' HEAD
    files:
      .git/itos/itos.yaml: "version: 1\n"
    exit: 0
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.head}}\n"
      .git/origin.git/refs/notes/itos: null
    json:
      schema: 1
      ok: true
      outcome: pushed
      remote: origin
      branch: main
      commit: '{{sha.head}}'
  # push.mode pr (slice 174, ADR-0039): an item's work goes on a branch named
  # for its item and reaches main through a pull request; only the registry's
  # commits go straight to main. These two refusals call no gh; the rest of
  # pr mode, which needs one, is features/push-mode.feature's.
  - name: under push.mode pr a push from main of a commit touching more than the registry is refused, nothing pushed
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: start
      - run: git init -q --bare .git/origin.git && git -C .git/origin.git symbolic-ref HEAD refs/heads/main && git remote add origin .git/origin.git && git push -q -u origin main
      - commit: "feat: add the widget"
        files: { widget.md: "widget\n" }
    files:
      itos.yaml: "version: 1\npush: { mode: pr }\n"
    exit: 1
    files_after:
      .git/origin.git/refs/heads/main: "{{sha.start}}\n"
    json:
      schema: 1
      ok: false
      outcome: work-on-main
      remote: origin
      branch: main
  - name: under push.mode pr a push from a branch that names no item of the registry is refused, nothing pushed
    argv: [push, --json]
    git:
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: start
      - run: git init -q --bare .git/origin.git && git -C .git/origin.git symbolic-ref HEAD refs/heads/main && git remote add origin .git/origin.git && git push -q -u origin main && git checkout -q -b tidy
      - commit: "chore: tidy the readme"
        files: { README.md: "tidy\n" }
    files:
      itos.yaml: "version: 1\npush: { mode: pr }\n"
    exit: 1
    files_after:
      .git/origin.git/refs/heads/tidy: null
    json:
      schema: 1
      ok: false
      outcome: not-item-branch
      remote: origin
      branch: tidy
