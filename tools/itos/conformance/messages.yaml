# One message through the footer rules (`commit check-message`):
# the wording of each rejection, the tree each footer's IDs are read at (the
# staged tree by default, the commit --at names, the working tree for a
# commit that predates the source, or always with read_at: worktree), a
# ledger folder that is missing (read only for a message naming a task), another
# config's footers, a Gherkin kind's default wip tag named for a test not
# live, a command adapter's tests named in a footer, a
# delegated header lint's report read into problems, the footer rules run
# beside it, a footer of free text (there and not empty; none passes; its
# since not applied to a message), a range's free-text footers gathered
# (commit footers), and the built-in header lint (commits.header_lint.use: builtin):
# each of config-conventional's errors under commitlint's rule id and words,
# commits.types as the type list (config-conventional's own without it), its
# warnings printed without rejecting, the messages commitlint leaves alone,
# comment lines read as part of a message on stdin, no delegate run beside
# it, and use: command running the delegate as no use does.
#
# The repository: a commit before the ledger (bare); a feat naming a live
# scenario and T-002 (live); then the scenario set back to @wip and T-002
# taken out of the ledger (head).
git:
  - commit: "docs: start"
    files: { README.md: "scratch\n" }
    label: bare
  - commit: "feat: add a thing\n\nScenarios: @ID-SCRATCH-01\nTask: T-002\n"
    files:
      e2e/features/scratch.feature: &live |
        @phase-1
        Feature: Scratch

          @ID-SCRATCH-01
          Scenario: Lies down
            When I press "Play"
      tasks/phase-1.yaml: |
        - { id: T-001, type: build, title: Scratch T-001 }
        - { id: T-002, type: build, title: Scratch T-002 }
    label: live
  - commit: "docs: set the scenario back to @wip\n\nTask: T-001, T-001\n"
    files:
      e2e/features/scratch.feature: |
        @phase-1
        Feature: Scratch

          @ID-SCRATCH-01 @wip
          Scenario: Lies down
            When I press "Play"
      tasks/phase-1.yaml: |
        - { id: T-001, type: build, title: Scratch T-001 }
    label: head
files:
  itos.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", group: { pattern: "\\d+", numeric: true }, id: "T-\\d+" }
    commits:
      types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
      footers:
        Task:
          source: ledger
          required_for: [refactor, perf, test, build, ci, chore, revert]
          validate_for: all
          read_at: commit
        Scenarios:
          source: { tests: scenario }
          strip_prefix: "@"
          required_for: [feat, fix]
          validate_for: [feat, fix]
          must_be_live: true
          read_at: commit
    tests:
      scenario: { root: e2e/features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", wip_tag: "@wip" }
  other.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
    commits:
      types: [feat, chore, docs]
      footers:
        Refs: { source: ledger, required_for: [chore], validate_for: all, read_at: worktree }
        Tests:
          source: { tests: scenario }
          strip_prefix: "@"
          required_for: [feat]
          validate_for: [feat]
          read_at: commit
    tests:
      scenario: { root: e2e/features, id: "ID-[A-Z]+-\\d+", wip_tag: "@wip" }
cases:
  - name: a scenario now @wip is rejected in a new commit
    argv: [commit, check-message, "-"]
    stdin: "feat: x\n\nScenarios: @ID-SCRATCH-01\n"
    exit: 1
    stderr: |
      ✖   still tagged @wip: ID-SCRATCH-01 [scenarios-footer]
  - name: the message may come from a file
    argv: [commit, check-message, msg.txt]
    files: { msg.txt: "feat: x\n\nScenarios: @ID-SCRATCH-01\n" }
    exit: 1
    stderr: |
      ✖   still tagged @wip: ID-SCRATCH-01 [scenarios-footer]
  - name: --at reads the scenarios at that commit, where it was live
    argv: [commit, check-message, "-", --at, "{{sha.live}}"]
    stdin: "feat: x\n\nScenarios: @ID-SCRATCH-01\n"
    exit: 0
  - name: --at still rejects a scenario that commit did not have
    argv: [commit, check-message, "-", --at, "{{sha.live}}"]
    stdin: "feat: x\n\nScenarios: @ID-SCRATCH-02\n"
    exit: 1
    stderr: |
      ✖   unknown scenarios: ID-SCRATCH-02 [scenarios-footer]
  - name: --at HEAD reads the scenario as @wip
    argv: [commit, check-message, --at, HEAD, "-"]
    stdin: "feat: x\n\nScenarios: @ID-SCRATCH-01\n"
    exit: 1
    stderr: |
      ✖   still tagged @wip: ID-SCRATCH-01 [scenarios-footer]
  - name: a task the ledger had at the commit passes there
    argv: [commit, check-message, "-", --at, "{{sha.live}}"]
    stdin: "build: x\n\nTask: T-002\n"
    exit: 0
  - name: a task taken out of the ledger is unknown in a new commit
    argv: [commit, check-message, "-"]
    stdin: "build: x\n\nTask: T-002\n"
    exit: 1
    stderr: |
      ✖   unknown tasks: T-002 [task-footer]
  - name: the footers read the staged tree, not the working tree
    argv: [commit, check-message, "-"]
    stdin: "build: x\n\nTask: T-003\n"
    git:
      - commit: "docs: a ledger"
        files: { tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - stage: { tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n- { id: T-003, type: build, title: Three }\n" }
      - write: { tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
    exit: 0
  - name: a task only the working tree has is unknown to a commit
    argv: [commit, check-message, "-"]
    stdin: "build: x\n\nTask: T-003\n"
    git:
      - commit: "docs: a ledger"
        files: { tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
      - write: { tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n- { id: T-003, type: build, title: Three }\n" }
    exit: 1
    stderr: |
      ✖   unknown tasks: T-003 [task-footer]
  - name: a commit that predates the ledger is read against the working tree, and says so
    argv: [commit, check-message, "-", --at, "{{sha.bare}}"]
    stdin: "build: x\n\nTask: T-001\n"
    exit: 0
    stderr: |
      {{sha.bare}} has no tasks; its Task: footer is read against the working tree
  - name: the working tree still rejects a task it lacks
    argv: [commit, check-message, "-", --at, "{{sha.bare}}"]
    stdin: "build: x\n\nTask: T-002\n"
    exit: 1
    stderr: |
      {{sha.bare}} has no tasks; its Task: footer is read against the working tree
      ✖   unknown tasks: T-002 [task-footer]
  - name: a message that names no task reads no ledger, so a missing ledger folder is no problem
    argv: [commit, check-message, "-", --config, no-ledger.yaml]
    stdin: "docs: x\n"
    files: &no-ledger
      no-ledger.yaml: |
        version: 1
        ledger: { files: "gone/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [chore, docs]
          footers:
            Task: { source: ledger, required_for: [chore], validate_for: all, read_at: commit }
    exit: 0
  - name: a missing footer is judged without the ledger folder
    argv: [commit, check-message, "-", --config, no-ledger.yaml]
    stdin: "chore: x\n"
    files: *no-ledger
    exit: 1
    stderr: |
      ✖   chore commits need a "Task: T-…" footer [task-footer]
  - name: a task named when the ledger folder is missing is one problem naming the folder, exit 2
    argv: [commit, check-message, "-", --config, no-ledger.yaml]
    stdin: "chore: x\n\nTask: T-001\n"
    files: *no-ledger
    exit: 2
    stderr: |
      FAIL no-ledger.yaml: the Task: footer names tasks of the ledger, and its folder gone does not exist
  - name: the missing ledger folder as --json, with its rule and fix
    argv: [commit, check-message, "-", --config, no-ledger.yaml, --json]
    stdin: "chore: x\n\nTask: T-001\n"
    files: *no-ledger
    exit: 2
    json:
      schema: 1
      config: no-ledger.yaml
      valid: false
      problems:
        - rule: footer-source-missing
          message: "no-ledger.yaml: the Task: footer names tasks of the ledger, and its folder gone does not exist"
          fix: "create gone with the ledger's files (ledger.files is gone/phase-{group}.yaml), or point ledger.files at the folder that holds them"
  - name: a type that needs a Task footer, without one
    argv: [commit, check-message, "-"]
    stdin: "chore: x\n"
    exit: 1
    stderr: |
      ✖   chore commits need a "Task: T-…" footer [task-footer]
  - name: a type that needs a Scenarios footer, without one
    argv: [commit, check-message, "-"]
    stdin: "fix: x\n"
    exit: 1
    stderr: |
      ✖   fix commits need a "Scenarios: @ID-…" footer [scenarios-footer]
  # A footer of free text (source: text) says what a consumer must do, or the
  # word none; its rule is only that it is there and not empty.
  - name: a type that needs a free-text footer, without one
    argv: [commit, check-message, "-", --config, text.yaml]
    stdin: "chore: x\n"
    files: &text
      text.yaml: |
        version: 1
        commits:
          types: [chore, docs]
          footers:
            Upgrading: { source: text, required_for: [chore], validate_for: all, since: "{{sha.head}}" }
    exit: 1
    stderr: |
      ✖   chore commits need a "Upgrading: <what a consumer must do, or none>" footer [upgrading-footer]
  - name: the missing free-text footer as --json, with its fix
    argv: [commit, check-message, "-", --config, text.yaml, --json]
    stdin: "chore: x\n"
    files: *text
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
        - rule: upgrading-footer
          message: "chore commits need a \"Upgrading: <what a consumer must do, or none>\" footer"
          fix: "add a line `Upgrading: <what a consumer must do>` after a blank line at the end, or `Upgrading: none` when a consumer changes nothing"
  - name: none says a consumer changes nothing
    argv: [commit, check-message, "-", --config, text.yaml]
    stdin: "chore: x\n\nUpgrading: none\n"
    files: *text
    exit: 0
  - name: a free-text footer passes with whatever it says
    argv: [commit, check-message, "-", --config, text.yaml]
    stdin: "chore: x\n\nUpgrading: rename commits.lint to commits.header_lint\n"
    files: *text
    exit: 0
  - name: an empty free-text footer is no footer to a type that needs one
    argv: [commit, check-message, "-", --config, text.yaml]
    stdin: "chore: x\n\nUpgrading:\n"
    files: *text
    exit: 1
    stderr: |
      ✖   chore commits need a "Upgrading: <what a consumer must do, or none>" footer [upgrading-footer]
  - name: an empty free-text footer is rejected where the type validates it, beside one that says something
    argv: [commit, check-message, "-", --config, text.yaml, --json]
    stdin: "docs: x\n\nUpgrading: drop Node\nUpgrading:  \n"
    files: *text
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
        - rule: upgrading-footer
          message: "the Upgrading: footer is empty"
          fix: "write after Upgrading: what a consumer must do, or none"
  - name: check-message requires a footer of a commit before its since, as the commit-msg hook does
    argv: [commit, check-message, "-", --config, text.yaml, --at, "{{sha.live}}"]
    stdin: "chore: x\n"
    files: *text
    exit: 1
    stderr: |
      ✖   chore commits need a "Upgrading: <what a consumer must do, or none>" footer [upgrading-footer]
  # commit footers gathers a range's free-text footers for a release's notes.
  - name: commit footers lists a range's free-text footers with their commits, oldest first, leaving out none
    argv: [commit, footers, Upgrading, "{{sha.first}}", HEAD, --config, said.yaml]
    git: &said
      - commit: "chore: start\n\nUpgrading: before the range\n"
        files: { README.md: "scratch\n" }
        label: first
      - commit: "chore: rename the key\n\nUpgrading: rename commits.lint to commits.header_lint\nUpgrading: none\n"
        files: { README.md: "scratch, renamed\n" }
        label: renamed
      - commit: "chore: tidy\n\nUpgrading: none\n"
        files: { README.md: "scratch, tidied\n" }
      - commit: "chore: drop node\n\nUpgrading: install the binary\nUpgrading: drop Node\n"
        files: { README.md: "scratch, dropped\n" }
        label: dropped
    files: &saidcfg
      said.yaml: |
        version: 1
        commits:
          types: [chore, docs]
          footers:
            Upgrading: { source: text, required_for: [chore] }
    exit: 0
    stdout: |
      {{short.renamed}} rename commits.lint to commits.header_lint
      {{short.dropped}} install the binary
      {{short.dropped}} drop Node
    stderr: ""
  - name: commit footers as --json, each with its commit's full SHA and subject
    argv: [commit, footers, Upgrading, "{{sha.renamed}}", HEAD, --config, said.yaml, --json]
    git: *said
    files: *saidcfg
    exit: 0
    json:
      schema: 1
      footer: Upgrading
      range: { from: "{{sha.renamed}}", to: HEAD }
      footers:
        - { sha: "{{sha.dropped}}", subject: "chore: drop node", text: install the binary }
        - { sha: "{{sha.dropped}}", subject: "chore: drop node", text: drop Node }
  - name: commit footers from an empty start reads every commit up to the end
    argv: [commit, footers, Upgrading, "", "{{sha.renamed}}", --config, said.yaml]
    git: *said
    files: *saidcfg
    exit: 0
    stdout: |
      {{short.first}} before the range
      {{short.renamed}} rename commits.lint to commits.header_lint
  - name: commit footers lists only a footer of free text
    argv: [commit, footers, Task, "", HEAD]
    exit: 2
    stderr: |
      itos: commit footers needs a footer of free text: commits.footers.Task is not one (source: text) (itos --help)
  - name: commit footers needs a name and a range
    argv: [commit, footers, Upgrading, HEAD]
    exit: 2
    stderr: |
      itos: commit footers needs <name> <from> <to> (itos --help)
  - name: docs needs no footer
    argv: [commit, check-message, "-"]
    stdin: "docs: x\n"
    exit: 0
  - name: a footer over several lines, with and without its prefix
    argv: [commit, check-message, "-"]
    stdin: "feat: x\n\nScenarios: @ID-A-1, @ID-B-2\nScenarios: ID-C-3\n"
    exit: 1
    stderr: |
      ✖   unknown scenarios: ID-A-1, ID-B-2, ID-C-3 [scenarios-footer]
  - name: an ID without the prefix is the same ID
    argv: [commit, check-message, "-", --at, "{{sha.live}}"]
    stdin: "feat: x\n\nScenarios: ID-SCRATCH-01\n"
    exit: 0
  - name: every footer is checked, each problem on its line
    argv: [commit, check-message, "-"]
    stdin: "feat: x\n\nScenarios: @ID-NOPE-01\nTask: T-044\n"
    exit: 1
    stderr: |
      ✖   unknown tasks: T-044 [task-footer]
      ✖   unknown scenarios: ID-NOPE-01 [scenarios-footer]
  - name: a Task footer on a type that needs none is still validated
    argv: [commit, check-message, "-"]
    stdin: "docs: x\n\nTask: T-044\n"
    exit: 1
    stderr: |
      ✖   unknown tasks: T-044 [task-footer]
  - name: --json gives each problem its rule and fix
    argv: [commit, check-message, "-", --json]
    stdin: "feat: x\n\nScenarios: @ID-SCRATCH-01, @ID-NOPE-01\nTask: T-044\n"
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
        - rule: task-footer
          message: "unknown tasks: T-044"
          fix: name an id tasks/ has, or add it first in a docs commit
        - rule: scenarios-footer
          message: "unknown scenarios: ID-NOPE-01"
          fix: name an id the scenario files has, or add it first in a docs commit
  - name: an unknown task's fix names the ledger's own folder
    argv: [commit, check-message, "-", --json]
    stdin: "docs: x\n\nTask: T-044\n"
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "work/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, validate_for: all, read_at: worktree }
      work/phase-1.yaml: "- { id: T-001, type: build, title: Scratch T-001 }\n"
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
        - rule: task-footer
          message: "unknown tasks: T-044"
          fix: name an id work/ has, or add it first in a docs commit
  - name: --json of a missing footer
    argv: [commit, check-message, --json, "-"]
    stdin: "refactor: x\n"
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
        - rule: task-footer
          message: 'refactor commits need a "Task: T-…" footer'
          fix: "add a line `Task: <id>` after a blank line at the end, naming what the commit belongs to"
  - name: --json of a message that passes
    argv: [commit, check-message, --json, "-"]
    stdin: "build: x\n\nTask: T-001\n"
    exit: 0
    json:
      schema: 1
      ok: true
      problems: []
  - name: another config's footer, required for its types, with its ID hint
    argv: [commit, check-message, "-", --config, other.yaml]
    stdin: "chore: x\n"
    exit: 1
    stderr: |
      ✖   chore commits need a "Refs: T-…" footer [refs-footer]
  - name: another config's footer, given
    argv: [commit, check-message, "-", --config, other.yaml]
    stdin: "chore: x\n\nRefs: T-001\n"
    exit: 0
  - name: validate_for all checks a type that need not carry it
    argv: [commit, check-message, "-", --config, other.yaml]
    stdin: "docs: x\n\nRefs: T-009\n"
    exit: 1
    stderr: |
      ✖   unknown tasks: T-009 [refs-footer]
  - name: without must_be_live a @wip scenario may be named
    argv: [commit, check-message, "-", --config, other.yaml]
    stdin: "feat: x\n\nTests: @ID-SCRATCH-01\n"
    exit: 0
  - name: a kind without wip_tag names the default one for a test not live
    argv: [commit, check-message, "-", --config, nowip.yaml]
    files:
      nowip.yaml: |
        version: 1
        commits:
          types: [feat]
          footers:
            Scenarios: { source: { tests: scenario }, strip_prefix: "@", validate_for: [feat], must_be_live: true }
        tests:
          scenario: { root: e2e/features, id: "ID-[A-Z]+-\\d+" }
    stdin: "feat: x\n\nScenarios: @ID-SCRATCH-01\n"
    exit: 1
    stderr: |
      ✖   still tagged @wip: ID-SCRATCH-01 [scenarios-footer]
  - name: another config's footer hint for a kind of tests
    argv: [commit, check-message, "-", --config, other.yaml]
    stdin: "feat: x\n"
    exit: 1
    stderr: |
      ✖   feat commits need a "Tests: @ID-…" footer [tests-footer]
  - name: a footer the config does not define is not read
    argv: [commit, check-message, "-", --config, other.yaml]
    stdin: "chore: x\n\nTask: T-001\n"
    exit: 1
    stderr: |
      ✖   chore commits need a "Refs: T-…" footer [refs-footer]
  - name: read_at worktree reads the working tree even at a commit
    argv: [commit, check-message, "-", --config, other.yaml, --at, "{{sha.live}}"]
    stdin: "chore: x\n\nRefs: T-002\n"
    exit: 1
    stderr: |
      ✖   unknown tasks: T-002 [refs-footer]
  - name: read_at commit reads that commit beside it
    argv: [commit, check-message, "-", --config, other.yaml, --at, "{{sha.live}}"]
    stdin: "feat: x\n\nTests: @ID-SCRATCH-02\n"
    exit: 1
    stderr: |
      ✖   unknown scenarios: ID-SCRATCH-02 [tests-footer]
  - name: a header lint delegate's report is printed as it comes, and its failure is the message's
    argv: [commit, check-message, "-", --config, delegate.yaml]
    stdin: "update things\n"
    files: &delegate
      delegate.yaml: |
        version: 1
        commits:
          header_lint: { stdin: "sh lint.sh" }
      lint.sh: |
        read header
        case "$header" in
          *:*) exit 0 ;;
        esac
        echo "⧗   input: $header"
        echo "✖   subject may not be empty [subject-empty]"
        echo "✖   type may not be empty [type-empty]"
        echo "⚠   body's lines must not be longer than 100 characters [body-max-line-length]"
        echo
        echo "✖   found 2 problems, 1 warnings"
        exit 1
    exit: 1
    stdout: |
      ⧗   input: update things
      ✖   subject may not be empty [subject-empty]
      ✖   type may not be empty [type-empty]
      ⚠   body's lines must not be longer than 100 characters [body-max-line-length]

      ✖   found 2 problems, 1 warnings
  - name: --json reads the delegate's report into problems, each with its level and fix
    argv: [commit, check-message, "-", --json, --config, delegate.yaml]
    stdin: "update things\n"
    files: *delegate
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
        - rule: subject-empty
          message: subject may not be empty
          fix: write a subject after the type's colon
          level: error
        - rule: type-empty
          message: type may not be empty
          fix: "start the header with a type and a colon, as in `fix: …`"
          level: error
        - rule: body-max-line-length
          message: body's lines must not be longer than 100 characters
          fix: wrap the body at 100 characters
          level: warning
  - name: a message the delegate passes
    argv: [commit, check-message, "-", --config, delegate.yaml]
    stdin: "docs: things\n"
    files: *delegate
    exit: 0
  - name: the footer rules run after a delegate that passes, and reject the message
    argv: [commit, check-message, "-"]
    stdin: "feat: x\n\nTask: T-9\n"
    env: { ITOS_CONFIG: passing-delegate.yaml }
    git: []
    files:
      passing-delegate.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
        commits:
          header_lint: { stdin: "cat >/dev/null; echo linted" }
          footers:
            Task: { source: ledger, required_for: [chore], validate_for: all }
      tasks/phase-1.yaml: "- { id: T-001, type: chore, title: One }\n"
    exit: 1
    stdout: |
      linted
    stderr: |
      ✖   unknown tasks: T-9 [task-footer]
  - name: a delegate that fails without a report of its rules is one header-lint problem
    argv: [commit, check-message, "-", --json, --config, broken.yaml]
    stdin: "docs: things\n"
    files:
      broken.yaml: |
        version: 1
        commits:
          header_lint: { stdin: "cat >/dev/null; echo 'lint: no config found'; exit 9" }
    exit: 1
    json:
      schema: 1
      ok: false
      problems:
        - rule: header-lint
          message: "lint: no config found"
          level: error
  - name: a delegate's footer rule gets the footer's fix
    argv: [commit, check-message, "-", --json]
    stdin: "feat: x\n"
    env: { ITOS_CONFIG: footers-delegated.yaml }
    git: []
    files:
      footers-delegated.yaml: |
