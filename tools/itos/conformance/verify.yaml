# The re-check of a pushed range (`itos verify`): every
# non-merge commit's message against the footers as they were at that commit,
# then its paths, then each kind's range check once, each judged by --json, the
# reports and the range check's output on stderr; commits.since, which leaves a commit and its ancestors
# out and starts the range checks there; a footer's own since, which leaves
# them out of that footer's required_for.
#
# The repository: a commit before the ledger (bare); a feat naming a live
# scenario and T-002 (live); the scenario set back to @wip and T-002 taken out
# (head), which leaves the feat valid; then a build naming T-002, now gone
# (gone), a docs commit touching source (source) and a sound chore (tidy).
git:
  - commit: "docs: start"
    files: { README.md: "scratch\n" }
    label: bare
  - commit: "feat: add a thing\n\nScenarios: @ID-SCRATCH-01\nTask: T-002\n"
    files:
      e2e/features/scratch.feature: "@phase-1\nFeature: Scratch\n\n  @ID-SCRATCH-01\n  Scenario: Lies down\n    When I press \"Play\"\n"
      tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n- { id: T-002, type: build, title: Two }\n"
    label: live
  - commit: "docs: set the scenario back to @wip\n\nTask: T-001\n"
    files:
      e2e/features/scratch.feature: "@phase-1\nFeature: Scratch\n\n  @ID-SCRATCH-01 @wip\n  Scenario: Lies down\n    When I press \"Play\"\n"
      tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n"
    label: head
  - commit: "build: name a task that is gone\n\nTask: T-002\n"
    files: { tools/a.sh: "true\n" }
    label: gone
  - commit: "docs: touch the source\n\nTask: T-001\n"
    files: { src/a.ts: "export {};\n" }
    label: source
  - commit: "chore: tidy\n\nTask: T-001\n"
    files: { package.json: "{}\n" }
    label: tidy
files:
  itos.yaml: |
    version: 1
    ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
    commits:
      types: [feat, fix, build, chore, docs]
      footers:
        Task: { source: ledger, required_for: [build, chore], validate_for: all, read_at: commit }
        Scenarios:
          source: { tests: scenario }
          strip_prefix: "@"
          required_for: [feat, fix]
          validate_for: [feat, fix]
          must_be_live: true
          read_at: commit
      scopes:
        feat: { must_touch: ["src/**", "e2e/**"] }
        build: { only: ["tools/**", "*.json"] }
        chore: { never: ["src/**"] }
        docs: { only: ["**/*.md", "tasks/**", "e2e/features/**"] }
    tests:
      scenario:
        root: e2e/features
        id: "ID-[A-Z]+-\\d+"
        range_checks:
          - { name: moves, except_types: [feat, fix], range: "echo checked {from}..{to}" }
cases:
  - name: every commit up to the head, a feat valid at its own commit though a later one set its scenario back
    argv: [verify, "", "{{sha.head}}", --json]
    exit: 0
    json:
      schema: 1
      range: { from: "", to: "{{sha.head}}" }
      commits:
        - { sha: "{{sha.bare}}", header: "docs: start", ok: true }
        - { sha: "{{sha.live}}", header: "feat: add a thing", ok: true }
        - { sha: "{{sha.head}}", header: "docs: set the scenario back to @wip", ok: true }
      passed: 3
      total: 3
      range_checks: true
    stderr_has: "checked ..{{sha.head}}"
  - name: a from of zeros is every commit up to the head
    argv: [verify, "0000000000000000000000000000000000000000", "{{sha.head}}", --json]
    exit: 0
    json:
      schema: 1
      range: { from: "0000000000000000000000000000000000000000", to: "{{sha.head}}" }
      commits:
        - { sha: "{{sha.bare}}", header: "docs: start", ok: true }
        - { sha: "{{sha.live}}", header: "feat: add a thing", ok: true }
        - { sha: "{{sha.head}}", header: "docs: set the scenario back to @wip", ok: true }
      passed: 3
      total: 3
      range_checks: true
    stderr_has: "checked 0000000000000000000000000000000000000000..{{sha.head}}"
  - name: a range with commits that fail, each named under its report
    argv: [verify, "{{sha.head}}", "{{sha.tidy}}", --json]
    exit: 1
    json:
      schema: 1
      range: { from: "{{sha.head}}", to: "{{sha.tidy}}" }
      commits:
        - { sha: "{{sha.gone}}", header: "build: name a task that is gone", ok: false }
        - { sha: "{{sha.source}}", header: "docs: touch the source", ok: false }
        - { sha: "{{sha.tidy}}", header: "chore: tidy", ok: true }
      passed: 1
      total: 3
      range_checks: true
    stderr_has: ["[task-footer]", T-002, src/a.ts, "checked {{sha.head}}..{{sha.tidy}}"]
  - name: a range check that fails fails the range, its commits sound
    argv: [verify, "{{sha.source}}", "{{sha.tidy}}", --config, failing.yaml, --json]
    files:
      failing.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          footers:
            Task: { source: ledger, required_for: [chore], validate_for: all, read_at: commit }
        tests:
          scenario:
            root: e2e/features
            id: "ID-[A-Z]+-\\d+"
            range_checks:
              - { name: moves, range: "echo 'a moved scenario changed' >&2; exit 1" }
    exit: 1
    json:
      schema: 1
      range: { from: "{{sha.source}}", to: "{{sha.tidy}}" }
      commits: [{ sha: "{{sha.tidy}}", header: "chore: tidy", ok: true }]
      passed: 1
      total: 1
      range_checks: false
    stderr_has: "a moved scenario changed"
  - name: the header lint delegate reads the commit it checks from ITOS_AT
    argv: [verify, "{{sha.bare}}", "{{sha.head}}", --config, delegated.yaml, --json]
    files:
      delegated.yaml: |
        version: 1
        commits:
          header_lint: { stdin: "head -1 >&2; echo \"at $(git rev-parse --short $ITOS_AT)\" >&2" }
    exit: 0
    json:
      schema: 1
      range: { from: "{{sha.bare}}", to: "{{sha.head}}" }
      commits:
        - { sha: "{{sha.live}}", header: "feat: add a thing", ok: true }
        - { sha: "{{sha.head}}", header: "docs: set the scenario back to @wip", ok: true }
      passed: 2
      total: 2
      range_checks: true
    stderr_has: ["at {{short.live}}", "at {{short.head}}"]
  - name: a header the delegate rejects
    argv: [verify, "{{sha.head}}", "{{sha.gone}}", --config, rejecting.yaml, --json]
    files:
      rejecting.yaml: |
        version: 1
        commits:
          header_lint: { stdin: "cat >/dev/null; echo '✖   type may not be empty [type-empty]'; exit 1" }
    exit: 1
    json:
      schema: 1
      range: { from: "{{sha.head}}", to: "{{sha.gone}}" }
      commits: [{ sha: "{{sha.gone}}", header: "build: name a task that is gone", ok: false }]
      passed: 0
      total: 1
      range_checks: true
    stderr_has: "[type-empty]"
  - name: a commit made without the hooks, no type and no footer, is the delegate's to reject
    argv: [verify, "{{sha.start}}", "{{sha.wip}}", --config, skipped.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
        label: start
      - commit: "wip"
        files: { tools/a.sh: "true\n" }
        label: wip
    files:
      skipped.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [build, docs]
          header_lint:
            stdin: "head -1 | grep -qE '^[a-z]+: ' || { echo '✖   type may not be empty [type-empty]'; exit 1; }"
          footers:
            Task: { source: ledger, required_for: [build], validate_for: all, read_at: commit }
    exit: 1
    json:
      schema: 1
      range: { from: "{{sha.start}}", to: "{{sha.wip}}" }
      commits: [{ sha: "{{sha.wip}}", header: wip, ok: false }]
      passed: 0
      total: 1
      range_checks: true
    stderr_has: "[type-empty]"
  - name: the built-in header lint rejects a commit made without the hooks
    argv: [verify, "{{sha.start}}", "{{sha.wip}}", --config, builtin.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n", tasks/phase-1.yaml: "- { id: T-001, type: build, title: One }\n" }
        label: start
      - commit: "wip"
        files: { tools/a.sh: "true\n" }
        label: wip
    files:
      builtin.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [build, docs]
          header_lint: { use: builtin }
          footers:
            Task: { source: ledger, required_for: [build], validate_for: all, read_at: commit }
    exit: 1
    json:
      schema: 1
      range: { from: "{{sha.start}}", to: "{{sha.wip}}" }
      commits: [{ sha: "{{sha.wip}}", header: wip, ok: false }]
      passed: 0
      total: 1
      range_checks: true
    stderr_has: ["[subject-empty]", "[type-empty]"]
  - name: an empty range passes
    argv: [verify, "{{sha.tidy}}", "{{sha.tidy}}", --json]
    exit: 0
    json:
      schema: 1
      range: { from: "{{sha.tidy}}", to: "{{sha.tidy}}" }
      commits: []
      passed: 0
      total: 0
      range_checks: true
    stderr_has: "checked {{sha.tidy}}..{{sha.tidy}}"
  - name: commits.since and its ancestors are left out, and the range checks start there
    argv: [verify, "", "{{sha.tidy}}", --config, since.yaml, --json]
    files:
      since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [feat, fix, build, chore, docs]
          since: "{{sha.source}}"
          footers:
            Task: { source: ledger, required_for: [build, chore], validate_for: all, read_at: commit }
          scopes:
            docs: { only: ["**/*.md", "tasks/**", "e2e/features/**"] }
        tests:
          scenario:
            root: e2e/features
            id: "ID-[A-Z]+-\\d+"
            range_checks:
              - { name: moves, except_types: [feat, fix], range: "echo checked {from}..{to}" }
    exit: 0
    json:
      schema: 1
      range: { from: "", to: "{{sha.tidy}}" }
      since: "{{sha.source}}"
      commits: [{ sha: "{{sha.tidy}}", header: "chore: tidy", ok: true }]
      passed: 1
      total: 1
      range_checks: true
    stderr_has: "checked {{sha.source}}..{{sha.tidy}}"
  - name: a start older than commits.since starts at it
    argv: [verify, "{{sha.bare}}", "{{sha.tidy}}", --config, since.yaml, --json]
    files:
      since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [feat, fix, build, chore, docs]
          since: "{{sha.source}}"
          footers:
            Task: { source: ledger, required_for: [build, chore], validate_for: all, read_at: commit }
          scopes:
            docs: { only: ["**/*.md", "tasks/**", "e2e/features/**"] }
        tests:
          scenario:
            root: e2e/features
            id: "ID-[A-Z]+-\\d+"
            range_checks:
              - { name: moves, except_types: [feat, fix], range: "echo checked {from}..{to}" }
    exit: 0
    json:
      schema: 1
      range: { from: "{{sha.bare}}", to: "{{sha.tidy}}" }
      since: "{{sha.source}}"
      commits: [{ sha: "{{sha.tidy}}", header: "chore: tidy", ok: true }]
      passed: 1
      total: 1
      range_checks: true
    stderr_has: "checked {{sha.source}}..{{sha.tidy}}"
  - name: a start newer than commits.since keeps its own
    argv: [verify, "{{sha.gone}}", "{{sha.tidy}}", --config, since.yaml, --json]
    files:
      since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [feat, fix, build, chore, docs]
          since: "{{sha.head}}"
          footers:
            Task: { source: ledger, required_for: [build, chore], validate_for: all, read_at: commit }
          scopes:
            docs: { only: ["**/*.md", "tasks/**", "e2e/features/**"] }
        tests:
          scenario:
            root: e2e/features
            id: "ID-[A-Z]+-\\d+"
            range_checks:
              - { name: moves, except_types: [feat, fix], range: "echo checked {from}..{to}" }
    exit: 1
    json:
      schema: 1
      range: { from: "{{sha.gone}}", to: "{{sha.tidy}}" }
      since: "{{sha.head}}"
      commits:
        - { sha: "{{sha.source}}", header: "docs: touch the source", ok: false }
        - { sha: "{{sha.tidy}}", header: "chore: tidy", ok: true }
      passed: 1
      total: 2
      range_checks: true
    stderr_has: [src/a.ts, "checked {{sha.gone}}..{{sha.tidy}}"]
  # A footer's own since: added to the rules later, a required footer would
  # otherwise fail every commit written before it.
  - name: without a since of its own, a required footer fails every commit written before the rule
    argv: [verify, "", HEAD, --config, upgrading.yaml, --json]
    git: &upgrading
      - commit: "chore: start"
        files: { README.md: "scratch\n" }
        label: start
      - commit: "chore: before the rule"
        files: { README.md: "scratch, before\n" }
        label: before
      - commit: "chore: after the rule\n\nUpgrading: none\n"
        files: { README.md: "scratch, after\n" }
        label: after
    files:
      upgrading.yaml: |
        version: 1
        commits:
          types: [chore, docs]
          footers:
            Upgrading: { source: text, required_for: [chore] }
    exit: 1
    json:
      schema: 1
      range: { from: "", to: HEAD }
      commits:
        - { sha: "{{sha.start}}", header: "chore: start", ok: false }
        - { sha: "{{sha.before}}", header: "chore: before the rule", ok: false }
        - { sha: "{{sha.after}}", header: "chore: after the rule", ok: true }
      passed: 1
      total: 3
      range_checks: true
    stderr_has: "[upgrading-footer]"
  - name: a footer's since leaves that commit and its ancestors out of its required_for
    argv: [verify, "", HEAD, --config, upgrading.yaml, --json]
    git: *upgrading
    files:
      upgrading.yaml: |
        version: 1
        commits:
          types: [chore, docs]
          footers:
            Upgrading: { source: text, required_for: [chore], since: "{{sha.before}}" }
    exit: 0
    json:
      schema: 1
      range: { from: "", to: HEAD }
      commits:
        - { sha: "{{sha.start}}", header: "chore: start", ok: true }
        - { sha: "{{sha.before}}", header: "chore: before the rule", ok: true }
        - { sha: "{{sha.after}}", header: "chore: after the rule", ok: true }
      passed: 3
      total: 3
      range_checks: true
  - name: a commit after the footer's since still needs it
    argv: [verify, "", HEAD, --config, upgrading.yaml, --json]
    git: *upgrading
    files:
      upgrading.yaml: |
        version: 1
        commits:
          types: [chore, docs]
          footers:
            Upgrading: { source: text, required_for: [chore], since: "{{sha.start}}" }
    exit: 1
    json:
      schema: 1
      range: { from: "", to: HEAD }
      commits:
        - { sha: "{{sha.start}}", header: "chore: start", ok: true }
        - { sha: "{{sha.before}}", header: "chore: before the rule", ok: false }
        - { sha: "{{sha.after}}", header: "chore: after the rule", ok: true }
      passed: 2
      total: 3
      range_checks: true
    stderr_has: "[upgrading-footer]"
  - name: a footer's since naming no commit of the repository
    argv: [verify, "", HEAD, --config, upgrading.yaml, --json]
    git: *upgrading
    files:
      upgrading.yaml: |
        version: 1
        commits:
          types: [chore, docs]
          footers:
            Upgrading: { source: text, required_for: [chore], since: "0123456789abcdef0123456789abcdef01234567" }
    exit: 2
    json: { schema: 1, range: { from: "", to: HEAD }, problems: [{ rule: config-since-commit }] }
    stdout_has: [commits.footers.Upgrading.since, 0123456789abcdef0123456789abcdef01234567]
  - name: commits.since naming no commit of the repository
    argv: [verify, "", "{{sha.tidy}}", --config, since.yaml, --json]
    files:
      since.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml", id: "T-\\d+" }
        commits:
          types: [feat, fix, build, chore, docs]
          since: "0123456789abcdef0123456789abcdef01234567"
          footers:
            Task: { source: ledger, required_for: [build, chore], validate_for: all, read_at: commit }
          scopes:
            docs: { only: ["**/*.md", "tasks/**", "e2e/features/**"] }
        tests:
          scenario:
            root: e2e/features
            id: "ID-[A-Z]+-\\d+"
            range_checks:
              - { name: moves, except_types: [feat, fix], range: "echo checked {from}..{to}" }
    exit: 2
    json: { schema: 1, range: { from: "", to: "{{sha.tidy}}" }, problems: [{ rule: config-since-commit }] }
    stdout_has: [commits.since, 0123456789abcdef0123456789abcdef01234567]
  # actions/checkout clones one commit deep by default: the clone lacks the
  # commit commits.since names, though the repository it was cloned from has it.
  - name: commits.since beyond a shallow clone's history
    argv: [verify, "", HEAD, --config, since.yaml, --json]
    git:
      - commit: "docs: start"
        files: { README.md: "scratch\n" }
        label: first
      - commit: "docs: write the readme"
        files: { README.md: "scratch, written\n" }
      - run: "git clone -q --depth 1 'file://{{dir}}' shallow"
    cwd: shallow
    files:
      shallow/since.yaml: |
        version: 1
        commits:
          types: [docs]
          since: "{{sha.first}}"
    exit: 2
    json: { schema: 1, range: { from: "", to: HEAD }, problems: [{ rule: config-since-commit }] }
    stdout_has: ["{{sha.first}}", "git fetch --unshallow"]
