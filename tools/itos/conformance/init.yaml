# itos init (slices 48 to 50, 59 and 80, features/init.feature): the starter it
# writes where there is no config, what it reports where one is there, and the
# offers of the itos plugin for Claude Code, of the git shim and of the rules
# for agents. No release server answers here,
# so it pins nothing and says how to. The runner's own claude is hidden; a
# case that has one writes it in the git folder, which records what it was
# given in .git/claude-args.
cases:
  - name: init refuses an argument it does not take, naming what it takes
    argv: [init, --force]
    exit: 2
    stderr: |
      itos: init takes only --stealth, --plugin [<scope>], --git-shim, --git-shim-dir <folder>, --no-git-shim, --agent-rules and --no-agent-rules (--force) (itos --help)
  - name: init's --git-shim-dir needs a folder
    argv: [init, --git-shim, --git-shim-dir]
    exit: 2
    stderr: |
      itos: --git-shim-dir needs <folder> (itos --help)
  - name: init takes --git-shim or --no-git-shim, not both
    argv: [init, --git-shim, --no-git-shim]
    exit: 2
    stderr: |
      itos: init takes --git-shim or --no-git-shim, not both (itos --help)
  - name: init's --git-shim-dir goes with --git-shim, not --no-git-shim
    argv: [init, --no-git-shim, --git-shim-dir, shims]
    exit: 2
    stderr: |
      itos: --git-shim-dir names where --git-shim links itos as git, not --no-git-shim (itos --help)
  - name: init's --plugin takes a scope
    argv: [init, --plugin, everywhere]
    exit: 2
    stderr: |
      itos: --plugin takes project, user, local or no (everywhere) (itos --help)
  - name: under --stealth init refuses to install the plugin for the project
    argv: [init, --stealth, --plugin, project]
    exit: 2
    stderr: |
      itos: under --stealth, --plugin project would write .claude/settings.json, which the project commits; --plugin local installs it for you alone in this repository, --plugin user for every one of yours (itos --help)
  - name: init writes the starter config, its ledger and registry, pins nothing it cannot reach, and installs the hooks
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
        label: start
    argv: [init]
    exit: 0
    stdout_has:
      - "wrote itos.yaml\nwrote tasks/phase-1.yaml\nwrote tasks/work-items.yaml\n"
      - "commits.since is HEAD, {{short.start}}: no commit before it is judged.\n"
      - "Pinned no itos: cannot ask for the newest itos: "
      - "Run itos pin when the release server can be reached.\n"
      - "Found plain git (no hook manager's marker)\nwrote .git/hooks/commit-msg\nwrote .git/hooks/pre-push\n"
      - "Commit what init wrote with the task that adopts itos: git add itos.yaml tasks/phase-1.yaml tasks/work-items.yaml, then itos commit --task T-1 -m 'chore: adopt itos'\n"
    files_after:
      itos.yaml: |
        # itos.yaml, written by itos init: this repository's rules for its commits,
        # kept small to grow. itos config check validates it; itos config check
        # --print-defaults prints every key it leaves to its default.
        version: 1

        # No pin: the itos called runs. itos pin pins the newest release.

        # The tasks: every commit but a feat, a fix or a docs names one in its Task
        # footer (itos commit --task T-1), and itos task T-1 runs its checks.
        ledger:
          files: "tasks/phase-{group}.yaml" # one file per phase: tasks/phase-1.yaml, …
          id: "T-\\d+"

        commits:
          # The Conventional Commits types, held to commitlint's config-conventional
          # rules by itos's own lint.
          types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
          header_lint: { use: builtin }
          footers:
            Task:
              source: ledger
              required_for: [refactor, perf, test, build, ci, chore, style, revert]
              validate_for: all # a task named must be in the ledger
              read_at: commit # judged against the ledger the commit carries
          # Where verification starts: this commit and the ones before it, written
          # before itos, are never judged.
          since: "{{sha.start}}"
          # Which paths each type may touch. docs needs no Task footer, so it may
          # touch only Markdown, docs/ and itos's data in tasks/; the rest, anything.
          scopes:
            docs: { only: ["**/*.md", "docs/**", "tasks/**"] }

        hooks:
          bin: itos # the hooks call the global itos, which runs the release pinned
      tasks/phase-1.yaml: |
        # The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
        # a docs, each named in its commit's Task footer (itos commit --task T-2).
        # A task:
        #
        #   - id: T-2
        #     type: chore # one of commits.types
        #     title: What it is
        #     why: Why it is worth doing. # optional
        #     done_when: # the checks that prove it, which itos task T-2 runs
        #       - run: a command that exits 0 once it is done
        - id: T-1
          type: chore
          title: Adopt itos
          why: >
            The commit that adds itos.yaml, this ledger and the work registry names it:
            itos commit --task T-1.
          done_when:
            - run: itos config check
      tasks/work-items.yaml: |
        # The work registry: who owns each phase and each piece of work, and what
        # waits on what. itos work shows what can start; itos work check validates it.
        # An item:
        #
        #   - id: T-2 # a task's ID, or a name of its own
        #     title: What it is
        #     phase: 1
        #     owner: null # a handle, or null
        #     status: todo # todo, doing, done or blocked
        #     depends_on: []
        phases:
          1: null # the ledger's phase 1, owned by nobody: a handle, or null
        items: []
      .git/hooks/commit-msg:
        text: |
          #!/bin/sh
          exec itos hook commit-msg "$1"
        executable: true
  - name: init with a config there writes nothing and lists what is missing, config check's problems and the hooks', then what it notes
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/: ""
      .git/hooks/commit-msg: { text: "#!/bin/sh\nexec itos hook commit-msg \"$1\"\n", executable: true }
    argv: [init, --no-git-shim]
    exit: 1
    stdout: |
      itos.yaml is there already, so init wrote nothing.
      Missing:
        no work registry at tasks/work-items.yaml; move the registry to tasks/work-items.yaml, or set work.registry to where it is
        the pre-push hook: .git/hooks/pre-push is not there; run itos hooks install
      Noted, not counted as missing:
        no people file at CONTRIBUTORS.md (work.people), so the registry's owners go unchecked; list the people who may own work in CONTRIBUTORS.md, or set work.people.file to where they are
    files_after:
      .git/hooks/pre-push: null
  - name: with --plugin and no claude on the PATH init says Claude Code was not found, and does the rest
    argv: [init, --plugin, user]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    stdout_has:
      - "wrote .git/hooks/commit-msg\nwrote .git/hooks/pre-push\n"
      - "Claude Code was not found (no claude on the PATH), so the itos plugin for it is not installed; with Claude Code installed, itos init --plugin user installs it.\n"
  - name: with --plugin project init adds the marketplace and installs the plugin, and names its settings in the commit
    argv: [init, --plugin, project]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      .git/bin/claude: &claude
        text: |
          #!/bin/sh
          echo "$*" >> .git/claude-args
          case "$1 $2" in
          "plugin list") echo '[]' ;;
          "plugin install") mkdir -p .claude && echo '{"enabledPlugins":{"itos@itos":true}}' > .claude/settings.json ;;
          esac
        executable: true
    exit: 0
    stdout_has:
      - "wrote .git/hooks/pre-push\nInstalled the itos plugin for Claude Code, itos@itos, at its project scope.\n"
      - "git add itos.yaml tasks/phase-1.yaml tasks/work-items.yaml .claude/settings.json, then itos commit --task T-1"
    files_after:
      .git/claude-args: |
        plugin list --json
        plugin marketplace add donvargax/itos --scope project
        plugin install itos@itos --scope project
  - name: with no --plugin and nobody to ask init installs nothing and says how to
    argv: [init]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      .git/bin/claude: *claude
    exit: 0
    stdout_has: "The itos plugin for Claude Code is not installed: itos init --plugin installs it for this repository (.claude/settings.json, to commit), --plugin user for every repository of yours, --plugin local for you alone in this one.\n"
    files_after:
      .git/claude-args: |
        plugin list --json
  - name: run again where nothing is missing, init notes a people file missing and reports a plugin not installed, and still exits 0
    argv: [init, --no-git-shim]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
      .git/hooks/commit-msg: { text: "#!/bin/sh\nexec itos hook commit-msg \"$1\"\n", executable: true }
      .git/hooks/pre-push: { text: "#!/bin/sh\nexec itos hook pre-push \"$@\"\n", executable: true }
      .git/bin/claude: *claude
    exit: 0
    stdout: |
      itos.yaml is there already, so init wrote nothing.
      Nothing is missing: the config, its ledger, registry and smoke sets are sound, and the hooks call itos.
      Noted, not counted as missing:
        no people file at CONTRIBUTORS.md (work.people), so the registry's owners go unchecked; list the people who may own work in CONTRIBUTORS.md, or set work.people.file to where they are
      The itos plugin for Claude Code is not installed: itos init --plugin installs it for this repository (.claude/settings.json, to commit), --plugin user for every repository of yours, --plugin local for you alone in this one.
  - name: run again with the plugin installed, init's JSON says so, and what it notes
    argv: [--json, init, --no-git-shim]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
      .git/hooks/commit-msg: { text: "#!/bin/sh\nexec itos hook commit-msg \"$1\"\n", executable: true }
      .git/hooks/pre-push: { text: "#!/bin/sh\nexec itos hook pre-push \"$@\"\n", executable: true }
      .git/bin/claude:
        text: |
          #!/bin/sh
          echo '[{"id":"itos@itos","version":"2.3.0","scope":"user","enabled":true}]'
        executable: true
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      action: checked
      missing: []
      plugin: { action: already, scope: user, excluded: false }
      notes:
        - rule: work-people-missing
          message: "no people file at CONTRIBUTORS.md (work.people), so the registry's owners go unchecked"
          fix: list the people who may own work in CONTRIBUTORS.md, or set work.people.file to where they are
          area: people
      git_shim: { action: declined, link: null, on_path: false, before_git: false }
      agent_rules: { action: offered, files: [] }
  - name: a claude that fails at the install is reported, exit 1, the rest of init done
    argv: [init, --plugin, user]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      .git/bin/claude:
        text: |
          #!/bin/sh
          case "$1 $2" in
          "plugin list") echo '[]' ;;
          "plugin install") echo 'Plugin "itos" not found in any marketplace' >&2; exit 1 ;;
          esac
        executable: true
    exit: 1
    stdout_has:
      - "wrote .git/hooks/pre-push\nclaude plugin install itos@itos --scope user failed (exit 1):\nPlugin \"itos\" not found in any marketplace\n"
      - "then itos commit --task T-1 -m 'chore: adopt itos'\n"
  - name: with --agent-rules init writes the config's rules at the end of AGENTS.md, its text kept, and CLAUDE.md imports it
    argv: [init, --agent-rules, --no-git-shim]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n", AGENTS.md: "# Demo\n\nBe kind." }
    exit: 0
    stdout_has:
      - "updated AGENTS.md\nwrote CLAUDE.md\nAGENTS.md holds the rules itos.yaml decides, between <!-- itos:begin --> and <!-- itos:end -->, which itos init --agent-rules rewrites; CLAUDE.md imports it (@AGENTS.md).\n"
      - "git add itos.yaml tasks/phase-1.yaml tasks/work-items.yaml AGENTS.md CLAUDE.md, then itos commit --task T-1"
    files_after:
      CLAUDE.md: "@AGENTS.md\n"
      AGENTS.md: |
        # Demo

        Be kind.

        <!-- itos:begin -->

        ## The rules itos holds this repository to

        Generated by itos init from `itos.yaml`, which decides them: change the config, then run `itos init --agent-rules`, which rewrites only what is between these markers. The hooks and CI hold every commit to these rules.

        ### Commit types

        A commit's type is one of `feat`, `fix`, `refactor`, `perf`, `test`, `build`, `ci`, `chore`, `docs`, `style` or `revert`. The header is held to commitlint's config-conventional rules by itos's own lint: `type: subject` or `type(scope): subject`.

        ### Footers

        - `Task:` names tasks of the ledger, `tasks/phase-{group}.yaml`.

        The footers each type needs:

        - `feat`: none.
        - `fix`: none.
        - `refactor`: `Task:`.
        - `perf`: `Task:`.
        - `test`: `Task:`.
        - `build`: `Task:`.
        - `ci`: `Task:`.
        - `chore`: `Task:`.
        - `docs`: none.
        - `style`: `Task:`.
        - `revert`: `Task:`.

        ### The paths each type may touch

        - `docs` may touch only `**/*.md`, `docs/**` and `tasks/**`.
        - `feat`, `fix`, `refactor`, `perf`, `test`, `build`, `ci`, `chore`, `style` and `revert` may touch anything.

        ### What the gates run

        The commit-msg hook, `itos hook commit-msg`, runs these on every commit, the first to fail refusing it:

        - itos's own data, when the commit stages any of it (the config, the ledger, the work registry and the smoke sets), as `itos config check` judges it.
        - The paths the commit's type may touch.
        - The header and the footers.
        - The static checks of the tasks `Task:` names: a failure refuses the commit once the task's work item is done, and is only printed while it is not.

        The pre-push hook, `itos hook pre-push`, runs these on every push:

        - The commit rules above, over every commit the push adds, as `itos verify` judges them.

        <!-- itos:end -->
  - name: with no --agent-rules and nobody to ask init writes no rules and says how to
    argv: [init, --no-git-shim]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    stdout_has: "itos's rules for agents are not written: itos init --agent-rules writes what the config decides into AGENTS.md, between <!-- itos:begin --> and <!-- itos:end -->, and imports it from CLAUDE.md (@AGENTS.md); --no-agent-rules declines.\n"
    files_after:
      AGENTS.md: null
      CLAUDE.md: null
  - name: run again, a block the config no longer matches is reported, naming itos init --agent-rules, and kept
    argv: [init, --no-git-shim]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
      .git/hooks/commit-msg: { text: "#!/bin/sh\nexec itos hook commit-msg \"$1\"\n", executable: true }
      .git/hooks/pre-push: { text: "#!/bin/sh\nexec itos hook pre-push \"$@\"\n", executable: true }
      AGENTS.md: "Be kind.\n\n<!-- itos:begin -->\nOld rules.\n<!-- itos:end -->\n"
    exit: 0
    stdout_has: "AGENTS.md's itos rules no longer match itos.yaml: itos init --agent-rules rewrites them, only between the markers.\n"
    files_after:
      AGENTS.md: "Be kind.\n\n<!-- itos:begin -->\nOld rules.\n<!-- itos:end -->\n"
      CLAUDE.md: null
  - name: an AGENTS.md with a begin marker and no end one is not written, exit 1, the rest of init done
    argv: [init, --agent-rules, --no-git-shim]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n", AGENTS.md: "<!-- itos:begin -->\nMine.\n" }
    exit: 1
    stdout_has:
      - "AGENTS.md is not written: AGENTS.md has a <!-- itos:begin --> line with no <!-- itos:end --> line after it; put the markers right by hand.\n"
      - "then itos commit --task T-1 -m 'chore: adopt itos'\n"
    files_after:
      AGENTS.md: "<!-- itos:begin -->\nMine.\n"
      CLAUDE.md: null
  - name: under --stealth, --agent-rules writes the rules in the git folder, imported from CLAUDE.local.md and after a copy of AGENTS.md in AGENTS.override.md, both excluded
    argv: [init, --stealth, --agent-rules, --no-git-shim]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n", AGENTS.md: "# Demo\n\nBe kind.\n" }
    exit: 0
    stdout_has:
      - "wrote .git/itos/AGENTS.md\nwrote CLAUDE.local.md\nwrote AGENTS.override.md\nListed CLAUDE.local.md and AGENTS.override.md in the git folder's info/exclude, so git status stays clean.\n.git/itos/AGENTS.md holds the rules .git/itos/itos.yaml decides, between <!-- itos:begin --> and <!-- itos:end -->, which itos init --agent-rules rewrites; CLAUDE.local.md imports it for Claude Code, and AGENTS.override.md holds them for Codex, after a copy of AGENTS.md between <!-- itos:agents-md:begin --> and <!-- itos:agents-md:end -->.\n"
      - "Nothing the project tracks changed"
    files_after:
      AGENTS.md: "# Demo\n\nBe kind.\n"
      CLAUDE.md: null
      CLAUDE.local.md: "<!-- itos:begin -->\n\n@AGENTS.md\n\n@.git/itos/AGENTS.md\n\n<!-- itos:end -->\n"
      AGENTS.override.md: &override |
        <!-- itos:agents-md:begin -->

        # Demo

        Be kind.

        <!-- itos:agents-md:end -->

        <!-- itos:begin -->

        ## The rules itos holds this repository to

        Generated by itos init from the stealth config, `itos/itos.yaml` in the git common dir, which decides them: change the config, then run `itos init --agent-rules`, which rewrites only what is between these markers. The hooks and CI hold every commit to these rules.

        ### Commit types

        A commit's type is one of `feat`, `fix`, `refactor`, `perf`, `test`, `build`, `ci`, `chore`, `docs`, `style` or `revert`. The header is held to commitlint's config-conventional rules by itos's own lint: `type: subject` or `type(scope): subject`.

        ### Footers

        - `Task:` names tasks of the ledger, `tasks/phase-{group}.yaml` beside the config.

        The footers each type needs:

        - `feat`: none.
        - `fix`: none.
        - `refactor`: `Task:`.
        - `perf`: `Task:`.
        - `test`: `Task:`.
        - `build`: `Task:`.
        - `ci`: `Task:`.
        - `chore`: `Task:`.
        - `docs`: none.
        - `style`: `Task:`.
        - `revert`: `Task:`.

        ### The paths each type may touch

        - `docs` may touch only `**/*.md` and `docs/**`.
        - `feat`, `fix`, `refactor`, `perf`, `test`, `build`, `ci`, `chore`, `style` and `revert` may touch anything.

        ### What the gates run

        The commit-msg hook, `itos hook commit-msg`, runs these on every commit, the first to fail refusing it:

        - itos's own data, when the commit stages any of it (the config, the ledger, the work registry and the smoke sets), as `itos config check` judges it.
        - The paths the commit's type may touch.
        - The header and the footers.
        - The static checks of the tasks `Task:` names: a failure refuses the commit once the task's work item is done, and is only printed while it is not.

        The pre-push hook, `itos hook pre-push`, runs these on every push:

        - The commit rules above, over every commit the push adds, as `itos verify` judges them.

        <!-- itos:end -->
  - name: under --stealth a CLAUDE.local.md and an AGENTS.override.md of the person's keep their text and gain the block alone, never the copy
    argv: [init, --stealth, --agent-rules, --no-git-shim]
    hide: [claude]
    git:
