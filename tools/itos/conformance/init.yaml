  - name: with no --git-shim and nobody to ask init links nothing and says how to
    argv: [init]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    stdout_has: ", the folder holding itos (--git-shim-dir <folder> for another), so that in a repository itos manages git commit and git push are itos's.\n"
  - name: run again with --git-shim, init links it and reports it in its JSON
    argv: [--json, init, --git-shim, --git-shim-dir, shims]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
