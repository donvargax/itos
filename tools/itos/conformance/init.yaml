# itos init (slices 48 to 50, 59 and 80, features/init.feature): the starter it
# writes where there is no config, what it reports where one is there, and the
# offers of the itos plugin for Claude Code, of the git shim and of the rules
# for agents. No release server answers here,
# so it pins nothing and says how to. The runner's own claude is hidden; a
# case that has one writes it in the git folder, which records what it was
# given in .git/claude-args.
cases:
  - name: init refuses an argument it does not take, naming what it takes
    argv: [init, --force]
    exit: 2
    stderr_has: --force
  - name: init's --git-shim-dir needs a folder
    argv: [init, --git-shim, --git-shim-dir]
    exit: 2
    stderr_has: --git-shim-dir
  - name: init takes --git-shim or --no-git-shim, not both
    argv: [init, --git-shim, --no-git-shim]
    exit: 2
    stderr_has: [--git-shim, --no-git-shim]
  - name: init's --git-shim-dir goes with --git-shim, not --no-git-shim
    argv: [init, --no-git-shim, --git-shim-dir, shims]
    exit: 2
    stderr_has: [--git-shim-dir, --no-git-shim]
  - name: init's --plugin takes a scope
    argv: [init, --plugin, everywhere]
    exit: 2
    stderr_has: everywhere
  - name: under --stealth init refuses to install the plugin for the project
    argv: [init, --stealth, --plugin, project]
    exit: 2
    stderr_has: [--stealth, --plugin project]
  - name: init --stealth where the project has its own itos.yaml is a usage error, and writes nothing
    argv: [init, --stealth, --agent-rules]
    hide: [claude]
    git:
      - commit: "docs: start"
        files:
          README.md: "# Scratch\n"
          itos.yaml: "version: 1\nledger: { files: \"tasks/phase-{group}.yaml\" }\n"
          tasks/work-items.yaml: "phases: {}\nitems: []\n"
    exit: 2
    stderr_has: [--stealth, itos.yaml]
    files_after:
      CLAUDE.local.md: null
      AGENTS.override.md: null
      .git/itos/itos.yaml: null
  - name: init writes the starter config, its ledger and registry, pins nothing it cannot reach, and installs the hooks
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
        label: start
    argv: [init, --json]
    exit: 0
    json_has:
      action: initialized
      config: itos.yaml
      since: "{{sha.start}}"
      files: [{ path: itos.yaml, action: wrote }, { path: tasks/phase-1.yaml, action: wrote }, { path: tasks/work-items.yaml, action: wrote }]
      pin: null
      hooks: { hooks: [{ name: itos-commit-msg, action: wrote }, { name: itos-pre-push, action: wrote }] }
    stdout_has: 127.0.0.1:1/no-release-server
    files_after:
      itos.yaml: |
        # itos.yaml, written by itos init: this repository's rules for its commits,
        # kept small to grow. itos config check validates it; itos config check
        # --print-defaults prints every key it leaves to its default.
        version: 1

        # No pin: the itos called runs. itos pin pins the newest release.

        # The tasks: every commit but a feat, a fix or a docs names one in its Task
        # footer (itos commit --task T-1), and itos task T-1 runs its checks.
        ledger:
          files: "tasks/phase-{group}.yaml" # one file per phase: tasks/phase-1.yaml, …
          id: "T-\\d+"

        commits:
          # The Conventional Commits types, held to commitlint's config-conventional
          # rules by itos's own lint.
          types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
          header_lint: { use: builtin }
          footers:
            Task:
              source: ledger
              required_for: [refactor, perf, test, build, ci, chore, style, revert]
              validate_for: all # a task named must be in the ledger
              read_at: commit # judged against the ledger the commit carries
          # Where verification starts: this commit and the ones before it, written
          # before itos, are never judged.
          since: "{{sha.start}}"
          # Which paths each type may touch. docs needs no Task footer, so it may
          # touch only Markdown, docs/ and itos's data in tasks/; the rest, anything.
          scopes:
            docs: { only: ["**/*.md", "docs/**", "tasks/**"] }

        hooks:
          bin: itos # the hooks call the global itos, which runs the release pinned
      tasks/phase-1.yaml: |
        # The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
        # a docs, each named in its commit's Task footer (itos commit --task T-2).
        # A task:
        #
        #   - id: T-2
        #     type: chore # one of commits.types
        #     title: What it is
        #     why: Why it is worth doing. # optional
        #     done_when: # the checks that prove it, which itos task T-2 runs
        #       - run: a command that exits 0 once it is done
        - id: T-1
          type: chore
          title: Adopt itos
          why: >
            The commit that adds itos.yaml, this ledger and the work registry names it:
            itos commit --task T-1.
          done_when:
            - run: itos config check
      tasks/work-items.yaml: |
        # The work registry: who owns each phase and each piece of work, and what
        # waits on what. itos work shows what can start; itos work check validates it.
        # An item:
        #
        #   - id: T-2 # a task's ID, or a name of its own
        #     title: What it is
        #     phase: 1
        #     owner: null # a handle, or null
        #     status: todo # todo, doing, done or blocked
        #     depends_on: []
        phases:
          1: null # the ledger's phase 1, owned by nobody: a handle, or null
        items: []
      .git/hooks/commit-msg: null
  - name: init with a config there writes nothing and lists what is missing, config check's problems and the hooks', then what it notes
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
      - run: git config --remove-section hook.itos-pre-push
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/: ""
    argv: [init, --no-git-shim, --json]
    exit: 1
    json_has:
      action: checked
      config: itos.yaml
      missing: [{ rule: work-registry-missing, area: registry }, { rule: hook-missing, area: hooks }]
      notes: [{ rule: work-people-missing, area: people }]
    stdout_has: [tasks/work-items.yaml, hook.itos-pre-push, CONTRIBUTORS.md]
    files_after:
      .git/hooks/pre-push: null
  - name: with --plugin and no claude on the PATH init says Claude Code was not found, and does the rest
    argv: [init, --plugin, user, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    json_has:
      action: initialized
      hooks: { hooks: [{ name: itos-commit-msg, action: wrote }, { name: itos-pre-push, action: wrote }] }
      plugin: { action: no_claude, scope: user }
  - name: with --plugin project init adds the marketplace and installs the plugin, and names its settings in the commit
    argv: [init, --plugin, project]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      .git/bin/claude: &claude
        text: |
          #!/bin/sh
          echo "$*" >> .git/claude-args
          case "$1 $2" in
          "plugin list") echo '[]' ;;
          "plugin install") mkdir -p .claude && echo '{"enabledPlugins":{"itos@itos":true}}' > .claude/settings.json ;;
          esac
        executable: true
    exit: 0
    stdout_has: "itos.yaml tasks/phase-1.yaml tasks/work-items.yaml .claude/settings.json"
    files_after:
      .git/claude-args: |
        plugin list --json
        plugin marketplace add donvargax/itos --scope project
        plugin install itos@itos --scope project
  - name: with no --plugin and nobody to ask init installs nothing and says how to
    argv: [init, --json]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      .git/bin/claude: *claude
    exit: 0
    json_has:
      action: initialized
      plugin: { action: offered, scope: null }
    files_after:
      .git/claude-args: |
        plugin list --json
  - name: run again where nothing is missing, init notes a people file missing and reports a plugin not installed, and still exits 0
    argv: [init, --no-git-shim, --json]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
      .git/bin/claude: *claude
    exit: 0
    json_has:
      action: checked
      missing: []
      notes: [{ rule: work-people-missing, area: people }]
      plugin: { action: offered, scope: null }
  - name: run again with the plugin installed, init's JSON says so, and what it notes
    argv: [--json, init, --no-git-shim]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
      .git/bin/claude:
        text: |
          #!/bin/sh
          echo '[{"id":"itos@itos","version":"2.3.0","scope":"user","enabled":true}]'
        executable: true
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      action: checked
      missing: []
      plugin: { action: already, scope: user, excluded: false }
      notes: [{ rule: work-people-missing, area: people }]
      git_shim: { action: declined, link: null, on_path: false, before_git: false }
      agent_rules: { action: offered, files: [] }
  - name: a claude that fails at the install is reported, exit 1, the rest of init done
    argv: [init, --plugin, user, --json]
    env: { PATH: "{{dir}}/.git/bin:{{PATH}}" }
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      .git/bin/claude:
        text: |
          #!/bin/sh
          case "$1 $2" in
          "plugin list") echo '[]' ;;
          "plugin install") echo 'Plugin "itos" not found in any marketplace' >&2; exit 1 ;;
          esac
        executable: true
    exit: 1
    json_has:
      action: initialized
      files: [{ path: itos.yaml, action: wrote }, { path: tasks/phase-1.yaml, action: wrote }, { path: tasks/work-items.yaml, action: wrote }]
      hooks: { hooks: [{ name: itos-commit-msg, action: wrote }, { name: itos-pre-push, action: wrote }] }
      plugin: { action: failed, scope: user }
    stdout_has: "not found in any marketplace"
  - name: with --agent-rules init writes its rules for agents at the end of AGENTS.md, its text kept, and CLAUDE.md imports it
    argv: [init, --agent-rules, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n", AGENTS.md: "# Demo\n\nBe kind." }
    exit: 0
    json_has:
      action: initialized
      agent_rules: { action: written, files: [{ path: AGENTS.md, action: updated }, { path: CLAUDE.md, action: wrote }] }
    files_after:
      CLAUDE.md: "@AGENTS.md\n"
      AGENTS.md: |
        # Demo

        Be kind.

        <!-- itos:begin -->

        ## itos

        Start with `itos go` unless your brief names another guide.

        Stage only your own files, by explicit path: untracked files you did not make are someone else's work in progress.

        <!-- itos:end -->
  - name: with no --agent-rules and nobody to ask init writes no rules and says how to
    argv: [init, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    json_has:
      action: initialized
      agent_rules: { action: offered, files: [] }
    files_after:
      AGENTS.md: null
      CLAUDE.md: null
  - name: run again, a block other than the one this itos writes is reported, naming itos init --agent-rules, and kept
    argv: [init, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
      AGENTS.md: "Be kind.\n\n<!-- itos:begin -->\nOld rules.\n<!-- itos:end -->\n"
    exit: 0
    json_has:
      action: checked
      missing: []
      agent_rules: { action: stale }
    files_after:
      AGENTS.md: "Be kind.\n\n<!-- itos:begin -->\nOld rules.\n<!-- itos:end -->\n"
      CLAUDE.md: null
  - name: an AGENTS.md with a begin marker and no end one is not written, exit 1, the rest of init done
    argv: [init, --agent-rules, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n", AGENTS.md: "<!-- itos:begin -->\nMine.\n" }
    exit: 1
    json_has:
      action: initialized
      files: [{ path: itos.yaml, action: wrote }, { path: tasks/phase-1.yaml, action: wrote }, { path: tasks/work-items.yaml, action: wrote }]
      agent_rules: { action: failed, files: [] }
    stdout_has: AGENTS.md
    files_after:
      AGENTS.md: "<!-- itos:begin -->\nMine.\n"
      CLAUDE.md: null
  - name: under --stealth, --agent-rules writes the rules in the git folder, imported from CLAUDE.local.md and after a copy of AGENTS.md in AGENTS.override.md, both excluded
    argv: [init, --stealth, --agent-rules, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n", AGENTS.md: "# Demo\n\nBe kind.\n" }
    exit: 0
    json_has:
      action: initialized
      config: .git/itos/itos.yaml
      agent_rules:
        action: written
        files: [{ path: .git/itos/AGENTS.md, action: wrote }, { path: CLAUDE.local.md, action: wrote }, { path: AGENTS.override.md, action: wrote }]
    files_after:
      AGENTS.md: "# Demo\n\nBe kind.\n"
      CLAUDE.md: null
      CLAUDE.local.md: "<!-- itos:begin -->\n\n@AGENTS.md\n\n@.git/itos/AGENTS.md\n\n<!-- itos:end -->\n"
      AGENTS.override.md: &override |
        <!-- itos:agents-md:begin -->

        # Demo

        Be kind.

        <!-- itos:agents-md:end -->

        <!-- itos:begin -->

        ## itos

        Start with `itos go` unless your brief names another guide.

        Stage only your own files, by explicit path: untracked files you did not make are someone else's work in progress.

        <!-- itos:end -->
  - name: under --stealth a CLAUDE.local.md and an AGENTS.override.md of the person's keep their text and gain the block alone, never the copy
    argv: [init, --stealth, --agent-rules, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n", AGENTS.md: "Be kind.\n" }
    files:
      CLAUDE.local.md: "My notes.\r\n"
      AGENTS.override.md: "My override.\n<!-- itos:begin -->\nOld.\n<!-- itos:end -->\nAfter.\n"
    exit: 0
    json_has:
      agent_rules:
        action: written
        files: [{ path: .git/itos/AGENTS.md, action: wrote }, { path: CLAUDE.local.md, action: updated }, { path: AGENTS.override.md, action: updated }]
    files_after:
      CLAUDE.local.md: "My notes.\r\n\r\n<!-- itos:begin -->\r\n\r\n@AGENTS.md\r\n\r\n@.git/itos/AGENTS.md\r\n\r\n<!-- itos:end -->\r\n"
  - name: with no --agent-rules and nobody to ask, under --stealth init writes no rules and says how to
    argv: [init, --stealth, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    json_has:
      action: initialized
      config: .git/itos/itos.yaml
      agent_rules: { action: offered, files: [] }
    files_after:
      .git/itos/AGENTS.md: null
      CLAUDE.local.md: null
      AGENTS.override.md: null
  - name: init takes --agent-rules or --no-agent-rules, not both
    argv: [init, --agent-rules, --no-agent-rules]
    exit: 2
    stderr_has: [--agent-rules, --no-agent-rules]
  - name: with --git-shim init links itos as git in the folder --git-shim-dir names, and says where it stands on the PATH
    argv: [init, --git-shim, --git-shim-dir, shims, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    json_has:
      action: initialized
      git_shim: { action: linked, link: "{{dir}}/shims/git", on_path: false, before_git: false }
  - name: with no --git-shim and nobody to ask init links nothing and says how to
    argv: [init, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    exit: 0
    json_has:
      action: initialized
      git_shim: { action: offered, link: "<any>", on_path: false }
  - name: run again with --git-shim, init links it and reports it in its JSON
    argv: [--json, init, --git-shim, --git-shim-dir, shims]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
    exit: 0
    json:
      schema: 1
      config: itos.yaml
      action: checked
      missing: []
      plugin: { action: no_claude, scope: null, excluded: false }
      notes: [{ rule: work-people-missing, area: people }]
      git_shim: { action: linked, link: "{{dir}}/shims/git", on_path: false, before_git: false }
      agent_rules: { action: offered, files: [] }
  - name: run again with no --git-shim, init says how to link it and does not count it as missing
    argv: [init, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      itos.yaml: |
        version: 1
        ledger: { files: "tasks/phase-{group}.yaml" }
      tasks/work-items.yaml: "phases: {}\nitems: []\n"
    exit: 0
    json_has:
      action: checked
      missing: []
      git_shim: { action: offered, link: "<any>" }
  - name: where no scenario carries an ID tag, the starter requires the Scenarios footer of no type, and init says how to tag one
    argv: [init, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
        label: start
    files:
      features/pages.feature: |
        Feature: pages

          Scenario: a page opens
            When it opens
    exit: 0
    json_has:
      action: initialized
      since: "{{sha.start}}"
      files: [{ path: itos.yaml, action: wrote }, { path: features/smoke.yaml, action: wrote }]
    files_after:
      itos.yaml: |
        # itos.yaml, written by itos init: this repository's rules for its commits,
        # kept small to grow. itos config check validates it; itos config check
        # --print-defaults prints every key it leaves to its default.
        version: 1

        # No pin: the itos called runs. itos pin pins the newest release.

        # The tasks: every commit but a feat, a fix or a docs names one in its Task
        # footer (itos commit --task T-1), and itos task T-1 runs its checks.
        ledger:
          files: "tasks/phase-{group}.yaml" # one file per phase: tasks/phase-1.yaml, …
          id: "T-\\d+"

        commits:
          # The Conventional Commits types, held to commitlint's config-conventional
          # rules by itos's own lint.
          types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
          header_lint: { use: builtin }
          footers:
            Task:
              source: ledger
              required_for: [refactor, perf, test, build, ci, chore, style, revert]
              validate_for: all # a task named must be in the ledger
              read_at: commit # judged against the ledger the commit carries
            # The scenarios a feat or a fix turns green, by their ID tags
            # (itos commit --scenarios '@ID-PAGE-01'); a @wip one is not live. No
            # scenario carries an ID tag yet, so no commit needs the footer: tag one
            # (@ID-PAGE-01 on the line above its Scenario:), then set required_for
            # to [feat, fix].
            Scenarios:
              source: { tests: scenario }
              strip_prefix: "@"
              required_for: []
              validate_for: [feat, fix]
              must_be_live: true
              read_at: commit
          # Where verification starts: this commit and the ones before it, written
          # before itos, are never judged.
          since: "{{sha.start}}"
          # Which paths each type may touch. docs needs no Task footer, so it may
          # touch only Markdown, docs/ and itos's data in tasks/; the rest, anything.
          scopes:
            docs: { only: ["**/*.md", "docs/**", "tasks/**"] }

        # The named tests: the scenarios of the feature files under features/, each
        # with an ID tag such as @ID-PAGE-01, and a smoke set naming one of each file.
        tests:
          scenario:
            root: features
            id: "ID-[A-Z]+-\\d+"
            smoke: { file: features/smoke.yaml }

        hooks:
          bin: itos # the hooks call the global itos, which runs the release pinned
      features/smoke.yaml: |
        # The smoke set: one live scenario of each feature file, which a push's CI can
        # run in place of every one; itos tests smoke check scenario holds it to that.
        # itos init picked each file's first: pick a fast one, central to its file.
        []
  # init --policy (slice 108, issue #33): a template's policy made the
  # project's own config, with fresh data, refused before anything is written
  # where it cannot be made as it says or a project is there already.
  - name: init's --policy needs a file
    argv: [init, --policy]
    exit: 2
    stderr_has: --policy
  - name: init --policy writes the project's own config, never one --config names
    argv: [--config, other.yaml, init, --policy, policy.yaml]
    files: { policy.yaml: "version: 1\n" }
    exit: 2
    stderr_has: other.yaml
  - name: init --policy refuses a policy config check refuses before it runs git init
    argv: [init, --policy, policy.yaml, --no-git-shim, --json]
    hide: [claude]
    files: { policy.yaml: "version: 1\nimaginary_policy: true\n" }
    exit: 2
    json_has:
      config: policy.yaml
      valid: false
      problems: [{ rule: config-unknown-key }]
    stdout_has: imaginary_policy
    files_after:
      .git/HEAD: null
      itos.yaml: null
  - name: init --policy refuses a policy that cannot name the file of group 1, nor hold T-1, writing nothing
    argv: [init, --policy, policy.yaml, --no-git-shim, --json]
    hide: [claude]
    git:
      - commit: "docs: start"
        files: { README.md: "# Scratch\n" }
    files:
      policy.yaml: |
        version: 1
        ledger:
          files: "tasks/phase-{group}.yaml"
          id: 'TASK-\d+'
          group: { pattern: '[a-z]+' }
        commits:
          types: [feat, fix, docs]
    exit: 2
    json_has:
      config: policy.yaml
      valid: false
      problems: [{ rule: init-policy-ledger }]
    stdout_has: [ledger.files, ledger.id, commits.types]
    files_after:
      itos.yaml: null
