        files: { README.md: "# Scratch\n", AGENTS.md: "Be kind.\n" }
    files:
      CLAUDE.local.md: "My notes.\r\n"
      AGENTS.override.md: "My override.\n<!-- itos:begin -->\nOld.\n<!-- itos:end -->\nAfter.\n"
    exit: 0
    stdout_has: "wrote .git/itos/AGENTS.md\nupdated CLAUDE.local.md\nupdated AGENTS.override.md\nListed CLAUDE.local.md and AGENTS.override.md in the git folder's info/exclude, so git status stays clean.\n.git/itos/AGENTS.md holds the rules .git/itos/itos.yaml decides, between <!-- itos:begin --> and <!-- itos:end -->, which itos init --agent-rules rewrites; CLAUDE.local.md imports it for Claude Code, and AGENTS.override.md holds them for Codex.\n"
    files_after:
      CLAUDE.local.md: "My notes.\r\n\r\n<!-- itos:begin -->\r\n\r\n@AGENTS.md\r\n\r\n@.git/itos/AGENTS.md\r\n\r\n<!-- itos:end -->\r\n"
  - name: with no --agent-rules and nobody to ask, under --stealth init writes no rules and says how to
