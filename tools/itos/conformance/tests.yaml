# Named tests behind an adapter (`itos tests list`): the built-in Gherkin adapter's one definition of live (a scenario's tag
# line, or a file-level tag above its Feature line), at the working tree, the
# index or a commit; a command adapter held to the adapter protocol, its failures
# naming what the command said; its tests named in a footer; and the run
# templates that merge selections into one command and read a check back as
# one (through `ci plan` and `tests smoke run`), an empty smoke set selecting none.
git:
  - commit: "test: the features"
    files:
      features/one.feature: |
        @phase-1
        Feature: One

          @ID-ONE-01
          Scenario: Lies down
            When I press "Play"

          @ID-ONE-02 @wip
          Scenario: Gets up
            When I press "Play"
      features/nested/two.feature: |
        @phase-1 @wip
        Feature: Two

          @ID-TWO-01
          Scenario: Sits
            When I press "Play"
      features/empty.feature: "Feature: Nothing yet\n"
    label: first
  - stage:
      features/one.feature: |
        @phase-1
        Feature: One

          @ID-ONE-01 @wip
          Scenario: Lies down
            When I press "Play"
  - write:
      features/one.feature: |
        @phase-1
        Feature: One

          @ID-ONE-01
          Scenario: Lies down
            When I press "Play"

          @ID-ONE-03
          Scenario: Rolls over
            When I press "Play"
files:
  itos.yaml: |
    version: 1
    commits:
      types: [feat, fix, docs]
      footers:
        Fixture:
          source: { tests: fixture }
          required_for: [feat, fix]
          validate_for: [feat, fix]
          must_be_live: true
          read_at: commit
    tests:
      scenario: { root: features, id: "ID-[A-Z]+-\\d+", tag_prefix: "@", wip_tag: "@wip" }
      fixture:
        adapter: { command: "sh adapter.sh", supports_at: false }
        id: "F-\\d+"
        run:
          whole: "sh adapter.sh run"
          select: "sh adapter.sh run {pattern}"
          ids_pattern: "^({ids})$"
          join: { each: "({p})", sep: "|" }
        recognize:
          - { command: "sh adapter.sh run", as: whole }
          - { command: "sh adapter.sh run {pattern}", as: pattern }
        smoke: { file: fixture-smoke.yaml }
  adapter.sh: |
    # Three named tests in two files, F-002 not live, and a file with none.
    case "$1" in
    list)
      printf '%s\n' '{"protocol":1,"tests":[{"id":"F-001","file":"one.txt","live":true},{"id":"F-002","file":"one.txt","live":false},{"id":"F-003","file":"two.txt","live":true}],"files":["empty.txt","one.txt","two.txt"]}'
      ;;
    run)
      shift
      pattern=${1:-.}
      shift 2>/dev/null
      printf '%s\n' F-001 F-002 F-003 | grep -E "$pattern"
      [ $# -eq 0 ] || echo "and: $*"
      ;;
    esac
  fixture-smoke.yaml: "- file: one.txt\n  scenarios: [{ id: F-001, why: one }]\n- file: two.txt\n  scenarios: [{ id: F-003, why: two }]\n"
cases:
  - name: every feature file and scenario, a file-level @wip making its scenarios not live
    argv: [tests, list, scenario, --json]
    exit: 0
    json:
      schema: 1
      protocol: 1
      tests:
        - id: ID-TWO-01
          file: nested/two.feature
          live: false
          fingerprint: 62caba60111dc01e660bfd61d0277762990d551f74f061be904f500799066a70
        - id: ID-ONE-01
          file: one.feature
          live: true
          fingerprint: 901cf935fe946f70f53cacc233f7fb52d4d361034941ef04c84a975114757457
        - id: ID-ONE-03
          file: one.feature
          live: true
          fingerprint: d2b35643e8510609098f6748a02f2e2a8b5c6ac279782485f85b388619d86a43
      files:
        - empty.feature
        - nested/two.feature
        - one.feature
  - name: the listing at a commit
    argv: [tests, list, scenario, --at, "{{sha.first}}", --json]
    exit: 0
    json:
      schema: 1
      protocol: 1
      tests:
        - id: ID-TWO-01
          file: nested/two.feature
          live: false
          fingerprint: 62caba60111dc01e660bfd61d0277762990d551f74f061be904f500799066a70
        - id: ID-ONE-01
          file: one.feature
          live: true
          fingerprint: 901cf935fe946f70f53cacc233f7fb52d4d361034941ef04c84a975114757457
        - id: ID-ONE-02
          file: one.feature
          live: false
          fingerprint: 24aa8e9c092c610bfd6a1994f4af5d66d61e0c51d11de90eea52194586707799
      files:
        - empty.feature
        - nested/two.feature
        - one.feature
  - name: the listing of the staged tree
    argv: [tests, list, scenario, --at, index, --json]
    exit: 0
    json:
      schema: 1
      protocol: 1
      tests:
      - id: ID-TWO-01
        file: nested/two.feature
        live: false
        fingerprint: 62caba60111dc01e660bfd61d0277762990d551f74f061be904f500799066a70
      - id: ID-ONE-01
        file: one.feature
        live: false
        fingerprint: 17aecc494ed5f592f97af1d4e83a463fe739d796da9ec128f7d25e00bc5a8b2b
      files:
      - empty.feature
      - nested/two.feature
      - one.feature
  - name: --tsv prints the live scenarios alone, each file from the project's top, its fingerprint the third column
    argv: [tests, list, scenario, --tsv]
    exit: 0
    stdout_contract: true
    stdout: "ID-ONE-01\tfeatures/one.feature\t901cf935fe946f70f53cacc233f7fb52d4d361034941ef04c84a975114757457\nID-ONE-03\tfeatures/one.feature\td2b35643e8510609098f6748a02f2e2a8b5c6ac279782485f85b388619d86a43\n"
  - name: --tsv of a command adapter's listing, its live tests' IDs and files as listed
    argv: [tests, list, fixture, --tsv]
    exit: 0
    stdout_contract: true
    stdout: "F-001\tone.txt\nF-003\ttwo.txt\n"
  - name: --tsv and --json together are a usage error
    argv: [tests, list, scenario, --tsv, --json]
    exit: 2
    stdout: ""
  - name: a tree that names no commit is refused, naming it
    argv: [tests, list, scenario, --at, no-such-commit, --json]
    exit: 2
    stderr_has: no-such-commit
  - name: a command adapter is listed as the command prints it
    argv: [tests, list, fixture, --json]
    exit: 0
    json:
      schema: 1
      protocol: 1
      tests:
        - id: F-001
          file: one.txt
          live: true
        - id: F-002
          file: one.txt
          live: false
        - id: F-003
          file: two.txt
          live: true
      files:
        - empty.txt
        - one.txt
        - two.txt
  - name: a command adapter that cannot list a tree reads the working tree, and says so
    argv: [tests, list, fixture, --at, HEAD, --json]
    exit: 0
    stderr_has: [tests.fixture, HEAD]
    json:
      schema: 1
      protocol: 1
      tests:
      - id: F-001
        file: one.txt
        live: true
      - id: F-002
        file: one.txt
        live: false
      - id: F-003
        file: two.txt
        live: true
      files:
      - empty.txt
      - one.txt
      - two.txt
  - name: a footer names a command adapter's tests
    argv: [commit, check-message, "-", --json]
    stdin: "feat: x\n\nFixture: F-001, F-003\n"
    exit: 0
    json:
      schema: 1
      ok: true
      problems: []
  - name: a footer naming a test the adapter does not list
    argv: [commit, check-message, "-", --json]
    stdin: "feat: x\n\nFixture: F-404\n"
    exit: 1
    stdout_has: F-404
    json:
      schema: 1
      ok: false
      problems:
      - rule: fixture-footer
  - name: a footer naming a test that is not live, where the kind has no wip tag
    argv: [commit, check-message, "-", --json]
    stdin: "feat: x\n\nFixture: F-002\n"
    exit: 1
    stdout_has: F-002
    json:
      schema: 1
      ok: false
      problems:
      - rule: fixture-footer
  - name: an adapter that fails, with what it said
    argv: [tests, list, broken]
    files: { broken.yaml: "version: 1\ntests:\n  broken:\n    adapter: { command: \"echo gone >&2; false\" }\n" }
    env: { ITOS_CONFIG: broken.yaml }
    exit: 2
    stderr_has: ["echo gone >&2; false list --at worktree", "gone\n"]
  - name: an adapter that prints no JSON
    argv: [tests, list, broken]
    files: { broken.yaml: "version: 1\ntests:\n  broken:\n    adapter: { command: \"echo\" }\n" }
    env: { ITOS_CONFIG: broken.yaml }
    exit: 2
    stderr_has: echo list --at worktree
  - name: an adapter that speaks another protocol
    argv: [tests, list, broken]
    files: { broken.yaml: "version: 1\ntests:\n  broken:\n    adapter: { command: \"echo '{\\\"protocol\\\":2}' #\" }\n" }
    env: { ITOS_CONFIG: broken.yaml }
    exit: 2
    stderr_has: "echo '{\"protocol\":2}' # list --at worktree"
  - name: an adapter that lists no files
    argv: [tests, list, broken]
    files: { broken.yaml: "version: 1\ntests:\n  broken:\n    adapter: { command: \"echo '{\\\"protocol\\\":1,\\\"tests\\\":[]}' #\" }\n" }
    env: { ITOS_CONFIG: broken.yaml }
    exit: 2
    stderr_has: "echo '{\"protocol\":1,\"tests\":[]}' # list --at worktree"
  - name: an adapter whose test lacks a field
    argv: [tests, list, broken]
    files: { broken.yaml: "version: 1\ntests:\n  broken:\n    adapter: { command: \"echo '{\\\"protocol\\\":1,\\\"files\\\":[],\\\"tests\\\":[{\\\"id\\\":\\\"x\\\"}]}' #\" }\n" }
    env: { ITOS_CONFIG: broken.yaml }
    exit: 2
    stderr_has: "echo '{\"protocol\":1,\"files\":[],\"tests\":[{\"id\":\"x\"}]}' # list --at worktree"
  - name: an adapter that is not built in
    argv: [tests, list, broken, --json]
    files: { broken.yaml: "version: 1\ntests:\n  broken: { adapter: mocha }\n" }
    env: { ITOS_CONFIG: broken.yaml }
    exit: 2
    json:
      schema: 1
      config: broken.yaml
      valid: false
      problems:
      - rule: config-invalid
  - name: a kind the config does not have
    argv: [tests, list, nothing, --json]
    exit: 2
    json:
      schema: 1
      config: itos.yaml
      valid: false
      problems:
      - rule: config-invalid
  - name: the smoke run is the kind's select template over the smoke IDs, the arguments after the kind passed on
    argv: [tests, smoke, run, fixture, --workers=1, -x]
    exit: 0
    stdout_has: "F-001\nF-003\nand: --workers=1 -x\n"
  - name: a -- right after the kind is taken, so itos's own flags after it reach the runner, and is not passed on
    argv: [tests, smoke, run, fixture, --, --json, -q]
    exit: 0
    stdout_has: "F-001\nF-003\nand: --json -q\n"
  - name: an empty smoke set runs nothing, and says so
    argv: [tests, smoke, run, fixture]
    files: { fixture-smoke.yaml: "[]\n" }
    exit: 0
    stdout: ""
    stderr_has: tests.fixture
  - name: the smoke IDs
    argv: [tests, smoke, ids, fixture]
    exit: 0
    stdout_contract: true
    stdout: |
      F-001
      F-003
  - name: the smoke IDs as --json
    argv: [tests, smoke, ids, fixture, --json]
    exit: 0
    json:
      schema: 1
      kind: fixture
      ids:
        - F-001
        - F-003
  - name: tests next-id claims an area's next tag through the id counter, kept in the git folder with no remote
    argv: [tests, next-id, scenario, ID-ONE]
    exit: 0
    stdout_contract: true
    stdout: |
      @ID-ONE-04
    files_after:
      .git/itos/ids.yaml: "counters:\n    ID-ONE: 4\n"
  - name: tests next-id claims past an area's counter when the counter is ahead of the files
    argv: [tests, next-id, scenario, ID-ONE, --json]
    files: { .git/itos/ids.yaml: "counters:\n    ID-ONE: 7\n    slice: 2\n" }
    exit: 0
    json:
      schema: 1
      kind: scenario
      stem: ID-ONE
      id: "@ID-ONE-08"
      ids: ["@ID-ONE-08"]
      claimed: true
    files_after:
      .git/itos/ids.yaml: "counters:\n    ID-ONE: 8\n    slice: 2\n"
  - name: tests next-id --count claims several of an area's tags in a row, one a line
    argv: [tests, next-id, scenario, ID-ONE, --count, "3"]
    exit: 0
    stdout_contract: true
    stdout: |
      @ID-ONE-04
      @ID-ONE-05
      @ID-ONE-06
    files_after:
      .git/itos/ids.yaml: "counters:\n    ID-ONE: 6\n"
  - name: tests next-id of a stem the registry's items use only reads, claiming nothing
    argv: [tests, next-id, scenario, slice, --json]
    exit: 0
    json:
      schema: 1
      kind: scenario
      stem: slice
      id: "@slice-1"
      ids: ["@slice-1"]
      claimed: false
    files_after:
      .git/itos/ids.yaml: null
  - name: tests next-id refuses a --count that is no number from 1 up, claiming nothing
    argv: [tests, next-id, scenario, ID-ONE, --count, "0"]
    exit: 2
    stderr_has: --count
    files_after:
      .git/itos/ids.yaml: null
  - name: tests next-id refuses a --count that is not a number
    argv: [tests, next-id, scenario, ID-ONE, --count, three]
    exit: 2
    stderr_has: [--count, three]
  - name: tests next-id refuses --count for a stem that only reads
    argv: [tests, next-id, scenario, slice, --count, "2"]
    exit: 2
    stderr_has: [--count, slice]
