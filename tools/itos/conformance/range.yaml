# Where a CI run's range starts (`ci range`): a pull request's
# base; else the start the `ci.range` provider proposes, when it is an
# ancestor of the head; else the commit commits.since names, when it is one
# (slice 109); else empty, which runs everything. The github
# provider proposes the nearest of the head's first parents with a green run
# of ci.range.github.workflow, on any branch (bug 29); finding none, or an API
# that refuses, is not an error. The command provider went in v5.0.0 (slice
# 85); GitHub here is the runner's fake (run.ts).
# The repository: main (root, one, two) and a branch off root (divergent).
git:
  - commit: "chore: root"
    files: { root: "root\n" }
    label: root
  - branch: rewritten
  - commit: "chore: divergent"
    files: { divergent: "divergent\n" }
    label: divergent
  - checkout: main
  - commit: "chore: one"
    files: { one: "one\n" }
    label: one
  - commit: "chore: two"
    files: { two: "two\n" }
    label: two
files:
  itos.yaml: |
    version: 1
    ci:
      steps: [{ run: vp check, cost: static }]
      range: { provider: github }
cases:
  - name: an ancestor with a green run starts the range
    argv: [ci, range, --head, "{{sha.two}}"]
    github:
      runs:
        - { head_sha: "{{sha.root}}", status: completed, conclusion: success }
    exit: 0
    stdout: |
      FROM={{sha.root}}
  - name: the nearest first parent with a green run starts it, past one whose run failed
    argv: [ci, range, --head, "{{sha.two}}"]
    github:
      runs:
        - { head_sha: "{{sha.one}}", status: completed, conclusion: failure }
        - { head_sha: "{{sha.root}}", status: completed, conclusion: success }
    exit: 0
    stdout: |
      FROM={{sha.root}}
  - name: a green run on another branch counts
    argv: [ci, range, --head, "{{sha.two}}"]
    github:
      runs:
        - { head_sha: "{{sha.one}}", status: completed, conclusion: success, head_branch: rewritten }
        - { head_sha: "{{sha.root}}", status: completed, conclusion: success }
    exit: 0
    stdout: |
      FROM={{sha.one}}
  - name: a green run off the head's history starts nothing, which runs everything
    argv: [ci, range, --head, "{{sha.two}}"]
    github:
      runs:
        - { head_sha: "{{sha.divergent}}", status: completed, conclusion: success }
    exit: 0
    stdout: |
      FROM=
  - name: an API that refuses runs everything, and is not an error
    argv: [ci, range, --head, "{{sha.two}}"]
    github: { refuse: true }
    exit: 0
    stdout: |
      FROM=
    stderr: ""
  - name: a pull request keeps its base
    argv: [ci, range, --head, "{{sha.two}}", --base, "{{sha.divergent}}"]
    github:
      runs:
        - { head_sha: "{{sha.root}}", status: completed, conclusion: success }
    exit: 0
    stdout: |
      FROM={{sha.divergent}}
    stderr: ""
  - name: --json
    argv: [ci, range, --head, "{{sha.two}}", --json]
    github:
      runs:
        - { head_sha: "{{sha.one}}", status: completed, conclusion: success }
    exit: 0
    json:
      schema: 1
      from: "{{sha.one}}"
  - name: provider none always runs everything
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\nci: { steps: [vp check], range: { provider: none } }\n"
    exit: 0
    stdout: |
      FROM=
  - name: provider none still keeps a pull request's base
    argv: [ci, range, --head, "{{sha.two}}", --base, "{{sha.one}}"]
    files:
      itos.yaml: "version: 1\nci: { steps: [vp check], range: { provider: none } }\n"
    exit: 0
    stdout: |
      FROM={{sha.one}}
  - name: provider github without a repository runs everything, asking no one
    argv: [ci, range, --head, "{{sha.two}}"]
    exit: 0
    stdout: |
      FROM=
  - name: with no green run the range starts at commits.since
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\ncommits: { since: \"{{sha.root}}\" }\nci: { steps: [vp check], range: { provider: github } }\n"
    github:
      runs:
        - { head_sha: "{{sha.one}}", status: completed, conclusion: failure }
    exit: 0
    stdout: |
      FROM={{sha.root}}
  - name: a green run nearer than commits.since starts the range
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\ncommits: { since: \"{{sha.root}}\" }\nci: { steps: [vp check], range: { provider: github } }\n"
    github:
      runs:
        - { head_sha: "{{sha.one}}", status: completed, conclusion: success }
    exit: 0
    stdout: |
      FROM={{sha.one}}
  - name: an API that refuses starts the range at commits.since
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\ncommits: { since: \"{{sha.one}}\" }\nci: { steps: [vp check], range: { provider: github } }\n"
    github: { refuse: true }
    exit: 0
    stdout: |
      FROM={{sha.one}}
    stderr: ""
  - name: provider none starts the range at commits.since
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\ncommits: { since: \"{{sha.root}}\" }\nci: { steps: [vp check], range: { provider: none } }\n"
    exit: 0
    stdout: |
      FROM={{sha.root}}
  - name: commits.since off the head's history starts nothing, which runs everything
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\ncommits: { since: \"{{sha.divergent}}\" }\nci: { steps: [vp check], range: { provider: none } }\n"
    exit: 0
    stdout: |
      FROM=
  - name: a pull request keeps its base over commits.since
    argv: [ci, range, --head, "{{sha.two}}", --base, "{{sha.one}}"]
    files:
      itos.yaml: "version: 1\ncommits: { since: \"{{sha.root}}\" }\nci: { steps: [vp check], range: { provider: none } }\n"
    exit: 0
    stdout: |
      FROM={{sha.one}}
  - name: the command provider was removed in v5
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\nci: { steps: [vp check], range: { provider: command, command: \"git rev-parse HEAD~1\" } }\n"
    exit: 2
    stderr: |
      FAIL itos.yaml: ci.range.provider: command was removed in v5; set ci.range.provider to github or none
      FAIL itos.yaml: ci.range.command was removed in v5; remove ci.range.command, and set ci.range.provider to github or none
  - name: ci.range.github.branch was removed in v5
    argv: [ci, range, --head, "{{sha.two}}"]
    files:
      itos.yaml: "version: 1\nci: { steps: [vp check], range: { provider: github, github: { branch: main } } }\n"
    exit: 2
    stderr: |
      FAIL itos.yaml: ci.range.github.branch was removed in v5; remove ci.range.github.branch: a commit's green run counts on any branch
