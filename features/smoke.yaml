# The smoke set: the scenarios every push's CI runs, beside the ones its
# commits name. The whole suite runs nightly (.github/workflows/nightly.yml).
#
# The rule, checked by `tools/bin/itos tests smoke check scenario` in CI:
# every feature file with a live scenario has at least one here, every ID here
# is a live scenario of the file it is listed under, and a file with more than
# one says why (`more`). `tools/bin/itos tests smoke run scenario` runs exactly
# this set.
#
# How to pick one: a fast scenario that exercises what its file is about, not
# an edge of it, chosen from the per-scenario times of the full runs and from
# what has failed on main; slow or narrow ones stay in the nightly.
#
# The shape (read by internal/tests, the file itos.yaml's
# `tests.scenario.smoke` names): one entry per feature file, `file` relative to
# features/, `more` saying why the file has more than one (required when it
# does), and each scenario's `id` and `why`. Quote a value holding `: `, and
# every ID (its `@` starts no plain scalar).
- file: bin.feature
  scenarios:
    - id: "@ID-BIN-01"
      why: a ci.covers pattern written for itos covering a check that calls hooks.bin, the reading every pattern shares
- file: ci.feature
  scenarios:
    - id: "@ID-CI-01"
      why: ci run logs a merged check under the kind it ran in, the file's point
- file: commit-command.feature
  scenarios:
    - id: "@ID-COMMITCMD-01"
      why: itos commit --task writes the ledger footer into a commit the hook lets through, the file's point
- file: commit-msg.feature
  scenarios:
    - id: "@ID-CMSG-03"
      why: the hook rejects a commit by a footer rule of itos's own, no delegate in between
- file: commit-data.feature
  scenarios:
    - id: "@ID-CDATA-01"
      why: the hook rejects a commit whose staged data has a problem, with the problem, the file's point
- file: commit-tasks.feature
  scenarios:
    - id: "@ID-CTASK-01"
      why: the hook rejects a commit whose named done task's static check fails, the file's point
- file: config.feature
  scenarios:
    - id: "@ID-CONFIG-01"
      why: the config's shell, which nearly every command itos starts goes through, read by the quickest of them
- file: cost.feature
  scenarios:
    - id: "@ID-COST-01"
      why: a pattern written for itos matching a command that calls hooks.bin, the file's point
- file: extensions.feature
  scenarios:
    - id: "@ID-EXT-04"
      why: an extension found on the PATH runs in the root with what the global flags before it set, the whole dispatch
- file: footers.feature
  scenarios:
    - id: "@ID-FOOT-01"
      why: the hook rejects a footer by itos's own rule with a delegate that carries none, the file's point
- file: guard.feature
  scenarios:
    - id: "@ID-GUARD-03"
      why: a git commit behind git's global options denied, naming itos commit, why the guard is a hook and not a rule
- file: header.feature
  scenarios:
    - id: "@ID-HEADER-01"
      why: the hook rejects a header by the built-in lint under commitlint's rule id, no Node in the scratch repository
- file: init.feature
  scenarios:
    - id: "@ID-INIT-01"
      why: init in a repository with a commit writes a config the checks accept and installs the hooks, the file's point
- file: ledger.feature
  scenarios:
    - id: "@ID-LEDGER-01"
      why: config check names the missing ledger folder, the first command a consumer meets it in
- file: moves.feature
  scenarios:
    - id: "@ID-MOVES-01"
      why: the commit-msg hook rejects a test commit that changes a live scenario, the rule's point
- file: nightly.feature
  scenarios:
    - id: "@ID-NIGHTLY-01"
      why: the nightly runs a done task's check and leaves out one in progress, the file's point
- file: patterns.feature
  scenarios:
    - id: "@ID-PATTERN-01"
      why: config check refuses a lookahead as RE2 does, the file's point, one config check in a scratch repository
- file: pin.feature
  scenarios:
    - id: "@ID-PIN-01"
      why: a pinned release fetched, checked and run with the arguments and its exit code, the launcher's whole path
- file: pre-push.feature
  scenarios:
    - id: "@ID-PREPUSH-01"
      why: a pushed commit that breaks the commit rules refused by the hook, saying how to fix it, the file's point
- file: push.feature
  scenarios:
    - id: "@ID-PUSH-01"
      why: the local commits rebased onto the remote's and pushed, whatever pull.rebase says, the file's point
- file: shim.feature
  scenarios:
    - id: "@ID-SHIM-01"
      why: git commit through the link is itos commit in an itos repository, refused before git runs, the shim's point
- file: show.feature
  scenarios:
    - id: "@ID-SHOW-01"
      why: an item's commits found by the scenarios their footers name, oldest first, the command's core
- file: since.feature
  scenarios:
    - id: "@ID-SINCE-01"
      why: verify leaves out the commit commits.since names, the key's point
- file: smoke.feature
  scenarios:
    - id: "@ID-SMOKE-01"
      why: runner arguments after the kind reach the runner without a --, the file's point
- file: stealth.feature
  scenarios:
    - id: "@ID-STEALTH-01"
      why: with no itos.yaml in the root, itos finds the config in the git folder and the ledger beside it, the mode's root
- file: task.feature
  scenarios:
    - id: "@ID-TASK-01"
      why: task --pending runs a check two tasks list once and both read its result, the file's point
- file: update.feature
  scenarios:
    - id: "@ID-UPDATE-06"
      why: a pin fallen behind runs and is told the newer release, the question and the notice together
- file: upgrading.feature
  scenarios:
    - id: "@ID-UPGRADE-01"
      why: a commit without the free-text footer its type needs is rejected, the footer's rule, one hook run
- file: watch.feature
  scenarios:
    - id: "@ID-WATCH-01"
      why: a push that waits for its run, printing each job and exiting with the run's result, the file's point
- file: work.feature
  scenarios:
    - id: "@ID-WORK-01"
      why: the registry read where itos looks by default, which every command reading it goes through
