# A port's fake and contract suite (ADR-0053) are test code outside
# _test.go files, never linked into the binary: no command measures them.
exclude: ["**/porttest/**"]
mutation:
  tests:
    list: go run ./tools/bin/itos-cc-tests
    run: "go test ./features -count=1 -scenarios='{pattern}'"
    ids_pattern: "^@(?:{ids})$"
    join: { each: "{id}", sep: "|" }
    whole: go test ./features -count=1
    support:
      - features/*_test.go
      - features/testdata/**
      - tools/bin/itos-cc-tests/main.go
      - tools/bin/repo-program/repoprogram.go
  exceptions:
    - file: internal/ledger/nextid.go
      function: github.com/donvargax/itos/v8/internal/ledger#NextIDAfter
      hash: aa4a7f149c20977d
      line_in_function: 35
      column: 11
      original: ">"
      replacement: ">="
      reason: "Equivalent: floor >= 0 differs from floor > 0 only for a floor of 0, which adds the series' number 0 to the IDs; nextid.Next takes the highest number and the widest width, and 0, one digit wide, raises neither, so the ID is the same."
    - file: internal/ledger/nextid.go
      function: github.com/donvargax/itos/v8/internal/ledger#NextIDAfter
      hash: aa4a7f149c20977d
      line_in_function: 35
      column: 15
      original: "&&"
      replacement: "||"
      reason: 'Equivalent: the prefix was refused above when empty, so prefix != "" always holds here and || adds an ID only for a floor of 0 or less: 0 raises neither the highest number nor the width nextid.Next takes, and a negative floor is written with a minus sign after the prefix, which is no number of the series, so the ID is the same.'
    - file: internal/idcounter/counter.go
      function: github.com/donvargax/itos/v8/internal/idcounter#validCategory
      hash: d301a27826cda753
      line_in_function: 2
      column: 50
      original: "||"
      replacement: "&&"
      reason: 'Equivalent: the source edit binds as s == "" || (strings.ContainsAny(s, "/\\\x00") && s == ".") || s == "..", and "." holds none of those characters, so it rejects only "" and ".."; every string the original also rejects (".", or one holding a slash, backslash or NUL) has a character outside [A-Za-z0-9-], which the loop below rejects anyway, so validCategory returns the same for every input.'
    - file: internal/slices/task/parse.go
      function: github.com/donvargax/itos/v8/internal/slices/task#AddArgs
      hash: a3c7930d817b83ab
      line_in_function: 9
      column: 11
