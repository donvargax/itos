# itos.yaml — the task tooling's policy (tasks/README.md explains it)
#
# One file for every table the task tool reads: the ledger's layout, the
# commit rules, the named tests, the CI plan, the work routing and the hooks.
# tools/itos/config.ts loads it and rejects a key it does not know;
# `ITOS_CONFIG` names another file. `$name` in a path list stands for
# `commits.path_sets.<name>`. The range, the identity and the people are
# providers (tools/itos/providers.ts).
version: 1
requires: ">=0.6.0" # the oldest itos that reads this file: builtin: moves is 0.6.0's
shell: [sh, -c]

ledger:
  files: "tasks/phase-{group}.yaml" # one file per phase
  group: { label: phase, pattern: "\\d+", numeric: true }
  id: "T-\\d+"
  check:
    timeout: 600 # seconds

commits:
  types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
  header_lint: # delegated to commitlint, config-conventional; itos runs the footers beside it
    hook: "vp exec commitlint --edit {file}"
    stdin: "vp exec commitlint"
  footers: # tools/itos/footers.ts reads them, for the footer rules and CI
    Task:
      source: ledger
      # A revert names the task it undoes, so a failed piece of work leaves a trail.
      required_for: [refactor, perf, test, build, ci, chore, revert]
      validate_for: all
      read_at: commit # a commit is judged against the ledger it carried
    Scenarios:
      source: { tests: scenario }
      strip_prefix: "@"
      required_for: [feat, fix]
      validate_for: [feat, fix]
      must_be_live: true # a feat or fix names scenarios it turns green, not @wip ones
      read_at: commit
  path_sets:
    config: # what build and ci commits may touch
      - "*.{json,yaml,yml,ts,toml}"
      - go.mod
      - go.sum
      - .gitignore
      - .editorconfig
      - ".vite-hooks/**"
      - ".github/**"
      - "tools/bin/**"
      - "tools/selftest/**"
      - tools/changelog.ts
      - .claude/settings.json
    # itos itself: the TypeScript v0 and the Go port's packages beside it, the
    # one place a feat or a fix must change unless it changes the features.
    implementation:
      - "tools/itos/*.ts"
      - "{cmd,internal}/**/*.go"
  scopes: # the paths each commit type may touch (tasks/README.md's table)
    feat: { must_touch: [$implementation, "features/**"] }
    fix: { must_touch: [$implementation, "features/**"] }
    refactor: { never: ["features/**/*.feature"] }
    perf: { never: ["features/**/*.feature"] }
    test:
      only:
        - "features/**"
        - "**/*.test.ts"
        - "{cmd,internal}/**/*_test.go" # the Go packages' unit tests
        - "tools/itos/conformance/**"
        - "tools/itos/fixtures/**"
        - "tools/selftest/**"
    build: { only: [$config] }
    ci: { only: [$config] }
    chore: { never: [$implementation] }
    docs: { only: ["**/*.md", "docs/**", "tasks/**", "features/**/*.feature"] }
    style: {}
  reject_message: "Commit rejected (see tasks/README.md):"
  # Where verification starts: verify and the range checks leave this commit
  # and its ancestors out. GitHub made this repository from the project
  # template as one squashed commit, which no rule passes.
  since: "1545231b3fec872b460521fce024f5c3ef79594c"

tests: # named tests, each kind behind an adapter (tools/itos/tests.ts)
  scenario:
    adapter: gherkin # built in: tools/itos/gherkin.ts
    root: features
    id: "ID-[A-Z]+-\\d+"
    tag_prefix: "@"
    wip_tag: "@wip"
    # The one command every selection of a push merges into: godog, through go
    # test. -scenarios= is a regular expression over the scenarios' tags, which
    # the harness turns into godog's tag filter (features/README.md): godog's
    # own filter takes only exact tags joined by commas.
    run:
      whole: "go test ./features -count=1"
      select: "go test ./features -count=1 -scenarios={pattern}"
      ids_pattern: "^@(?:{ids})$"
      join: { each: "(?:{p})", sep: "|" }
    recognize: # a task check read back as a selection, so CI runs it in the one run
      - { command: "go test ./features -count=1", as: whole }
      - { command: "go test ./features -count=1 -scenarios={pattern}", as: pattern }
      - { command: "tools/bin/itos tests smoke run scenario", as: smoke }
    smoke:
      { file: features/smoke.yaml, every_file: true, add_hint: "add one to features/smoke.yaml" }
    range_checks:
      # Outside feat and fix, live scenarios only move, unchanged: itos's own rule,
      # judged by the commit-msg hook and verify. A rename allowed outside feat and
      # fix goes in allowed_renames, by ID and new name, with why in its task.
      - { name: scenario-moves, builtin: moves, except_types: [feat, fix] }

ci:
  env: { CI: "1" }
  steps: # every step of CI, in order; each states its cost
    - { run: vp check, cost: static }
    - { run: "! gofmt -l features cmd internal | grep .", cost: static } # names each file gofmt would change
    - { run: go vet ./..., cost: static }
    - { run: tools/bin/itos tests smoke check scenario, cost: static }
    - { run: tools/bin/itos config check, cost: static } # the config, the ledger, the registry, the smoke set
    - { run: vp run test:coverage, cost: late }
    - { run: "go test ./cmd/... ./internal/...", cost: late } # the Go port's unit tests
    - { run: vp run audit, cost: late }
    # The conformance corpus: what itos did when it was written, as cases run
    # through its command line; a regression corpus, not named tests.
    - { run: node tools/itos/conformance/run.ts --bin tools/bin/itos, cost: late }
    # The Go build against the ported set (its corpus files and scenarios), so a
    # change to a ported group lands in both implementations in one push.
    - { run: node tools/selftest/go-port.ts, cost: late }
    - { run: tools/bin/itos task T-007, cost: late } # the commit rules, proven on every push
    - { tests: scenario } # the one merged run; late, as no pattern matches it
  prose: # a range that touches only these runs only the prose steps
    paths: ["**/*.md", "docs/**"]
    steps: [vp check, tools/bin/itos config check] # CONTRIBUTORS.md, the people, is Markdown
  cost:
    # Checks with no `cost:` of their own: static if a pattern matches, else
    # late. Only commands static by what they are: `sh -c` wraps anything, so a
    # static sh -c check says `cost: static` in the ledger. A command whose
    # first word is hooks.bin (tools/bin/itos) is read as starting with itos.
    static:
      - "^vp check$"
      - "^itos (tests smoke check|commit|verify|ci (plan|scope|range)|work|config check)\\b"
      - "^actionlint\\b"
      - "^git ls-remote "
      - "\\| vp exec commitlint$"
      - "^node tools/selftest/(ci-scope|ci-range)\\.ts$"
      - "^go (vet|mod verify)\\b"
    keep_written_order: true # a task's checks never run before the ones above them
  covers: # a check a step has just done is not run again
    - { by: "vp run test:coverage", matches: "^vp test run(?: [^\\s-]\\S*)*$" }
    # The corpus files of the ported set, each run against a fresh Go build:
    # the command line (T-039), the help texts (T-041).
    - by: node tools/selftest/go-port.ts
      matches: "^sh -c 'node tools/bin/build-go\\.ts dist/go && node tools/itos/conformance/run\\.ts --bin dist/go/itos --only tools/itos/conformance/cli\\.yaml'$"
    - by: node tools/selftest/go-port.ts
      matches: "^sh -c 'node tools/bin/build-go\\.ts dist/go && node tools/itos/conformance/run\\.ts --bin dist/go/itos --only tools/itos/conformance/help\\.yaml'$"
  # Slow, and it proves the gates rather than the code: left to the nightly.
  nightly_only: ["node tools/selftest/gates.ts"]
  # Every feature, the gates self-test, then the static checks of every task
  # whose work item is done (T-035), each shared check once: a task's checks
  # otherwise run only when a push names it. Last, so a red one does not keep
  # the features from reporting; its late checks stay with the pushes.
  nightly:
    steps:
      - { tests: scenario, whole: true }
      - node tools/selftest/gates.ts
      - { tasks: done, cost: static }
  wait_on_status: [todo] # a named task nobody has started waits
  stop_at_first_failure: true
  range:
    provider: github # or command (with command:, its stdout) or none
    github:
      {
        workflow: ci.yml,
        branch: main,
        repository_env: GITHUB_REPOSITORY,
        token_env: [GITHUB_TOKEN, GH_TOKEN],
      }

work: # tools/itos/work.ts; the registry is at its default, tasks/work-items.yaml
  groups_key: phases
  statuses: [todo, doing, done, blocked]
  # or all-contributorsrc (contributors[].login) or yaml (a list of logins)
  people:
    { source: all-contributors-md, file: CONTRIBUTORS.md, login_from: "https://github.com/{login}" }
  # gh api user; or command (with command:, its stdout) or none (only --as)
  identity: { provider: github, hint: "pass --as <handle>" }

hooks:
  manager: vp # shims in .vite-hooks/, written by `itos hooks install`
  bin: tools/bin/itos # what the shims call
  pre_push: { per_base: "vp test run --changed {base}", whole: "vp test run" }
