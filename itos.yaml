# itos.yaml — the task tooling's policy (tasks/README.md explains it)
#
# One file for every table the task tool reads: the ledger's layout, the
# commit rules, the named tests, the CI plan, the work routing and the hooks.
# internal/config loads it and rejects a key it does not know;
# `ITOS_CONFIG` names another file. `$name` in a path list stands for
# `commits.path_sets.<name>`. The range, the identity and the people are
# providers (internal/providers).
version: 1
requires: ">=0.6.0" # the oldest itos that reads this file: builtin: moves is 0.6.0's
shell: [sh, -c]

ledger:
  files: "tasks/phase-{group}.yaml" # one file per phase
  group: { label: phase, pattern: "\\d+", numeric: true }
  id: "T-\\d+"
  check:
    timeout: 600 # seconds

commits:
  types: [feat, fix, refactor, perf, test, build, ci, chore, docs, revert]
  # itos's own lint of config-conventional's rules, held to commitlint's verdicts over this history
  # when it replaced commitlint (T-063), and since to @ID-CMSG's scenarios and the corpus's
  # messages.yaml; the footer rules run beside it.
  header_lint: { use: builtin }
  footers: # internal/message reads them, for the footer rules and CI
    Task:
      source: ledger
      # A revert names the task it undoes, so a failed piece of work leaves a trail.
      required_for: [refactor, perf, test, build, ci, chore, revert]
      validate_for: all
      read_at: commit # a commit is judged against the ledger it carried
    Scenarios:
      source: { tests: scenario }
      strip_prefix: "@"
      required_for: [feat, fix]
      validate_for: [feat, fix]
      must_be_live: true # a feat or fix names scenarios it turns green, not @wip ones
      read_at: commit
    # The work registry item a commit belongs to, for the commits no other footer ties to it: a
    # spec in a docs commit, a slice's steps committed red first in a test commit, a chore it
    # needs (slice 63, T-083). Taken in place of Task for those types, since a slice has no task;
    # every other type still needs its Task. itos commit --item <id> writes it.
    Item:
      source: registry
      validate_for: all
      read_at: commit # a commit is judged against the registry it carried
      in_place_of: { Task: [test, docs, chore] }
    # What a consumer of itos must change for the commit, or none: feat and fix are
    # what a consumer can feel. itos commit footers gathers them into a release's
    # Upgrading section, and release-notes' self-test holds the asset to them. since: the commit
    # before the rule, so verify judges no commit written before it by it.
    Upgrading:
      source: text
      required_for: [feat, fix]
      since: "2e522f25cd21dd28eab41e320854ff8beb9856ae"
    # An old scenario or corpus case a fix or a breaking change changes on purpose, which the last
    # release's suite then fails (T-071, tools/bin/previous-release): one entry a line, scenarios by
    # their IDs (Changes: @ID-CMSG-03) or a case by its file and name (Changes: hooks.yaml: <case
    # name>). A case's name may be cut short to fit the 100-character line (T-081): the entry names
    # the case whose name is the entry's, or else the one case of the file whose name starts with
    # it; a prefix two cases start with names neither, and is warned of. Only a fix's or a breaking
    # commit's excuses a failure, and only the failures it names (T-106). Free text, so itos commit
    # --changes writes it, a scenario the fix removed is not refused as unknown, and a case can be
    # named; the check reads each against the last release instead.
    Changes:
      source: text
      validate_for: all
  path_sets:
    config: # what build and ci commits may touch
      - "*.{json,yaml,yml,ts,toml}"
      - go.mod
      - go.sum
      - .gitignore
      - .editorconfig
      - ".github/**"
      - "tools/bin/**"
      - "tools/selftest/**"
      - .claude/settings.json
    # itos itself, its Go packages since the TypeScript v0 left (T-062): the
    # one place a feat or a fix must change unless it changes the features.
    implementation:
      - "{cmd,internal}/**/*.go"
    # The gates themselves: the config, the workflows, the hooks (tools/bin/pre-commit beside
    # itos's), their Go code and self-tests, the dependency check's exceptions and the formatter's
    # config. Only build and ci, which need a Task, may touch them (T-098); every other type that
    # could has them in never.
    gates:
      - itos.yaml
      - ".github/**"
      - "tools/bin/**"
      - "tools/selftest/**"
      - deps-check.json
      - dprint.json
  scopes: # the paths each commit type may touch (tasks/README.md's table)
    feat: { must_touch: [$implementation, "features/**"] }
    fix: { must_touch: [$implementation, "features/**"] }
    refactor: { never: ["features/**/*.feature", $gates] }
    perf: { never: ["features/**/*.feature", $gates] }
    test:
      # The gates' self-tests, tools/selftest/**, left this list for build and ci (T-098).
      never: [$gates]
      only:
        - "features/**"
        # The TypeScript's unit tests, gone with it (T-062), stay for verify,
        # which judges every commit after commits.since by these rules.
        - "**/*.test.ts"
        - "{cmd,internal}/**/*_test.go" # itos's unit tests, the Go packages'
        - "{cmd,internal}/**/testdata/fuzz/**" # a fuzz target's seeds, go test's inputs for it (T-328)
        - "tools/itos/conformance/**"
        - "tools/itos/fixtures/**"
    # The devcontainer (T-108): its Dockerfile, firewall script, post-install script and the
    # LICENSE of the base it came from, which $config's extensions leave out. Not ci's.
    build: { only: [$config, ".devcontainer/**"] }
    ci: { only: [$config] }
    chore: { never: [$implementation, $gates] }
    docs: { only: ["**/*.md", "docs/**", "tasks/**", "features/**/*.feature"] }
  reject_message: "Commit rejected (see tasks/README.md):"
  # Where verification starts: verify and the range checks leave this commit
  # and its ancestors out. It was the template's squashed initial commit, which
  # no rule passes; T-136, then T-188, moved it to the last green run's commit,
  # every commit up to which passed verify when pushed, once older commits
  # failed later rules.
  since: "ee1152572b59c164bd15b3342a0f219d9c09595f"

tests: # named tests, each kind behind an adapter (internal/tests)
  scenario:
    adapter: gherkin # built in: internal/tests/gherkin.go
    root: features
    id: "ID-[A-Z]+-\\d+"
    tag_prefix: "@"
    wip_tag: "@wip"
    # The one command every selection of a push merges into: godog, through go
    # test. -scenarios= is a regular expression over the scenarios' tags, which
    # the harness turns into godog's tag filter (features/README.md): godog's
    # own filter takes only exact tags joined by commas.
    run:
      whole: "go test ./features -count=1"
      select: "go test ./features -count=1 -scenarios={pattern}"
      ids_pattern: "^@(?:{ids})$"
      join: { each: "(?:{p})", sep: "|" }
    recognize: # a task check read back as a selection, so CI runs it in the one run
      - { command: "go test ./features -count=1", as: whole }
      - { command: "go test ./features -count=1 -scenarios={pattern}", as: pattern }
      - { command: "tools/bin/itos tests smoke run scenario", as: smoke }
    smoke:
      { file: features/smoke.yaml, every_file: true, add_hint: "add one to features/smoke.yaml" }
    range_checks:
      # Outside feat and fix, live scenarios only move, unchanged: itos's own rule,
      # judged by the commit-msg hook and verify. A rename allowed outside feat and
      # fix goes in allowed_renames, by ID and new name, with why in its task.
      - { name: scenario-moves, builtin: moves, except_types: [feat, fix] }

ci:
  env: { CI: "1" }
  steps: # every step of CI, in order; each states its cost
    # The Markdown and YAML as dprint formats them (dprint.json, T-142), which the pre-commit hook
    # does to what it stages; a file it would change fails, named. ci.yml fetches dprint and its
    # plugins before the plan, so the step asks no network.
    - { run: tools/bin/pinned dprint check, cost: static }
    # gofmt names each file it would change.
    - { run: "! gofmt -l features cmd internal | grep .", cost: static }
    # internal/cli/commands_gen.go is what tools/bin/assemble writes from the commands'
    # declarations (T-240): -check writes nothing and fails, naming the file, when the committed
    # one differs.
    - { run: go run ./tools/bin/assemble -check, cost: static }
    - { run: go vet ./..., cost: static }
    # The pinned golangci-lint over the whole module (.golangci.yml, T-194): ADR-0053's depguard
    # arrows, no mocking library, and the linters of itos-cc's the tree passes. Linux only, as the
    # ci job is; tools/bin/pinned fetches it and checks its SHA-256.
    - { run: tools/bin/pinned golangci-lint run ./..., cost: static }
    # What depguard cannot hold (a slice importing another, the domain and adapters within a
    # slice, who imports a slice, the binary linking a fake), then the fixtures under
    # tools/testdata/architecture proving every rule accepts and refuses with that linter (T-194).
    - { run: tools/bin/architecture-check, cost: static }
    # staticcheck (T-148), its default checks over the whole module: U1000 (unused code), the SA
    # checks (likely bugs), the S simplifications and the ST style rules. A finding is fixed, or
    # excused with a //lint:ignore <check> <reason> beside it when it is a false positive. Its
    # version is go.mod's tool directive, held to the dependency check's 7-day rule like every
    # module; run it with `go tool staticcheck ./...`. Linux only, as the ci job is.
    - { run: go tool staticcheck ./..., cost: static }
    # The three workflows (T-008's check, kept as a step in T-125): their expressions, the inputs
    # of the actions they use and the shell of each run: (shellcheck). Nothing else lints them:
    # the gates self-test runs none of them, and a broken release.yml shows only when a release is
    # cut and nightly.yml only at night. ci.yml installs it for this step.
    - { run: actionlint, cost: static }
    - { run: tools/bin/itos tests smoke check scenario, cost: static }
    # The config, the ledger, the registry, the smoke set.
    - { run: tools/bin/itos config check, cost: static }
    # This repository's own ci.prose.paths (T-008's check, kept as a step in T-125): none of them,
    # which reach the ledger, the registry, a feature, the config or code, takes the prose shortcut
    # down. The corpus proves the shortcut over its own configurations, never over these paths.
    # Each gate's self-test is a Go test, TestSelftest, with one subtest per case (T-143), which
    # runs only with ITOS_SELFTEST set: go test ./tools/... below skips it, and its step runs it.
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/ci-scope",
        cost: static,
      }
    # The plugin's version rule (T-074): a range whose tree changes integrations/claude-code/ must
    # leave its plugin.json's version higher, by semver, than at the range's start, as Claude Code
    # offers an installed plugin an update only when that version changes. It reads git alone, so
    # static; no range start (FROM empty), a start the clone lacks or a shallow clone stops it
    # (exit 2). In the prose steps too, as the plugin's skill is Markdown. FROM as below.
    - { run: 'go run ./tools/bin/plugin-version -range-from "${FROM-}"', cost: static }
    # The docs' byte budget (T-110): the files every session or most briefs read held to the caps in
    # tools/bin/doc-budget/caps.json, a file over its cap failing, named with its size and cap. It
    # reads the files alone, so static; in the prose steps too, as docs-only pushes are where the
    # docs grow.
    - { run: go run ./tools/bin/doc-budget, cost: static }
    # The plugin's calls (T-111, decision 41): the itos commands the Claude Code plugin's scripts
    # call, read from the scripts, each run against tools/bin/itos; one that exits 2 (unknown), or
    # a --json call whose answer lacks the list the plugin reads, fails, named with its script. It
    # runs the local binary alone, so static.
    - { run: go run ./tools/bin/plugin-calls, cost: static }
    # The dependency check (T-067), when the range changes go.mod or go.sum: no module younger
    # than 7 days unless deps-check.json excepts it, then govulncheck. It asks the network, so
    # late; first of the late steps, before the unit tests run a new module's code. FROM is the
    # range's start, which the workflow's Range step puts in the job's environment, as a step
    # cannot be given the range; empty (no green run to start from) checks.
    - { run: 'go run ./tools/bin/deps-check -changed-since "${FROM-}"', cost: late }
    # The schema contract (T-070), when the range has a feat or a fix, the commits T-069 releases:
    # this tree's config schema held to the one the last release published, a breaking change failing
    # unless a commit since that release's tag marks it. It downloads that schema, so late; a failed
    # download stops it (exit 2), and no release tag passes it, saying so. FROM as above.
    - { run: 'go run ./tools/bin/schema-contract -range-from "${FROM-}"', cost: late }
    - { run: "go test ./cmd/... ./internal/...", cost: late } # itos's unit tests, the Go packages'
    # The unit tests of the gate programs under tools/bin (T-091's check, kept as a step in T-125):
    # the step above and tools/bin/go-unit-tests take ./cmd/... ./internal/... alone, so these ran
    # only when a push named a task that listed them. It settles idea p1-tools-bin-unit-tests-in-ci.
    - { run: "go test ./tools/...", cost: late }
    # The conformance corpus: what itos did when it was written, as cases run
    # through its command line; a regression corpus, not named tests. Against
    # tools/bin/itos, the Go binary built from this tree. The runner is Go (T-144).
    - { run: go run ./tools/bin/conformance --bin tools/bin/itos, cost: late }
    # The last release's scenarios and corpus against this tree's itos (T-071), when the range has
    # a feat or a fix: the release's tag checked out into a scratch worktree, its go test ./features
    # run there with ITOS_BIN naming tools/bin/itos, and its corpus with this tree's runner. An old
    # scenario or case that fails is accepted only when a fix or a breaking commit since the tag
    # names it in Changes: (T-106). A shallow clone or a tag it cannot check out stops it (exit 2),
    # and no release tag passes it, saying so. After this tree's own corpus, which fails for a cause
    # nearer home. FROM as above.
    - { run: 'go run ./tools/bin/previous-release -range-from "${FROM-}"', cost: late }
    # The coordinator's inbox trust rule, offline (T-057's check, kept as a step in T-125): an issue
    # is actionable only from an allow-listed login, or with an itos-accepted label applied by one.
    # A Go test since T-146, a subtest a case, which runs only with ITOS_SELFTEST set: nothing else
    # runs it.
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/bin/inbox",
        cost: late,
      }
    # Three gates' own self-tests (T-067's, T-070's and T-074's checks, kept as steps in T-125),
    # each one the gate's refusals: a young module refused or excepted and a govulncheck finding
    # failing, a breaking schema change refused unless marked, a plugin version unraised or lowered
    # refused and a shallow clone stopping it. The steps above judge real modules, a real range and
    # a real change to the plugin, which never exercise a refusal.
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/bin/deps-check",
        cost: late,
      }
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/bin/schema-contract",
        cost: late,
      }
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/bin/plugin-version",
        cost: late,
      }
    # The push and nightly mutation commands (proof.code.check below, the nightly's mutation run),
    # dispatched through ci run with a fake shell: their counts and paths, and that a failing
    # provider blocks (T-131); and the nightly's changed-sites base read through a fake gh (T-161).
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/ci-mutation-budget",
        cost: late,
      }
    # Workflow coverage, launcher guards and the nightly's latest-CI query, offline (T-170).
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/ci-platform",
        cost: late,
      }
    # The repository's narrow registry route and conservative fallbacks (T-171).
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/ci-registry",
        cost: late,
      }
    # The nightly's property-test step, which draws and prints a seed and raises the checks, and
    # that no push's plan does (T-310).
    - {
        run: "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/nightly-properties",
        cost: late,
      }
    # The one merged run; late, as no pattern matches it. Against the Go
    # binary, tools/bin/itos, the features' default ITOS_BIN. ci.yml's platform
    # jobs run it alone, on each platform, with ci run --tests (T-163).
    - { tests: scenario }
  prose: # a range that touches only these runs only the prose steps
    paths: ["**/*.md", "docs/**"]
    steps: # CONTRIBUTORS.md, the people, is Markdown
      - tools/bin/pinned dprint check
      - tools/bin/itos config check
      - 'go run ./tools/bin/plugin-version -range-from "${FROM-}"' # the plugin's skill is Markdown
      - go run ./tools/bin/doc-budget # the docs' byte budget: docs-only pushes are where they grow
  cost:
    # Checks with no `cost:` of their own: static if a pattern matches, else
    # late. Only commands static by what they are: `sh -c` wraps anything, so a
    # static sh -c check says `cost: static` in the ledger. A command whose
    # first word is hooks.bin (tools/bin/itos) is read as starting with itos.
    static:
      - "^tools/bin/pinned dprint check$"
      - "^itos (tests smoke check|commit|verify|ci (plan|scope|range)|work|config check)\\b"
      - "^actionlint\\b"
      - "^git ls-remote "
      - "^ITOS_SELFTEST=1 go test -count=1 -run '\\^TestSelftest\\$' \\./tools/selftest/ci-scope$"
      - "^go (vet|mod verify|tool staticcheck)\\b"
    keep_written_order: true # a task's checks never run before the ones above them
  covers: # a check a step has just done is not run again
    # The corpus step runs every corpus file against the Go binary built from
    # this tree, so a check running some of them by --only, against it or
    # against the port's own build of the same tree (T-039 to T-052), is what
    # it has just done.
    - by: go run ./tools/bin/conformance --bin tools/bin/itos
      matches: "^go run \\./tools/bin/conformance --bin tools/bin/itos --only tools/itos/conformance/[a-z-]+\\.yaml(?: tools/itos/conformance/[a-z-]+\\.yaml)*$"
    - by: go run ./tools/bin/conformance --bin tools/bin/itos
      matches: "^sh -c 'go run \\./tools/bin/build-go dist/go && go run \\./tools/bin/conformance --bin dist/go/itos --only tools/itos/conformance/[a-z-]+\\.yaml(?: tools/itos/conformance/[a-z-]+\\.yaml)*'$"
  # There is no ci.nightly_only: T-125 removed it with the ledger's checks, whose three commands
  # (the gates self-test, the newest release's attestation, the newest CI run's platform jobs) are
  # steps here, and nothing a push names is left out of a push.
  # The gates self-test, the hooks' choice of Go unit tests (T-059: since the
  # TypeScript left, the one proof that the hooks run only the unit tests a
  # change reaches), the Go release build (T-040) and the config's JSON Schema
  # held to config check over the corpus (T-054), the previous-release check
  # held to which commits excuse an old failure (T-106, T-117: no push ran its
  # self-test, and it went red unseen). Then what T-125's answered list keeps
  # from the done tasks' checks, each a step with a comment saying what it
  # guards that no scenario, unit test or other self-test does. The release
  # build is every night's, not every push's: it builds five platforms, and
  # nothing publishes it until the Go release. Every feature is not a step:
  # nightly.yml's platform jobs run them on Linux, macOS and Windows beside
  # this plan (T-163), and the plan runs them on Linux only with something
  # hostile first on the PATH, below.
  nightly:
    steps:
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/gates"
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/go-hooks"
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/go-release"
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/bin/config-schema"
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/bin/previous-release"
      # The stateful property tests (T-310, ADR-0051), explored: every TestProperty with a seed drawn
      # for the night and printed, and a thousand checks. A push runs the same tests with the seed
      # internal/proptest pins; a failure here becomes a fail file committed as a regression.
      - tools/bin/nightly-properties
      # What a push's features step selects, read back from go test -json (T-005's and T-016's
      # checks, kept as a step in T-125): this repository's scenario kind and the harness's
      # -scenarios selection. The corpus proves the plan's command, never what go test then runs.
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/features-scope"
      # tools/bin/itos, which every hook and every CI step calls (T-060's check, kept as a step in
      # T-125): it runs with no node, rebuilds when a Go source is added or removed or HEAD's
      # version changes, and a Go tree that does not build exits 3 without ever running the old
      # binary. Every job uses the script and nothing else tests its staleness rule.
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/go-dogfood"
      # upgrading.json, the asset `itos upgrade` reads, end to end over this history and
      # `itos commit footers` (T-091's check, kept as a step in T-125): release-notes' TestAsset
      # proves its shape on fixtures, never against the footers command. Asks the network.
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/bin/release-notes"
      # The push and nightly mutation commands through ci run with a fake shell (T-131).
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/ci-mutation-budget"
      # The programs in tools/bin are shell scripts, which windows cannot start at all: every
      # program under tools/ starts one of them through one resolver, and this runs two of them
      # here to keep that true (T-135). Cheap and offline, so it can also run by hand on windows,
      # where it is the check that says a spawn lost its exit code.
      - "ITOS_SELFTEST=1 go test -count=1 -run '^TestSelftest$' ./tools/selftest/tools-bin-programs"
      # The features never run the itos on the PATH (T-087's check, kept as a step in T-125): a
      # fake one exiting 97 there passes only while they hide it. CI's runners have no itos, a
      # person's machine has one, and nothing else plants one.
      - run: >-
          sh -c 'd=$(mktemp -d) && printf "#!/bin/sh\nexit 97\n" > "$d/itos" && chmod +x "$d/itos" && PATH="$d:$PATH" go test ./features -count=1'
      # The features and the hook declaration still work when `git` is an itos (T-104's check, kept
      # as a step in T-125): the git shim, as the devcontainer installs it. No runner has it.
      - run: >-
          sh -c 'tools/bin/itos --version >/dev/null && d=$(mktemp -d) &&
          ln -s "$PWD/.tools/bin/itos" "$d/git" && PATH="$d:$PATH" go test ./features -count=1 &&
          PATH="$d:$PATH" go test ./internal/cli -count=1 -run TestDeclareHooksOldGit'
      # The tools/bin programs' tests use the real git when `git` is an itos (T-122's check, kept
      # as a step in T-125): internal/git's Real, which the corpus runner calls too. As above, no
      # runner has the shim.
      - run: >-
          sh -c 'd=$(mktemp -d) && ln -s "$PWD/.tools/bin/itos" "$d/git" && PATH="$d:$PATH" go test ./tools/bin/... -count=1'
      # The unit tests under the git environment a hook hands its children (T-326, ADR-0051's
      # tiers): GIT_DIR, GIT_WORK_TREE and GIT_INDEX_FILE at a scratch repository, and a
      # core.hooksPath of failing hooks. A test that inherits them and writes through them, or makes
      # a repository whose git commands meet the failing hooks, is red; the hooks themselves drop the
      # variables, so a push never sees one. Beside the other hostile-environment runs above; the
      # packages are CI's unit step and the gate programs'.
      - "go run ./tools/bin/go-unit-tests -hook-env ./cmd/... ./internal/... ./tools/..."
      # internal/cli's help tests do not depend on what itos-* extensions the PATH holds (T-077's
      # check, kept as a step in T-125), and neither does the corpus's help listings above all
      # (T-080's): each with an extension of its own planted on the PATH, as a maintainer's machine
      # has one and nothing else plants it.
      - run: >-
          sh -c 'd=$(mktemp -d) && printf "#!/bin/sh\n" > "$d/itos-zz-path-check" && chmod +x "$d/itos-zz-path-check" && PATH="$d:$PATH" go test ./internal/cli -count=1'
      - run: >-
          sh -c 'd=$(mktemp -d) && printf "#!/bin/sh\n" > "$d/itos-zz-path-check" && chmod +x "$d/itos-zz-path-check" && PATH="$d:$PATH" go run ./tools/bin/conformance --bin tools/bin/itos'
      # The features build the itos under test with -cover and split its counters per scenario
      # (T-121's check, kept as a step in T-125): ID-PIN-01 covers launch.fetch, ID-ASK-01 does
      # not. T-120 adopts that integration coverage through itos-cc; this remains a targeted
      # regression check for the harness contract.
      - run: >-
          d=$(mktemp -d) && ITOS_CC_TEST_COVERDIR=$d go test ./features -count=1 -scenarios='^@ID-(PIN-01|ASK-01)$'
          && test -z "$(find "$d" -maxdepth 1 -type f)"
          && go tool covdata func -i="$d/ID-PIN-01" | awk '$1 ~ /launch\/launch\.go/ && $2 == "fetch" && $3 != "0.0%" {f=1} END {exit !f}'
          && go tool covdata func -i="$d/ID-ASK-01" | awk '$1 ~ /launch\/launch\.go/ && $2 == "fetch" && $3 == "0.0%" {f=1} END {exit !f}'
      # The launcher, the shim and an extension's call write their counters before syscall.Exec
      # (T-124's check, kept as a step in T-125). This remains a targeted regression check for the
      # paths that otherwise lose counters when replacing the process.
      - run: >-
          d=$(mktemp -d) && ITOS_CC_TEST_COVERDIR=$d go test ./features -count=1 -scenarios='^@ID-(PIN-01|SHIM-05|EXT-01)$'
          && go tool covdata func -i="$d/ID-PIN-01" | awk '$1 ~ /launch\/run_unix\.go/ && $2 == "run" && $3 != "0.0%" {f=1} END {exit !f}'
          && go tool covdata func -i="$d/ID-SHIM-05" | awk '$1 ~ /shim\/run_unix\.go/ && $2 == "run" && $3 != "0.0%" {f=1} END {exit !f}'
          && go tool covdata func -i="$d/ID-EXT-01" | awk '$1 ~ /cli\/extension_unix\.go/ && $2 == "runProgram" && $3 != "0.0%" {f=1} END {exit !f}'
      # The marketplace's and the plugin's manifests and hooks against the latest Claude Code's
      # rules (T-066's and T-073's and T-097's checks, kept as steps in T-125), unpinned on purpose,
      # since a person runs the latest and it releases several times a day. plugin-calls checks the
      # commands the scripts call, not the manifest. nightly.yml installs Claude Code for these two.
      - "claude plugin validate --strict . && claude plugin validate --strict integrations/claude-code"
      # The plugin's own tests (T-066's, T-073's and T-097's checks, kept as a step in T-125):
      # hooks/register.test.ts and hooks/titles.test.ts. Nothing else runs them.
      - claude plugin test integrations/claude-code
      # The newest release is available and intact, with no artifact downloaded (T-127): GitHub
      # publishes a sha256 digest on every release asset, so one API call for the release's assets
      # and checksums.txt (564 bytes) prove every asset the manifest names is there, not empty and
      # on its digest, where before this step fetched the 4.5 MB linux-amd64 archive every night to
      # verify one attestation. That attestation is verified where the bytes are, in the release
      # job that uploads them (.github/workflows/release.yml), since gh attestation verify takes the
      # file and never a digest. Late, as it asks GitHub.
      - go run ./tools/bin/verify-release -repo donvargax/itos -manifest checksums.txt
      # The newest completed CI run on main passed on Linux, macOS and Windows (T-072): a push's own
      # run is still going when its plan runs, so the nightly reads the one before it. A metadata
      # run proves its reduced scope explicitly on all three jobs; otherwise each test owner and
      # launcher must have run successfully. Missing, mixed or failed coverage never passes. The
      # run is picked from ci.yml's newest 100 runs, unfiltered (T-277): asked with --branch and
      # --status, the list came back empty for a nightly of 2026-10-22 while main had a completed
      # run. A run cancelled while it waited (ci.yml's concurrency) ran no job and is passed over,
      # as the run after it checks its commits. None found is said, never asked of gh run view.
      - >-
        id=$(gh run list --workflow ci.yml --limit 100 --json databaseId,headBranch,event,status,conclusion
        --jq '[.[] | select(.headBranch == "main" and .event == "push" and .status == "completed" and .conclusion != "cancelled")][0].databaseId // empty') &&
        { [ -n "$id" ] || { echo "No completed CI run on main among the newest 100 runs of ci.yml, so its platform jobs cannot be judged." >&2; false; }; } &&
        echo "The newest completed CI run on main is $id." &&
        gh run view "$id" --json jobs --jq
        '.jobs as $jobs | ["ci (ubuntu-latest)", "platform (macos-latest)", "platform (windows-latest)"] as $names |
        def passed($name): any(.steps[]?; .name == $name and .conclusion == "success");
        ($names | all(. as $name | [$jobs[] | select(.name == $name)] | length == 1 and all(.conclusion == "success"))) and
        ([$jobs[] | select(.name as $name | $names | index($name))] |
          (all(passed("Validation-only range")) or
           all((passed("Validation-only range") | not) and passed("Install the launcher") and passed("The launcher") and
             (if .name == "ci (ubuntu-latest)" then passed("Plan") else passed("Unit tests") and passed("Named tests") end))))' | grep -qx true
      # The two mutation steps are the plan's last, the twenty first (T-185): they take most of the
      # night's time, so a runner that shuts down during them costs only them, never the steps
      # that would have come after.
      # Twenty mutation sites of the Go code judged freshly (q-41's nightly budget, q-52), drawn
      # across cmd and internal with no cache; a survivor fails the night. Not --fail-uncovered
      # (q-54): with no range, strict coverage judges every function, and that backlog is the
      # debt baseline's (p3-debt-role). The seed is the run's own, GitHub's run id (the time, run
      # by hand), not HEAD's, so two nights on one commit draw differently; the report names it,
      # to reproduce a draw. Linux only, as the job is.
      - {
          run: 'tools/bin/pinned itos-cc mutation run --count 20 --seed "${GITHUB_RUN_ID:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" --json cmd internal',
          cost: late,
        }
      # The mutation sites of the Go functions changed since the last green nightly, strictly
      # covered on the lines changed (ADR-0049, q-57): a push judges one site of its range, so the
      # rest of a slice's survivors are judged here, not one red push at a time. The base is the
      # head commit of nightly.yml's last run on main that concluded success, read with gh and the
      # job's token (tools/bin/nightly-base), or the floor when that is later: T-191's head, which
      # judged the last batch of the slices refactor, so the nights stop drawing from all it moved
      # since the green night of 2026-10-08 (T-280). Capped and seeded per run (the user,
      # 2026-10-12): a range of 60 sites or fewer is judged whole, a bigger one (after a red
      # streak) gets a fresh sample of 60 each night, seeded as the twenty above are, until a
      # green night moves the base, and never runs past the job's time. With no green nightly in
      # reach (none, gh failing, or its commit not in HEAD's history) it says so and judges from
      # the floor, never every function. The twenty above still draw from all of the code, no
      # floor (the user, 2026-10-17). A survivor or an uncovered changed line fails the night.
      # Linux only, as the job is (T-161). A Go file only another OS builds, such as a _windows.go
      # file, is left out by itos-cc itself ("not_built" in its report, itos-cc#18) and fails
      # nothing, so a change to one cannot keep every night red and the base from moving.
      - {
          run: 'base=$(go run ./tools/bin/nightly-base -floor a9de53f62e7b6755a91f47d2780bdc2a827b94e4) && tools/bin/pinned itos-cc mutation run --since "$base" --count 60 --seed "${GITHUB_RUN_ID:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" --fail-uncovered=lines --json cmd internal',
          cost: late,
        }
  wait_on_status: [todo] # a named task nobody has started waits
  stop_at_first_failure: true
  range:
    provider: github # or none; a green run of ci.yml counts on any branch
    github:
      { workflow: ci.yml, repository_env: GITHUB_REPOSITORY, token_env: [GITHUB_TOKEN, GH_TOKEN] }
  # itos push waits for the run of the commit it pushed and exits with its result (slice 51,
  # T-078): an agent starts it in the background and monitors it, a person may pass --no-wait.
  # itos status names the last nightly's run, nightly.yml's newest on main (slice 72).
  watch: { provider: github, github: { nightly_workflow: nightly.yml } }

work: # internal/work; the registry is at its default, tasks/work-items.yaml
  groups_key: phases
  statuses: [todo, doing, done, blocked]
  # The area tags of the backlog reviews of 2026-10-10 (T-150) and 2026-10-23: one per item, what
  # part of itos it touches; v8 and v9 are a second axis, the release an item fits. itos work
  # list --tag <tag> lists an area's or a release's items.
  tags:
    [
      agents,
      architecture,
      ask,
      ci,
      cli,
      commit,
      config,
      docs,
      draft,
      evidence,
      extensions,
      followup,
      gates,
      guard,
      hooks,
      init,
      launcher,
      message,
      plugin,
      proof,
      providers,
      push,
      records,
      release,
      review,
      status,
      stealth,
      tests,
      upgrade,
      verify,
      windows,
      work,
      v8,
      v9,
    ]
  # or all-contributorsrc (contributors[].login) or yaml (a list of logins)
  people:
    { source: all-contributors-md, file: CONTRIBUTORS.md, login_from: "https://github.com/{login}" }
  # gh api user; or none (only --as)
  identity: { provider: github, hint: "pass --as <handle>" }

hooks:
  bin: tools/bin/itos # what itos's hooks call: the Go binary, built from cmd/itos on demand
  # CI's golangci-lint step when the push changes Go (T-220), CI's staticcheck step over the
  # packages it changes (T-269), then the unit tests the push reaches, itos's Go packages'
  # (tools/bin/go-unit-tests, which pre-commit runs too).
  pre_push:
    per_base: "tools/bin/golangci-lint-changed {base} && tools/bin/staticcheck-changed {base} && go run ./tools/bin/go-unit-tests {base}"
    whole: "tools/bin/golangci-lint-changed --all && tools/bin/staticcheck-changed --all && go run ./tools/bin/go-unit-tests --all"

proof:
  code:
    paths: ["{cmd,internal}/**/*.go"]
    # One mutation site of the range's changed Go functions judged freshly, with no cache (q-41's
    # push budget, q-52), and strict coverage of the lines the range adds or changes (q-57,
    # itos-cc's =lines): old uncovered code beside a change is not the range's, and a
    # change that only deletes judges no coverage. A range with no site is not applicable and
    # passes. Linux only, as CI's ci job is. --seed {base} draws the site by the range's start, not
    # HEAD (itos-cc's default seed), so the same site leads while the range stands: a repair push
    # re-judges what failed instead of drawing another, and the local run, seeded by origin/main,
    # draws what CI will. The gates' seeds are fixed, the nightly's fresh (q-54) (T-159).
    check: "tools/bin/pinned itos-cc mutation run --count 1 --since {base} --seed {base} --fail-uncovered=lines --json cmd internal"

# Work reaches main through pull requests merged by rebase once their checks
# pass; registry and ledger bookkeeping, and docs commits off features/, go
# straight to main (slices 174-177, 186, T-303, T-311). A pull request stays a
# draft, unjudged, until itos push --ready, which waits for Codex's review
# before auto-merge (slice-179, slice-187).
push:
  mode: pr
  pr:
    draft: true
    review_by: [chatgpt-codex-connector]
    direct:
      types: [docs]
      except: ["features/**"]
