  - id: p2-distributed-builds-poc
    title: "Distributed builds and tests with proofs kept: a Go-only proof of concept here, later its own Bazel-based tool"
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user, 2026-10-24: distributed builds and distributed tests for every kind of test, keeping
      the proofs, for all of the user's repositories (Go, TypeScript, Flutter, likely Rust and
      Python), so the eventual tool is its own project built on Bazel (remote cache and Remote
      Execution API: BuildBuddy, NativeLink, Buildbarn). itos (or itos-cc) hosts the Go-only proof
      of concept first. Shape agreed: itos decides what must run (ci plan, tests list) and keeps the
      proof; the distribution layer runs it. PoC steps, cheapest first: (1) a spike allowed in v8:
      measure where CI's time goes (build, unit tests, features, platform jobs, code proof) from
      recent run timings; (2) a shared Go build and test cache through GOCACHEPROG on a store
      reachable over the tailnet; (3) shard named tests by ID across runners (features first),
      results merged; (4) evidence records (docs/plans/evidence-records.md) shared as a
      content-addressed result cache, written only by trusted runs. Runners: all workflows on
      self-hosted runners planned; GitHub-hosted runners can join the tailnet with
      tailscale/github-action (ephemeral tagged keys, ACLs to the cache port). Hard rules: the
      repository is public, so self-hosted runners are ephemeral and isolated per job, with approval
      for outside contributors' pull requests; only main and the user's own branches write to the
      cache, pull requests read only, else a cache hit proves nothing. Why not Bazel for the PoC:
      the features are not hermetic by design (real git repos, PATH games, the shim), Windows and
      macOS remote execution is weak, and per-test coverage and mutation runs map poorly; the PoC
      learns the proof model, Bazel carries it across languages later.
    tags: [ci, proof, architecture, v9]

  - id: p1-github-registry-spike
    title: "Spike: mirror queued items as GitHub issues and run a few through pr mode, to inform the v9 registry"
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-175, slice-176]
    kind: idea
    why: >
      The user, 2026-10-24: after the switch to push.mode pr, test the GitHub registry (v9,
      p1-github-registry-pilot) by faking it, no itos code. A throwaway script outside itos's source
      mirrors the open, queued items (a couple of dozen) as issues in donvargax/itos itself,
      labelled itos-item plus type and area labels, and maps the moves: take = assign + doing label,
      done/drop = close completed/not planned, add = create, queue = a ranking label or field. The
      YAML registry stays the source of truth; the script runs beside it. A few real items go end to
      end through pr mode with Closes #n in the pull request. tools/bin/inbox skips itos-item. In
      the real repository on purpose, not a scratch one: v9 puts consumer reports and items in one
      tracker, so triage, the trust rule (only allow-listed authors' issues are items), label
      collisions and rate limits shared with the CI watch are what the spike must show. It answers:
      do registry conflicts and registry commits to main disappear; does a rebase-merge with Closes
      #n close the item; gh latency and rate limits at an agent's pace; how work done finds an
      item's commits when the item is an issue number. Findings go onto p1-github-registry-pilot as
      the v9 design's inputs. Cleanup: close every itos-item issue as not planned, delete the label.
    tags: [work, providers]

