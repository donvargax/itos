  - id: slice-140
    title: Validate decidable minting inputs before reserving IDs
    phase: 1
    owner: null
    status: todo
    depends_on: [p1-typed-items]
    kind: slice
    why: >
      Was p1-draft-checks-before-minting.
      Issue #46 (itos-template, 2026-10-11): draft add mints at once (ID-DRAFT-17, kept: the
      coordinator needs the id for the spec and brief), so a command that promote then refuses (an
      undeclared tag) burns the id, and changing a drafted command means drop and redraft, which
      burns another. Run every check work add, task add or work promote will run before minting,
      refuse with nothing minted, and let a command draft be replaced keeping its id (draft add <id>
      --replace, or draft edit on a command draft); work add, task add and work promote check before
      taking an id too.

      2026-10-11 (bug-105's agent): work promote also mints from the shared counter before its late
      refusals (now an unparseable questions file too), so a refused promote burns a slice number;
      the same order fix applies to it.

      2026-10-12, the coordinator: work add --kind bug without --phase, in a registry of four
      phases, was refused ('which phase bug-106 is in is not said') after minting bug-106, so the
      retry got bug-107 and bug-106 is burned. work add itself checks after minting too, not only
      draft add.

      Definition split for #46: this item owns side-effect-free preflight before ID reservation in
      recognized minting commands, both direct and drafted: work add, work promote and task add.
      Validate parse/type/group/tag/registry and questions-file inputs and resolvable dependency
      constraints before reserving; known-invalid input must change neither counter, tree nor draft
      store. A dependency on an ID reserved by an earlier queued draft is pending creation, not
      automatically unknown: validate what is decidable and retain final validation at promotion
      without running arbitrary queued commands. Reject dependencies absent from both committed data
      and known earlier drafts. Recheck at promotion because inputs may have changed. A legitimate
      later commit/hook failure can leave a reserved ID gap under ADR-0045; this work must not
      recycle IDs or promise a cross-remote transaction. Original replacement scope is specified
      separately as p1-draft-replace-reserved-command; missing message footers are
      p1-draft-message-preflight (#78). New task-promotion preflight must follow q-63 and share the
      same rules instead of reserving twice. Acceptance distinguishes parse/semantic refusal before
      reservation, legitimate earlier-draft references, stale promotion input, normal early ID
      availability and post-reservation failures. Exact support for chained non-minting command
      effects remains a promotion-time check; do not interpret or execute arbitrary commands during
      preflight.

      q-69 is settled: use bounded early validation, not simulation of the preceding queue. Reject
      only definitively invalid current inputs before reservation. Earlier drafts can change
      config/registry/ledger inputs; checks affected by such drafts remain explicitly pending until
      promotion, and earlier reserved IDs are recognized. Without a relevant preceding draft, an
      undeclared tag or invalid group is decidable and must be refused before minting. Explain
      pending checks in the draft result rather than presenting the draft as proven promotable.
      Revalidation at promotion remains authoritative. Acceptance must include a preceding config
      draft that declares the later command tag, no false rejection of that chain, and a genuinely
      undeclared tag without a preceding policy change. This qualifies the old
      all-checks-before-minting wording: the first delivery provides bounded assurance, not a
      projection engine or a guarantee about future inputs.
    refs: [internal/cli/idmint.go, features/draft.feature]
    tags: [work, v9]

