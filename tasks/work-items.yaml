      Selection order must follow stored queue order, not caller argument order. Unknown/duplicate
      selection and unsatisfied selected/unselected dependencies must refuse before applying
      anything; after execution begins retain the existing stop-on-first-failure behavior for the
      selected sequence and keep unselected drafts untouched. A later draft referencing a minted ID
      held by an unselected predecessor is not independent. Whole-file patches and arbitrary command
      drafts cannot be assumed independent from IDs alone; define declared dependencies plus a
      conservative scope proof or explicit review model before allowing reordering. Need a product
      choice for this dependency/independence interface; a prefix-only operation does not satisfy
      the report's desired independent selection by itself. No arbitrary command execution during
      planning, hook bypass, draft-metadata hand edits or rollback of previously successful commits.
      Coordinate with slice-140's bounded assurance and p1-draft-task-fields, without treating
      either as a general projected-queue simulator.

      q-73 selects declared dependencies plus conservative independence checks, with no execution or
      projected-queue simulator during planning. Specify supported inference explicitly: file drafts
      and task-field drafts, and parsed work-add command effects; other opaque commands remain
      barriers to skipping but still work in ordinary queue order. The supported cases must permit
      real non-prefix selection, including an unrelated field/prose draft and an unqueued work-add
      idea, rather than replacing the request with prefix-only promotion. Explicit dependency
      metadata needs a supported edit that preserves private copies and reservations. Track
      prerequisites across successful promotion and refuse dropping an unsatisfied prerequisite
      while dependents remain. Final hooks and normal partial-progress behavior remain authoritative
      after execution starts.
    refs: [internal/cli/draft.go, internal/draft, features/draft.feature]
    tags: [draft, v9]

