      called Task: (ci-scope.ts's tasksIn), not the one whose source is the ledger, so a project
      calling it Work: gets no task checks in CI; ci run says "No task <id> in tasks/" whatever
      ledger.files names, and a prose-only range "`vp check`, and the named tasks' static and
      prose: true checks" whatever ci.prose.steps are. Each is read from the config. @ID-CI-05 to
      07.

  - id: slice-23
    title: The moving rule is itos's, a built-in range check and a command
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-19]
    kind: slice
    refs: [features/moves.feature]
    why: >
      What p1-config-names-from-config left, the user's call: ship scenario-moves as itos's. The
      rule (outside feat and fix, live scenarios only move, unchanged) was this repository's
      script, which hardcoded feat and fix, ignored except_types, fell back to e2e/features for
      the kind's root and kept its allowed renames in code; no consumer had it. A Gherkin kind's
      range check takes { name, builtin: moves, except_types, allowed_renames }: the commit-msg
      hook judges the staged feature files for a type except_types does not name, verify each
      commit of a range against its parent, skipping those types; itos tests moves <kind> judges
      the staged files by hand. Was the idea p1-config-names-from-config. @ID-MOVES-01 to 06.

  - id: T-037
    title: This repository's moving rule is itos's built-in, and its script goes
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-23]
    kind: task
    refs: [tasks/phase-1.yaml]

  - id: T-038
    title: v0.6.0, the config contract before the Go port
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-18, slice-19, slice-20, slice-21, slice-22, slice-23, T-037]
    kind: task
    refs: [tasks/phase-1.yaml]

  - id: p1-moves-except-types-checked
    title: config check refuses an except_types type that is not one of commits.types
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-23]
    kind: idea
    why: >
      Found in slice 23: a range check's except_types is read as a list of commit types, and the
      moves rule leaves those types alone, but config check accepts any word there, as it does
      for the command checks. A misspelt type (fead) leaves feat judged by the rule, and every
      feat that turns a scenario live is rejected with no hint of why. The footers' required_for
      and validate_for are already held to commits.types; except_types could be too.

  - id: p1-moves-merge-by-git
    title: The commit-msg hook knows a merge by git's state, not by its message
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-23]
    kind: idea
    why: >
      Found in slice 23: the hook's moves rule leaves a merge alone because "Merge" is not one of
      commits.types, so a config that lists no commits.types judges a merge commit, whose index
      holds every scenario a merged feat made live, and rejects it. The path rules dodge it the
      same way (a type with no scope). The hook could read MERGE_HEAD (or the commit being a
      merge) and leave every staged-file rule to verify, which skips merges.

  - id: slice-21
    title: ledger.group.label read, or dropped
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-4]
    kind: slice
    refs: [features/config.feature]
    why: >
      Slice 4 made every key it named read or dropped, but ledger.group.label (phase here) is
      validated and read by nothing: the registry's items keep the key phase, work check's
      messages say "phase 1 is not listed" and itos task takes --phase beside --group whatever the
      label says. Either the tools read the word from it, or it leaves the schema until they do.
      Needs a scenario in config.feature.
      Decided (the coordinator's call): read it. The words the tools print for a group (work check's
      rules, itos task's usage) take the label, and itos task takes --<label> beside --group and
      --phase; its default stays phase, so nothing changes without the key. The registry's item key
      phase is data and stays. Was the idea p1-group-label-read. @ID-CONFIG-17 and 18.

  - id: slice-20
    title: ci.covers, ci.nightly_only and recognize read hooks.bin as itos too
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-8]
    kind: slice
    refs: [features/bin.feature]
    why: >
      Slice 8 reads a command whose first word is hooks.bin as itos in ci.cost.static alone. The
      other places a command is matched against the config still read it as written: a ci.covers
      matches pattern, a ci.nightly_only entry and a tests.<kind>.recognize template written for
      itos miss tools/bin/itos. matchesStatic's reading, shared by every command pattern, closes
      it; each needs a scenario.
      Was the idea p1-itos-in-every-pattern. @ID-BIN-01 to 03, in a feature file of their own, since
      cost.feature's header is about the cost rule.

  - id: p1-own-recognize-for-itos
    title: This repository's recognize template written for itos
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-20]
    kind: idea
    why: >
      Found in slice 20, which made a tests.<kind>.recognize template read a check that starts
      with hooks.bin as itos: this repository's own itos.yaml still spells the path out in its
      smoke-run template (tools/bin/itos tests smoke run scenario), as cost.static no longer does.
      Writing it for itos makes the worked example show what a consumer may now write; the plan
      is the same either way (ci plan --whole and --nightly unchanged), so it is a build commit
      with a task whose check compares the plan before and after.

  - id: p1-ci-checks-once
    title: CI's plan runs a check two named tasks list once
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-9]
    kind: idea
    why: >
      Slice 9 runs a check once per itos task invocation, but CI's plan (ci-plan.ts) still runs a
      check once for every named task that lists it, unless a step covers it: a push naming two
      tasks that share a late check runs it twice. Planning it once, each task reading the one exit
      status by its run: or fails:, changes ci plan's output and its corpus cases; it needs a
      scenario in ci.feature or task.feature.

  - id: p1-hook-checks-once
    title: The commit-msg hook runs a static check two named tasks list once
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-9]
    kind: idea
    why: >
      The hook (commit-tasks.ts) runs each named task's static checks on their own, so a commit
      naming two tasks that share one (config check, say) runs it twice while the committer waits.
      itos task now keys a run by command and timeout (checks.ts); the hook's captured runs, capped
      by hooks.commit_msg.check_timeout, could share them the same way. Needs a scenario in
      commit-tasks.feature.

  - id: slice-19
    title: The defaults the tools apply are the ones config check prints, read from one table
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-8]
    kind: slice
    refs: [features/config.feature]
    why: >
      config check --print-defaults prints a table beside the code, but each tool writes its own
      fallback where it reads a key (?? 600, ?? "@wip"), so the printed table drifted from what
      runs: tests.<kind>.tag_prefix is @ in the table and the Gherkin adapter but empty where the
      smoke rule strips a smoke ID's prefix, so tests smoke check rejects a sound smoke set when
      the key is left out; and hooks.bin's default, tools/bin/itos (itosBin in config.ts), which
      decides what the cost rule reads as itos, is not printed at all. One table the loader merges
      under the file, which the tools and the flag both read, closes it and fits the Go port's
      loader. Was the ideas p1-one-defaults-table and p1-bin-in-defaults. @ID-CONFIG-15 and 16.

  - id: p1-ledger-id-default
    title: ledger.id has one default, or none, for every command
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-19]
    kind: idea
    why: >
      Found in slice 19, which moved every agreed fallback into the defaults table: without
      ledger.id, itos task reads a command-line word as a task ID only when it matches T-\d+ (cli.ts),
      while the ledger check and the ledger footers take any ID (.+). The two disagree, so neither
      went into the table. Either the table gets T-\d+ (a changed default: the ledger check and the
      footers start rejecting other IDs) or itos task finds its IDs another way, and the key stays
      without a default. Needs a scenario in ledger.feature or task.feature.

  - id: p1-wip-tag-command-kind
    title: config check refuses wip_tag on a kind whose adapter is a command
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-19]
    kind: idea
    why: >
      Found in slice 19: since the footer rule names the wip tag only for the Gherkin adapter, a
      kind whose adapter is a command reads its wip_tag nowhere (the adapter says which tests are
      live), yet config check accepts the key there, against "every key it accepts is one a tool
      reads" (config.feature). It could refuse it on such a kind, as slice 4 refused unread keys.

  - id: p1-group-label-flag-word
    title: config check refuses a ledger.group.label that cannot be itos task's flag
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-21]
    kind: idea
    why: >
      Found in slice 21: itos task takes --<label> as a group flag, but config check accepts any
      string as the label. One with a space can never be typed as a flag, and one that is another
      of the task runner's flags (skip, pending) makes that flag read as a group, so --skip T-005
      selects nothing. The v0.6.0 notes ask for one word that is no other flag; config check could
      refuse the rest, naming the key.

  - id: slice-22
    title: work.registry's default follows the ledger's folder, as PLAN says
    phase: 1
