  - id: p1-config-release-prerelease
    title: itos.yaml accepts release.prerelease, the marker that turns release candidates on
    phase: 1
    owner: null
    status: todo
    depends_on: [T-118]
    kind: idea
    why: >
      T-118 taught tools/bin/release-version to cut vN.0.0-rc.N while HEAD's itos.yaml says release:
      { prerelease: rc }, but the config's schema refuses a key it does not know, so config check
      (CI, and the commit-msg hook when itos.yaml is staged) would refuse the marker decision 42
      turns on with the first v7 work. Adding it is a feat in internal/config/schema.go, which needs
      a scenario, and config.feature's premise is that every key itos.yaml accepts is one itos
      reads, while this one only the repository's own release tool reads. Needs the user's call
      before the marker goes on: the key in the schema with a scenario of its own (and the premise
      widened to the release tooling), or another home for the marker.

  - id: p1-version-compare-prerelease
    title: version.Compare orders a pre-release below its release, as its doc says
    phase: 1
    owner: null
    status: todo
    depends_on: [T-118]
    kind: idea
    why: >
      internal/version's doc says Compare orders a pre-release below its release, but it reads the
      first three numbers alone, so 7.0.0-rc.1 compares equal to 7.0.0 (and rc.2 to rc.1). With
      release candidates (T-118) that matters: a repository pinning 7.0.0-rc.1 is never told by the
      launcher's update notice that 7.0.0 is out, and itos upgrade from an rc to the final release,
      or to a later rc, walks no release and prints nothing it asks. A fix, with a bug scenario,
      before the first rc is pinned anywhere.
