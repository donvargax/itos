  - id: slice-158
    title: Record final evidence in the validated project close commit
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-143, p1-typed-items]
    kind: slice
    why: >
      Was p1-work-done-past-data-commits.
      slice-93 lets work done pass over registry-only commits, but a close commit also changes the
      ledger and a decision changes tasks/asks.yaml, so on 2026-10-09 T-137 and slice-103 could not
      close until those coordinator commits were pushed, each push one more CI run. Widen
      registry-only to commits that change only the registry, the ledger files and the questions
      file: none can change what an item's code does. A spec commit adding @wip scenarios to a
      feature file stays out, since a feature file is test code. The user agreed 2026-10-10; ranked
      before p1-decision-add-answer.

      Issue #71 provides a concrete evidence-only lifecycle: T-80 implementation 094e634 had green
      CI 38786410533, then ledger documentation commit 6710147 naming T-80 led to CI 38790254907
      before closure. The original refusal transcript is absent, so this is reported friction rather
      than a newly reproduced failure. q-70 remains a design question after explaining why accepting
      all ledger-only changes would also cover changed checks or specifications. Do not implement
      blanket ledger skipping or claim old green CI proves new acceptance criteria. Finalize the
      evidence-recording/reuse boundary before this item becomes a slice; structural close/dequeue
      is slice-142.

      Direct gh-api inspection of consumer commit 671014753bbce42ff915ab24c066b02f8112b2ac confirms
      parent 094e634b072f618cdd8aa4e252151fa758553bca, one changed file tasks/phase-1.yaml, and only
      an appended validation-evidence paragraph in T-80 why. done_when, implementation and tests
      were unchanged; the commit carries Task: T-80. This verifies the
      evidence-in-specification-field scenario from #71 without claiming the absent refusal
      transcript has been recovered. Current work done also reads and executes current ledger checks
      before CI selection; distinguish that fresh acceptance run from whether an older hosted CI run
      covers a later task-associated commit. q-70 still needs an answer before choosing receipt
      storage or revised skip semantics.

      q-70 follow-up after direct diff inspection: a simpler first delivery can accept final
      evidence through work done and record it in the same validated close transaction, avoiding the
      intermediate Task-associated documentation commit seen in #71. This preserves current
      acceptance checks and CI rules; it does not grant general reuse across separately committed
      ledger/specification changes. The person is being asked to choose evidence-with-closure first
      versus general reusable receipts first. Do not treat this proposed first delivery as already
      accepted, or claim it eliminates every evidence-reuse case. Structural transaction slice-142
      supplies the shared close/dequeue boundary.

      q-70 is now answered: evidence with closure first, superseding the older broad data-skip
      proposal. Proposed interface is work done <id>... --evidence-file <path>, capturing a nonempty
      UTF-8 narrative once before validation and quoting it in the same atomic close commit body
      after all existing acceptance and hosted CI gates pass. Do not edit task why, create an
      intermediate associated commit, execute narrative text, parse it as proof, or trust its claims
      instead of the tool-verified CI result. Batch evidence identifies only the items actually
      transitioning; an all-already-done request with evidence must refuse rather than silently
      discard it. Without the flag existing idempotency is unchanged. Depend on slice-143 for the
      single batch/close/dequeue transaction. Separately committed evidence reuse is now
      p1-reusable-completion-evidence. Stealth persistence needs an explicit first-delivery boundary
      because that mode creates no close commit.
    refs: [features/work-evidence.feature, internal/cli/workdone.go, internal/cli/workwrite.go]
    tags: [work, v9]

