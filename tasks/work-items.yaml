  - id: p1-corpus-orphan-loop
    title: A corpus case's fake git never loops with tools/bin/dev-version, and the runner kills a case's whole process group
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found 2026-10-07: two processes spun at 100% CPU for 38 minutes, orphaned. A conformance
      case's fake old git (case/old-git, a git older than 2.54.0) was on the PATH when
      tools/bin/dev-version ran git -C <repo> rev-parse, and the fake and git called each other
      without end; the run that started them had ended, its children left to init. Two fixes: the
      fake hands any other git call to the real git by an absolute path (or ITOS_GIT, as the
      features do since T-104), never to a git found on the PATH; and the runner starts each case in
      a process group of its own and kills the group on timeout or exit, so nothing outlives the
      run.

      Seen again by slice-97's agent (2026-10-07): with the git shim ahead of /usr/bin/git on the
      PATH, the corpus's old-git cases hang in git describe; with /usr/bin first the whole corpus
      runs in 45 s. T-104 made the features and unit tests pass over an itos linked as git; the
      conformance runner (tools/itos/conformance/run.ts) and its fakes do not yet, which is this
      item's first fix.

