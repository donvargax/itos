    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A range check takes one {from}. verify gives it commits.since when the range's own start is
      empty or older than it, but keeps the start when the two have diverged (a pull request based
      before commits.since, say), so a project's own range command may judge commits before it;
      the built-in moves rule judges verify's own list of commits, which leaves them out. A {since}
      in the template, or a range given as a commit list, would close it.
