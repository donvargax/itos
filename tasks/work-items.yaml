    phase: 1
    owner: null
    status: todo
    depends_on: [slice-4]
    kind: idea
    why: >
      Slice 4 made every key it named read or dropped, but ledger.group.label (phase here) is
      validated and read by nothing: the registry's items keep the key phase, work check's
      messages say "phase 1 is not listed" and itos task takes --phase beside --group whatever the
      label says. Either the tools read the word from it, or it leaves the schema until they do.
      Needs a scenario in config.feature.

  - id: p1-itos-in-every-pattern
    title: ci.covers, ci.nightly_only and recognize read hooks.bin as itos too
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-8]
    kind: idea
    why: >
      Slice 8 reads a command whose first word is hooks.bin as itos in ci.cost.static alone. The
      other places a command is matched against the config still read it as written: a ci.covers
      matches pattern, a ci.nightly_only entry and a tests.<kind>.recognize template written for
      itos miss tools/bin/itos. matchesStatic's reading, shared by every command pattern, closes
      it; each needs a scenario.

  - id: p1-bin-in-defaults
    title: config check --print-defaults lists hooks.bin's default
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-8]
    kind: idea
    why: >
      hooks.bin's default, tools/bin/itos, decides which commands the cost rule reads as itos since
      slice 8, besides what the hook shims call, but the defaults --print-defaults prints leave it
      out (itosBin in config.ts holds it). Listing it changes the printed table, so the release
      notes check and its conformance cases move with it; p1-one-defaults-table would carry it.

  - id: p1-ci-checks-once
    title: CI's plan runs a check two named tasks list once
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-9]
    kind: idea
    why: >
      Slice 9 runs a check once per itos task invocation, but CI's plan (ci-plan.ts) still runs a
      check once for every named task that lists it, unless a step covers it: a push naming two
      tasks that share a late check runs it twice. Planning it once, each task reading the one exit
      status by its run: or fails:, changes ci plan's output and its corpus cases; it needs a
      scenario in ci.feature or task.feature.

  - id: p1-hook-checks-once
    title: The commit-msg hook runs a static check two named tasks list once
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-9]
    kind: idea
    why: >
      The hook (commit-tasks.ts) runs each named task's static checks on their own, so a commit
      naming two tasks that share one (config check, say) runs it twice while the committer waits.
      itos task now keys a run by command and timeout (checks.ts); the hook's captured runs, capped
      by hooks.commit_msg.check_timeout, could share them the same way. Needs a scenario in
      commit-tasks.feature.

  - id: p1-one-defaults-table
    title: The defaults the tools apply, read from one table
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      config check --print-defaults prints a table beside the code, but each tool writes its own
      fallback where it reads a key (?? 600, ?? "@wip"; the registry's is one constant since slice 5,
      DEFAULT_REGISTRY in config.ts, which the table and the tools share), so the printed
      table can drift from what runs: tests.<kind>.tag_prefix is @ in the table and the Gherkin adapter
      but empty where a smoke ID loses its prefix. One table the loader merges under the file, which the
      tools and the flag both read, closes it; it fits the Go port's config loader.

  - id: slice-10
    title: The footer rules run by itos beside the header lint
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: [features/footers.feature]
    why: >
      Found by the consumers: with a header-lint delegate configured, the commit-msg hook, commit
      check-message and verify ran only the delegate, so the footer rules ran only through the
      commitlint plugin in this repository's commitlint.config.ts (calling tools/itos/footers.ts),
      and a delegate without it skipped them silently. itos now runs the footer rules itself,
      always, and reports them beside the delegate's problems. This repository's commitlint config
      then drops its plugin, or every footer problem is reported twice; a consumer whose commitlint
      config carries the plugin drops it too, which the next release's notes say. @ID-FOOT-01 to 04.

  - id: T-030
    title: This repository's commitlint config judges the header and body alone
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-10]
    kind: task
    refs: [tasks/phase-1.yaml, commitlint.config.ts]
    why: >
      Once itos runs the footer rules beside the header lint (slice 10), the commitlint plugin that
      ran them here reports each footer problem twice, so it goes, right after the feat.

  - id: slice-13
    title: A footer whose source is missing is a problem, not a crash
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-10]
    kind: slice
    refs: [features/footers.feature]
    why: >
      Found in slice 10: the footer rules read a footer's source whenever its validate_for applies,
      even when the message names no ID, so a config with a ledger footer and no ledger folder
      stopped check-message, the commit-msg hook and verify with itos: ENOENT … scandir 'tasks'
      (exit 2). Since slice 10 they run behind every header-lint delegate too. A message naming no
      ID reads no source; one naming an ID when the source is missing is one problem naming the
      path, exit 2 (an environment error, PLAN §7). @ID-FOOT-05 and 06.

  - id: slice-12
    title: An empty selection of named tests adds no pattern to the merged run
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-11]
    kind: slice
    refs: [features/ci.feature]
    why: >
      Found specifying slice 11: an ids selection renders through ids_pattern, so an empty smoke set
      rendered "@(?:)\b", which matches every tag, and the merged run of named tests ran every
      scenario instead of the ones a push names (slice 11's own run printed run @(?:)\b|@ID-A-01).
      An empty ids selection adds no pattern, and a run with nothing selected runs no named tests.
      @ID-CI-02 and 03.

  - id: p1-ledger-folder-missing
    title: A missing ledger folder is one problem in every command that reads the ledger
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-13]
    kind: idea
    why: >
      Found in slice 13: the footer rules now report a missing ledger folder as one problem
      (footer-source-missing, exit 2), but config check, task, task list, ci plan and ci run still
      stop on it with itos: ENOENT … scandir 'tasks', exit 2, and config check --json then prints no
      JSON. A consumer that configures a ledger before making its folder meets that first in config
      check. The ledger's loader could report the folder once, as the footer rules do.

  - id: p1-merged-check-without-a-run
    title: A check merged into a run of named tests that does not happen runs as itself
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-12]
    kind: idea
    why: >
      Found in slice 12: with an empty smoke set and a range that names no test, the plan has no run
      of named tests, yet a task's check recognized as the smoke run (as: smoke) is still marked
      merged, and ci run logs it "(in the scenario run above)" under no such run. It could run as
      itself instead, or be logged as selecting nothing.

  - id: p1-several-test-kinds
    title: A CI run that merges more than one kind of named test
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The plan merges only the kind of the first tests: step of ci.steps, with one smoke set, and the
      smoke rule names the kind scenario: in a config with two kinds (scenarios and Go tests, say)
      every tests: step would take the first kind's merged command.

  - id: slice-11
    title: ci run's log names a merged check by its kind of named tests
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: [features/ci.feature]
    why: >
      What the consumers found: ci run logs a task check merged into the run of named tests as
      "(in the E2E run above)", the template's word for its Playwright suite, whatever the kind is
      called. It names the kind instead. @ID-CI-01. Half of the old idea p1-e2e-names; T-031 is
      the other half.

  - id: T-031
    title: The template's E2E names out of the code
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-11]
    kind: task
    refs: [tasks/phase-1.yaml]
    why: >
      e2e-scope.ts, e2eStep and the comments naming e2e/smoke.yaml and Playwright are renamed for
      what they do. After slice 11, which changes the one line itos prints with the word.

  - id: p1-range-check-since-diverged
    title: A range check given commits.since when the range has diverged from it
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A range check takes one {from}. verify gives it commits.since when the range's own start is
      empty or older than it, but keeps the start when the two have diverged (a pull request based
      before commits.since, say), so a project's own range check may judge commits before it;
      scenario-moves leaves them out itself. A {since} in the template, or a range given as a commit
      list, would close it.

  - id: p1-hooks-config-write
    title: "hooks install writes lefthook's and pre-commit's config"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      hooks install writes shim files for Vite+, husky and plain git, but for lefthook, pre-commit
      and prek, whose hooks live in their YAML config, it only prints the snippet to add. Merging it into
      the file, keeping the other hooks and comments, would make install one step for them too, for
      a manager detected or named by hooks.manager (which overrides detection since slice 4).

  - id: p1-identity-map
    title: "An identity command's answer mapped to a login"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A command identity takes the command's output as the handle, so the command must print the
      login itself. Asking git config user.email and mapping it through a people file that pairs a
      login with an email needs a map: key and that file; it fits the people sources in the Go port.

  - id: p1-conformance-http
    title: Conformance cases for the providers that ask an HTTP API
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The corpus runs every provider that needs no network, but not which run the github range
      provider takes from the API's answer (the newest success, whatever the list's order), which
      stays in tools/selftest/ci-range.ts. A case serving a canned response, with the provider taking
      its API's base URL from the environment as GITHUB_API_URL gives it in Actions, would cover it, and
      GitLab and Forgejo after it.

  - id: p1-agent-rules-as-checks
    title: Agent rules a command can decide, moved into itos
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A rule moves from the agent instructions into itos once a command can decide it. Two
      candidates: pre-push refusing a non-fast-forward push (AGENTS.md, "Force-push, in any form"),
      and a commit refusing paths the config marks as someone's work in progress (AGENTS.md, "Stage
      your own work"). The instructions then point to the check.

  - id: p1-release-selftest-own-release
    title: A release task's tarball check proves its own release
    phase: 1
    owner: null
    status: todo
    depends_on: [T-029]
    kind: idea
    why: >
      T-024's and T-027's first check, node tools/selftest/release.ts, packs this tree and proves
      that tarball under package.json's version, so a done release task says nothing about its
      release and goes red with whatever later breaks the tree's pack. Given a tagged version it
      could prove the released tarball (--tarball, downloaded and verified as release-notes.ts
      does) against the tag's corpus and features.

  # ---- phase 2 ----------------------------------------------------------------
  - id: p2-go-port
    title: The Go port, one command group at a time
    phase: 2
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      PLAN.md, phase 2: the Go binary built here beside the TypeScript, one command group at a
      time, each shipped when it passes its features (ITOS_BIN pointed at it) and its part of the
      conformance corpus. The gofmt step in itos.yaml and T-015's check name features/ only, and
