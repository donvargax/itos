  - id: slice-153
    title: Wait through registration 404s for a newly pushed workflow
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: slice
    why: >
      Was p1-push-watch-new-workflow.
      #56 (2026-10-12): the first push of .github/workflows/ci.yml gets a 404 on the workflow's runs
      until GitHub registers it, and itos push exits 3 at once; itos ci watch a little later waits
      normally. A 404 for a workflow the range adds is 'not registered yet', retried at
      ci.watch.interval; exit 3 only when the timeout passes.

      First delivery: only itos push can grant registration grace from its captured post-rebase
      remote base and exact pushed SHA. A literal configured workflow basename ending .yml/.yaml is
      eligible when absent at the known remote base and present as a regular workflow blob at the
      pushed SHA; a genuinely new branch uses the empty tree. Unknown history, numeric or
      unsupported workflow identifiers, an already-existing workflow, or uncommitted-only files do
      not establish grace. Until the first successful workflow-runs response, only HTTP 404 from
      that exact workflow-runs listing is treated as not yet available. It does not count toward six
      consecutive transport failures and uses the existing interval and overall deadline; timeout is
      75 under current watch semantics, not the issue suggestion of 3. Other endpoints and permanent
      errors retain their existing behavior. Standalone ci watch has no push-range proof and retains
      existing 404 behavior. No new config, retry switch, extra remote fetch, push retry or policy
      change.
    tags: [push, v8]
    refs: [features/watch-registration.feature, internal/cli/push.go, internal/cli/watch.go, internal/providers/watch.go]
    deferred: >
      Spec review round 1 (2026-10-26, .git/itos/review/slice-153-plan-r1.txt, CHANGES_REQUESTED,
      $0.84): the 2026-10-15 spec predates push.mode pr and --ready; under pr the addition base
      would be the empty tree (a ci.yml on main for months looks added), and --ready and the rebased
      head are not covered; plus a malformed-JSON row that contradicts its own rule and an
      unbuildable unreadable-tree row. It saves one rerun of --ready per newly added workflow, a
      one-off; a respec for pr mode plus the build costs more. Revisit if p1-ci-e2e-workflow (#84)
      adds a workflow and the first --ready actually meets the 404.

