  - id: p1-ci-after-push-checks
    title: CI waits on an after-push check the push itself cannot satisfy
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      CI runs a named task's `after: push` checks on every range that names it. T-021's check
      needs the release a tag makes after the push, so every range naming T-021 was red until
      v0.1.0 existed and green only when re-run after it; its check was made late so the red run
      still proved everything else first. A check that waits on something after the push (a
      release, a tag) could be reported pending by CI instead, so the push that lands the workflow
      is green and the next release task does not meet the same red.

