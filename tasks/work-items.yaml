      shim managers (vp, husky, plain git) always write the pre-push shim; but a project that picks
      --manager git-config, or hooks.manager git-config, still gets the pre-push entry only with
      hooks.pre_push, and an existing one is removed without it. One rule for every manager would be
      simpler; changing it changes a released behaviour (hooks.yaml's git-config cases), so it waits
      for a decision.

