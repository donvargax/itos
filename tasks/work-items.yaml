  - id: p3-header-case-decomposition
    title: subject-case names the cases of a subject with any precomposed letter as commitlint does
    phase: 3
    owner: null
    status: todo
    depends_on: [slice-25]
    kind: idea
    why: >
      The built-in header lint's one known difference from commitlint (slice 25, v2.0.0's Known
      issues): es-toolkit's deburr decomposes every precomposed letter (NFD) before it finds
      start-case and pascal-case, and internal/message/cases.go decomposes only Latin-1's and Latin
      Extended-A's, by table, so for a subject such as "Ǎb Cd" subject-case's message lists
      start-case where commitlint's does not. The verdict is the same (sentence-case alone decides
      it), so only a script matching the words sees it. Closing it needs Unicode's canonical
      decompositions: golang.org/x/text/unicode/norm would be the binary's second dependency
      (PLAN.md, section 8), so a table generated from UnicodeData.txt into the package is the other
      way. commitlint has left this repository (T-063), but tools/selftest/header-agreement.json
      holds its words for one such subject ("feat: Ἀθήνα Πόλη"); once cases.go decomposes it,
      header-agreement.ts can drop its exception for the gap and compare those words too.

