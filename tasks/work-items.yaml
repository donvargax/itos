  - id: slice-8
    title: The cost rule reads a command that starts with hooks.bin as itos
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-7]
    kind: slice
    refs: [features/cost.feature]
    why: >
      Asked by the user: ci.cost.static's patterns do not recognise itos's own commands written as
      tools/bin/itos, so this repository's config spells out ^(tools/bin/)?itos, and each consumer
