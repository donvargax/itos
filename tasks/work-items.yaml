      edit to that file alone can break the registry. Slice 6 runs the registry's check when the
      registry is staged, and T-023 drops the pre-commit check, which never watched the people file
      either; only CI's prose steps catch it, after the push. The commit-msg hook could run the
      registry's check when work.people's file is staged too.

