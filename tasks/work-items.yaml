      stages go.mod or go.sum, a CI range that changes them), so a vulnerability disclosed after
      a module came in is found only when go.mod next changes, which may be months. A nightly
      step running the check (go run ./tools/bin/deps-check, the whole of it, which would also
      flag an exception a week old as no longer needed) would find it the next morning; it needs
      the network, which the nightly has.
    refs: [tasks/phase-3.yaml, itos.yaml]
    tags: [gates, v8]

  - id: p3-ci-step-paths
    title: A CI step says which paths it is for, so a range that leaves them alone skips it
    phase: 3
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      T-067 left it: the dependency check's CI step should run only for a range that changes
      go.mod or go.sum, but a step of ci.steps cannot be given the range, so the step reads the
      range's start from FROM, which the workflow's Range step puts in the job's environment,
      and decides itself (-changed-since). A paths list on a step, read by itos ci plan as
      ci.prose.paths is, would leave such a step out of the plan, show it in itos ci plan, and
      drop the step's dependence on the workflow's environment. An itos feature, so a slice.

      2026-10-12: T-163 changed ci.nightly and the nightly went red in
      tools/selftest/features-scope, which judges the plan's shape but runs only at night (35 s, too
      slow for every push). With a paths list, a range touching itos.yaml or the workflows would run
      it per push, so the change that breaks it is told before it lands, not the next morning
      (T-164). A case for moving this up from phase 3.
    refs: [itos.yaml, PLAN.md]
    tags: [ci, v8]

