    title: itos push, the pull-rebase-push routine as one command
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Commit, git pull --rebase --no-autostash, check no rebase stopped and no conflict is left,
      then push in a separate command, never piped: AGENTS.md spends a section on it, ORCHESTRATING
      a lesson and a guard one-liner, and every session repeats it. itos push could do it, refuse a
      non-fast-forward push (one of p1-agent-rules-as-checks' candidates) and print the CI run the
      push started, for p1-ci-watch.

  - id: p1-ci-watch
    title: itos ci watch and itos status, the run for a commit and the state of main
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      After every push the coordinator wrote the same watch: find the run for the full SHA, wait,
      grep --log-failed for "CI failed at"; and checked each agent's claimed run, since a report's
      link is a claim. itos ci watch [<sha>] could find the run, wait and print the failed step.
      itos status could print what HANDOFF's "Where things stand" holds by hand: main's last green
      run, the last nightly, the unreleased commits since the last tag.

  - id: p1-upgrading-footer
    title: A footer that records what a consumer changes, gathered into the release notes
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      v0.3.0's and v0.4.0's Upgrading sections were assembled by hand from each slice's report of
      "what a consumer sees change", which the notes check cannot see beyond changed defaults. A
      feat or fix footer (Upgrading:, say) would record it where the change is made; release
      preparation would gather the range's, and the notes check would require each to appear.
      It would cover what p1-release-notes-schema-keys misses too: keys dropped, values narrowed.

  - id: p1-itos-release
    title: itos release prepare, tag and close
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      T-027 and T-033 ran the same sequence: take the task, write the notes, bump the version, a
      push red by design at the after-push download check, the user's review, tag, watch
      release.yml, download and checksum the tarball, and a closing commit moving README's install
      line and marking the task done. itos release prepare|tag|close could do the mechanical parts;
      with p1-ci-after-push-checks the red-by-design run would read as pending instead.

  - id: slice-16
    title: The nightly runs every done task's checks
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-9]
    kind: slice
    refs: [features/nightly.feature]
    why: >
      Only a push that names a task runs its checks, so a done task rots unseen: T-024 was red from
      slice 7 to v0.3.0, and slice 10 broke T-007, caught only because CI runs it on every push.
      ORCHESTRATING's brief now tells agents to run the done tasks whose checks call a command a
      slice moves, a rule a command can decide. The nightly could run every done task's checks,
      cheaper since slice 9 runs a shared check once, and report a red one as a regression.
      Asked for by the character editor, whose e2e-scope self-test failed unseen from the moment
      a pose golden joined its nightly until someone ran every done task's checks by hand. A
      nightly step { tasks: done, cost: static } runs the checks of every task whose work item is
      done (the user's call: not every task wait_on_status lets through, since a task in progress
      may be red until it lands), each shared check once, only the static ones with cost: static,
      and a red one fails the nightly naming its task's ID and title. Was the idea
      p1-done-tasks-nightly. @ID-NIGHTLY-01 to 04.

  - id: p1-nightly-issue-names-tasks
    title: The Nightly red issue names a failing done task's check
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-16]
    kind: idea
    why: >
      Slice 16's nightly step runs the done tasks' checks, and a red one fails the run with "CI
      failed at T-… (<title>), its check: <command>". The nightly workflow's issue lists only go
      test's "--- FAIL: TestFeatures/" lines, so a red task check is reported as "no failing
      scenario", sending the reader to the log. Gathering the "CI failed at" lines (or ci run
      --json's failed_at) into the issue would name the task.

  - id: p1-nightly-past-first-failure
    title: The nightly goes on past its first failure, so a red step does not hide the done tasks
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-16]
    kind: idea
    why: >
      ci.stop_at_first_failure is one setting for pushes and the nightly. A push should stop early
      to save the runner, but the nightly runs once a day to report: with it true, a red scenario
      in the whole run hides every done task's check after it, and a red task check placed first
      hides the features. A ci.nightly.stop_at_first_failure (false by default, or the nightly
      always going on) would report everything red in one night; with p1-ci-run-every-failure-json
      its JSON would list them.

  - id: slice-17
    title: config check says a commits.since it cannot find may be outside a shallow clone
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: [features/since.feature]
    why: >
      The first nightly running the done tasks' static checks was red at itos config check: "commits.since
      names <sha>, which is not a commit of this repository", because actions/checkout's default is
      a one-commit shallow clone. The commit was there, the clone was not deep enough. With git
      rev-parse --is-shallow-repository true, config check (and verify) could say the clone is
      shallow and fix it with fetch-depth: 0 or git fetch --unshallow; a consumer's nightly that
      takes { tasks: done } meets the same.
      Both keep exit 2 and say the clone is shallow, with the fix: git fetch --unshallow, or
      fetch-depth: 0. Was the idea p1-since-shallow-clone. @ID-SINCE-07 and 08.

  - id: p1-range-start-shallow-clone
    title: verify says a range start a shallow clone lacks may lie beyond its history
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-17]
    kind: idea
    why: >
      slice-17 made a commits.since a shallow clone lacks a config error that says the clone is
      shallow. A range's own start is not checked: verify <from> HEAD (and so ci run, whose range
      starts at the last green run) with a <from> beyond a shallow clone's history ends in
      "itos: Command failed: git rev-list --no-merges --reverse <from>..HEAD", exit 2, no word of
      the clone. The same check (git cat-file -e, then --is-shallow-repository) could make it a
      problem naming the commit, with git fetch --unshallow or fetch-depth: 0 as its fix, and a
      <from> no clone has (a typo) one of its own.

  - id: p1-wip-red-first
    title: A command that shows a slice's @wip scenarios fail against the current binary
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Every implementing agent proved its scenarios failed without its change by stashing it and
      running them. A command that runs a slice's @wip scenarios against the current binary and
      reports each one's failure (the step and its output) would make that routine, and show a
      coordinator before an agent starts whether a spec fails where it should. It would not have
      caught this session's two bad specs (@ID-CONFIG-10, @ID-CI-01), which failed for a wrong
      reason, but the failing step it prints would have shown the reason.

  - id: p1-commit-message-file
    title: Commit messages through a file, so a heredoc cannot be piped into git
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      AGENTS.md warns that git commit -F - <<EOF … | tail hands the heredoc to tail and leaves git
      waiting, and every session writes its message to a file to avoid it. Belongs to the hooks
      more than to itos: a helper that takes the message as a file or argument, or a hook that
      refuses an empty message read from stdin, would make the rule a check.

  # More of the same, from the same session, refined with the user.
  - id: p1-work-brief
    title: "itos brief <item> fills the project's brief template from the registry and the ledger"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The coordinator writes each agent brief by hand from ORCHESTRATING.md's template. itos brief
      <item> would fill a template the project owns (work.brief.template) with what it knows: the
      item's title, why and refs; a slice's @slice-<n> scenarios and which are @wip, a task's
      done_when as the ledger holds it; the earlier commits on the same feature file or task; the ideas
      depending on it; the command that runs what the slice reaches, from the kind's run.select
      template. The decisions the agent builds to stay the coordinator's, in an optional brief: field
      on the item, written when it is specified. An idea is refused: specify it first. Output is text
      or --json; nothing reads it back. Which done tasks a slice will reach cannot be known before the
      work: slice-16 catches that after.

  - id: p1-work-queue-order
    title: "The registry holds the order of the queue, not HANDOFF's prose"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The registry knows dependencies but not priority, so the real order lives in HANDOFF's Next
      list and itos work lists ideas unordered. An optional order or priority on items (or an ordered
      queue: list) would let itos work propose in the coordinator's order and HANDOFF point at it.

  - id: p1-slice-done-check
    title: "A slice is done when its scenarios are live and green, checked"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Slices are marked done by hand. itos could check it, as itos task does for a task: every
      scenario tagged @slice-<n> live (none @wip without a reason), green in the last CI run that named
      them and in the nightly after; work check or work done <id> refusing a slice that is not.

  - id: p1-checkout-lease
    title: "A lease on the checkout, so a second session cannot commit over an agent's work"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      ORCHESTRATING.md asks the coordinator not to commit while an agent works in the same checkout:
      the index is shared, and two vp staged runs at once break its backup. itos work take <id> could
      write a lease into the git directory (per worktree, never committed): the item, the boot ID and
      a timestamp each holder commit refreshes. With work.lease on, the commit-msg hook refuses a
      commit whose footer does not belong to the leased item, naming it and how to release it, unless
      every staged path is in work.lease.free_paths (default docs/** and tasks/**), so the
      coordinator's docs commits pass but never sweep the agent's staged files. A reboot (boot ID
      changed), work.lease.stale_after of no activity, itos work done or itos work release <id> ends
      it, so a dead machine never wedges the checkout; the shared claim stays status: doing in the
      registry. Left open: two vp staged backups racing in the same instant.

  - id: p1-itos-upgrade
    title: "itos upgrade walks a consumer through a release's Upgrading section"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user moves the consumers' pins by hand, following each release's Upgrading section. itos
      upgrade <version> could fetch the notes, check the config against what they say (keys removed,
      values narrowed, requires), apply what is mechanical and list the rest, and verify with itos
      version and config check, as each section's last step asks.

  - id: p1-tests-next-id-and-steps
    title: "Spec help: the next free test ID, the steps that exist, the ones still undefined"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Writing a scenario meant grepping features/ for the next free ID and steps_test.go for the
      phrases already defined. itos tests next-id <kind> <AREA> from the kind's IDs; an optional
      tests.<kind>.steps command that prints the step definitions (godog and playwright-bdd both can),
      which itos tests steps <kind> [--grep] runs; and itos tests undefined <kind> <ids>, a dry run of
      @wip scenarios listing the steps nobody has written. Help only: nothing judges a scenario's
      wording, which the user judged too restrictive.

  - id: p1-handoff-status
    title: "itos status, and the HANDOFF's state block written from it"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      HANDOFF's "Where things stand" is rewritten by hand from run IDs and the log. itos status could
      print main's head and last green CI run, the last nightly, the last release and the commits since
      it (feat and fix apart from the rest), the items doing and the ideas added since a date; itos
      handoff update would rewrite only a marked block of the file (path and markers in the config),
      leaving Next and User review the coordinator's prose. Overlaps p1-ci-watch's itos status.

  - id: p1-work-spend
    title: "The tokens each item cost, recorded by the coordinator and summed"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Each agent's completion notice carries its token spend (100k to 210k a slice in the v0.3.0 and
      v0.4.0 session), and ORCHESTRATING asks the coordinator to mind it when proposing agents, with
      nothing recorded. An optional spend: list on an item, written by the coordinator (itos work done
      <id> --tokens 175k), and itos work cost printing totals and medians per kind and phase and an
      estimate of the queue. No budgets and no refusals.

  - id: p1-smoke-suggest
    title: "itos tests smoke suggest proposes a smoke entry for a file that needs one"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Each new feature file needed a smoke scenario picked by hand: fast and central. itos tests smoke
      suggest <kind> could print a YAML snippet per file lacking one, its live scenarios ranked by
      duration from the last full run (an optional tests.<kind>.timings report the runner writes) and
      marked when they failed on main recently, the why left for a person. Writes nothing.

  - id: p1-backport-code-design
    title: Backport the template's code-design rules, and the gates that decide them
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    deferred: until the project template has its code-design rules, written there first by the user
    why: >
      The user wants rules around code design: vertical slices (DDD), no mocks, unit tests for the
      core only and integration tests for the rest, property-based testing. They go into the
      template first, which every project starts from, and come back here. What a command can
      decide becomes a gate, not prose: import boundaries and the mock ban as lint rules run by
      vp check, where unit test files may live as a path rule, integration tests as a named kind
      (which moves p1-several-test-kinds up); slices and property-based tests stay prose. Here they
      fit a TypeScript CLI with no domain layer, whose scenarios and conformance corpus are
      already black-box integration tests.

