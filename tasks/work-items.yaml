      the environment of whoever ran git, so the same commit would be judged by different configs
      from a terminal, an IDE or an agent. Phase 2, only if one config is not enough: several
      stealth configs under <git common dir>/itos/, each with a scope, the hooks choosing by the
      staged paths and refusing a commit spanning two.
