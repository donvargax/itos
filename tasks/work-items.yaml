  - id: p3-commit-long-text-footer
    title: itos commit fits a long footer of free text within the line limit
    phase: 3
    owner: null
    status: todo
    depends_on: [slice-36]
    kind: idea
    why: >
      Found in slice 36: --upgrading and --breaking write their text as one trailer line,
      while IDs are packed onto lines of 100 characters at most. A text past 100 characters
      breaks the header lint's footer line limit, and Texts reads only a footer's first line,
      so a folded trailer would lose the rest. itos commit could refuse it up front naming the
      limit, or fold it as git folds a trailer, with Texts and commit footers reading the
      continuation lines.

      Backlog review of 2026-10-10, batch 1: folds in p3-text-footer-lines (message.Texts reads one
      line per Key:). Queued: a plain Upgrading: line over 100 characters is refused by the
      commit-msg hook only after pre-commit's slow checks, and every feat or fix carries one.

      Backlog review of 2026-10-10, batch 2: also folds in p1-release-notes-footers: Texts reads
      footers from the trailer paragraph only (a wrapped body line starting Changes: was listed as
      one, b79c767, v2.15.1), and the notes quote a multi-line footer with every line in the
      blockquote (63d7046, v2.21.1).

      2026-10-11 (slice-129): --breaking writes one footer line too, and a long breaking text was
      refused only after the whole pre-commit hook had run; itos commit can check every footer
      flag's length before git runs.

      Third time on 2026-10-11 (slice-130): a --breaking line one character over 100 was refused
      only after the whole pre-commit hook. Three agents in one day lost a hook run to it.

      donvargax/itos#51 (itos 8.0.0, 2026-10-12): an --upgrading text whose footer line would be 126
      characters was refused by the lint as 'footer's lines must not be longer than 100 characters',
      naming neither the footer nor its length. itos commit builds that line itself, so it can
      refuse before git runs: '--upgrading's footer line would be 126 characters, over 100: shorten
      the text to 88 or fewer'; for a footer from the message file, name the footer and its length.

      Met again in #111 (2026-10-21): a long --upgrading is refused by footer-max-line-length
      instead of being wrapped onto continuation lines as --scenarios is.

      2026-10-24 grooming (the user's call): merged in p1-commit-wrap-review, slice 58's
      post-landing review of itos commit's wrap, since one wrapping helper serves both: lines with a
      URL are wrapped though linesFit exempts them; a CRLF line counts its \r and is wrapped at 100,
      leaving mixed endings; strings.Fields squeezes tabs and runs of spaces inside a wrapped line;
      wrapLine repeats value.Wrap's greedy loop, which counts runes where the lint counts UTF-16
      units, as workwrite.go's body wrap does; message.CommentChar returns 'auto' for
      core.commentChar=auto, in the lint too. Tests for -F -, the unchanged-file path and CRLF.
      Raised: queued after slice-164, as it bites every feat and fix and ends a lesson.

      Correction to the note above: it was already sixth in the registry's queue, after
      p1-defer-reason-footer; the queue was left as it is.
    refs: [internal/cli/gitcommit.go, internal/message/footers.go]
    tags: [commit, v8]

