  - id: p1-release-checks-its-notes
    title: The release workflow runs the notes check before it publishes
    phase: 1
    owner: null
    status: todo
    depends_on: [T-024]
    kind: idea
    why: >
      release.yml refuses a tag without docs/releases/v<version>.md, but only checks that the file
      is there: tools/selftest/release-notes.ts, which proves the Upgrading section is last, pins the
      tarball and names every changed default, runs only as T-024's check, so a later release's
      notes are judged only if its task names it. The workflow could run it beside release.ts (it
      needs gh and the previous release, both there), so no release is published with notes that
      miss a changed key.

  - id: p1-release-notes-schema-keys
    title: The notes check sees keys added to or removed from the schema, not only the defaults
    phase: 1
    owner: null
    status: todo
    depends_on: [T-024]
    kind: idea
    why: >
      The notes check compares the two releases' config check --print-defaults --json, so it sees
      a key whose default changed, appeared or went, but not a key without a default that the
      schema gains or drops: slice 4 removes commits.header_lint.use and alongside and
      ledger.check.pushed for v0.3.0, and the check would pass notes that never named them. A
      listing of the schema's keys (config check --print-schema, say, which the Go port's JSON
      Schema gives anyway) would let it require those too. v0.3.0 also narrows hooks.manager,
      which has no default, to six values: a key whose accepted values change is invisible to the
      defaults as well. From v1.0.0 each release publishes itos.schema.json (T-054), every key and
      the values each allows: the check could compare the two releases' schemas.

  - id: T-029
    title: A release task's notes check judges its own release, not the current version
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-027]
    kind: task
    refs: [tasks/phase-1.yaml]
    why: >
      release-notes.ts with no argument judges the notes of package.json's version against this
      tree's defaults, so every release task's check (T-024's, T-027's) judges the newest release:
      T-024's went red when slice 7 added defaults, and goes green with v0.3.0's notes, not its
      own. Pinning the version does not help, since the defaults still come from the tree. The
      check could take the release's tag and read that tree's defaults (or the released tarball's),
      so a done release task stays green while later work changes defaults, and the notes of the
      next release are judged by its own task.

  - id: p1-shell-not-empty
    title: config check rejects an empty shell
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-3]
    kind: idea
    why: >
      Every command now starts through shell, read as its argv prefix; `shell: []` is accepted and
      then runs `sh <command>`, which reads the command as a script's path, so every check, step and
      delegate fails with a message about a missing file. config check could require at least one
      word, as it requires a list of strings.

  - id: p1-ci-run-every-failure-json
    title: "ci run --json lists every failure when it goes on past the first"
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-3]
    kind: idea
    why: >
      With ci.stop_at_first_failure false, ci run prints "CI failed at" for each failure but its
      --json verdict names only the first (failed_at), so an agent reading the JSON learns of one
      failure where the log shows several. A `failures` list beside failed_at, keys only added,
      would carry them.

  - id: p1-changelog-unconventional
    title: The changelog renders a release holding an unconventional commit
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
    refs: [tasks/phase-0.yaml]
    why: >
      vp run changelog, with or without --task or --scenario, fails: git-cliff gives the template's
      squashed "Initial commit" (1545231, in v0.1.0) no footers, and cliff.toml's body template and
      tools/changelog.ts's footer filter both read commit.footers. Leaving out commits.since and its
      ancestors, as verify does, or reading a missing footers as none, would fix both.
      A fix under T-010, whose checks (vp run changelog, with and without --task) prove it.

