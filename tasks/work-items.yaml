  - id: p1-targeted-quality-evidence
    title: Every push runs DRY, CRAP and Scrap over the changed code with proof they ran, their findings guidance only
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user asked on 2026-10-08 for enforcement that coverage, CRAP and Scrap were executed, as
      mutation is checked now, with coverage and mutation targeted to changed code. A separate
      repository CI task can call a composite provider without waiting for generalized roles. Derive
      subjects from the committed CI range, not --changed alone, which selects working-tree files.
      Require applicable source/test/config/tool inputs and complete measured subjects; reject
      missing, stale, malformed or empty proof instead of checking report-file presence. Distinguish
      an analysis executed for these inputs from valid cached evidence; reuse should avoid duplicate
      measurement. Keep CRAP and Scrap fast and reports visible, with Scrap recommendations advisory
      unless the person chooses a failure policy. ADR-0044 still forbids a coverage-percentage
      threshold; changed-function --fail-uncovered remains the rule. CRAP/Scrap v0.5.0 lack --since,
      so explicit changed paths provide file targeting until the provider supports changed
      functions. Mutation check/sample remain targeted; no full coverage or mutation fallback.
      Extend existing p3-role-protocol, p1-proof-paths-placeholder and p1-proof-summary for reusable
      enforcement rather than creating competing protocols. Nothing here is added to slice-102 or
      T-129.

      Accepted by the person on 2026-10-08: move mutant execution out of the local agent loop and
      into CI. Agents use tools/bin/itos push --no-wait, report the exact pushed SHA, leave a clean
      checkout and hand off without watching CI or closing the item. The coordinator watches
      asynchronously, can start independent work while CI is pending, owns closure once the covering
      run is green, and assigns red-run fixes in isolated worktrees with hooks installed. Red main
      takes priority before further landings; releases remain blocked until all required proof is
      green. CI measurements and reused evidence must cover changed committed functions, relevant
      unit and integration tests, and valid source/test/config/tool inputs. No automatic full
      mutation sweep, stale-cache pass, proof bypass, force-push or rewrite of published history.
      Make the CI/gate migration a separate task before resuming the blocked slice; do not push
      deliberately incomplete proof under the old check-only policy. Targeted coverage reuse is
      still a provider capability to establish, not permission to drop integration tests. Fail-fast
      remains opt-in when released by itos-cc, usable in CI rather than only local briefs.

      The person refined the accepted policy on 2026-10-08: push CI executes one mutant total over
      changed committed code; nightly executes 20 total, with explicit counts rather than relying on
      defaults. This is sampled mutation assurance, not proof that every changed function has all
      mutant outcomes. Coverage of changed code still needs honest current evidence. Current
      itos.yaml runs mutation sample with its default count of 20 in push CI, not nightly; move that
      budget to nightly. Pinned mutation sample only draws fresh cached outcomes and does not
      generate a mutation inventory for unmeasured changed functions, so new code must never get a
      vacuous pass from an empty cache. Establish fresh bounded mutation execution first; do not
      secretly generate all mutant outcomes to enable a one-mutant sample, run mutants locally, or
      keep the old complete-cache check while claiming the new workflow works. A source range with
      mutation sites but none judged must fail with a clear capability or execution problem; a range
      with genuinely no sites may be explicitly not applicable. All exploration, edits, scratch
      files and any worktrees stay within this repository directory; do not inspect sibling or
      dependency repositories.

      Fresh bounded mutation execution requested in donvargax/itos-cc#27:
      https://github.com/donvargax/itos-cc/issues/27. This is separate from #26 fail-fast, which
      cannot bound a successful run. Current pinned v0.5.0 can recheck cached samples but cannot
      generate an N-mutant fresh judgment for changed code with no complete cache. Do not migrate to
      sample --count 1 alone and let new functions disappear, or run a hidden full mutation prepass.
      The CI migration waits for an honest provider capability, then uses one mutant total per push
      and 20 nightly, explicit sampled/incomplete evidence and reproducible seeds. No code or
      dependency repository outside this directory was inspected or edited; the request was filed
      through GitHub only.

      Transition exception accepted by the person on 2026-10-08: the already-running local mutation
      job that could not be stopped may finish. Preserve and push its provider-generated mutation
      snapshots as they stand, even when the run or current CI fails; survivor/uncovered results are
      useful diagnostic evidence, not passing proof. Do not launch another local run, add unreviewed
      exceptions, doctor outcomes, claim partial data complete, or weaken CI/release gates. Stage
      only actual snapshots and owned work, not raw coverage runs or scratch data. Source/test
      changes can invalidate cached outcomes, so freshness remains the provider check. Agents push
      --no-wait and report the exact SHA; the coordinator owns watching, red repairs and closure,
      and no item closes on red. This exception is only for finishing and preserving the existing
      job, not a return to local mutant execution.

      Provider evidence request filed separately as https://github.com/donvargax/itos-cc/issues/28.
      Pinned v0.5.0 crap reports missing coverage as a warning unless a score threshold is chosen,
      and scrap recommendations are advisory; neither help exposes a report-freshness check or
      committed-range selector. Loose version-1 crap/scrap reports carry measurements without
      source/test/config/tool fingerprints; the inspected CRAP report names an obsolete /v2 package
      while the module is /v7. Hooks and the standing CI plan currently enforce mutation evidence,
      not fresh CRAP/Scrap measurement. Do not stage those unrelated loose reports or treat their
      presence as proof. Request explicit evidence completeness/freshness and valid reuse, with
      measurement-required behavior independent of metric thresholds. No coverage-percentage or
      Scrap failure policy was added, and no new coverage/mutation execution was run for this
      investigation.

      2026-10-23: the user asked whether DRY, CRAP and Scrap run; they do not, anywhere (the last
      local .metrics reports are from 2026-10-03). Mutation was built (the push proof, ADR-0057);
      this item's CRAP and Scrap half was not.

      2026-10-23, the user: DRY, CRAP and Scrap run as part of the workflow, and the workflow
      requires proof that they ran (fresh, for the changed code, not a stale report), but what they
      find is guidance, never a refusal: no threshold, no block, the findings shown to the
      implementing agent and the reviewer (and in the push and ci watch result) to act on by
      judgement. They run nowhere today: the last local reports are from 2026-10-03. Mutation's half
      was built (the push proof). Waits on itos-cc#28 for CRAP and Scrap of changed functions; until
      then changed files. The proof that they ran fits an evidence record (ADR-0060 shape) the
      lifecycle can check.
    refs:
      [
        itos.yaml,
        itos-cc.yaml,
        internal/proof/proof.go,
        docs/decisions/0044-no-coverage-threshold-mutants-judge-the-tests-and-fail-uncovered-refuses-untested-changed-code.md,
      ]
    tags: [proof]

