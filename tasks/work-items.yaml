  - id: p1-agent-rules-as-data
    title: The coordinator's and the implementing agent's rules are itos data, each with its exit and dates
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-119]
    kind: idea
    why: >
      The user's call (2026-10-06). Lessons grew as prose in AGENTS.md and ORCHESTRATING.md, read by
      every agent for every task, with nothing to retire them; failures of the best model available,
      but each fixed in prose with no exit. Rules become data (one file, a role field: coordinator
      or implementer; id, text, why, exit: a registry item or permanent, recorded and last-seen
      dates), managed by a noun group itos rule (add, seen, list) per docs/CLI.md. A check flags a
      rule whose exit item is done, and caps each role's count. itos go prints the coordinator's
      rules and itos guide work the implementer's, so each role reads only its own. For every
      project itos manages, not only this one. ORCHESTRATING.md's dated lessons (2026-10-06) are its
      first data.

      Scope agreed with the user (2026-10-06). One command group for both roles: itos rule add
      --role coordinator|implementer (a rule for both lists both; a rule with no role is refused);
      the role decides where a rule is printed (itos go for the coordinator, itos guide work for the
      implementer), rule list filters by --role, and the cap counts per role. Also in this item: (1)
      AGENTS.md, which the harness loads for every session whatever its role, shrinks to the
      generated gates block, the permanent policies and one line sending each role to its own rules,
      else the separation leaks there; (2) a rule may carry a scope (item kind, commit type, path
      globs matched against the item's refs), and itos guide work <item> prints only the rules that
      match, so briefs shrink to the item; (3) a defined moment for sightings: the coordinator's
      check of a result marks the rules it saw broken (itos rule seen <id>), and the brief's report
      asks the agent which rules it needed or broke.

      Backlog review of 2026-10-10, batch 4: folds in p1-guide-as-rule-data: once project rules
      prove themselves as data, the built-in guide and the brief template become rules too,
      versioned with itos, each with its exit and dates, and each project's rules layered on top
      (q-42 and q-43 already reshape the built-in guide).

      2026-10-10, with the user: q-45 to q-48 replace part (1) of the scope above. AGENTS.md routes
      no role at all (q-46) and drops the generated gates block's enumeration (q-45): it keeps
      universal safety boundaries and one line saying the gates enforce the repository's policy, and
      each before-action procedure loads the commit, footer, path and CI policy it needs from the
      config. itos status stays a snapshot with no notes (q-48); the coordinator's rules mention
      that the notes exist, with the reason to read them (q-47). Folds in p1-agent-rules-ci-summary
      (issue #27), moot once the CI list leaves AGENTS.md. Still to decide: the before-action guide
      commands' names and syntax (q-43), the rules file's path and schema, and the per-role cap.
      Breaking (init --agent-rules writes another block): part of the v8 release-candidate bundle,
      split before specifying, the AGENTS.md reduction first.

      2026-10-10, with the user: split. p1-guide-before-action (the procedures) and
      p1-agents-md-reduced come first, p1-notes-placement after; this item keeps rules as data.
      Decided: the file is guide.rules, by default rules.yaml in the ledger's folder (under a
      stealth config, in itos's git folder). A rule has an id (a slug, like an idea's), roles (one
      or both, none refused), at (the procedure that prints it: start, the role's essentials, or
      commit, push, brief, land, repair, decide), an optional scope (kinds, types, paths; refused on
      at: start, which q-44 keeps unscoped and, later, unsuspendable), text, why, exit (an item or
      permanent), recorded and last_seen. The cap is bytes, not a count: one per role and at, start
      the tightest, defaults in guide.budget, counting the rules' text and not what itos generates
      from the config; rule check fails over it, so a new lesson retires or tightens another.
      Commands: itos rule add|seen|list|check.

      2026-10-15 open-issue audit: #27's growing generated CI enumeration is already addressed by
      done slice-120, implementation 5a1bb170 and live ID-INIT-57..60. Current initrules.go emits
      the same two-instruction block for every repository; adding CI steps cannot enlarge it. This
      establishes the reported symptom's mapping, not completion of this broader rules-as-data idea.
      No extra renderer, ci-summary flag or implementation is needed for #27, and no GitHub closure
      was performed.

      2026-10-23 grooming, merged in p1-agent-rules-suspend (a permanent rule can be suspended,
      printed nowhere, restored by a sighting of its mistake, deleted after staying suspended
      through a model release: the vanilla baseline one rule at a time) and p1-notes-placement (itos
      go stops appending the notes whole: a note is a startup essential or attached to a role,
      procedure or item, printed where it applies; split from this item on 2026-10-10, q-47 and
      q-48). One design with p1-typed-items, v9.
    refs: [docs/ORCHESTRATING.md, AGENTS.md, internal/guide]
    tags: [agents, v9]

