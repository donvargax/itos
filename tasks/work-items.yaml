  - id: p1-push-needs-hooks
    title: itos commit and itos push check the gates they rely on
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found 2026-10-03: the coordinator's first docs commit from a new worktree reached CI
      unformatted. core.hooksPath named .vite-hooks/_, a folder vp config generates and git
      ignores, which the worktree lacked, and git then runs no hook at all, without a word: not
      the project's pre-commit, not itos's commit-msg, not pre-push. The user's calls: each
      command checks the gates it relies on, locally and fast, and read-only commands (itos work,
      itos config get, which the plugin calls every session) check nothing. A check is tagged with
      the commands that need it; itos init's rerun runs them all, and itos status summarises them.
      Three parts: a core.hooksPath that is set must exist, whatever the manager; the hook a
      command relies on (commit-msg for itos commit, pre-push for itos push) must reach itos, and
      hooks.bin must resolve (hooks.bin: itos with no itos on the PATH fails every hook with a
      bare "command not found"); and itos commit proves its hook ran: it sets a one-time token in
      the environment, itos hook commit-msg records seeing it, and when git returns without the
      record itos commit undoes that commit (HEAD, unpushed, its own), leaves the changes staged
      and says why. itos push checks before pushing, since proof after the push is too late.

