      trailer; oracle: git interpret-trailers --parse on the same message) and K143a (itos commit
      --amend --no-edit -F - read HEAD's message; oracle: the message git itself records for the
      same arguments, over generated combinations of -m, -F file, -F -, --amend, --no-edit). K150b
      (duplicate keys and several documents read silently) has a strict-parse oracle: every YAML
      reader refuses what value.Parse refuses.
