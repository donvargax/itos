  - id: slice-200
    title: "itos push --ready finishes on its own: merges a clean pull request, counts only the head's review, and returns before a harness's foreground cap"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: slice
    why: >
      Was p1-ready-clean-merges.
      Seen 2026-10-25 on #146 (T-307): the first itos push --ready waited through green checks and
      Copilot's review, then gh pr merge --auto failed with "Pull request is in clean status
      (enablePullRequestAutoMerge)": GitHub refuses auto-merge on a pull request that is already
      mergeable, which is exactly the state --ready waits for. A second --ready rebased, re-watched
      CI and got auto-merge on only because the rebase made the pull request unclean again: two
      waits on CI for one merge. When the pull request is clean, --ready should merge it (gh pr
      merge --rebase, the head pinned with --match-head-commit) rather than ask for auto-merge.

      Seen again 2026-10-25, twice: slice-151 (#149) once, and T-310 (#156) three --ready runs in a
      row, each refused at gh pr merge --auto with "Pull request is in clean status", so the
      implementer merged it directly with gh pr merge --rebase --match-head-commit <the head the
      green run judged>, what --ready should do itself when the pull request is clean. With strict
      required checks off, a pull request stays clean after main moves, so a rerun does not help; it
      now blocks merges, not only costs a CI wait.
    refs: [internal/slices/push/pr.go]
    tags: [push, v8]

