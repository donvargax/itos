  - id: p1-ledger-matches-registry
    title: A ledger.files pattern that matches the registry
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The registry's default home is tasks/, where ledgers live. This repository's ledger.files,
      tasks/phase-{group}.yaml, does not match tasks/work-items.yaml, but tasks/{group}.yaml with the
      default group pattern [^/]+ does: config check then fails with "tasks/work-items.yaml is not a
      list of tasks", and task list with a TypeError. config check could reject a ledger.files whose
      pattern matches work.registry (naming both), or the ledger could leave the registry's file out.
      Needs a scenario either way.

  - id: p1-people-checked-at-commit
    title: A staged people file runs the registry's check at commit
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-6]
    kind: idea
    why: >
      A registry's owners must be among the people (CONTRIBUTORS.md here, work.people's file), so an
      edit to that file alone can break the registry. Slice 6 runs the registry's check when the
      registry is staged, and T-023 drops the pre-commit check, which never watched the people file
      either; only CI's prose steps catch it, after the push. The commit-msg hook could run the
      registry's check when work.people's file is staged too.

  - id: p1-smoke-rule-at-commit
    title: A staged feature file runs the smoke rule at commit
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-6]
    kind: idea
    why: >
      The smoke rule reads the feature files as well as the smoke set: a feat that makes a file's
      scenarios live without a smoke entry breaks it while staging no smoke file, so the commit-msg
      hook's data check does not run (slice 6's own feat did this, and config check caught it only
      by hand). CI's smoke step catches it after the push. The hook could run the smoke part of the
      check, over the index, when a kind's test file is staged.

  - id: p1-verify-data-per-commit
    title: verify checks each commit's data at that commit, as the commit-msg hook does
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-6]
    kind: idea
    why: >
      verify re-checks every pushed commit with the commit-msg rules, but not the data check slice
      6 added to the hook: a commit made past the hooks with a broken ledger or registry, mended
      later in the same push, passes CI, whose config check reads only the head. source.ts can read
      a commit's tree, so verify could run the check at each commit that touches the data. Needs a
      scenario.

  - id: p1-pre-commit-asks-what-skips
    title: A project's pre-commit hook asks itos which staged files need no tests
    phase: 1
    owner: null
    status: todo
    depends_on: [T-023]
    kind: idea
    why: >
      The pre-commit hook's early exit is a hand-written pathspec (Markdown, docs/**, tasks/**,
      feature files) that restates what itos's config already says: ci.prose.paths, ledger.files,
      work.registry and the scenario kind's paths. A project that moves its registry or its ledger
      with work.registry or ledger.files leaves its hook skipping the wrong files, silently. An itos
      command could answer from the config whether every staged file is prose or itos's data, so the
      hook's exit is one line that follows the config.

