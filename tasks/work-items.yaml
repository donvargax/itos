  - id: slice-30
    title: A stealth mode, itos kept in the git folder of a repository that does not use it
    phase: 3
    owner: donvargax
    status: done
    depends_on: [slice-28]
    kind: slice
    why: >
      The user's call (2026-10-02): itos as their own discipline in many repositories, private and
      open source, whose teams may not adopt it, so nothing of it may show to other contributors:
      not in the tree, not in CI, not in the history. A Task: footer is the leak that defeats the
      point, so the link from a commit to its task lives in git notes (refs git push does not send
      unless asked), never in the message. What today's itos already allows: a config outside the
      repository (ITOS_CONFIG, read where it is), hooks in .git/hooks (hooks install --manager
      git), no CI. What the mode adds, to specify as scenarios: the config by default at
      <git common dir>/itos/itos.yaml (git rev-parse --git-common-dir), self-contained in the
      repository with no environment variable to set (the user's ask): itos looks for --config,
      then ITOS_CONFIG, then a committed itos.yaml (the project's mode), then that one; the ledger,
      the registry and the smoke set it names resolve beside it, in the same folder, so none of it
      can be committed, and every linked worktree shares it; a footer source read from a commit's note instead of its message, with
      the data read in the working tree (it is in no commit or index); hooks install chaining to
      the project's own hook when core.hooksPath is set (husky, lefthook, vp), never replacing it;
      and verify and ci plan over the person's unpushed commits (@{u}..HEAD) by default, since
      others' commits follow no rules of theirs. After the port: one Go binary in ~/.local/bin
      needs no Node or node_modules in someone else's repository, which is what makes the mode
      practical, and new behaviour lands in one implementation, not two.
      Specified in features/stealth.feature as slices 30 (the config in the git folder), 32 (the
      footers in notes), 33 (config-based hooks) and 34 (the unpushed range), with slice 31,
      itos commit, between them. The user's answers (2026-10-03): itos commit --task writes the
      link, a note in stealth mode, rather than a hook rewriting the message; the hooks are
      declared in .git/config (hook.<name>.command), which git runs beside the project's own.
      Slice 30 landed: the config in the git folder, its data beside it (the people too), a git
      tree read reading the git folder's files where they are, and the launcher running the
      newest release for a stealth config that pins nothing; slices 31 to 34 keep their own items.
    refs: [features/stealth.feature, PLAN.md]

  - id: slice-35
    title: A stealth config uses the global itos and reads no people file
    phase: 3
    owner: donvargax
    status: done
    depends_on: [slice-30, slice-33]
    kind: slice
    why: >
      Slice 30 reads a stealth config's data beside it, and the defaults are still a project's:
      hooks.bin is tools/bin/itos, which a repository that does not use itos has not got, and
      work.people is CONTRIBUTORS.md, now looked for in the git folder, so work and config check
      fail until the person writes a people file there (README.md's example sets both). A stealth
      config could default hooks.bin to itos, the global install, and its people to the one
      identity, through defaultsFor as work.registry's default already depends on the config.
      The user's calls (2026-10-03): a config in <git common dir>/itos/ is stealth however it was
      found; in it hooks.bin is itos, the global launcher, and no people file is read, the person
      being the only one. In a project a missing or malformed people file is reported by itos init
      (and its re-run) and silent elsewhere: work runs with no identity, already no error (config
      check at most a warning that never fails). A project's hooks.bin default stays
      tools/bin/itos through v2; v3 drops the key (v3-hooks-bin-default).
      Was p3-stealth-defaults. Specified as @ID-STEALTH-17 and -18, @ID-WORK-05 and
      @ID-CONFIG-19.
    refs: [features/stealth.feature, features/work.feature, features/config.feature]

