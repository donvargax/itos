      repair covers only push and nightly runs. It asks: ci.watch.github takes a list of workflows
      each with a role (gate: push and work done wait on it, today's workflow; after: same push, not
      waited on, judged by status and go; nightly), workflow and nightly_workflow kept as
      shorthands; status shows each one's newest run and its newest green run while the head has not
      passed; ci watch --workflow <name>; go reports a red after run as repair work, naming the
