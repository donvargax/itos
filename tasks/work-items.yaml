  - id: p1-cheap-coordinator-trial
    title: "Trial a cheaper model as coordinator: a dispatcher over strong spec and review agents"
    phase: 1
    owner: null
    status: todo
    depends_on: [p1-guide-brief-filled, p1-session-handoff]
    kind: idea
    why: >
      The user, 2026-10-23: test whether a cheap model can coordinate, the coordinator becoming
      mainly a delegator. Models: openai/gpt-6-luna#high first; openai/gpt-6.1-sol at low or medium
      effort the alternative. Its context stays under 272K tokens and read-cache friendly: a stable
      prefix (system prompt, AGENTS.md, then itos go with the guide and the repository notes before
      the volatile status, notes.md small), append-only turns (no compaction, which rewrites the
      history and loses the cache; start a fresh session near about 200K instead, which rereads the
      same prefix), no code or long logs read by the coordinator (an explore agent returns a short
      summary; reports capped in length; itos commands with --json filtered or limited output), and
      nothing held only in the session (everything recorded in itos as it happens, so a fresh
      session loses nothing). Judgement moves to subagents: a strong spec agent writes the @wip
      scenarios or the task why and checks, a strong read-only review agent checks each spec before
      hand-off and each agent report before landing, the person decides through itos decision. Trial
      on a bounded, low-risk stretch (three or four v8 GitHub issue fixes), a strong reviewer
      auditing each landing; compare tokens (p1-work-spend) and mistakes (a trusted report, a missed
      escalation, a weakened gate, a bad triage) against a stretch the current coordinator runs.
      Needs the brief filled by itos (p1-guide-brief-filled), status showing what is in flight
      (p1-session-handoff), and spec, review and implement agent definitions in .opencode/agents.

      2026-10-23: the user starts a first version of this trial next session: gpt-6.1-sol high
      coordinates and Claude Opus 5.5 only reviews (the reviewer CLI, every spec before hand-off and
      every diff before closing). Compare against today's Opus-coordinated session: items landed,
      coordinator interventions, review rounds, reds, and mistakes (a trusted report, a missed
      escalation, a weakened gate, a bad triage).

      2026-10-23 session assessment: coordinator overhead and sequencing contributed to slow
      delivery. Multiple simultaneous specification/review threads and an expanding conversation
      delayed starting the requested guide-override implementation; worktrees and spawns alone do
      not count as delivered behavior. Judge the dispatcher by time to accepted user behavior,
      genuine defects prevented, interventions and context size, not number of checks or reviews.
      Keep a bounded active working set and record decisions/artifacts in itos instead of using
      conversation memory as the durable controller. Honor the user pause after T-289; no
      guide-override implementation was started. Medium Sol completed T-288 and T-289 without
      coordinator coding help; bug-112 required CI branch-coverage and Windows-fixture repair plus
      substantive review corrections before green CI and closure. The stronger review was valuable,
      but mechanical corrections and missing reviewer configuration should not consume additional
      full review cycles.

      2026-10-23, the user closed the Sol trial: Sol as coordinator worked but struggled far more
      than Claude Code (Opus), which needed much less steering; coordinating here still takes a lot
      of effort. Claude Code coordinates and implements in this repository from now on. The user may
      retry a cheaper coordinator in other repositories once the coordinator role is simpler
      (perhaps through the state-machine work).
    tags: [agents]
    deferred: >
      The user ended the Sol coordinator trial and keeps the reviewer on its CLI for now; both may
      be retried once the coordinator role is simpler.

