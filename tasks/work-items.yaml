      proxy: <host>' when the proxy itself does not resolve; RemoteFailure reads neither, so the
      adapter gives port.Other and itos push exits as an unknown failure rather than 75 (try again).
      git cannot tell a blocked destination from a host that is down from the refusal alone; reading
