      runs, as --root does, so the extension starts at the top with ITOS_ROOT naming it, and a
      relative path the person typed after its name, which itos never reads, no longer means what
      it meant. itos's own commands read such a path from where the person stood; an extension
      cannot, since nothing tells it that folder. A variable such as git's GIT_PREFIX (the folder
      relative to the top, unset or empty at the top) would let it, or the extension could run
      where it was started with ITOS_ROOT still the top.
