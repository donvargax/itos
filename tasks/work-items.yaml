  - id: bug-31
    title: itos reads git's path lists unquoted
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: slice
    why: >
      Found by the code review of 07b0e6d (2026-10-05). git ls-files, ls-tree and diff --name-only
      run without -z or -c core.quotePath=false, so a path with a non-ASCII letter, a quote, a
      backslash or a control character comes back C-quoted: a never rule misses it, an only rule
      refuses it, must_touch misses it, and a feature file so named vanishes from index and commit
      reads (the moves rule and footer IDs). Seen in cli/hook.go:48, git/git.go:75, plan/scope.go:29
      and source/source.go:186-262. Its @bug-31 scenario is written before it is handed out.
    refs:
      [internal/git/git.go, internal/source/source.go, internal/cli/hook.go, internal/plan/scope.go]

  - id: bug-32
    title: Renames and type changes hide a path from the hook and from CI's plan
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: slice
    why: >
      Found by the code review of 07b0e6d (2026-10-05). The commit-msg hook's git diff --cached and
      the plan's Changed run with rename detection on, so a rename lists only its new path (git mv
      of code into docs/ passes a docs commit, and makes a range prose-only so build and tests are
      skipped), and the hook's --diff-filter=ACMRD leaves out T. verify uses diff-tree and
      disagrees. Read with --no-renames and every change type. Its @bug-32 scenario is written
      before it is handed out.
    refs: [internal/cli/hook.go, internal/plan/scope.go]

