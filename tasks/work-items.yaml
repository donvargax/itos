  - id: p1-guard-follows-cd
    title: The guard judges a git command in the folder a literal cd before it in the same list moved to
    phase: 1
    owner: null
    status: todo
    depends_on: [p3-guard-replacement]
    kind: idea
    why: >
      Issue #34 (https://github.com/donvargax/itos/issues/34). itos guard claude-code judges every
      git call by the hook input's cwd, so cd S && git commit, run from a managed repository, is
      denied though it commits in S, and cd R && git commit, run from outside, is never seen though
      it commits in the managed R. The guard already follows git -C. internal/guard/doc.go lists a
      command that moves with cd first among what it does not look into (the user's call,
      2026-10-03: a guardrail, not a fortress), so this widens a documented limit rather than fixing
      a contradiction. Proposed: a cd or pushd with a literal path, earlier in the same && or ;
      list, moves the folder judged; one built from a variable or a substitution keeps today's cwd
      and is named in the help, as sh -c and aliases are. The second case matters more, since a
      session started outside a managed repository commits in one past the guard where no git shim
      is installed.

      Backlog review of 2026-10-10, batch 2: folds in p3-guard-cd and takes its queue place: on
      2026-10-03 and 10-04 the guard denied git commit in scratch repositories under /tmp, judged by
      the session's folder, and an agent fell back to git commit-tree; a guard that pushes agents to
      plumbing is worse than one that follows the cd.

      2026-10-11 (slice-130's agent): the guard refused a plain git commit in a scratch repository
      under the session's scratchpad, outside any itos repository, so the agent fell back to git
      commit-tree. The guard should judge the repository the command runs in, not the session's
      folder.

      Definition outline for #34 and duplicate #69: first delivery follows literal cd, including
      quoted literal paths, relative paths and git -C after cd, in the shell AST already parsed.
      Directory changes inside subshells, command substitutions, pipelines, functions and background
      commands must not leak to the parent list. For cd D && git commit, the right side uses D; for
      cd D || git commit, the right side uses the original directory. A semicolon or conditional
      merge must consider both success and failure destinations, denying when any statically
      possible target is managed rather than asserting cd succeeded. Repeated cd resolves from the
      preceding possible directory. Do not execute shell commands to discover paths. Dynamic
      expansions, aliases and shell-dependent lookup remain documented limits; do not claim a fully
      resolved target for them. Literal pushd/popd and directory-stack modeling are a separate
      future item, not part of this first slice. Acceptance must prove managed-to-scratch allow and
      scratch-to-managed deny, existing git -C behavior, quoted/relative paths, nested isolation and
      control-flow joins. Preserve the guard's never-allow contract, its current error/exit policy,
      and ordinary config.Managed semantics. No plugin file changes are implied; if implementation
      touches them, obey the plugin version gate.

      2026-10-15, follow-up to q-67: after reviewing the scratch-fixture evidence in #34/#69, the
      user questioned whether the guard itself is still worth keeping and asked for the origins of
      both blocking plain Git and --no-wait. No choice to keep, remove or widen the guard has been
      made. The design review is p1-agent-git-ci-contract; resolve that before committing to the
      proposed directory-tracking implementation. The guard was introduced before CI waiting existed
      and does not enforce waiting; --no-wait existed from the introduction of ci.watch, while
      mandatory coordinator-owned handoff here came later in q-41. Keep source validation, command
      convenience and responsibility for CI as separate decisions.

      2026-10-15: the user parked the guard/workflow discussion at low priority without a deferred
      flag and requested no workflow changes now. Move this proposed guard enhancement out of the
      front of the queue, behind p1-agent-git-ci-contract. No narrow or broad shell-analysis
      implementation was selected in q-67.

      Met again 2026-10-24, three times in one day: spec drafters for bug-134 and slice-174 were
      denied a plain git commit in a scratch repository under $TMPDIR, outside any itos project,
      because the guard judges the session's folder; the first denial led to the failed cd that
      overwrote the main checkout's registry (p1-brief-scratch-probes).
    refs: [internal/guard/guard.go, internal/guard/doc.go, features/guard.feature]
    tags: [guard, v9]

