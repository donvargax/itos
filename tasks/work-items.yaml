      does) against the tag's corpus and features.

  # What the coordinator and the agents did by hand, the same way each time, in the session that
  # released v0.3.0 and v0.4.0: each could be a command. Asked for by the user.
  - id: p1-work-take-done-promote
    title: itos work take, done and promote write the registry
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Nearly every piece of work opened with a "take" docs commit and closed with a "close" one,
      each an edit of status: in this file by hand; ideas became slices or tasks through scripts
      that renamed the id, changed kind and added refs; the next slice number, T- ID and scenario
