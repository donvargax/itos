  - id: p1-json-gaps
    title: Every command's --json carries the facts its text gives, and every refusal prints its JSON object
    phase: 1
    owner: null
    status: todo
    depends_on: [p1-cli-kong]
    kind: idea
    why: >
      The corpus count for ADR-0052 (2026-10-21) found what a contract-only corpus cannot pin. No
      JSON at all: hook commit-msg, hook pre-push, tests smoke run, help. Refusals that print no
      object under --json: task <unknown id> and work or work list with a missing or unsound
      registry (exit 1); --as naming nobody, draft, followup and push outside a repository, commit
      and hooks install with undeclared hooks or an old git (exit 3); pin with no release server
      (exit 75). --json lacking the fact the text gives: verify names no problems or rule ids per
      failing commit (about 13 corpus cases wait on it), ci run gives only ok, failed_at and
      failures, draft promote does not name the id it minted, decision does not list answers not yet
      recorded, status gives no reason when GitHub refuses. Each is a feat after the freeze
      (ADR-0053); the corpus tasks T-198 to T-204 keep loose _has checks for them meanwhile.

      T-199 found more (2026-10-21). ci watch and push --json give ci: error with no reason when the
      API refuses, no token is found or no GitHub repository is known. push --json on uncommitted
      changes does not name the files. tests list --at a tree, with an adapter that cannot list one,
      does not say the working tree was read. A problem names the path, config key or id it is about
      only in its message (commit check-paths scope rules, config errors, a footer naming a test
      that is unknown or not live, both fixture-footer), so the corpus splits such cases or keeps a
      loose _has meanwhile.

      T-200 found more (2026-10-21). followup doc --json does not say the doc it wrote is in the
      work tree and not ignored by git, which the warning on stderr says. guide commit --json does
      not say it appended the commit policy the config sets, which only its text holds.

      T-201 found more (2026-10-21). commit check-message --json does not say that a commit made
      before the ledger existed has its Task: footer read against the working tree, which only the
      note on stderr says.

      T-202 found more (2026-10-21). task list --json does not name the work registry it found
      missing, which the note on stderr names. status --json gives last_green null both where no
      green run is found and where none is read (ci.range's provider none); only the text says none
      was found. init --json does not name .claude/settings.json, which a project-scope plugin
      install writes, among what to commit.

      T-203 found more, 2026-10-21. config check --json does not say how many ledger files it read
      or how many smoke tests the smoke set holds, which only the text says. ci run --json does not
      name the ledger folder an unknown task was looked for in, the tasks named but not started nor
      the registry that says so, or that --tests found no named tests to run; what ran, merged,
      covered, left out or left pending is the log alone, as above.

      T-204 found more, 2026-10-21. work --json does not say why the session is nobody,
      work.identity none with its hint or gh signed out or not installed, nor that the handle the
      provider gave is not among the people. work done --json gives ci unwatched but not that
      whether its commits are pushed went unchecked for want of a remote. verify --json names no
      problem or rule for a failing commit, as above.

      2026-10-24 grooming (the user's call): merged in two push entries. p1-push-json-not-waited
      (slice 56): a push whose commits touch only the work registry returns without waiting, and
      under --json its object is the one --no-wait or ci.watch.provider none prints, with no ci key,
      so a script cannot tell a run skipped on purpose from no watch set up; a ci value such as
      not-waited would say it. p1-push-json-registry-conflict (after slice-66): itos push explains a
      rebase stopped on a conflict in the work registry (two takes of one item) in text only; under
      --json the outcome stays rebase-stopped with nothing of the registry or the items both sides
      changed (internal/cli/push.go).

      2026-10-24 grooming: the problem-field paragraph moved to p1-problem-fields. The user: fold
      the rest into v9's JSON contract (q-89), not additive v8 fields.
    tags: [message, v9]

