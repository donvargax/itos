  - id: p2-trunk-review-and-release
    title: Trunk-only work with review after the commit, keyed to items, and review debt gating release
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's model (2026-10-17, from their stacked-workflow essay and SVN + FishEye + Crucible
      experience): a team swarming on a story commits straight to main, with no branches, not even
      short-lived ones; code that passes tests deploys behind a disabled feature flag; a review is
      opened later over the commits of a task, chosen even when not consecutive, so writing and
      reviewing code fall in separate blocks of time and teammates review with fresh eyes. Pair
      programming does not replace this review. Sources weighed the same day: Anthropic's
      'Redesigning source control' (Scion: trunk only, refs discouraged, no merge queue, post-merge
      and pre-deploy testing, reviewers judge intent, approval rules that tell comment-only from
      logic changes); Thorsten Ball on Amp (no PRs, push to main behind flags, irrefutable proof
      from agents); joelhooks/piper (a merge train, rejected, but its triage of a failed check,
      retried once then run on the base without the change, and its bisection of a red range, both
      fit post-merge testing: see p1-repair-plan). None of them reviews after the commit, which is
      the user's own piece. The shape: (1) trunk only, post-merge testing with that triage and
      bisection; (2) review after the commit, its commits chosen by Item: footer, each file diffed
      from before the review's first commit that touched it to after its last (git can compute this
      from blobs, as Crucible did per file); (3) itos tracks review debt, the commits on main no
      review covers, and the debt gates turning on a flag, not the merge; (4) check results keyed to
      the inputs they read, so a passed check never runs again (as p1-mutation-results-committed
      does for mutation); (5) approval rules by kind of change, from the types and paths itos
      already sorts; (6) an agent's handback carries proof itos can verify. The review UI: local
      first, a diff viewer over two refs itos builds with git plumbing and never pushes, so no CI
      runs on them (difit, diffity, diffx, Plannotator and viewers built on @pierre/diffs; the user
      knows of Pierre-based local viewers to find). A borrowed GitHub PR (head a tested main commit,
      base synthetic, never merged, CI filtered off review/**) is the fallback for annotations;
      GitHub ties checks and reviews to a branch head's SHA, which is why PRs are a hack here. Open:
      how the review comments become itos data that outlives the viewer, how itos learns a flag's
      state, which kinds of change may skip review, and the differentiators the user will add. The
      user plans to pitch agent-first hosting around this layer later; no new VCS or hosting is
      built now.

      Correction (2026-10-17, from the user's Gemini thread, .tmp/Trunk-Based Development
      Alternatives.pdf): the per-file span above leaks an unrelated commit into a file both features
      touch (a1, b1, a2, a3: b1 shows in the span), which the user rejects outright. The review diff
      is instead head = current main (a real, tested commit) and base = main with the review's
      commits reverted: b1 is on both sides and drops out, and a revert conflicts only where a later
      commit rewrote the review's own lines. And which commits a review holds must be data that can
      change after the push: the Item: footer is the default, with additions and removals kept
      outside the commit (git notes or the registry), since a footer cannot be corrected without
      rewriting shared history (the user's objection to Gerrit's Change-Id). The thread's claims
      that Gerrit topics and Reviewable give a combined diff of non-consecutive commits contradict
      its own earlier answers and are unverified; Phorge audits are believed per commit.

      Review UIs and prior art the user pointed to (2026-10-17). hunk (modem-dev/hunk, MIT): a
      terminal diff viewer built on OpenTUI and @pierre/diffs, the user's preference (CLI over web);
      it reads a patch from stdin (hunk patch -), so itos can pipe the review's diff (main with the
      review's commits reverted, against main) without making refs at all; it shows agents'
      annotations inline and ships a hunk-review skill; it reads git, jj and Sapling; where its
      annotations are stored is not documented. skepsis (oxidecomputer/skepsis): a local web UI on
      React and @pierre/diffs, early (0.1.x); it writes review comments into the source as code
      comments, which for review after the commit would put them on main, so not that part; it keys
      'viewed' state by the file's content hash, which is worth borrowing. Fossil: autosync makes a
      distributed VCS feel like SVN's commit-to-trunk; history is never rewritten (no rebase); a
      commit's comment, tags and branch can be amended later by an append-only control artifact
      (fossil amend), the shape this idea needs for a review's membership (git notes being git's
      nearest equivalent); tickets, wiki and a timeline UI (fossil ui) live in the repository
      itself.

      On GitHub's own infrastructure (2026-10-17, the user: a faster GitHub UI can use the existing
      infra): commit comments (line-level, on any commit, no PR) can hold the review's comments on
      main's commits, each placed on the commit that last touched its line within the review (blame
      over the review's commits), so the review needs no new storage; the Checks API gives each main
      commit's check runs and annotations by SHA, shown inline with nothing re-run, which answers
      the CI concern without a synthetic PR; immutable objects by SHA cache forever and ETag 304s do
      not count against the rate limit (about 5,000 requests an hour per user), so a caching client
      can be far faster than GitHub's UI; webhooks need a GitHub App and a small server (a Worker),
      else ETag polling. Prior art: DiffsHub (swap github.com for diffshub.com, on @pierre/diffs),
      ReviewStack, Reviewable. The de-risking order: local review with hunk, then a UI on GitHub's
      APIs with commit comments, then storage elsewhere (Cloudflare Artifacts, celld) only if the
      product needs it.

      Scope (the user, 2026-10-17): this idea stays the review piece for itos; the wider
      GitHub-alternative UI is a separate product, noted in p3-github-alternative-notes.

      Amp's CI/CD (2026-10-17, Thorsten Ball on X, from the user's summary; the post itself could
      not be fetched): direct pushes to main while SOC2 compliant; Buildkite runs tests and image
      builds, then GitHub Actions runs infrastructure security checks and deploys. A failed check
      blocks the deploy, not the push, and notifies that commit's author in Slack; later pushes keep
      running CI in parallel until the pipeline is green again. Staging then production in about 10
      minutes; durable agent infrastructure every 2 hours, CLI releases every 4. Fits this idea's
      gate on release rather than merge, and itos already releases only on green. How Amp meets
      SOC2's change approval without pre-merge review is not in the summary: worth finding out,
      since review after the commit as audit evidence would be a selling point.
    tags: [review]

