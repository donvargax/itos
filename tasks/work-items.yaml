  - id: p2-cross-repo-contract
    title: itos as the per-repository layer under a cross-repository coordinator
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's calls (2026-10-04): itos owns what can be decided inside one repository (its rules,
      gates, registry, queue and releases); a coordinator spanning repositories owns what none can
      (order across them, which session runs, the spend, a shared view). It starts a session per
      repository with itos go and acts only through itos commands, reading state through the --json
      outputs (itos status, work, work show, ci watch, ask), never editing a registry or pushing by
      itself, so those outputs become a versioned public contract that a compatibility check must
      hold. Agents in different repositories talk through issues in the receiving repository, sorted
      by labels and trusted by who acted, never through live chat; one coordinator per repository at
      a time (p1-checkout-lease). Cross-repository depends_on references (owner/repo#item), stored
      and reported but judged by the coordinator, only once someone needs them.

