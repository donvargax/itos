  - id: slice-36
    title: itos commit writes every footer a commit needs, its required ones refused up front
    phase: 3
    owner: donvargax
    status: done
    depends_on: [slice-37]
    kind: slice
    why: >
      The user's calls (2026-10-03), after asking whether footers with two roles are the right
      design: links (Task:, Scenarios:, IDs itos resolves) and content (Upgrading:, BREAKING
      CHANGE:, Co-authored-by:, text for people and tools) share git's trailer block, as git's own
      trailers already do, and the config's source already tells them apart, so no config change.
      itos commit gains a flag for each free-text footer the config declares (--upgrading here)
      and --breaking, writing BREAKING-CHANGE:, the form git parses (a "BREAKING CHANGE:" line,
      with its space, makes git interpret-trailers see no trailers at all in the block, so
      Co-authored-by and anything --trailer appends are lost to tools reading trailers through
      git). Before running git it refuses a commit missing a footer its type requires, naming the
      flag ("feat commits need --upgrading <text|none>"); the hook and verify still judge commits
      made any other way. In stealth mode the links go to the note and content stays in the
      message, so no stealth-only flag is needed (was p3-stealth-text-footers). Later, with the
      release cut by CI: git-cliff renders Upgrading and BREAKING-CHANGE (cliff.toml lists them),
      and itos commit footers and the release-notes footer check, which gather what generated
      notes hold by construction, are deprecated, then removed in v3.
      Amending too (the user's question, 2026-10-03): agents amend through itos commit --amend,
      git commit being the guard's; scenarios prove its footers are not doubled and a stealth
      note is rewritten, and it takes in p3-hook-amend-paths, which refuses a reword-only amend of
      a feat and made slice 34 soft-reset an unpushed commit to fix its message.
      Was p3-commit-content-flags. Specified as @ID-COMMITCMD-07 to -11 and @ID-STEALTH-19, with
      p3-hook-amend-paths as @bug-6 (@ID-COMMITCMD-12), fixed first.
    refs: [features/commit-command.feature, features/stealth.feature, internal/cli/gitcommit.go]

  - id: slice-37
    title: itos commit tells the hook an amend, the author's second kept only as a fallback
    phase: 3
    owner: donvargax
    status: done
    depends_on: [slice-32]
    kind: slice
    why: >
      Was p3-hook-amend-signal.
      Slice 32 tells an amend in the commit-msg hook by GIT_AUTHOR_NAME, _EMAIL and _DATE matching
      HEAD's author to the second, so a new commit by the same author in the same second passes on
      HEAD's note (verify still catches it). git tells prepare-commit-msg what it needs: its second
      and third arguments are "commit" and the commit's SHA for --amend, -c and -C. A
      prepare-commit-msg hook recording that for the commit-msg hook would be exact, and serve
      p3-hook-amend-paths too.
      The user's call (2026-10-03): replace the heuristic rather than keep both, before v2.1.0, so
      the release asks once for itos hooks install to be re-run. prepare-commit-msg (installed
      by every manager, a git config entry too) writes the SHA it is amending to a marker in the
      git folder; commit-msg reads and removes it, trusting it only while HEAD is that SHA, and
      falls back to the heuristic where the hook is not installed yet.
      Corrected (2026-10-03): git passes prepare-commit-msg "commit HEAD" only for an amend
      edited or --no-edit, and just "message" for -m or -F (tested on git 2.55), so the marker is
      dropped. itos commit tells the hook whether --amend is among git's arguments, always, and
      the author guess stays only for a commit made without it. A raw git commit --amend that
      sets another date stays unknown until p3-git-shim routes git commit through itos.
    refs: [features/stealth.feature, internal/cli/hook.go]

