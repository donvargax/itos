  - id: slice-16
    title: The nightly runs every done task's checks
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-9]
    kind: slice
    refs: [features/nightly.feature]
    why: >
      Only a push that names a task runs its checks, so a done task rots unseen: T-024 was red from
      slice 7 to v0.3.0, and slice 10 broke T-007, caught only because CI runs it on every push.
      ORCHESTRATING's brief now tells agents to run the done tasks whose checks call a command a
      slice moves, a rule a command can decide. The nightly could run every done task's checks,
      cheaper since slice 9 runs a shared check once, and report a red one as a regression.
      Asked for by the character editor, whose e2e-scope self-test failed unseen from the moment
      a pose golden joined its nightly until someone ran every done task's checks by hand. A
      nightly step { tasks: done, cost: static } runs the checks of every task whose work item is
      done (the user's call: not every task wait_on_status lets through, since a task in progress
      may be red until it lands), each shared check once, only the static ones with cost: static,
      and a red one fails the nightly naming its task's ID and title. Was the idea
      p1-done-tasks-nightly. @ID-NIGHTLY-01 to 04.

