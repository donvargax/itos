  - id: p3-extension-pins
    title: A repository pins the extensions it runs, fetched and checked like itos's own pin
    phase: 3
    owner: donvargax
    status: todo
    depends_on: [slice-27, slice-29]
    kind: idea
    why: >
      The user's call (2026-10-03), from the itos-security discussion: the launcher pins and
      checksums itos itself (pin.version, pin.checksums), but an extension is whatever itos-<name>
      comes first on the PATH, unpinned and unchecked, which a supply-chain check run as an
      extension would make ironic. A repository could declare the extensions it relies on in
      itos.yaml, each with a version, where to fetch it and the hash of its checksums, and the
      launcher would fetch them into its cache, check them and run that version for itos <name>,
      as it does for itos; an undeclared extension still comes from the PATH. Its first user is
      the dependency checks (T-067) if they move out of this repository into an itos-security
      extension, which waits for the user's repository template. The roles design (2026-10-03,
      p3-role-protocol) adds two questions for it: a role's source command that is missing is an
      error, never a pass, as an adapter's failure is (PLAN.md §12), so a role filled by an
      extension makes that extension a requirement of every hook and CI run that calls it, which
      pinning and installing it would make bearable; and a role-level check command, so config
      check can validate a source's own files (itos-cc's itos-cc-debt.yaml).
    refs: [features/extensions.feature, features/pin.feature, PLAN.md]
    tags: [extensions]
    deferred: >
      No repository relies on an extension yet: the dependency checks it was for stayed in-tree
      (tools/bin/deps-check). Its paragraph on p3-role-protocol is moot, that item dropped.
      2026-10-24 grooming.

