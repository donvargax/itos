      power), because agents held the main checkout and the coordinator could not commit; worktree
      agents removed that, so the coordinator records each change in itos as it happens and no
      handoff is written at all. itos status derives what is in flight: items doing, each one's
      worktree (worktrees named after their item, .claude/worktrees/<id>), its last pushed SHA and
      that run's state, unpushed commits, drafts waiting; holds go on the item as a note.
      .git/itos/notes.md goes back to facts true only of this clone, and the rule to prune it at
      each coordinator start goes with it. No itos handoff command; the typed-record dependency
      above no longer applies.

      2026-10-24 grooming: itos status already lists doing items, open questions and drafts waiting.
