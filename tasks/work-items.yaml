  - id: p2-stateful-pbt-registry
    title: A stateful property test drives the work registry with random operation sequences against a model
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user (2026-10-11), after weighing agent-formal-verify: itos has no property-based testing;
      itos-template uses pgregory.net/rapid (17 rapid.Check properties, none stateful), as
      go-template-itos does. itos's richest state is files edited by sequences of operations, which
      stateful PBT tests on the real code: random add, take, give-back, done, queue and drop against
      a plain in-memory model, the invariants that the registry stays sound, the queue consistent
      and comments kept; then the config editor (rename and remove keep every other byte) and the
      ledger's minting (no ID twice). A pilot after v8; CI and itos-cc run it with a fixed seed so a
      mutant is not killed on one run and kept on the next. If it pays, a standard tier (#41).

      The person, 2026-10-25: the whole domain is verified by stateful, model-based property tests:
      properties of the system over random sequences of domain operations against a plain model,
      with invariants after each step and shrinking to the shortest failing sequence; input-level
      properties are fuzzing and formal models are not for everything. ID minting first (T-310,
      which also sets up rapid, the fixed seed per push and the fresh nightly seed). Then, each its
      own task once T-310 shows the pattern: this registry lifecycle (add, take, give-back, done,
      drop, queue, defer); the ledger (minting, a close removing its checks); push's classification
      of a range (registry prefix, push.pr.direct, work on main) as a function of commit sequences;
      work done's trust (bug-137 is the kind of sequence such a model finds: a check added to the
      item's task on main after its head's run); the evidence store (record, lookup, quarantine,
      under concurrency); the config editor (rename and remove keep every other byte). Concurrency
      through linearizability checks on the real code, not TLA+.

      The reviewer replay (2026-10-27): two known bugs are sequences this programme's models would
      generate: K137 (bug-137, a done_when check added on main after the head's run, skipped by the
      trust) and K153 (push's Touched(parent..commit) followed a merge's second parent; a history
      generator with merge commits against a first-parent model). Each is a regression seed for its
      domain's model.
    refs: [internal/work, internal/value]
    tags: [tests]

