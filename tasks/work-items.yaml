# Who works what, and what waits on what. A session reads this through
# `vp run work`, which says who it is working for (the account `gh api user`
# is signed in as, or `--as <handle>`) and proposes the next items that person
# can take: `todo`, every dependency `done`, owned by them or by nobody. Who
# works on the project is CONTRIBUTORS.md.
#
# What an item is and when it is done stays where it already lives: a slice's
# scenarios in features/, a task's checks in tasks/. This file holds only
# the routing. Change it in a `docs` commit: take an item by setting `owner`
# and `status: doing` before starting it, mark it `done` in the commit that
# lands it (or the next `docs` one), and add the items a slice discovers.
#
# Keys of an item: `id` (a slice as `slice-<n>`, a task by its T- ID, anything
# not yet numbered as `p<phase>-<name>`), `title`, `phase`, `owner` (a GitHub
# login that CONTRIBUTORS.md lists, or null), `status` (todo, doing, done,
# blocked, or dropped, which `itos work drop` alone sets), `depends_on` (item IDs), optional `issue` (a GitHub issue number),
# `refs` (where it is specified), `kind` (slice: needs scenarios and a feat;
# task: a tasks/ entry with checks, its T- ID given when it is written; idea:
# a gap with neither yet), optional `why` (an idea's short reason),
# `deferred` (why it is put off; the item stays `todo`, is listed apart and
# is never proposed as startable) and `blocked_by` (why, when blocked on
# something outside this file).
#
# This file is an index (decision 34, slice 76): a why is an idea's, since an
# idea has no spec yet. A slice's or a bug's why lives in its feature file
# (the description and the comments above its scenarios), a task's in its
# ledger entry, a change's in its commit. `itos work done` drops the why of
# the item it closes, so a done item holds its index fields alone and the
# file grows with the open work; the dropped text stays in git's history.
# An item no longer wanted is not deleted: `itos work drop <id> --why '…'`
# sets it dropped, drops its why and records the reason as its commit's body
# (slice 78), and the item stays here so its id is never given again.
#
# This file is the one list of open work: no TODO or ROADMAP file sits beside
# it. A gap a slice leaves goes in as a `kind: idea` item, with a title, a
# short `why`, its owner or null and its `depends_on`, in the slice's last
# `docs` commit; `vp run work` lists the open ideas apart from what can start
# now. A coordinator who picks an idea up specifies it (`@wip` scenarios, or a
# task in tasks/) and changes its kind to `slice` or `task`, and its id if it
# becomes a slice or a T- ID.
#
# CI reads it too: a task a pushed commit names whose item is still `todo`
# waits (itos.yaml's `ci.wait_on_status`), since nobody has started it.
#
# The top-level `queue:` lists item ids in the order the work comes in, one
# queue for the repository, ideas included: `itos work` proposes in its order,
# `itos work queue <id> --top|--before <id>|--after <id>|--drop` edits it and
# `itos work done` takes a closed item out of it.

