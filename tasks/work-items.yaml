  - id: p3-stealth-scope
    title: A stealth config's scope, so commits outside the subproject it owns pass unjudged
    phase: 3
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's case (2026-10-03): a work monorepo, stealth mode required, one subproject worked
      on, a branch and a pull request per change, rules not theirs to change. Stealth mode already
      judges only the person's own commits (the hooks run on their machine, verify with no range
      judges what no remote has), and others' commits are not theirs to judge; what is missing is
      their own commit outside their subproject, a drive-by fix or a shared config, which today
      must carry a Task footer and pass the path rules. A config's scope (paths, e.g.
      services/billing/**) makes the hooks and verify judge only commits touching it; a commit
      touching nothing in scope passes unjudged. Ledgers per subproject need nothing new: one
      stealth config, ledger.files "tasks/{group}.yaml" with the group the subproject. Chosen over
      ITOS_CONFIG and an ITOS_STEALTH variable selecting a config per shell, since a hook sees only
      the environment of whoever ran git, so the same commit would be judged by different configs
      from a terminal, an IDE or an agent. Phase 2, only if one config is not enough: several
      stealth configs under <git common dir>/itos/, each with a scope, the hooks choosing by the
      staged paths and refusing a commit spanning two.
    refs: [internal/config/stealth.go, features/stealth.feature]
    tags: [stealth]

