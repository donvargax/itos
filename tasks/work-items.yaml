  - id: p1-loop-driver-pilot
    title: "Pilot the item loop as a Claude Code dynamic workflow: deterministic stages, a subagent per role with its own model"
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-172]
    kind: idea
    why: >
      The user, 2026-10-23, from the grooming: the v8 pilot of p1-item-lifecycle's loop, built as a
      Claude Code dynamic workflow script outside itos. Stages in order: spec draft, spec review
      (the reviewer's prompts as a read-only subagent or the CLI, p1-agent-self-review), take, red
      first, implement, push --no-wait, ci watch, diff review, repair rounds, work done. Each stage
      is a subagent with the model its role wants (Opus for specs and review, Sonnet or Haiku
      implementing). State comes from itos (work show, ci watch --json, the evidence records), never
      stored apart, so itos itself needs no Claude Code (itos runs without the plugin). Escalates to
      the person only a decision the spec does not settle or a red that repeats after a repair.
      Needs p1-ci-watch-failed-step (the failure handed back) and p1-guide-brief-filled (the brief
      from the item); its first users are p1-haiku-implementer-trial and
      p1-sonnet-implementer-trial, and running it is what tells whether a cheap coordinator is
      realistic (p1-cheap-coordinator-trial).

      The user, 2026-10-24: escalation goes to an answering agent first, not the person: it settles
      what the spec does not, drawing on decisions already recorded (here and in other repositories,
      p2-cross-repo-contract), and records each answer for the person's daily or weekly review. Only
      a hard blocker reaches the person at once.

      The user, 2026-10-25: the driver is a program walking the item state machine, and runs several
      implementations in parallel, on items touching different areas (p1-refs-overlap), which is
      what lifts the coordinator's throughput. The stages are now push.mode pr's with push.pr.draft,
      walked by hand on slices 179 and 181 and on #134: spec drafter (Opus) commits the spec and
      pushes, which opens the item's draft pull request; the reviewer CLI's pr mode, stage spec,
      posts its verdict and threads and prints one line (VERDICT round=N threads_open=k URL); fix
      rounds by the drafter, replies on threads, the reviewer's next round resolves them; the
      implementer (Sonnet) starts from the item's branch, red first, pushes the draft, hands back;
      reviewer pr mode, stage diff; thread rounds; the implementer alone runs itos push --ready
      (marks ready, rebases, waits for CI and Copilot's review, refuses open threads, turns on
      auto-merge); the merge; work done on main; the issue closes by Closes #n. Each transition
      reads state from GitHub (the pull request's draft state, threads, reviews, checks) and itos
      (ci watch, work show), never from the agents' reports, which are claims. Judgement stays with
      the coordinator: triage, the spec's decisions, disputes between drafter and reviewer (#137's
      round 1 blocker was the reviewer's misread), and anything the person decides.

      The user, 2026-10-25: the driver supports every flow, the registry in the repository's YAML or
      in GitHub issues, crossed with strict trunk-based development (push.mode trunk) or pull
      requests (push.mode pr, draft or not). So the driver never branches on the flow: it calls
      itos's commands (push, push --ready, work done, ci watch, the registry moves) and reads their
      answers, and itos turns each config into behaviour, held by its scenarios. What itos lacks for
      that: one per-item next-step answer (the state machine's current state and next transition)
      under all four flows, where today state is spread over work show, the pull request, its
      threads and ci watch; the registry moves (take, done, queue) behind one interface for YAML and
      GitHub; and the review in both forms, the reviewer CLI's pr mode posting on a pull request
      under pr, its plan and diff modes on pushed commits under trunk.
    tags: [agents, v8]

