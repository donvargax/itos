  - id: p1-nightly-changed-sites-other-os-files
    title: The nightly's changed-sites step can never pass while its range holds a file only another OS builds
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found by T-161's local run (2026-10-12): mutation run --since 9397855d --fail-uncovered=lines
      over cmd and internal reports internal/idcounter/counter_file_windows.go (changed 2026-10-08,
      after the last green nightly) as mutation.coverage-missing on Linux, itos-cc#18. Strict
      coverage judges every admitted function of the range, not only the sampled sites, so the night
      stays red while that change is in the range, and the base moves only on a green night: the
      step can never go green on its own. The push proof has the same rule but sees the file only
      when a push touches it. Options: wait for itos-cc#18, or give the step paths or an exclusion
      that leaves out files no Linux build compiles. The same run listed 22 uncovered changed lines
      in 7 functions and a survivor in initWrite (init.go:326) since 2026-10-08, which are the
      step's real work.

      The exclusion is in place (6baa9772, T-161, the user's call of 2026-10-12): the nightly's
      changed-sites step judges only the Go files of cmd and internal that a Linux build compiles,
      from nightly-base -linux-files, so the windows file no longer keeps the night red. The idea is
      now to remove that narrowing, passing cmd internal again, once an itos-cc release fixes
      itos-cc#18.

      T-276 raised the pin to itos-cc v0.26.0 on 2026-10-22, which fixes itos-cc#18: a Go file only
      another OS builds is listed under not_built and fails nothing, so the step passes cmd internal
      again. What is left: nightly-base -linux-files and its tests stay only because T-191, still to
      do, passes its files in its eight checks; drop the flag when T-191 closes, or once its checks
      pass cmd internal as the nightly step now does.
    refs: [itos.yaml, internal/idcounter/counter_file_windows.go]
    tags: [proof, v8]

