    status: todo
    depends_on: [p1-item-lifecycle]
    kind: idea
    why: >
      The user, 2026-10-21: every coordinator session appends its handoff to .git/itos/notes.md by
      hand (in flight, closed, next, open questions, local-only commits, lessons), and the file
      grows without shape (this clone's is hundreds of lines). itos handoff collects what itos knows
      (items in progress and their pushed SHAs, unpushed commits, open questions, running CI, drafts
      waiting, recorded artifacts) and takes the session's own text for the rest, writing a dated
      section; itos go prints the newest handoff in full and older ones as one line each, and itos
