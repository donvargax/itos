    depends_on: [p1-typed-items]
    kind: idea
    why: >
      #98 (an ops repository deferring hardware keys to 2027): a deferral's date can only live in
      its free-text reason, where nothing reads it, so the item stays out of sight. work defer
      --until <date> keeps the date beside the reason; from that date itos work and status list the
      item as due. Same date form as p1-work-item-dates.
