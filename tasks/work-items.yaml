  - id: p1-tampered-fixture-unused
    title: The tampered corpus fixture, which a dropped check ran and nothing runs now
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found doing T-125 (2026-10-08): tools/itos/conformance/fixtures/tampered.yaml holds six
      cases copied from the corpus with one expectation changed each, so a runner that compared
      nothing, or one field only, would pass it. It is outside the folder the runner reads
      (tools/itos/conformance/*.yaml), so a whole-corpus run never sees it, and T-006's check that
      ran it by --only and needed it to fail is one of the 187 T-125 dropped. Nothing proves the
      runner's comparisons now but the cases it judges, so a comparison that stopped judging
      something would go unseen. It wants a home: a case in the corpus whose fixture file names
      what must fail, or a self-test beside the runner.
    refs: [tools/itos/conformance/fixtures/tampered.yaml, tools/itos/conformance/run.ts]
    tags: [gates, v8]

