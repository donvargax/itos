  - id: p2-cross-repo-contract
    title: itos as the per-repository layer under a cross-repository coordinator
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's calls (2026-10-04): itos owns what can be decided inside one repository (its rules,
      gates, registry, queue and releases); a coordinator spanning repositories owns what none can
      (order across them, which session runs, the spend, a shared view). It starts a session per
      repository with itos go and acts only through itos commands, reading state through the --json
      outputs (itos status, work, work show, ci watch, ask), never editing a registry or pushing by
      itself, so those outputs become a versioned public contract that a compatibility check must
      hold. Agents in different repositories talk through issues in the receiving repository, sorted
      by labels and trusted by who acted, never through live chat; one coordinator per repository at
      a time (p1-checkout-lease). Cross-repository depends_on references (owner/repo#item), stored
      and reported but judged by the coordinator, only once someone needs them.

      From another coordinator's notes (2026-10-05): a dependency summary across sibling
      repositories, rendered by the coordinator from each repository's stored owner/repo#item
      references, would complement the per-repository ledgers.

      The user, 2026-10-24 grooming: a cross-repository coordinator of sorts is needed sooner rather
      than later, so it is designed for v9, beside the JSON contract (q-89, p1-cli-kong), the item
      lifecycle and the data store it reads. p1-checkout-lease, named above, is dropped.

      The user, 2026-10-24: itos repos has not worked at all. Start simpler: run itos in a folder
      that holds every repository, as if it were a monorepo, and coordinate the work there, as a
      test of a starting point. Wanted: a canvas to view every repository's work, and orchestration
      that is simple once the workflow is deterministic, running by itself and showing when
      something needs the person. Inspiration: github.com/AsteroidHunter/facilitator, the earlier
      review of how T3 Code orchestrated Claude Code, and tmux-style session hosts (herdr); GitHub
      issues as the inbox through which agents talk. Needed mostly for opencode today. Likely a
      separate tool that uses itos, not an itos feature, still open. The user has a very basic
      prototype to share.

      The user, 2026-10-24: the starting point and proof of concept is their opencode page,
      ~/tmp/llms-safe/opencode-server/sessions.html (sessions grouped by project directory through
      opencode serve's HTTP API, run.sh starting the server): opencode support alone first.

      The user, 2026-10-24, correcting the research's first-version sketch (which made the person
      the coordinator and ran nothing by itself): deterministic means it can be automated. The
      projects run on their own, agents implementing everything and never waiting on the person.
      Only a question no repository can answer, or a hard blocker, leaves the loop, and even then
      another agent answers it first: the person reviews those decisions daily or weekly rather than
      being asked as they arise. Many questions repeat across repositories with the same answer, so
      answers are reused across them (a shared decision memory the answering agent consults). More
      to think through before a design.
    tags: [status, v9]

