      for a human, and moving commits.since is not. itos waive --reason "..." runs verify over the
      commits since the last green CI run, lists the failing ones and writes them, with the
      reason, to a waiver list in the config, committing that change itself (a SHA argument picks
      one); verify passes a waived commit and prints its reason; CI's red verify prints the
      command. A guardrail, not a fortress: the plugin's guard denies git commit, git push and
      itos waive to agents, itos commit refuses a staged change to the list, and with those in
      place a waiver is taken as a human's, with no signature, tag or note. Claude Code's sandbox
      or Cupcake could firm the guard up later if ever needed.
    refs: [itos.yaml, internal/cli/verify.go]

