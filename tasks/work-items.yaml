      squashed "Initial commit" (1545231, in v0.1.0) no footers, and cliff.toml's body template and
      tools/changelog.ts's footer filter both read commit.footers. Leaving out commits.since and its
      ancestors, as verify does, or reading a missing footers as none, would fix both.
      A fix under T-010, whose checks (vp run changelog, with and without --task) prove it.

  - id: slice-18
    title: CI names the ledger footer, the ledger's folder and the prose steps as the config does
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-4]
    kind: slice
