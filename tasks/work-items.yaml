  - id: p3-role-protocol
    title: One adapter protocol for every role a command fills, the test kinds' own
    phase: 3
    owner: null
    status: todo
    depends_on: [slice-29]
    kind: idea
    why: >
      The design agreed with itos-cc's maintainer (2026-10-03), itos-cc being a code-quality tool
      (CRAP, mutation testing, duplication) that will run as the extension itos cc. Three layers:
      commands (itos <ext>, exists), checks (any command in ci.steps or a task, exists) and roles,
      a protocol itos defines and enforces rules over, filled by any command; extensions fill
      roles, they do not invent them. Test kinds are the one role today. Every role shares the
      test kinds' adapter protocol as it stands (PLAN.md §6): <command> list --at <tree>
      (worktree, index or a SHA) printing one JSON object with "protocol": 1, and range checks
      with staged and range commands ({from}, {to}), so a later role costs no new protocol.
      Where the brief that proposed this differs, itos's protocol wins: the key is "protocol",
      not "schema", which stays the key of every command's own --json output. Exit codes stay
      0/1/2/3 (pass, policy, usage, environment), read from a source as from an extension; detail
      goes in each problem's rule ID, prefixed by its source (cc/mutant-survived).
    refs: [PLAN.md, docs/extensions.md]

  - id: p3-debt-role
    title: A debt role, the known-wrong things a project accepts for now, listed by a source
    phase: 3
    owner: null
    status: todo
    depends_on: [p3-role-protocol]
    kind: idea
    why: >
      The second role (p3-role-protocol): a list of things known to be wrong, accepted for now,
      each to be owned: CRAP or mutation debt from itos-cc, later quarantined scenarios, TODOs,
      accepted security findings. Configured role first, then source, as test kinds are:
      debt: { code-quality: { list: "itos cc debt list", range_checks: [{ staged: "itos cc check
      --staged", range: "itos cc check --range {from}..{to}" }] } }, the source's name the prefix
      of its entries' IDs; a source need not be an extension, as godog is not one. Decided
      (2026-10-03): debt is a committed baseline its source lists without measuring (itos-cc
      keeps itos-cc-debt.yaml at the repository's top; its own range check refuses a new
      violation the baseline lacks), so listing is cheap, and the hook calls a source only when
      the commit stages its baseline or the work registry, as it lists only the test kinds a
      message names; measuring (running tests, mutants) stays a late CI step. A source that is
      missing or fails is an error, never a pass (PLAN.md §12). itos treats entry IDs as opaque
      and never reads the source's files; the source never sees a work item: the two share IDs,
      never formats. Open: moves, since an entry's ID holds a file path (itos-cc reads an
      unchanged function hash under a new ID as a move, and a claim by glob may still break),
      which may want a moves rule like the scenarios' builtin.

      The user's design note (2026-10-03), for when itos-cc fills this role: the agent runs itos-cc
      mutate on what it changed; the commit hook only checks, by a per-function hash of each changed
      function (and of the tests that ran) recorded in itos-cc's cache, that results exist for
      exactly the staged code, refusing a stale or missing one; CI re-runs the changed functions'
      mutants, fully or as a random spot check, refusing a commit whose recorded results do not
      hold, so forging them is a bad bet. Per function, since itos-cc's annotation comment would
      change a file's hash. Until then, mutation comments added by hand go in refactor commits.

      The split (the user's question, 2026-10-03): the role, the hook's check, CI's re-run and the
      debt list are itos's; the evidence is itos-cc's, whose cache already hashes each function.
      What itos-cc still needs is donvargax/itos-cc#8: a check mode that runs nothing, the tests'
      hash in the cache, and a sample mode for CI.

      itos-cc's state on 2026-10-07 (its agent's answer): mutate is renamed itos-cc mutation run
      (cc3fecb). #9 is done: --since <ref> judges the functions changed in <ref>...HEAD, never the
      working tree (268bbf7); --fail-uncovered fails an uncovered mutant, exit 1 (a010631); --json
      lists every mutant with file, line, column, function, operator, outcome (killed, survived,
      timeout, uncovered) and reused, exit codes 0 pass, 1 survivor, uncovered or failing baseline,
      2 usage, 3 outside git, no 75 (bb2aa2f, 313ea4a). #4, #12, #13, #1, #2 are closed. #8:
      mutation check (0cbba44) and results going stale when their tests change (d943490) are done;
      mutation sample is next. #10 (equivalent mutants with reasons) is open. None of it is
      released: the newest itos-cc release is v0.1.1 (2026-10-03), and itos pins its provider by
      release, so this item and p3-role-protocol stay deferred until a release carries mutation
      sample.

      itos-cc after v0.2.0 (2026-10-07; #8 closed by d78ed07 and #10 by 6072800, both after the
      v0.2.0 tag, so a later release carries them): mutation sample exists and must run with the
      same flags the results were recorded with (--all-tests for a nightly), else kills made only by
      end-to-end tests read as false mismatches. Equivalent mutants are excepted in itos-cc.yaml at
      the project root under mutation.exceptions, each with its reason; writing one keeps the file's
      other keys and comments but re-indents it to 2 spaces. New problem rules:
      mutation.exception-stale exits 1 (why: killed, changed or gone); exception.no-survivor exits
      2, as does config.invalid for a bad itos-cc.yaml, checked before mutation run, check and
      except do anything. In --json every file has an excepted count, and an excepted mutant keeps
      outcome survived and gains excepted, holding its reason. itos's gate reads these, never the
      cache or itos-cc.yaml itself.
    refs: [PLAN.md]

  - id: p3-debt-claims
    title: Work items claim debt entries, and itos refuses debt nobody owns
    phase: 3
    owner: null
    status: todo
    depends_on: [p3-debt-role]
    kind: idea
    why: >
      A work item claims debt entries by ID or glob, pays: ["code-quality:crap:billing/**"], a new
      registry key, so a feat with scenarios. itos refuses, in config check, the commit-msg hook
      and verify: an entry no open item claims; an item marked done while it still claims an
      entry; a claim that matches nothing. An item that pays debt is then proven done without a
      hand-written check. Decided (2026-10-03), option A with a start point: every entry owned at
      every commit, which the committed baseline makes cheap (p3-debt-role); entries already in
      the baseline at a start commit, as commits.since starts verification, are exempt or claimed
      by an explicit legacy item, so adopting it in an existing codebase needs no claim per old
      entry and verify does not judge history written before it; only entries added after it
      must be claimed. A commit that adds debt must be able to carry its claim, so a project's
      commits.scopes has to let the commit adding debt touch the registry. Open: a glob claim lets
      new debt join an item quietly, so itos work list could show how many entries each item
      claims.
    refs: [PLAN.md]

