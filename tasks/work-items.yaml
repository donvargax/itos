      JSON. A consumer that configures a ledger before making its folder meets that first in config
      check. The ledger's loader could report the folder once, as the footer rules do.
      Each command reports the folder the way the footer rules do: one problem naming it, exit 2,
      and config check --json the config error's report. Was the idea p1-ledger-folder-missing.
      @ID-LEDGER-01 to 06.

  - id: slice-15
    title: A check merged into a run of named tests that does not happen runs as itself
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-12]
    kind: slice
    refs: [features/ci.feature]
    why: >
      Found in slice 12: with an empty smoke set and a range that names no test, the plan has no run
      of named tests, yet a task's check recognized as the smoke run (as: smoke) is still marked
      merged, and ci run logs it "(in the scenario run above)" under no such run. It could run as
      itself instead, or be logged as selecting nothing.
      Decided: it runs as the task wrote it, since nothing else proves it. Was the idea
      p1-merged-check-without-a-run. @ID-CI-04.

  - id: p1-data-at-ledger-folder
    title: ci plan --data-at names a commit's missing ledger folder by the commit, not a scratch path
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [slice-14]
    kind: idea
    why: >
      Found in slice 14: ci plan --data-at <sha> copies the ledger at the commit into a scratch
      folder and reads it there, so a commit with no ledger folder is reported as "the ledger's
      folder /tmp/plan-data-…/tasks does not exist" (ledger-folder-missing, exit 2): one problem as
      the slice wants, but naming a path that is gone when the user reads it. It could name the
      folder at the commit (tasks at <sha>), or read a commit before the ledger as having no tasks.

  - id: p1-several-test-kinds
    title: A CI run that merges more than one kind of named test
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
