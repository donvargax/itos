  - id: slice-59
    title: itos init writes the config's rules for agents as a generated block in AGENTS.md
    phase: 3
    owner: donvargax
    status: todo
    depends_on: [slice-48]
    kind: slice
    why: >
      Was p3-init-agent-rules.
      The user's call (2026-10-03): init readies agents too, for a repository adopting itos that
      cannot start from the project template. How to work with itos stays in the plugin's skill,
      versioned with itos, and AGENTS.md points to it; what the config decides (the commit types,
      the footer each needs, the path scopes, what each gate runs) is generated from itos.yaml
      into a marked block in AGENTS.md (<!-- itos:begin --> … <!-- itos:end -->), with a one-line
      @AGENTS.md import in CLAUDE.md for Claude Code. init writes it, a rerun regenerates only
      inside the markers, and the doctor run reports a block the config no longer matches. A
      project file without the markers gets the block only after asking on a terminal, or with
      a flag for an agent. Under --stealth (the user's calls, 2026-10-03), nothing tracked is
      touched and every file written is listed in .git/info/exclude: the rules go to
      <git common dir>/itos/AGENTS.md, shared by every worktree; Claude Code gets a CLAUDE.local.md
      whose block imports @AGENTS.md (when the project has one, since a CLAUDE.local.md otherwise
      stops Claude Code reading it) and that file; Codex, which has no imports and reads one file
      per folder with AGENTS.override.md winning, gets an AGENTS.override.md that itos creates
      holding a marked copy of the project's AGENTS.md (<!-- itos:agents-md:begin --> … end) and
      the rules block. An AGENTS.override.md or CLAUDE.local.md that already exists is the
      person's: it gains only the rules block, after asking, never the copy. A rerun refreshes
      the blocks it finds, and the doctor reports a copy that no longer matches AGENTS.md or
      rules that no longer match the config. Codex's file is always AGENTS.override.md, never an
      AGENTS.md (the user's call): with no AGENTS.md to copy it holds the rules block alone, and
      an untracked AGENTS.md would make git refuse the pull the day the project adds its own.

      The user's call (2026-10-03): files itos writes into a project are written formatter-stable
      (one line per paragraph, no hard wraps, no code span across lines), so a project's formatter
      leaves them alone and the drift check stays exact, rather than asking every project to exclude
      them from its formatter.

