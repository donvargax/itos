      (IDOR, XSS, SSRF, JWT), and itos is a CLI, so it may find little; the surface worth testing is
      text from issues and the registry reaching shell commands, the git shim's PATH handling and
      the workflows. If tried: read its curl installer first, run once against a git archive export
      in a scratch folder, never this checkout, with the key in a file only the user writes and a
      token budget. The user has Anthropic API credits for it.
    tags: [gates]

  - id: p2-agent-shared-trunk
    title: Agents share one working tree and trunk through intent-carrying reads and writes
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's idea (2026-10-17, their Gemini thread in .tmp/Trunk-Based Development
      Alternatives.pdf, which ends in a spec called SIBS): agents swarming one codebase should not
      each sit in a worktree or branch and merge later; a read returns the file, what changed since
      that agent last read it and the intent behind those changes, a write carries its intent, and
      agents claim what they are about to touch. Today itos avoids the problem by allowing one
      implementing agent per checkout. The cheap shape, on git plumbing rather than the spec's
      operational transformation: a write is a small commit on main whose message holds the intent
      (itos footers), made with a per-agent index (GIT_INDEX_FILE) and landed by a compare-and-swap
      on the ref (update-ref <new> <old>); a read is the content plus git log <agent's last
      read>..HEAD -- <path> with those commits' patches and intents; a failed swap makes the agent
      re-read and re-apply, the model doing with intent as context what the spec's 'semantic OT'
      promised; claims are soft locks in a shared registry, files first. This is Scion's server-side
      commits and compare-and-swap ref at the scale of one machine. Not taken from the spec: OT or
      CRDTs (they guarantee convergence, not correct code), locks on syntax-tree nodes (a parser per
      language, and callers in other files escape them), reverting a file to its last green state
      (fights concurrent work). Open: whether the tools are an MCP server or wrappers itos ships,
      how a claim expires, and how CI judges a trunk that moves every few seconds (the Scion
      article's 'what does CI even mean'). Related: p2-trunk-review-and-release,
      sandbox-for-unattended-runs (memory).

      Prior art (2026-10-17): joelhooks/rat-king (MIT, pre-alpha, nothing running yet), an encrypted
      agent network on AT Protocol: stable agent identities, encrypted envelopes, a sequenced
      mailbox log per agent, receipts, and one 'intercom' tool for calls, mail and cc digests. Its
      mailbox log with receipts is the messaging half of what this idea needs beside reads and
      writes (an agent telling another what it intends, and knowing it was read); its shipping rules
      match itos's: report code-ready, deployed and behavior-verified separately, every bundle
      reports its version and commit, every capability starts off, storage changes expand then
      migrate then contract. Same author's piper and alchemy-celld share its stack (Effect for
      contracts and typed failures, XState for lifecycles, Alchemy for infrastructure, Cloudflare
      and celld as targets).
    tags: [agents]

  - id: p2-itos-data-store
    title: "itos's data outgrows one YAML file per kind: per-item files, with SQLite as a derived index"
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's idea (2026-10-17, after Fossil, whose repository is one SQLite database): itos's
      files could become SQLite. Today tasks/work-items.yaml is 453 KB and phase-1.yaml 158 KB, each
      one file every item edit rewrites and every concurrent push can conflict on. A SQLite file as
      the truth in git would lose what itos leans on: diffs and review of registry changes, git
      blame for item ages, rebasing two pushes that touched it (a binary conflict cannot be
      resolved), and the moves and footer checks that read the files at a commit. Fossil gets away
      with it because Fossil is the VCS: its database is the repository, synced by its own protocol
      from append-only artifacts. For itos on git the shape is: the truth stays text in git, split
      so concurrent edits rarely meet (one file per item, or append-only event files as Fossil's
      control artifacts are), and SQLite is a derived index, built from the files at a commit, never
      committed (as Scion computes derived data), for queries and speed. It also answers bug-38's
      atomic writes for the derived part only. Fits v9's typed-items redesign; related:
      p1-archive-closed. Open: per-item files or events, the migration and the verify/moves rules
      over a split registry.
    tags: [records, v9]

  - id: p1-watch-step-function
    title: The CI watch decides each look in a pure step and bounds every pass by its deadline
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found 2026-10-17: internal/cli/watch.go:197's mutant (case !ok to case ok) made watchCovered
      follow an empty run forever, since both of its follow paths continue past the deadline check
      and the sleep at the loop's foot; the loop ends only because every real follow moves to a
      newer run, a property of GitHub's data, not of the loop. Under the mutant the test's captured
      progress grew until two hosted runners died (nightly 39029889396, CI 39046789187; itos-cc#54),
      and T-187 added a test-side guard. The design: a pure step(state, look) returns the next state
      and one action, done(result), follow(run) or wait(d); a small driver alone looks, prints,
      sleeps and checks the deadline, on every pass, so no decision can skip it and the timeout
      bounds the loop whatever the decisions do; the decisions become a table test with no fake
      sleep or clock. The shape joelhooks/piper uses (machines decide, an executor acts). A
      refactor: what itos ci watch and itos push print and exit with stays as it is.

      The repair's agent confirms the reading (2026-10-17): the default branch's continue skips the
      deadline check, and only covering's guarantee of a real next keeps the original from spinning;
      checking the deadline before following a run would bound it. watch.go:138:95 (failing never
      giving up) is the same family: bounded only by the 600 s deadline.
    refs: [internal/cli/watch.go]
    tags: [ci, v8]

  - id: p2-vcs-and-tracker-seams
    title: "itos runs over more than git and files: a VCS seam and a tracking seam, Fossil the first second backend"
    phase: 2
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's call (2026-10-17): itos is not to stay bound to git, and multiple tracking systems
      are a goal; Fossil is the first candidate, for the user's workflow (autosync commits to trunk,
      no rebase, fossil amend for metadata after the fact, tickets and wiki inside the repository).
      Today internal/providers is the one seam, for the world outside the repository (ci.range,
      ci.watch, identity, people), with GitHub alone behind it and tested only against fake servers,
      which the user does not count as a tested integration. Two have no seam: the VCS (history and
      ranges through git rev-list --first-parent and merge-base --is-ancestor, version stamping
      through git describe, footers parsed as git trailers, the commit-msg and pre-push hooks, the
      git shim) and tracking (the registry, the ledger and the questions are YAML files in the
      tree). The work is designing those two seams with Fossil as the backend that proves them, not
      porting itos: a Fossil VCS (footers as text in the check-in comment, amendments as control
      artifacts, its own hook set, no shim) and Fossil tickets as a tracker beside the files, with a
      git export mirror to GitHub to keep Actions where CI is wanted. Waits on the design refactor
      the user is piloting in itos-cc, whose lessons come back here first; then the discussion
      resumes from this. Related: p2-itos-data-store, p2-trunk-review-and-release,
      p3-command-providers-back.

      A design rule worth borrowing (joelhooks/rat-king's VISION, 2026-10-17): provider adapters
      stay outside the core, and every surface (CLI, API, UI) projects the same contract; contracts
      and typed failures in one place, finite lifecycles as state machines. For itos: the VCS and
      tracker backends as adapters behind one contract the commands project, which is also what the
      itos-cc refactor pilot is testing.

      Correction to the note above: whether the itos-cc refactor pilot tests this rule is the
      coordinator's guess, not known; ask the user when the discussion resumes.

      The user (2026-10-17): they believe the itos-cc refactor pilot covers the
      adapters-outside-core rule. When the pilot lands, confirm it and start this design from the
      pilot's seams; no separate idea.

      Fossil spike (2026-10-17, an hour, Fossil 2.28, scratch only). Fits: autosync refuses a commit
      that would fork trunk ('Would fork', and a check-in lock in a true race), so trunk-only work
      needs no rebase; a review set as a tag (fossil tag add/cancel, fossil amend --tag/--comment)
      is append-only, audited, synced (tagging needs an explicit fossil sync) and never changes a
      hash; the review diff works as fossil merge --backout per commit, newest first, then fossil
      diff --from tip --invert, a later rewrite of a review line showing as a conflict; first-parent
      ranges are plink.isprim in SQL (0.006 s over 3,552 check-ins); fossil json exists. Import of
      main alone (git fast-export refs/heads/master --tags | fossil import --git --rename-master
      trunk) took about 40 s, kept every message byte for byte but the final newline, lost author
      names, timezones and author dates; the repository is about 1.5 times .git. Blockers: fossil
      git export appends a FossilOrigin-Name paragraph to each message, so the mirror's
      Task:/Item:/Changes:/Upgrading: are no longer git trailers; amends never reach the mirror (it
      stays fast-forward, built from the original comments) and tag cancels don't propagate; about
      half the timestamps shift by 1 s. Hooks: before-commit can refuse by message locally (bypassed
      by --no-verify and by amend), hooks are not cloned, and after-receive cannot refuse a push.
      itos on Fossil would need its own footer reader (event.comment for the amended text) and range
      walker. Not tried: fossil server over HTTP, --use-author/--attribute, suppressing the mirror's
      appended line.

      The tracker store port (T-225..T-227, internal/store/tracker/port) is storage level: Load,
      List, Hold, Ready, Transact of named documents committed as one change, plus Reserve; names
      are paths and Transaction carries git's commit fields. The user (2026-10-22): fine for now;
      Fossil tickets and a taskmapper-shaped issue provider are the two needs that will reshape it,
      likely at the record level (list, take, done, drop) above or beside the file adapter, in v9.

      Direction (the user, 2026-10-22): itos a thin layer over issue trackers, as taskmapper is
      (beads, t, Trello, GitHub, Fossil all candidates), limiting what is doable so items move
      freely between trackers; its weight stays in guiding agents and enforcing verification. That
      is a record-level provider (list, show, create, take, give back, done, drop, tags, queue) with
      a small required core and optional capabilities (dependencies, queue order) that degrade where
      a tracker lacks them; IDs the tracker mints must be accepted. The storage port (T-225..T-227)
      becomes the YAML provider's internals. Ledger: tracking can go behind a provider, its checks
      stay core verification; an itos-task extension is a later discussion. Fossil and GitHub start
      in core behind the interface; extensions once it has survived two or three providers (far
      future).
    refs: [internal/providers, PLAN.md]
    tags: [architecture]

