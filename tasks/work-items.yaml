  - id: p1-ci-slow-linux-runs
    title: Find why some Linux CI runs of a pull request take 10 to 12 minutes against a median of 4.9
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      docs/plans/ci-workflows.md (2026-10-26): of the 14 newest green PR runs, three ran 12 minutes
      and were slow on Linux itself (its ci job ended at 10.3 to 12.1 min) while the median Linux
      job ended at 4.9; that tail costs more than the shelved split would save. Read those runs'
      step timings (gh run view --json jobs, steps' started/completed) against a median run: the
      code proof (mutation draw and coverage over a larger range), the named tests a range selects,
      go build cache misses, or the runner. Report which step and why before any change.

      Measured 2026-10-26 (bug-144 #167, run 40426050564, ci job 393 s, Plan 361 s): recent green PR
      runs top out at ~6.5 min (the 10-12 min ones are older); Plan is ~1.5 min on a range with no
      Go, ~6 on one with Go. Its parts on a Go range: the code proof (itos-cc mutation run --count 1
      --fail-uncovered=lines) 167 s = unit coverage 4 s + the whole features suite for coverage 62 s
      + judging the one mutant ~88 s; previous-release 75 s; static checks ~51 s (architecture-check
      21 s); go test cmd/internal ~25 s; conformance 20 s; self-tests and named tests ~20 s. Not
      cache misses. Levers, in order: (1) the mutant's judgement runs ~88 s: run only the tests
      covering its line (mutation.tests ids from the coverage run), likely itos-cc's side; (2) the
      coverage pass runs every feature (62 s) where only the changed lines' coverage is judged:
      features touching the changed packages, or reuse a run CI already makes; (3) previous-release
      could run only the old scenarios the range can affect (as the named tests are selected). Each
      is a gate change; measure the saving on a run before choosing.

      Investigated 2026-10-27 (itos-cc v0.38.0 source; v0.40.1 changes none of it): itos-cc already
      judges a mutant with only its file's unit tests, then only the listed scenarios covering its
      line (ADR 0012), so no itos config change helps. The cost is the listed-tests coverage pass:
      whole features 62 s, then ~1000 per-ID covdata conversions with no -pkg (most of the silent
      ~88 s, inferred from source), measured afresh every counted run, failing closed so it cannot
      be scoped from itos. Filed on itos-cc: #73 (scope conversions with -pkg, or cache the reach
      map, or measure only reaching scenarios), #74 (progress lines for the silent phases), #75
      (emit itos_proof so the green log says what was judged). Left for itos: lever 3,
      previous-release running only the old scenarios a range can affect (75 s).

      Windows side done 2026-10-27 (T-317, T-318): the windows job 354 s -> 282 s, its unit tests
      step 250 s -> 171 s (cli 123 s, idcounter 112 s, vcs/adapter 70 s: T-318 missed its 90 s/120 s
      target). On a pull request changing Go, Linux's ci job (~390 s, the code proof) now outlasts
      Windows, so further Windows work saves nothing there. What remains on Windows is product git
      starts per run() (hook probe ~290, rev-parse --show-toplevel ~210 per cli suite) and the
      concurrency property test (~73 git starts per rapid check): a product or test-strength
      decision, not taken.
    tags: [ci]

