  - id: bug-21
    title: itos push names and waits for the commit it pushed, not HEAD after the push
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: slice
    why: >
      Was p1-push-names-head-after-hook.
      Found in bug 20 (2026-10-04). pushRun.push pushes HEAD:<branch>, then reads git rev-parse HEAD
      after git push returns to name the commit pushed and the one whose CI run it waits for. The
      pre-push hook runs the unit tests for minutes, so a commit made in that time (itos work add,
      here) moves HEAD: the push sent 98f5b0a, the line said Pushed bd346b1, and the wait was for a
      run that never comes. Resolving HEAD to a commit once, before the push, and pushing that
      commit by its SHA would keep what is pushed, named and waited for the same.

      Specified as @ID-PUSH-06 in features/push.feature. Settled: itos push resolves HEAD to a full
      SHA once, after the rebase and before git push, pushes '<sha>:<ref>' and names and waits on
      that SHA; nothing after the push reads HEAD again. The two new steps are setup and a check: a
      hooks.pre_push command that commits in the clone (made with git's hooks off, as the scenario's
      setup), and the output naming the remote branch's head as pushed.
    refs: [features/push.feature, internal/cli/push.go]
