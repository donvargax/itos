  - id: p1-red-agent
    title: A red agent writes a slice's step definitions and proves them red; the implementer only turns them green
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user, 2026-10-23. Today one implementing agent writes a slice's missing step definitions,
      commits them red (scenarios still @wip, each failing at its checking step) and then writes the
      fix, so nothing stops it from writing steps its own fix happens to satisfy; bug-111's
      gpt-6-luna agent also stopped on undefined steps, the job being implied rather than stated.
      Pipeline to trial on slices with several scenarios: the spec (scenario text and decisions, a
      strong spec agent, see p1-cheap-coordinator-trial) is reviewed by the reviewer; a red agent
      (mid-tier model) writes the step definitions, reusing fixtures, in a test commit and records
      where each scenario fails; the reviewer diff-reviews that commit (do the steps check what the
      text says, does each fail for the right reason, could one pass with no fix); the implementer
      starts from proven-red tests and only turns them green; a diff review before closing. Small
      bugs keep one agent. Accepted caveats (the user): the implementer sometimes needs
      implementation details the red agent did not have, and a spec or a step can miss something
      that makes it impossible to pass; so the implementer may change steps or @wip scenarios,
      saying why in the commit body, and the diff review judges those changes rather than a rule
      forbidding them. Later, a check could flag (not refuse) a feat or fix commit that changes step
      definitions or the scenarios it was handed. Measure tokens and red CI runs against
      single-agent slices (p1-work-spend).

      Data point, 2026-10-23: gpt-6-luna#high implementers stalled on scenario setup in both bugs
      this session. bug-111 stopped on undefined steps until told to write them; bug-113 needed the
      coordinator to diagnose a Background fixture missing the ledger folder, then still could not
      get -01 to -03 red at the intended checks or the guards right after two resumes. The fixes
      themselves were small. Step writing and fixtures look like the part needing the stronger
      model, which supports a separate red agent on a stronger tier.

      Second data point, 2026-10-23: luna-6 high under a Codex-style persistence and planning system
      prompt with todowrite (the implement agent) also stopped on bug-112's step definitions and
      fixtures, after about 5 minutes, cancelling its remaining todos; sol-6.1-medium finished
      bug-113, a comparable setup-heavy bug, alone. So the stall is less the harness prompt than the
      model on step and fixture work, which supports a stronger red agent writing the steps.

      Model choice after the 2026-10-23 trials (the user): implementers run gpt-6.1-sol at medium
      effort, which finished bug-113 alone; the luna implement-agent experiment (Codex-style
      persistence prompt plus todowrite) was dropped. If sol starts stalling the same way, first try
      giving it that prompt and the plan tool before changing models.

      2026-10-23 user reaffirmation: feature files and correct step definitions are necessary
      acceptance contracts, especially with weaker agents that may claim completion prematurely.
      Preserve red-first at the intended behavior assertion, concrete fixture/root/config/launcher
      tracing, and independent review of whether steps assert what the user requested. This sessions
      concrete setup hazards were a config rewrite dropping an earlier custom type, an old-block
      helper fabricating the wrong release block, guards already true before the change,
      pre-sanitized fake environments hiding production behavior, and a Windows fixture omitting an
      explicit OS input. A separate strong step/fixture agent is a targeted option for setup-heavy
      work, not a mandatory extra stage for every small test repair. Unit assertions must exercise
      the actual production or actual concurrent-fixture path, not merely a helper that no real path
      uses.
    tags: [agents, v8]

