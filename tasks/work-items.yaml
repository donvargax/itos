      time, from experience: agents, like people, slip back to the common workflow they learned
      (branches, worktrees, parallel agents), and it causes trouble. The coordinator itself made an
      unrequested worktree and branch that day, against that rule. The rule is prose today (the
      guide's One agent at a time). A config key (for example work.parallel: false) makes itos work
      take refuse in a linked worktree, or while another item is doing in the same checkout; a run
      the user asks for explicitly (the devcontainer test) overrides it for that run. LeashBench
      counts such slips as broken rules, so a model's pull back to the norm is measured.

      Still wanted after q-19 (2026-10-06), which lets pull requests in behind push.mode pr for
      parallel work: the two are settings of one choice. A trunk project that works one item at a
      time sets the gate; a project in pr mode lifts it for agents in their own clones, never for a
      shared worktree.

