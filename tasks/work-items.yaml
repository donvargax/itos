  - id: p1-mutation-results-committed
    title: Every product mutation site has a committed result, and a check proves none is missing or stale
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The user's call (2026-10-17): every product site (cmd and internal, 10,093 sites, none in
      _test.go) gets a mutation run, by committed results rather than by the nightly carrying
      progress (itos-cc#43's shape). Today the nightly judges 80 sites a night and keeps none, so
      judging every site once would take about four months; the random step's survival rate (5 or 6
      of 20 on 2026-10-15 to 2026-10-17) puts the unkilled mutants at roughly 2,000 to 2,500. The
      shape: one complete itos-cc mutation run, split by package across runs, whose .metrics/mutate
      snapshots are committed (itos-cc writes them to be committed: later runs reuse killed mutants
      of unchanged functions and judge only changed functions and survivors); then itos-cc mutation
      check cmd internal, which runs no test, proves every function has a fresh valid result, at the
      cheapest tier that catches a missing one. Its survivors become the burn-down beside T-186 and
      T-187. To design before it is specified, with an ADR: who refreshes the snapshots and when
      (this changes q-41's no local mutation runs and q-55's one-site push proof), how a push that
      changes a function gets its result committed, how survivors are listed while the burn-down
      lasts (an except is only for an equivalent mutant), and what happens to the nightly's random
      and changed-site steps once every site has a result. The random step stays strict meanwhile,
      and the changed-site step's base stays at 9397855d until a whole nightly passes.

      Blocked on itos-cc#56 (the user, 2026-10-17). itos-cc 0.12 dates a Go file's results by every
      test file of its package and of the packages importing it, one hop. internal/cli imports 27 of
      32 internal packages, and in the 7 days to 2026-10-17, 38 commits changed a cli test (56 any
      Go test), so committed results would be stale after most pushes. Refreshing is about 10,093
      sites at roughly 12 s each (the 2026-10-17 nightly judged 20 in about 4 minutes), over a day
      of runner time. It is also near the policy q-41 replaced on 2026-10-08. A one-time sweep plus
      moving the changed-site base was offered and declined in favour of waiting. Once #56 dates a
      kill by its killing test, design this as first written. .metrics/mutate is tracked (T-141) but
      holds 12 old snapshots; mutation check cmd internal reports 1,171 functions missing.

      Who refreshes (the user's question, 2026-10-17): CI, with the results kept out of main's
      history. An agent refreshing before its push is a pre-landing gate, which the user's trunk
      model removes; it costs local runs (against q-41); and check cannot tell a result that was run
      from one that was edited. CI committing to main adds a bot commit per push, with a token that
      can write main, a rebase race with other pushes and a CI re-trigger. Instead: CI restores
      .metrics/mutate from refs/notes/mutation (or the Actions cache, which expires after 7 days
      unused), runs the changed and stale functions reusing the rest, and pushes the notes back; a
      survivor turns the run red and blocks the release. This is p2-trunk-review-and-release's check
      results keyed to inputs, and a first user of p2-itos-data-store.

      Measured by slice-138 (2026-10-17, 8 cores): its scoped run judged 240 sites of 12 functions
      in 7:51 (about 2 s a site; hosted runners take about 12). The kill loop's three reruns took
      6:49, 6:46 and 3:12, reusing nothing until the tests stopped changing (run 4 reused 182 of
      238). Snapshots for 5 files: 742 KB. The user chose to wait for itos-cc#56 before local scoped
      runs replace q-41/q-55; with #56 the reruns would judge only survivors.

      2026-10-23 grooming, the user: committed results it is (this item over
      p1-drop-mutation-cache's 2026-10-10 call): the structural fix for the nightly staying red, a
      complete inventory to kill or except in batches; p1-line-endings-for-the-mutation-cache comes
      with it.
    refs: [itos.yaml, itos-cc.yaml, .metrics/mutate, docs/decisions, https://github.com/donvargax/itos-cc/issues/56]
    tags: [proof, v8]
    deferred: >
      Waits on itos-cc#56: committed Go results go stale on any test change one import hop away, so
      they cannot stay fresh here.

