  - id: slice-17
    title: config check says a commits.since it cannot find may be outside a shallow clone
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: [features/since.feature]
    why: >
      The first nightly running the done tasks' static checks was red at itos config check: "commits.since
      names <sha>, which is not a commit of this repository", because actions/checkout's default is
      a one-commit shallow clone. The commit was there, the clone was not deep enough. With git
      rev-parse --is-shallow-repository true, config check (and verify) could say the clone is
      shallow and fix it with fetch-depth: 0 or git fetch --unshallow; a consumer's nightly that
      takes { tasks: done } meets the same.
      Both keep exit 2 and say the clone is shallow, with the fix: git fetch --unshallow, or
      fetch-depth: 0. Was the idea p1-since-shallow-clone. @ID-SINCE-07 and 08.

  - id: p1-range-start-shallow-clone
    title: verify says a range start a shallow clone lacks may lie beyond its history
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-17]
    kind: idea
    why: >
      slice-17 made a commits.since a shallow clone lacks a config error that says the clone is
      shallow. A range's own start is not checked: verify <from> HEAD (and so ci run, whose range
      starts at the last green run) with a <from> beyond a shallow clone's history ends in
      "itos: Command failed: git rev-list --no-merges --reverse <from>..HEAD", exit 2, no word of
      the clone. The same check (git cat-file -e, then --is-shallow-repository) could make it a
      problem naming the commit, with git fetch --unshallow or fetch-depth: 0 as its fix, and a
      <from> no clone has (a typo) one of its own.

