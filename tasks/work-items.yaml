  - id: p1-shim-install-hard-linked-itos
    title: git-shim install and uninstall recognise a hard-linked itos as git
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      linksItos (internal/cli/gitshim.go) knows an itos as this binary or a symbolic link to a file
      named itos, so a git that is a hard link to another itos, as git-shim install makes on windows
      when symbolic links are refused and which an upgraded itos.exe leaves behind as a different
      file, is refused as a git that is not a link to itos by install, uninstall and init. Bug 45
      gave git.IsItos the build information check that tells such a git; the shim commands could use
      it to replace or remove one.
    refs: [internal/cli/gitshim.go]

  - id: p1-untyped-ignored-headers
    title: Judge a one-parent commit whose lint-ignored header names no type
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Bug 30 judged reverts, fixup!, squash! and amend! commits and merge commits by what they stand
      for. A commit with one parent whose header the lint leaves alone, as commitlint does, but that
      names no type (a Merge … header, Merged PR, Automatic merge, a bare version such as v1.2.3)
      still reads as a word outside commits.types, so no path rule, required footer or moves rule
      applies to it, in the hook or in verify. Refusing it, as an untyped merge with changes of its
      own is refused, would close the gap; it changes the conformance cases moves.yaml 'a message
      whose type is not one of commits.types is the header lint's, as a merge's is' and
      messages.yaml's version case, so it is the user's call.

