      The user's call (2026-10-06), to try and change if it does not work. Threads grow large in a
      months-long collaboration with many meetings, and some never close. Notes stay append-only (a
      correction is a new note), so the record stays whole for followup doc. Each thread gets a
      state, replaced with itos followup state <id> <text> and logged as a dated note when it
      changes; followup show prints the state and only the notes since it was set (--all for
      everything), and itos followup lists each open thread with its state's first line. One thread
      per topic, not per team, lets a topic close while the collaboration goes on. follow-ups.yaml
      gets a format number from now on: this change is additive and needs no migration, and a later
      change that is not migrates the file once when itos opens it, keeping a backup, with no reader
      kept for the old format. Open risk: whether agents keep the state current. followup note says
      on stderr when the state is older than the newest notes; watch how it goes, and change the
      design if it does not hold.

      2026-10-24 grooming, merged in p1-followup-topics (a thread is on a topic, --with optional and
      repeatable; may be one object with p1-research-log), p1-followup-drafts (a note is a draft
      until sent; sent notes stay append-only) and p1-followup-supersede (note --supersedes <n>; doc
      exports the standing ones unless --all). Their whys stand in their dropped entries. One type
      of p1-typed-items' record, built after it or as its pilot.

      Correction to the note above: a drop removes an item's why, so the merged whys are not in
      their dropped entries; here they are in full. p1-followup-topics (the user, 2026-10-21):
      threads follow a topic (a vendor, an integration, a recurring meeting) as often as a person.
      --with becomes optional and repeatable; followup lists by topic and filters by person. May
      merge with p1-research-log if a topic thread with no person is the same thing as a log.
      p1-followup-drafts (the user, 2026-10-21): notes written to send to someone (an email, a
      message) are drafted, revised and then sent, but every followup note is final and dated when
      written. followup note --draft keeps it editable (followup draft edit, send marks it sent with
      the time), show and doc mark drafts, and the list shows a thread with a draft waiting. Sent
      notes stay append-only. p1-followup-supersede (the user, 2026-10-21): a correction or an
      updated plan is a new note, and readers must know the newest wins. followup note --supersedes
      <n> links the new note to the one it replaces; show and doc print the superseded note struck
      or folded under its replacement, and doc exports only the standing ones unless --all. Notes
      stay append-only. All three: designed as a type of p1-typed-items' one record, not a command
      group of its own; built after it, or as its pilot.
    tags: [followup, v9]

