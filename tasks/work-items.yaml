      0.2 s on Windows) rebuild, in most scenarios, the same first commit of a ledger repository;
      keyed by the files, their modes and the message, it could be restored from one scenario's
      objects and refs. And on Windows each scenario writes the hook stand-in as a 3.5 MB script-exe
      copy that a run of the hooks seldom runs; one shared stand-in, which the config points at
      until a scenario arms its own, would be written once. Both change what a scenario meets
      (commit times, the reflog, stat data in the index), so worth it only when the Windows shards
      near 300 s again.
