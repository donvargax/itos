# Phase 3: the switch, Go only as soon as possible (PLAN.md, phase 3; the
# user's calls, 2026-10-02): the hooks run the Go unit tests, this repository
# runs the Go binary itself, the built-in header lint replaces commitlint
# (slice 25, specified in features/ as scenarios), and v2.0.0 removes the
# TypeScript. No shadow period and no two-week wait: every push already holds
# the Go build to the whole corpus and every feature (T-053).

- id: T-059
  type: build
  title: The hooks run the Go unit tests a change reaches
  why: >
    Go unit tests ran only in CI, so a change that broke one passed its hooks
    and turned main red (T-050's first push). The pre-commit hook runs the
    unit tests of the Go packages a staged change touches and of those that
    import them, and the pre-push hook those the pushed commits reach, beside
    Vitest's. Closes p2-go-unit-tests-in-hooks. tools/selftest/go-hooks.ts
    proves it in a scratch copy of the repository: a staged Go change whose
    unit test fails is refused at commit, and one whose tests pass is not.
  done_when:
    - run: node tools/selftest/go-hooks.ts
      timeout: 900

- id: T-060
  type: build
  title: This repository's hooks and CI run the Go binary
  why: >
    Dogfood before consumers switch: tools/bin/itos, which the hooks, CI's
    steps, the ledger's checks and the nightly call (hooks.bin), runs the Go
    binary built from cmd/itos, stamped with package.json's version, rebuilt
    when the Go sources change, instead of the TypeScript, so every commit
    here is judged by the binary consumers will run. The TypeScript stays,
    still held to the corpus and every feature, until v2.0.0 removes it.
    tools/selftest/go-dogfood.ts proves tools/bin/itos runs with no Node on
    the PATH (version, config check, task list on this repository).
  done_when:
    - run: node tools/selftest/go-dogfood.ts
      timeout: 600

# Reordered so the built-in header lint is built once: every feature runs
# against both implementations on every push (T-053), so the TypeScript leaves
# the repository before slice 25 is specified, and v2.0.0 releases both.

- id: T-062
  type: refactor # a chore may not touch the implementation, and deleting it touches it
  title: The TypeScript implementation leaves the repository
  why: >
    Go only (the user's call): with this repository running the Go binary
    (T-060), the TypeScript is kept only to be held to the same corpus and
    features, which doubles every new feature. tools/itos/*.ts (but the
    conformance runner and its fixtures), tools/bin/pack.ts and the tarball
    it made, the Vitest unit tests of the implementation (Vitest with them:
    nothing else here had unit tests), tools/bin/itos-ts, which T-060 left as
    the TypeScript's one entry, and the TypeScript from
    commits.path_sets.implementation go; the features' default ITOS_BIN
    (features/steps_test.go) goes back from tools/bin/itos-ts to
    tools/bin/itos, the Go binary. CI keeps one run of each suite: the corpus
    step and the features step run tools/bin/itos, the tree built on demand,
    and go-port.ts, which built it again for the whole of both, leaves CI's
    steps and stays the port's tasks' check, so a push runs the smoke set and
    what it names again, the nightly every scenario. The release stops
    packing the tarball (the notes are T-061's), the self-tests that imported
    the TypeScript ask the binary, and done tasks whose checks proved the
    TypeScript or its tarball check the Go equivalent. Node stays as this
    repository's dev tooling (vp, the corpus runner, the self-tests, the
    builds), never a runtime for a consumer. No release: v2.0.0 (T-061)
    publishes it.
  done_when:
    - run: sh -c 'test -z "$(git ls-files "tools/itos/*.ts" | grep -v "^tools/itos/conformance/")"'
      cost: static
    - run: node tools/selftest/go-port.ts
      timeout: 1200

- id: T-063
  type: build
  title: The built-in header lint agrees with commitlint, and this repository switches to it
  why: >
    Before commitlint goes, the built-in lint (slice 25) is held to its
    verdict: tools/selftest/header-agreement.ts runs both over every commit
    message of this repository after commits.since and over the corpus's
    messages, and fails on any commit where one rejects and the other does
    not, naming it. Then itos.yaml's commits.header_lint is use: builtin,
    and commitlint, its config and its packages leave the repository.
    Slice 25 leaves it this. The hook's reading of a message file is
    commitlint --edit's (git's comment lines and scissors out, a line break
    added) and check-message's and verify's is stdin's, so the comparison
    runs both readings. Held so while it was written, over this history and
    messages aimed at each rule, the two agreed on every verdict and every
    word but one: subject-case's list of cases for a subject with a
    precomposed letter outside Latin-1 and Latin Extended-A
    (p3-header-case-decomposition), so the words compare apart from that.
    When commitlint leaves, the features' step "the header lint is
    commitlint's conventional config" (ID-CMSG-01 and footers.feature's
    four) writes use: builtin, the scenarios' text unchanged (PLAN.md's
    risks), and so do the places that name commitlint as this repository's
    lint: AGENTS.md's commit-msg gate, tasks/README.md, features/README.md,
    docs/ARCHITECTURE.md's gates, .fallowrc.json's entry and the hook's
    help ("commitlint here"). So that the check outlives commitlint, the
    agreement is recorded while commitlint is still here: a fixture of every
    compared message with commitlint's verdict and report lines, in both
    readings, written once by a script that runs commitlint, then
    header-agreement.ts holds the built-in lint to that fixture alone and
    needs no Node package beyond the corpus runner's. The switch is proven
    by running it, never by a grep of package.json: the gates self-test's
    commit-msg case judges a header in a scratch copy with no commitlint
    installed.
  done_when:
    - run: node tools/selftest/header-agreement.ts
      timeout: 900

- id: T-061
  type: build
  title: v2.0.0, Go only
  why: >
    PLAN.md, phase 3, step 5. Three parts, in order. First, this repository
    requires the Upgrading footer of every feat and fix (slice 26's
    source: text, its since the commit before the one that adds it, so no
    commit written before the rule is judged by it). Second, the
    release-notes check reads the notes Go only (no tarball pin line; the
    binary's install, version and checksums lines instead) and requires
    that every Upgrading footer of the range since the last release, but
    those that say none, appears in the notes' Upgrading section, listed
    by itos commit footers Upgrading <previous tag> <tag> --json; v2.0.0's own range began before the footer, so
    its notes are written from the commits since v1.1.0 as before, and a
    reviewer agent reads them against those commits before the tag (PLAN.md,
    "Releases"). Third, the release: version 2.0.0, the notes finished
    (Upgrading asks for everything at once: the pin moves from the tarball
    to the binary, Node and commitlint can go for use: builtin, the RE2
    patterns as v1.1.0 said, anything else since v1.1.0), README's install
    Go only, then the tag, automated: the coordinator tags when CI and the
    release checks are green.
  done_when:
    - run: node tools/selftest/go-release.ts
      timeout: 900
    - run: node tools/selftest/release-notes.ts 2.0.0
      timeout: 300
    - run: sh -c 'd=$(mktemp -d) && gh release download v2.0.0 --dir "$d" --pattern "itos-2.0.0-linux-amd64.tar.gz" --pattern checksums.txt && cd "$d" && sha256sum --ignore-missing -c checksums.txt'
      after: push

