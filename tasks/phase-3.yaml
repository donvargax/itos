# Adoption, toward v2.3.0 (PLAN.md §10, "Adoption"): the plugin is built on
# slice 42's guard and slice 43's work list, both itos commands, so its hooks
# call itos and a repository's pin picks the version that answers.

- id: T-066
  type: chore
  title: The itos plugin for Claude Code, published from this repository
  why: >
    Was p3-claude-code-plugin, the user's calls (2026-10-02 and 2026-10-03). This repository is
    a Claude Code plugin marketplace: .claude-plugin/marketplace.json at the root names the itos
    plugin in integrations/claude-code/, whose version is itos's (package.json's), so a release
    of itos is a release of the plugin. The plugin carries three things. The titles: the user's
    local itos-titles mod (a function-hooks module, ui.render on AssistantMessage, never the
    stream or the transcript), which writes an itos ID's title beside it in Claude's replies,
    moved here with its tests, asking the project's own itos for the titles (itos work list
    --json, slice 43, and itos task list --json), so a registry moved by work.registry and ledger
    tasks without registry entries are found, and reading tasks/work-items.yaml when no itos
    answers. An itos older than v2.3.0 has no work list and reads it as work, printing the
    proposal, which has no items key: the titles read that as no itos answering. A short skill
    on working with itos: find work with itos work, commit with itos commit --task or
    --scenarios, push with itos push, read what a gate says and fix that cause, never run the
    gates by hand. And a PreToolUse hook on Bash that runs itos hook pre-tool-use (slice 42), the
    guard against an agent's git commit and git push, behind two shell guards: no itos on the
    PATH answers nothing, and an exit 2 becomes 1, since an itos on the PATH older than the guard
    would otherwise block every Bash command. The guard is a guardrail, not a fortress (the
    user's call): it stops agents that follow it. integrations/** is not the
    implementation, so these are chore commits; docs commits may touch its Markdown. The checks
    run Claude Code's own validator over the marketplace and the plugin, and the plugin's tests
    with claude plugin test. Neither needs a login (checked 2026-10-03 with an empty home and no
    key), so CI installs the latest Claude Code, unpinned, the user's call (2026-10-03: it
    releases several times a day, and the latest is what a person runs), with Claude Code's own
    installer, in CI's job, whose token stays read-only and which is handed no secret (a ci
    commit). The checks stay late, so the nightly, whose token can write issues, never runs
    Claude Code.
  done_when:
    - run: claude plugin validate --strict .
    - run: claude plugin validate --strict integrations/claude-code
    - run: claude plugin test integrations/claude-code
      timeout: 300

- id: T-067
  type: build
  title: A dependency check refuses Go modules younger than a week, and known vulnerabilities
  why: >
    The user's call (2026-10-03): supply-chain attacks are common and easy, so a dependency is
    trusted only once it has been public for a while, as this repository's pnpm settings do for
    npm. Go has no such setting: go get takes any version, though it runs no code of the
    dependency, so a check between go get and the commit is safe. A script in this repository for
    now (moved to an itos-security extension later, if it earns it, once the user's repository
    template is ready; p3-extension-pins) checks every module of the build (go list -m all, the
    tools' too) against the Go module proxy's publication time and refuses one younger than 7
    days, unless a committed exceptions file names that module and version with a reason (an
    urgent security fix is exactly a young version); and it runs govulncheck over the module,
    itself a pinned tool dependency, so its own version is held to the same age. It runs where a
    dependency can come in: the pre-commit hook when go.mod or go.sum is staged (it needs the
    network there, as go get did), and CI on a push whose range changes them. Written in Go, so
    it moves into an extension as it is. A self-test proves both refusals against a local
    module proxy, with no network: a version a day old is refused and passes once excepted, and
    an old one passes. govulncheck needs the network (its database, and its source on a cold
    module cache), so the self-test runs a stub in its place, proving what the check does with a
    finding (exit 3); the real one runs at every commit that stages go.mod or go.sum, the first
    being the one that added it. Its first run (2026-10-03): 39 modules, the newest
    golang.org/x/vuln v1.8.0 itself (2026-09-08), no exception needed, no vulnerability found.
  done_when:
    - run: node tools/selftest/deps-check.ts
      timeout: 300

