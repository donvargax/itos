    - run: sh -c 'd=$(mktemp -d) && gh release download v2.3.0 --dir "$d" --pattern "itos-2.3.0-linux-amd64.tar.gz" --pattern checksums.txt && cd "$d" && sha256sum --ignore-missing -c checksums.txt'
      after: push

- id: T-070
  type: ci
  title: A config that the last release accepts is accepted unless the range carries a breaking change
  why: >
    The user's call (2026-10-03), for T-069's releases, whose version is read from the commits
    alone: an incompatible config change that no commit marks as breaking would ship as a minor.
    tools/selftest/go-schema.ts already holds the generated schema to config check (T-054); this
    holds it to the last release's. A Go check, standard library only (T-067's reason), compares
    the itos.schema.json published with the last release (its tag from git) with the schema
    tools/bin/config-schema generates from this tree, over the subset that generator writes:
    a key removed, a type narrowed, an enum value removed, a key newly required, an object
    closed, or a default changed is a breaking change, and fails unless a commit since that tag
    carries BREAKING-CHANGE (or a ! in its header); a key added, a type widened or an enum value
    added passes, and is printed for the notes. oasdiff was weighed and left: it reads OpenAPI,
    so the schema would be wrapped as a request body, and its rules are an API client's (a
    changed default is information there, a change of behaviour in a config). It runs in CI on a
    push whose range has a feat or a fix, before T-069's release job, and needs the network for
    the last release's schema. Its self-test proves each breaking change refused, each one
    passed with a breaking-change commit, and each compatible change passed, on schemas it
    writes itself, with no network. Built as tools/bin/schema-contract, a late step of
    itos.yaml's ci; the self-test also proves a failed download, a 404, a shallow clone and a
    keyword it does not compare each stop it (exit 2), and no release tag passes, saying so.
    Its first run, v2.3.0's published schema against this tree, found no change; against
    v2.0.0's it finds two compatible ones, pin added and hooks.manager's git-config.
  done_when:
    - run: node tools/selftest/schema-contract.ts
      timeout: 300

- id: T-071
  type: ci
  title: The last release's scenarios hold against the new binary unless a commit says why not
  why: >
    The user's call (2026-10-03): a scenario edited while doing something new no longer checks
    the behaviour it promised, and the suite that judges the change is the edited one, so a
    behaviour change can pass every check and ship as a minor under T-069. The steps are a black
    box that runs whatever ITOS_BIN names (features/README.md), so CI builds this tree's itos,
    checks out the last release's tag in a scratch worktree (its own features, steps and go.mod)
    and runs its go test ./features there with ITOS_BIN naming the new binary, about 15
    seconds; the last release's conformance corpus runs the same way, since a corpus case also
    changes with the behaviour it records. An old scenario or case that fails is accepted only
    when a commit since the tag carries BREAKING-CHANGE (or a ! in its header), or when a fix
    since the tag names that scenario in a Changes: footer (Changes: @ID-…), the user's call: a
    fix whose old scenario held the bug stays a patch, said in its commit; a feat may never break
    an old scenario without a breaking change. If a bug fix ever breaks a consumer that relied on
    the old behaviour, this becomes stricter (fixes too need a breaking change). Changes: is a
    footer of commits.footers, its IDs checked as Scenarios: are, and the release notes T-069
    generates list each. It runs in CI on a push whose range has a feat or a fix, before T-069's
    release job. Its self-test proves, against a scratch repository with a tag and a binary that
    breaks one old scenario, that the run fails, passes with a fix naming it in Changes:, fails
    with a feat naming it, and passes with a breaking change. Built as tools/bin/previous-release,
    a late step of itos.yaml's ci after this tree's corpus. A corpus case is named in Changes: by
    its file and name, as the runner's FAIL line gives them (Changes: hooks.yaml: <case name>),
    one entry a line. Changes: is source: text, not a footer of IDs: itos commit writes only a
    free-text footer by its name (--changes), an IDs footer refuses an ID gone from the commit's
    tree (the fix that removed its old scenario), and a case name is not an ID; so the check reads
    the entries against the release, and one naming nothing there is a warning, never a failure,
    as a pushed commit cannot be rewritten. The worktree's package.json takes the binary's own
    version, since the corpus's {{version}} is what the binary must say and T-069's builds say a
    version the tag never had. The self-test also proves a fix or a ! before the tag does not
    count, a fix naming only the scenario leaves the case refused, a shallow clone and a tag that
    cannot be checked out stop it (exit 2), and no release tag passes. Its first run, v2.3.0's
    187 scenarios and 554 cases against this tree's binary, passed in about 12 seconds. The old
    corpus's help cases are left out, never judged, the user's call (2026-10-03) after bug 8's fix
    rightly changed itos tests smoke --help and v2.3.0's help.yaml held CI red on it: help text
    is documentation, not compatibility (PLAN.md: --json and exit codes are the stable interface),
    this tree's own corpus still pins its help exactly, and judged, every feat that adds a flag or
    a command, which changes itos --help, could pass only as a breaking change. A help case is
    one whose argv holds --help or -h before any --, starts with help, or is empty (a bare itos
    prints the help): 37 of v2.3.0's help.yaml's 38 cases and none outside it, its itos version
    case still judged. The check says how many it left out and why; the self-test proves an old
    help case that differs passes while an old non-help case still fails.
  done_when:
    - run: node tools/selftest/previous-release.ts
      timeout: 900

- id: T-069
  type: ci
  title: A push to main whose CI is green cuts a release when it carries a feat or a fix
  why: >
    Was p1-itos-release. The user's calls (2026-10-03): releases happen about daily and each was
    two agents and an hour of hand steps (notes, a version bump, a CI run red by design, a nightly
    dispatched by hand, the tag, a checksum download, a README commit, a closing commit), so the
    release is cut by CI as soon as a feat or a fix lands, the version computed from the commits
    (option B): feat a minor, fix a patch, BREAKING-CHANGE or a ! a major, nothing releasable no
    release. When CI is green on a push to main, a release job of its own (the only one given
    contents: write, id-token: write and attestations: write, one at a time so pushes in a row
    cut their releases in order) computes the next version from
    the commits since the last tag (svu or git-cliff --bumped-version, a pinned binary or action,
    not an npm package), tags it, publishes with GoReleaser, and attests the archives with
    actions/attest-build-provenance (Sigstore, no keys; gh attestation verify checks them), all
    in that one workflow, since a tag pushed with the workflow's token starts no other. The releaser never commits. The tag
    is the version: GoReleaser stamps the binary from it; tools/bin/itos stamps a local build
    from git describe so it sorts above the last tag and below the next release (2.3.1-dev.5+g…
    after v2.3.0), so the pin and requires checks keep working; package.json's version stops
    being itos's, and release.yml's tag-equals-version check and its tag trigger go. The
    archives, their names and checksums.txt stay as the launcher, the pin, go install and the
    install script read them today. The notes are generated, not committed: git-cliff over the
    range, grouped by type, every Upgrading footer quoted in the Upgrading section, plus a
    template for the install lines and the schema line, published as the release's
    description; the release-notes check proves the generated notes against the range, and
    docs/releases/ keeps the past releases' files. README's install lines and hashes go, for a
    link to the latest release, so nothing needs a commit after a release. The Claude Code
    plugin is decoupled from itos's version (it may move to a repository of its own with its own
    rules): its version stops following itos and the release self-test stops comparing them.
    The tools the workflow runs are pinned, each version at least 7 days old (T-067's rule). The
    release job adds no gate of its own: a push's CI, with T-070's schema contract and T-071's
    run of the last release's scenarios, is what a release rests on, and a break that slips
    through means a missing check, fixed forward with the check and a fix release (the user's
    call, 2026-10-03). No
    task per release any more, no after-push download check red by design: a release's proof is
    the workflow itself, and the first release it cuts proves this task. p3-release-signatures
    keeps the launcher checking the attestations itself, later. docs/ORCHESTRATING.md's release
    lessons and PLAN.md's releases section say the new way. Built as tools/bin/release-version
    (standard library), .goreleaser.yaml, tools/bin/pinned (GoReleaser 2.18.2, git-cliff 2.14.2,
    each checked against its SHA-256), tools/bin/release-notes and ci.yml's release job calling
    release.yml. What it found: a local build says 2.3.1-dev.N.g<sha>, all pre-release, since
    pin.version and the launcher refuse a + build metadata; a config's requires reads X.Y.Z
    alone, so the corpus's cases that require the binary's own version use {{release}}, and
    tools/bin/previous-release judges this tree built as its release would be stamped (v2.3.0's
    corpus fails two cases against a dev build for the stamp alone). GoReleaser uploads a draft
    and the job publishes it once attested and given its notes, which is when GitHub creates the
    tag, so no tag exists without its assets (closes p3-schema-contract-unpublished). The schema
    contract gains -json and -release <tag> for the notes (closes p3-schema-contract-json). itos
    commit footers reads a wrapped footer's first line only, so the notes take the rest from the
    message. The snapshot's assets match v2.3.0's published ones but for the version: the same
    seven names, the same entries, modes and owners, the same schema byte for byte. The
    attestation check runs in the nightly, last, not in pushes (ci.nightly_only): it passes only
    once the release job has cut a release, which needs a green push, and a push's range starts at
    the last green run, so in pushes it would hold every later one red and no release could ever
    be cut. It stays red there until the first feat or fix after T-069 lands.
  done_when:
    - run: node tools/selftest/release-cut.ts
      timeout: 900
    - run: sh -c 'd=$(mktemp -d) && t=$(gh release view --json tagName --jq .tagName) && gh release download "$t" --dir "$d" --pattern "itos-*-linux-amd64.tar.gz" && gh attestation verify "$d"/itos-*-linux-amd64.tar.gz -R donvargax/itos'
      after: push

- id: T-072
  type: ci
  title: Every push runs the unit tests and every feature on Linux, macOS and Windows
  why: >
    The user's calls (2026-10-03): itos ships Windows and macOS archives (cross-compiled, no cgo)
    that nothing has ever run: CI, the nightly and the release run on Ubuntu alone, and PLAN.md's
    risks already name Windows (checks run through sh; Git for Windows' sh preferred). GitHub's
    standard runners are free for a public repository, macOS and Windows included. A job of its
    own in ci.yml, a matrix of ubuntu-latest, macos-latest and windows-latest, builds itos
    natively on each and runs the Go unit tests and every feature (go test ./features -count=1)
    against that build, so git, the hooks, the shell and paths are exercised as a person on that
    platform meets them; Linux joins the matrix so all three run the same way on every push. Two
    steps, in this order. First the job lands not blocking (continue-on-error), so a platform
    that fails cannot stop T-069's releases; each failure it shows is fixed (a fix with a
    @bug-<n> scenario where it is itos's behaviour, a test or ci commit where it is the steps or
    the runner's setup), or recorded as an idea when it is large. Then, once all three pass,
    the job blocks and the release job needs it, so a platform break stops a release, as every
    other check of a push does. Building the releases stays on Linux: a Mac runner would change
    nothing in the darwin archives, and signing and notarising them waits for an Apple
    developer account, if ever (curl, the launcher and go install mark nothing for Gatekeeper).
    Every action the job uses is pinned by commit, each version at least 7 days old (T-067).
    Its check runs in the nightly, not in pushes (ci.nightly_only), and reads the newest completed
    ci.yml run on main: a push's own run is still going when its task checks run, so read in a
    push it would find that run's platform jobs unfinished and hold every push naming T-072 red.
    What it found: macOS passed on its first run, and Windows failed. Its unit tests wrote paths
    into sh commands unquoted and a POSIX /abs, and leaned on signals and on a fake git that is a
    shell script; its features failed 35 scenarios. Four were itos's own: the default registry
    and the ledger's folder were joined with backslashes, so the commit-msg hook never checked a
    staged registry there (bug 9, a fix and the patch release 2.3.2). The rest were the steps':
    their fake programs (extensions, a release's itos, the config's shell, gh) are shell scripts,
    which windows does not run, so on windows a step writes <name>.exe, script-exe
    (features/testdata/script-exe) with the script after it, run by Git for Windows' sh; an
    extension's folder read through pwd -W and its links; an ITOS_* path's ending read with
    slashes. The platform jobs take about 30 s on ubuntu, a minute on macos and three on windows,
    which the release now waits for.
  done_when:
    - run: sh -c 'id=$(gh run list --workflow ci.yml --branch main --status completed --limit 1 --json databaseId --jq ".[0].databaseId") && gh run view "$id" --json jobs --jq "[.jobs[] | select(.name | test(\"ubuntu|macos|windows\")) | .conclusion] | length == 3 and all(. == \"success\")" | grep -qx true'
      after: push
