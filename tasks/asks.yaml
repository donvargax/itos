ince T-123, by release-version's unit tests and go-release.ts); 25 that need a release or the network and prove one release once (release-notes.ts and asset downloads per version); 15 that pin this repo's own policy (check-paths on its scopes, config get values), whose mechanism the corpus covers; 13 one-time edits. The CI step tools/bin/itos task T-007 goes with T-007's checks (@ID-CMSG, corpus messages.yaml and scopes.yaml). Also found: itos verify \"\" HEAD, CI's fallback when no green run starts the range, is red over 17 old commits. Full list, in the directory /tmp/claude-1000/-home-yorch-tmp-llms-safe-gamedev-svg-art-itos/ (a path split at a space for the commit's wrapping): bdbd9664-fbe3-4d8a-b056-28288819fdcc/scratchpad/T-125-checks-keep-or-drop.md. Options: (1, recommended) build it as listed; (2) name the changes: steps to strike or add, or moves between push and nightly."
