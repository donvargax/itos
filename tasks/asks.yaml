    answer: "Refuse an unambiguous bare area shorthand with a concrete valid full-stem suggestion and no reservation, rather than silently normalizing and claiming an ID. Preserve legitimate auxiliary-tag previews such as slice and bug and the behavior of already-valid full stems."
  - id: q-76
    item: "slice-158"
    question: "For #71, recommend --evidence-file as narrative in the validated close commit body, preserving results in Git instead of task specification. Stealth closes create no Git commit, so this storage cannot retain their evidence. Should the first delivery support project-mode evidence and explicitly refuse the flag under stealth, or also introduce a private evidence journal and readback for stealth? Ordinary stealth closure without the flag stays supported."
    answer: "Project-mode evidence first. Store the supplied narrative in the validated close commit body. Explicitly refuse the evidence flag under stealth so results are never silently discarded; keep ordinary stealth closure unchanged. A private evidence journal and readback are outside this delivery."
  - id: q-77
    item: "p1-commit-msg-checks-the-index"
    question: "For #60, the reported check test -f gen/out.txt passed because an untracked working-tree file existed, although the index lacked it. Recommend a first delivery that clearly warns before task checks when staged and working-tree inputs differ, preserving current hook verdicts and exact-commit CI. Full staged-snapshot execution could reject the false pass, but needs a scratch execution environment and rules for Git-dependent checks and ignored/generated inputs; it need not use Git worktrees. Should the first delivery be the explicit warning or staged-snapshot execution?"
    answer: "Execute task checks against a staged snapshot, not warning-only execution in the working tree. Define an isolated scratch execution environment without registered Git worktrees or stashing/moving the shared checkout; preserve existing task-check selection, limits and verdict rules. Snapshot setup, Git context, dependencies and cleanup must be specified before implementation."
  - id: q-78
    item: "p1-flag-defaults-policy"
    question: "For #30, recommend that a fresh plain init write the small local agent-rules setup for its mode by default, with --no-agent-rules opting out, while plugin installation and the global git shim remain opt-in. Plain reruns would keep existing report/explicit-rewrite behavior. Audit other flag defaults separately against the recommended ordinary invocation rather than changing all flags automatically. Should local rules default on for fresh initialization, or should they remain explicitly opt-in everywhere?"
    answer: "Default local agent rules on for fresh initialization, in project or stealth mode as appropriate, with --no-agent-rules opting out. Plugin installation and the global Git shim remain opt-in. Ordinary reruns retain report-only behavior and require explicit --agent-rules to rewrite. Audit other flag defaults separately; no blanket default change or guard/CI policy change is authorized."
  - id: q-79
    item: "p1-itos-config-all-or-nothing"
    question: "For #31, recommend first refusing an external project config with a precise unsupported-root diagnostic rather than half-resolving its data. The alternative is intentional shared external data: ledger/registry/questions/decisions/smoke beside the config, with source and execution in the working project, requiring explicit historical-read and Git-write ownership rules before implementation. Which direction should this item take? Existing stealth private-config behavior must remain supported; per-branch planning is a separate undecided design."
    answer: "Refuse external project configs first with a precise unsupported-root diagnostic instead of partially resolving data paths. Preserve existing private stealth-config support. Intentional shared external data and per-branch planning remain separate designs, with no hidden fallback or ownership guess."
  - id: q-80
    item: "slice-161"
    question: "For #32, recommend keeping decision acceptance separate from implementation evidence: an ADR can record the chosen direction while explicitly saying validation is untried or unknown, later updated only with stated evidence. Do not infer that a decision was built from an answered question or done item alone. Alternatively keep every unbuilt ADR in proposed status until validation. Which model should the first delivery use?"
    answer: "Keep decision acceptance separate from validation status. An accepted ADR may visibly be untried or unknown; update its validation only from explicitly stated evidence, not an answered question or done item. Do not keep every unbuilt accepted direction proposed merely because it has not been validated. This selects the model, not a particular field schema or automatic inference."
  - id: q-81
    item: "slice-163"
    question: "For #55, recommend historical policy for project-mode per-commit verification: each commit is judged using the tracked config in that commit, so a newly added or removed path/moves rule takes effect in that same commit and does not rewrite older history. This requires explicit handling of adoption, config removal/renames, missing history and arbitrary whole-range commands before implementation; stealth has no historical tracked config and needs a stated separate rule. Alternative: keep current policy authoritative and add activation boundaries per rule, with migration/annotation overhead. Which direction should we specify first? The scenario-adoption half is already covered separately by slice-134/bug-108."
    answer: "Use the tracked config in each project-mode commit for its historical verification. A rule takes effect in the commit adding it, not retroactively. Specify adoption, removal, renamed config, missing history, whole-range command execution and stealth behavior explicitly before implementation; do not hide old failures by moving commits.since."
  - id: q-82
    item: "p1-wip-red-first"
    question: "For #58, recommend separating a plain current-working-tree tests run command (explicit IDs or item selection, configured runner, no commits/stash/worktrees and no red-proof verdict) from the reconsidered mandatory red-first policy. Its first version could run live scenarios; handling @wip needs a separate adapter/runner contract because the configured runner may exclude them even when IDs are selected. Alternative: settle guard declarations and runner-specific WIP execution as part of a red-proof tool before delivering a command. Which first delivery is useful? Existing red-first instructions are not changed by this choice alone."
    answer: "Plain current-working-tree test runner first, with explicit IDs or item selection for live scenarios. Keep it separate from red-first proof and enforcement. Do not add commits, stashes or worktrees, and do not claim WIP execution when the configured runner excludes it. Reliable WIP execution and any red-first policy change remain separate design work."
  - id: q-83
    item: "slice-164"
    question: "For #25, current proof accepts exit zero without parsing success JSON, and generic commands may return no metrics. Recommend defining an optional common summary contract: show reported scope/counts, distinguish unavailable metrics from zero, and refuse explicit zero judged work when the ranged proof is required for code changes. Commands without summary support retain the existing exit-code contract. Alternative: require a complete summary from every proof provider, a breaking provider-contract change. Should support be optional first or mandatory? No provider-specific JSON guessing or fabricated zero counts."
    answer: "Optional proof summaries first. Show reported scope/counts and distinguish unavailable metrics from zero. Refuse explicitly reported zero judged work for a required ranged code proof. Existing providers without summary support retain exit-code behavior; no mandatory provider-contract migration, fabricated zero or provider-specific JSON guessing."
  - id: q-84
