# The questions to the person the work is for, written by itos decision (itos help decision).
questions:
  - id: q-1
    item: "bug-12"
    question: "The starter config itos init writes requires a Task footer of docs commits, but work add, edit, take, done and task add commit docs with none, so every registry command fails under init's own hooks (bug 12's @ID-INIT-23 and 24 wait on this). Drop docs from the starter's required_for, as this repository does (the coordinator's recommendation), exempt a docs commit touching only the registry and ledger in the hook, or something else? The Item: footer, once built, could also satisfy it."
    answer: "Option 1 (2026-10-04): drop docs from the starter's required_for, as this repository does, and give docs the starter's one path scope (Markdown, docs/ and itos's data beside the ledger), so a change labelled docs to skip the Task footer is still refused. Every other type stays unscoped."
    decision: none
  - id: q-2
    item: "p1-push-needs-hooks"
    question: "Refusing itos commit and itos push when the hook they rely on cannot run breaks every consumer without hooks installed. Put it behind a config key, off by default until v3.0.0, with only the clear bug (core.hooksPath naming a missing folder) refused at once as a fix (the coordinator's recommendation)?"
    answer: "Refuse, in v6.0.0 and with no config key (the user's call, 2026-10-06; decision 36 rules out feature flags). Every itos command that commits or pushes checks first that the hook it relies on will run (git rev-parse --git-path hooks, and a stealth config's git-config hooks with a git that runs them) and exits 3 naming the cause and telling the person to run their project's hook installation when it will not: core.hooksPath naming a missing folder, a hooks folder with no commit-msg or pre-push hook, hooks never installed. Plain git stays the deliberate way around; CI's verify is the backstop. Running the checks in itos itself instead was rejected: it would cover itos's checks only, not the project's other hooks. Issue #16 is the case that bit. itos stops covering for hook managers: hook install writes git's own hooks only (plain, or git-config in stealth mode), prints the lines to add where another tool owns the hooks folder, and hooks.manager is removed (the user's call: itos is not a babysitter)."
    decision: none
