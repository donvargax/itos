    answer: "Task-specific field drafts first: explicitly selected title, why or checks fields, preserving unrelated task/field edits and refusing same-field conflicts. Keep generic whole-file drafts unchanged; do not build a general arbitrary-ledger merge engine for this delivery."
  - id: q-73
