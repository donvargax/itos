# itos ask's questions to the person the work is for, written by itos ask (itos help ask).
questions:
  - id: q-1
    item: "bug-12"
    question: "The starter config itos init writes requires a Task footer of docs commits, but work add, edit, take, done and task add commit docs with none, so every registry command fails under init's own hooks (bug 12's @ID-INIT-23 and 24 wait on this). Drop docs from the starter's required_for, as this repository does (the coordinator's recommendation), exempt a docs commit touching only the registry and ledger in the hook, or something else? The Item: footer, once built, could also satisfy it."
    answer: "Option 1 (2026-10-04): drop docs from the starter's required_for, as this repository does, and give docs the starter's one path scope (Markdown, docs/ and itos's data beside the ledger), so a change labelled docs to skip the Task footer is still refused. Every other type stays unscoped."
    decision: none
  - id: q-2
    item: "p1-push-needs-hooks"
    question: "Refusing itos commit and itos push when the hook they rely on cannot run breaks every consumer without hooks installed. Put it behind a config key, off by default until v3.0.0, with only the clear bug (core.hooksPath naming a missing folder) refused at once as a fix (the coordinator's recommendation)?"
  - id: q-3
    item: "p1-follow-reopen"
    question: "A closed itos follow thread: reopen it with an explicit itos follow reopen <id> (the coordinator's recommendation, so a late note does not bring it back by accident), or let any note reopen it?"
  - id: q-4
    question: "When do the other repositories move to the current itos (by hand from a release's notes, or with itos pin)?"
  - id: q-5
    item: "slice-59"
    question: "Once itos init --agent-rules lands, does this repository's hand-written AGENTS.md become the generated block (the coordinator recommends yes, a small docs task)?"
  - id: q-6
    question: "Set a unit coverage threshold? Coverage is collected with none since the template's demo app left; it blocks nothing."
  - id: q-7
    question: "Confirm or overturn the coordinator's older calls: slice 4 drops the keys of features not built yet; slice 7 counts a task with no work item as in progress; slice 8 tries each cost pattern as written and as hooks.bin to itos; slice 9 reads a check's reused run even when an earlier check of its task changed the tree; slice 10 keeps a failing delegate's exit code in the hook; slice 13 makes a missing ledger folder exit 2; slice 46's pre-push verify is silent when commits pass, with no opt-out."
  - id: q-8
    item: "p1-adr-tools-default-dir"
    question: "A repository set up with adr-tools' defaults keeps its records in doc/adr with no .adr-dir file, so itos ask record would start a second log in docs/adr, numbered from 1. Should an existing doc/adr holding records win when there is no .adr-dir, as adr-tools' own lookup does (the coordinator's recommendation: compatibility was the point of using its format), or stay with docs/adr unless .adr-dir says otherwise?"
    answer: "No (2026-10-04): docs/adr stays the default and a different folder is configured, with a .adr-dir file. Defaults follow the most common convention; configuration is the escape hatch (convention over configuration). An existing doc/adr does not win on its own."
    decision: 1
  - id: q-9
    item: "p1-adr-madr"
    question: "Decision records move to MADR 4 (p1-adr-madr). Which folder by default: docs/decisions, MADR's own convention (the coordinator's recommendation, by decision 1, since a default follows the format's convention), or docs/adr as decided for adr-tools' format? Either way .adr-dir stays the escape hatch."
    answer: "docs/decisions (2026-10-04): MADR's own folder is the default, by decision 1; another folder is configured."
  - id: q-10
    item: "p1-adr-madr"
    question: "Writing MADR instead of Nygard changes what v2.28.0's itos ask record promises, so it is a breaking feat and cuts v3.0.0. Cut v3.0.0 now for it alone, the planned v3 items (v3-hooks-bin-default, v3-stealth-pre-push) moving to the next major (the coordinator's recommendation: majors cost nothing under fix-forward, and holding it means T-085 writes about 20 records in a format being dropped), or hold MADR until those items are ready and ship them together?"
    answer: "Cut v3.0.0 now for MADR alone (2026-10-04); the planned v3 items go to the next major, and another major follows whenever one is needed."
