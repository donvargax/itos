  - id: q-69
    item: "slice-140"
    question: "Draft preflight (#46): an earlier draft may change the config that a later draft needs, such as declaring a tag before creating an item with that tag. Recommend a bounded first delivery: reject definitively invalid arguments and currently decidable metadata before minting, recognize earlier reserved IDs, and leave checks affected by preceding drafts explicitly pending until promotion. Alternative: build projected-state validation of the preceding queue before minting each drafted command. Which assurance should this item promise?"
    answer: "Bounded early checks, as the user selected. Reject errors that can be proved at draft creation; recognize earlier reserved IDs. Checks whose inputs are affected by earlier drafts remain explicitly pending and are revalidated at promotion. Do not build a projected queue simulator in this item or promise that early validation guarantees future promotion."
  - id: q-70
