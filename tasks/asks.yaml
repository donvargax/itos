    question: "Where should the required commit plan live? Recommended: a separate machine-readable per-item plan file, linked from the work registry and authored/validated by itos commands; private plans stay beside private itos data in stealth mode. ADR-0034 keeps the registry as an index, so an inline registry plan would change that separation. Alternatives: inline metadata in each task/feature specification, or plans inside the registry. Exact path and schema remain undecided. See docs/plans/guided-commits.md."
    answer: "Use separate machine-readable per-item plan files linked from the registry and written/validated by itos. Preserve the registry as an index and keep stealth plans with private itos data. Exact schema and filenames remain open."
