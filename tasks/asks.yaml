  - id: q-26
    question: "Every numbered id (T-, slice-, bug-, a scenario's @ID-AREA-n) is chosen by whoever writes the spec, read off the files by hand or with task next-id, and a duplicate went unnoticed once (p1-wip-id-collision). Recommended: itos mints every id it writes and no caller passes one: task add, work add --kind slice|task and work promote take no id and give the next free one, bugs likewise, itos tests new-id <AREA> mints a scenario's, and the commit-msg hook refuses a duplicate, @wip included; one slice folding p1-work-promote-next-id, p1-tests-next-id-and-steps and p1-wip-id-collision. Claims stay on main under PR mode, so item ids are minted there; a scenario id minted on a branch that collides is caught at rebase, before main. Or: ids with no counter (an item keeps its idea's slug for life, scenarios get slugs or short random suffixes), which ends collisions but changes every id format and the footers that cite them, a break for every consumer."
    answer: "The user (2026-10-08): itos mints every id it writes, no slugs. An id given to work add (a slice, a task or a bug), task add or work promote is refused as a usage error; an idea keeps its author's name; a bug is a kind of its own, minted bug-<n>; a drafted command names an earlier draft's minted id by that draft's name, {<name>}, the draft names needing no numbering. Specified as slice-102 and slice-103."
    decision: 45
  - id: q-27
    item: "slice-102"
    question: "How does itos mint an item id that stays unique when sessions on two machines mint at once? Everything that names an item before it reaches main (feature-file tags, footers, drafts, briefs) writes its name, so the name, not an internal identity, must not clash. Recommended: short git-style ids (slice-3fa2, a prefix of a random id, longer only when one is taken in the repository): minted offline, no coordination, a cross-machine clash about 1 in 65,000 per pair minted at once; the order lives in the queue and the registry, not the number. Or: sequential numbers claimed atomically on origin (refs/itos/ids/<id>; needs the network to mint). Or: sequential numbers minted locally and renumbered on a clash at push (a renumber command rewriting the registry, tags, drafts and unpushed commits). Scenario ids (@ID-AREA-n) stay sequential either way, a duplicate refused at commit (p1-wip-id-collision), since only their own spec names them before they land."
    answer: "The user (2026-10-08): one counter, minted by itos for every id. In a repository whose itos data is shared through a remote, the counter is the ref refs/itos/ids on that remote: a commit whose tree holds a counter per item kind (slice, bug, task) and per scenario area; minting takes one past the higher of the counter and what the repository holds, and pushes the next counter commit fast-forward only, fetching and retrying when another machine moved it first. That push runs no hook (git push --no-verify), only inside itos's minting code, the ref a constant and no command taking a refspec or flag that reaches it: it updates no branch, so no hook has anything to judge, and no hook manager needs to know about it. Under a stealth config or with no remote the counter is a file in itos's folder of the git common dir, which no git command can push. Offline, nothing numbered is minted; ideas still are. Scenario ids are minted through it too (tests next-id, --count), a duplicate refused at commit as a backstop. Specified as slices 102 to 105."
    decision: 45
  - id: q-28
    item: "T-125"
    question: "T-125: which done-task checks become standing steps? 208 distinct checks (280 ledger entries) of the 120 done tasks closed before slice 101: keep 21 as 20 steps, drop 187. KEEP on push: actionlint (the three workflows; nothing lints them); selftest/ci-scope.ts (this repo's prose paths never shortcut a gate path); go test ./tools/... (the tools/bin gate programs' unit tests, which no step runs; settles p1-tools-bin-unit-tests-in-ci); inbox.ts --self-test (the inbox's trust rule); vp run changelog (the changelog tool still runs; the weakest keep); the self-tests of three push gates, selftest/deps-check.ts, schema-contract.ts and plugin-version.ts (each gate's refusals, which real ranges never exercise). KEEP nightly: selftest/features-scope.ts (CI's features step runs exactly the smoke set plus what is named; red today, as ASK-01 and ASK-20 share a name, so its name-to-ID mapping needs a fix); go-dogfood.ts (tools/bin/itos rebuilds when stale, exit 3 on a tree that does not build); upgrading-json.ts (the asset itos upgrade reads, end to end); five hostile-PATH runs: the features with a fake itos on the PATH (T-087), the features and TestDeclareHooksOldGit with git as itos (T-104), go test ./tools/bin/... with git as itos (T-122), go test ./internal/cli and the corpus with a stray itos-* extension (T-077, T-080; the corpus one not judged here, as this machine's global git shim hung it); two coverage runs (T-121's per-scenario split, T-124's counters before exec), until T-120's proof reads that coverage; claude plugin validate --strict on the marketplace and the plugin, and claude plugin test (nightly.yml then installs Claude Code). DROP: 44 greps or string tests over a file; 90 covered by a named step, scenario, unit test, corpus case or self-test (T-006's fixture checks by corpus cases; the port's 21 by the corpus step and the features run; header-agreement.ts, red by design since squash! and fixup! are judged by type, by @ID-CMSG; release-cut.ts, red since T-123, by release-version's unit tests and go-release.ts); 25 that need a release or the network and prove one release once (release-notes.ts and asset downloads per version); 15 that pin this repo's own policy (check-paths on its scopes, config get values), whose mechanism the corpus covers; 13 one-time edits. The CI step tools/bin/itos task T-007 goes with T-007's checks (@ID-CMSG, corpus messages.yaml and scopes.yaml). Also found: itos verify \"\" HEAD, CI's fallback when no green run starts the range, is red over 17 old commits. Full list, in the directory /tmp/claude-1000/-home-yorch-tmp-llms-safe-gamedev-svg-art-itos/ (a path split at a space for the commit's wrapping): bdbd9664-fbe3-4d8a-b056-28288819fdcc/scratchpad/T-125-checks-keep-or-drop.md. Options: (1, recommended) build it as listed; (2) name the changes: steps to strike or add, or moves between push and nightly."
