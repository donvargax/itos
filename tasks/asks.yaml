  - id: q-27
    item: "slice-102"
    question: "How does itos mint an item id that stays unique when sessions on two machines mint at once? Everything that names an item before it reaches main (feature-file tags, footers, drafts, briefs) writes its name, so the name, not an internal identity, must not clash. Recommended: short git-style ids (slice-3fa2, a prefix of a random id, longer only when one is taken in the repository): minted offline, no coordination, a cross-machine clash about 1 in 65,000 per pair minted at once; the order lives in the queue and the registry, not the number. Or: sequential numbers claimed atomically on origin (refs/itos/ids/<id>; needs the network to mint). Or: sequential numbers minted locally and renumbered on a clash at push (a renumber command rewriting the registry, tags, drafts and unpushed commits). Scenario ids (@ID-AREA-n) stay sequential either way, a duplicate refused at commit (p1-wip-id-collision), since only their own spec names them before they land."
    answer: "The user (2026-10-08): one counter, minted by itos for every id. In a repository whose itos data is shared through a remote, the counter is the ref refs/itos/ids on that remote: a commit whose tree holds a counter per item kind (slice, bug, task) and per scenario area; minting takes one past the higher of the counter and what the repository holds, and pushes the next counter commit fast-forward only, fetching and retrying when another machine moved it first. That push runs no hook (git push --no-verify), only inside itos's minting code, the ref a constant and no command taking a refspec or flag that reaches it: it updates no branch, so no hook has anything to judge, and no hook manager needs to know about it. Under a stealth config or with no remote the counter is a file in itos's folder of the git common dir, which no git command can push. Offline, nothing numbered is minted; ideas still are. Scenario ids are minted through it too (tests next-id, --count), a duplicate refused at commit as a backstop. Specified as slices 102 to 105."
    decision: 45
