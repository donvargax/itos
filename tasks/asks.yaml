    answer: "Explicit fields (the user, 2026-10-23): cli.Main builds one run value (folder, environment, stdin) and hands it to each command's ports and adapters when it constructs them; no context values, and os.* stays only in cmd/itos, the launcher and the shim."
  - id: q-102
    item: "slice-169"
    question: "slice-169 (evidence records A3): a hand-run itos task or ci run on a dirty tree is uncached in the plan, so an agent mid-edit never leaves a record the commit hook can hit. Recommended: run on the index as the commit-msg hook does (key by the index tree, a miss run in its bug-112 snapshot, unstaged and untracked files never reaching run or key, the unstaged count reported, --working-tree for today). Rejected: a working-tree key from git add -A, which sweeps in unrelated untracked files and nested checkouts."
    answer: "The person, 2026-10-23: the recommendation, hand runs on the index; and keep the repository clean, ignoring what should not reach GitHub (T-292)."
  - id: q-103
    item: "slice-173"
    question: "slice-173: does work done run late done_when checks locally? Recommended: no, keep the split. Static checks run at work done through the evidence engine (a hit costs nothing, a failure reported with its output, #82); late checks stay CI's, and work done names them as left to CI rather than skipping them silently; once p1-evidence-ci (B) lands, work done checks their CI record. Alternatives: run every check locally (the drafter's proposal), or late checks only on a hit."
    answer: "The person, 2026-10-23: the recommendation (keep the split, late checks CI's, named as left to CI, checked by their CI record once p1-evidence-ci lands); revisit if it causes trouble."
  - id: q-104
    question: "Which changes does the coordinator's model reviewer read the diff of, now that the gates and Copilot judge every pull request? Compared 2026-10-25 with Amp's practice (trust the agent's own end-to-end testing; a person reviews only the few central files and migrations; threads, linked to commits, are the memory) and with poteto's pstack (github.com/michael-denyer/pstack-claude, idea p3-evaluate-pstack: model-made evidence and a mandatory independent multi-model verdict per pull request; \"never count your own review, passing tests, or CI as the independent verdict\"; a decision trail committed when stakes need it). itos sits apart from both: CI re-judges every claim mechanically (scenarios red first, a fresh mutant and changed-line coverage per push, the last release's scenarios and corpus, the nightly), and the why is distilled into commit bodies, specs and records rather than kept as transcripts. On the first parallel day (six pull requests) the diff reviews found nothing substantive (a doc.go sentence, a wording nit no commit type could carry), while Copilot found two real bugs in #143 and CI's code proof found two gaps; the spec reviews found one open decision (#145)."
    answer: "The person, 2026-10-25: every spec is still reviewed before implementation, since that is where the decisions are. The diff stage runs only for a pull request touching what has a high blast radius: internal/config (the loader and schema), internal/message, internal/engine/hooks, internal/slices/hook and internal/slices/commit (the footers and the commit-msg hook), internal/slices/push (push and merge), internal/ledger, internal/work and internal/value/docedit.go (the registry and ledger writers), the gates (itos.yaml, itos-cc.yaml, .github/workflows, tools/bin, tools/selftest, deps-check.json) and go.mod or go.sum, or carrying a BREAKING-CHANGE footer. Everything else rests on the gates and Copilot's review. A non-blocking note never starts a fix round. itos keeps distrusting the agent's report and keeps CI as the verdict (its difference from Amp, which trusts the agent's testing, and from pstack, which wants an independent model verdict over CI), and keeps distilled records over transcripts (the person's rule against session links)."
    decision: 61
  - id: q-105
    item: "p1-ready-hand-off"
    question: "Open question 6 (v9 plan): when push --ready hands off and returns at once, what holds the merge until Codex and Bugbot have reviewed the head? Recommended: a required status check, itos/reviews, set by a small workflow on pull_request (synchronize, ready_for_review), pull_request_review and issue_comment events that runs itos on main's code to read the head's reviews as --ready reads them today (logins from push.pr.review_by) and posts success, pending or failure for that head; the person adds it to main's branch protection. Its triggers only recompute a status from facts, so anyone commenting can at worst rerun it; it labels nothing. Then --ready: ready, gh pr merge --auto --rebase --match-head-commit, return handed-to-forge, and the reviews wait moves off the CLI. Two items: the gate (a ci/build item, yours to turn on) then the hand-off mode. Alternative: --ready --once judges the run, reviews and threads once and returns ready-still-waiting at the first thing missing, the driver rerunning it; no gate change, but slice-209 must tell ready-without-auto-merge from merging, and v9 would replace it. Alternative: GitHub's required approving reviews, which Codex's comment-based reviews do not satisfy."
    answer: "A required status check, itos/reviews (the person, 2026-10-30): a workflow on pull_request, pull_request_review and issue_comment events runs itos to read the head's reviews as --ready reads them and posts success, pending or failure for that head; the person adds it to main's branch protection. Then --ready hands off: ready, auto-merge pinned to the head, return. Items: the status command (slice), the workflow (ci), then the hand-off mode."
  - id: q-106
    question: "May code written outside itos go into its source?"
    answer: "No. No code written outside itos goes into its source, whatever its license: not copied, vendored, or ported line by line. Another project's ideas and designs are fine, reimplemented here from what they do. Libraries taken as dependencies through go.mod stay allowed, as deps-check governs them. Code from Open Orchestra, which the person co-owns, is the one exception."
    decision: 63
