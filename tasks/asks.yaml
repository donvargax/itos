  - id: q-15
    item: "slice-82"
    question: "slice-82 changes the words of one v5.0.8 corpus case: config check still refuses builtin moves on a command kind without supports_at, same rule (config-range-check-builtin), exit 2 and problem count, but the message now names supports_at instead of 'reads feature files'. previous-release judges a config error's words (T-095), and a feat may not change an old case, so it is a breaking change as the gate stands. Recommended: previous-release judges an old config error by its exit code, rule ids and problem count, not its message and fix text (a ci task before slice-82 lands), since a refusal reworded when its reason changes breaks no consumer and every such refinement would otherwise cost a major. Or: land slice-82 as breaking, v6.0.0. Or: keep the old, now untrue, message when supports_at is absent (not recommended). The finished patch waits in the scratchpad (slice-82-feat.patch)."
    answer: "Only machine output is itos's contract: its exit codes, its --json output less every key named message or fix, and the files it writes. Every plain-text output, a refusal's or a success's, is for people and may change in any release; message and fix in --json are the same sentences and may change with them, so a script reads the rule id and the other keys, never a message. The exit codes keep grep's and diff's model: 0 success, 1 a check said no, 2 usage or config error, 3 missing environment; v6 adds 75 (sysexits' EX_TEMPFAIL) for a failure that may pass if run again unchanged (a network failure, a server error or rate limit itos gave up retrying, a run still going at ci.watch.timeout), so a retry wrapper can act on it without --json. ci run stops passing a failing step's exit code through, which could read as 75: it exits 1 and names the step's code. previous-release judges an old case by that contract alone (T-100), replacing the help and usage-error exemptions; this tree's own corpus still pins every word. v6.0.0 announces the contract in a BREAKING-CHANGE footer and carries 75 and ci run's code (slice-86, with the /v6 module path, T-101). Per-rule structured fields in --json problems, so no script needs a message, come after v6 as additive keys. slice-82 lands after T-100 as a plain feat."
    decision: 35
  - id: q-16
    question: "Which CLI changes does v6.0.0 carry, besides exit 75 and ci run's own exit code (slice-86) and itos version saying what answers it (slice-87)?"
    answer: "The user's calls, 2026-10-06, from the CLI review (docs/CLI.md). The Claude Code guard becomes itos guard claude-code; itos ask becomes itos question and itos follow becomes itos followup (asks.yaml, follow-ups.yaml and the q-<n> ids stay); hooks install becomes hook install; work promote --as becomes --id and work queue --drop becomes --remove; itos help with an unknown topic exits 2. An old name exits 2 naming the new one; nothing keeps an old interface working, no alias and no feature flag. Every command parses its flags from a declared spec: an unknown flag and a flag with no value are refused with exit 2, --flag=value is read as --flag value, a flag's value is never read as a global flag, and a ref argument is checked. Exit codes come from the kind of the error, never from a default: 2 usage or config, 3 missing environment, 75 a failure that may pass when run again, 70 (sysexits' EX_SOFTWARE) an error itos cannot classify. All of it ships in one push, with slice-86, slice-87 and T-101: each part is built by one agent at a time, committed and not pushed, and the coordinator pushes the stack once. Code that keeps an old interface working is removed after v6 (p1-drop-compat-code)."
    decision: 36
  - id: q-17
    question: "How does itos install its hooks from v6.0.0, now that it refuses to commit or push where they cannot run?"
    answer: "Only in the git config, everywhere (the user's call, 2026-10-06): itos hook install declares its commit-msg and pre-push hooks as hook.<name>.event and hook.<name>.command in .git/config, which every worktree of the clone shares and git runs beside any hooks folder, whatever core.hooksPath says. itos knows no hook manager: the marker detection, the writing in each manager's layout, hook install's --manager and hooks.manager go, and a project's own hooks are its own business. Every itos command that commits or pushes refuses, exit 3, when its hooks are not declared or the git cannot run hooks its config declares, naming itos hook install or the git to upgrade. Each fresh clone installs once; a git too old for config hooks is the cost, recorded with the version that added them. Issue #16 would not have happened: the fresh worktree shared the config."
    decision: 37
