  - id: q-86
    item: "p1-json-cases-pin-json"
    question: "ADR-0035 makes plain text a non-contract, yet this tree's corpus pins every word (329 exact stdout, 440 exact stderr comparisons, help.yaml's 77 exact help cases). Should the corpus pin only the contract (exit codes, json: less message and fix, files_after), converting text-only behaviour cases to json: and deleting wording-only cases, with plain text at most a loose stdout_has fact? Recommended: yes, one test task per corpus file, help.yaml first; scenarios keep loose substring checks that a refusal names the next step."
    answer: "The user, 2026-10-21: yes. Printed text is exempt from breaking changes, so the corpus pins only the contract ADR-0035 names: exit codes, json: (less message and fix) and files_after. A case that checks behaviour through text converts to json:, exit and files_after (adding --json where the command has it); a case that checks only wording is deleted, help.yaml shrinking to help exiting 0 on stdout and naming its subcommands; a behaviour case on a command with no --json keeps at most a loose stdout_has on its key fact, the missing --json a gap of its own. One test task per corpus file, sized by the count, help.yaml first. Scenarios keep loose substring checks that a refusal names the next step; they never pin a whole line. No transcript comparison of printed text is added for the slices refactor: the contract-only corpus and previous-release are its proof."
    decision: 52
  - id: q-87
    item: "p1-slices-and-ports"
    question: "Does itos take itos-cc's architecture (its ADR-0051, ADR-0047, ADR-0053, docs/architecture.md): each command a vertical slice under internal/slices/<command> over shared engines, the outside world reached through ports with in-memory fakes and contract suites, the OS a value, held by depguard and architecture-check? Recommended: yes, as behaviour-neutral v8.x refactors, kong and itos-cc's exit codes in v9.0, no in-process driver yet."
    answer: "The user, 2026-10-21: yes, as fast as possible; issues found later are fixed forward, the scenarios, the contract-only corpus (ADR-0052) and previous-release covering the moves. (1) The layout and the ports land in v8.x as refactors, one command or one port operation group per task, no behaviour change; kong (p1-cli-kong) and itos-cc's exit codes (80 to 82, 100, 130, a per-problem exit) are designed now and land together as v9.0; an in-process second driver is left out unless it proves itself. (2) The gates come straight from itos-cc (pinned golangci-lint with depguard, tools/bin/architecture-check with its fixtures, no mocking library, no fake linked into the binary); p2-adopt-go-template-itos stays later. (3) Features freeze until the layout is done: only repairs and moves. (4) The first ports are the VCS (git) and the tracker store (the registry, ledgers, questions, records), the seams p2-vcs-and-tracker-seams needs for Fossil. (5) Every port method takes a context.Context first (itos-cc's decision 30); callers pass context.Background() at the edges until v9 threads cancellation. (6) Two implementing lanes in worktrees now, the moves and the corpus conversion; more once the ports and engines are out."
    decision: 53
  - id: q-88
    item: "p1-json-cases-pin-json"
    question: "The corpus count for ADR-0052 found outputs ADR-0035 does not name: plain stdout meant for scripts (ci scope's docs_only=, ci range's FROM= and TO=, config get, tests next-id, tests smoke ids), guard claude-code's hook JSON read by Claude Code and the itos plugin, and guide --json's and go --json's text key holding guide prose. Which are contract? Recommended: the script outputs and the guard JSON are contract and stay pinned exactly; text is exempt like message and fix."
    answer: "The user, 2026-10-21: each recommendation. Contract: the plain stdout meant for scripts (ci scope's docs_only=, ci range's FROM= and TO=, config get, tests next-id, tests smoke ids) and guard claude-code's hook JSON; their corpus cases keep their exact pins (the hook JSON with json:). Exempt like message and fix: the text key of guide --json and go --json. A usage case keeps its exit code and a loose stderr_has naming the offending flag or argument (a fact, not a wording), so it cannot pass for another reason (the coordinator's call)."
    decision: 54
  - id: q-89
    item: "p1-cli-kong"
    question: "v9: is prose ever part of itos's JSON contract? Recommended: no. Every prose value sits under a reserved key (message, fix, the guide's text), never judged; every fact a sentence carries is structured data beside it, as RFC 9457's extension members (status's unread becomes objects with source, rule and status; verify's failures become problems with rule ids); an external format's required prose field (Claude Code's permissionDecisionReason) is present by that format's schema and its words are never judged. A prose field under another key in v8 (unread and the like) is renamed or restructured in v9 as a breaking change beside the new exit codes."
  - id: q-90
    question: "#97: should itos offer a tracked registry-only starter for a docs-and-ops repository (registry, queue, decisions, deferrals; no required footers, no smoke set, no CI plan)? Recommended: no new init mode; ship and document a policy file for it, used through the existing itos init --policy <file> (a mode is a second starter to keep in step; a policy file is data). To check before answering: that such a policy passes init and config check."
    answer: "The user, 2026-10-21: the recommendation. No new init mode: a shipped, documented policy file for a registry-only repository, used through itos init --policy (p1-registry-only-policy)."
    decision: none
  - id: q-91
    item: "p1-task-signoff-check"
    question: "#99 with #95: should a task be able to say its proof is a person's sign-off rather than a command? Recommended: yes, only as an evidence requirement on top of slice-158 (work done refuses such a task without --evidence-file and records it with its date); no --check-on <host> runner, since a command that reaches a host is already a valid check."
    answer: "The user, 2026-10-21: guard against an agent closing a sign-off task in a person's name. No honor-system evidence alone. A sign-off task closes only by a commit signed with a sign-off key of a person on the people list, verified in CI: a key distinct from any key that signs ordinary commits (all commits may be signed, but the sign-off key is its own), behind a hardware touch or a passphrase so an agent cannot use it. Proof that the work itself happened on a device (a runner or signed evidence outside the agent's reach) is a later step."
    decision: 55
