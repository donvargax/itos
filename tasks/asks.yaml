    question: "For #71, recommend dedicated completion-evidence data bound to a validated implementation revision: adding results can reuse proof, but edits to the task specification, check definitions, scenarios, fixtures or execution policy still invalidate it. The older p1-work-done-past-data-commits proposal skips all ledger changes, including check changes, so it is too broad for this assurance. Should we specify the dedicated evidence route, or first restrict the existing skip rule without adding stored receipts?"
    answer: "First delivery records final completion evidence in the same work done closure transaction after the existing current checks and hosted CI requirements pass. This avoids a separate pre-close evidence commit for the verified #71 sequence. Preserve current freshness and acceptance checks; do not add generic proof receipts or silently reuse proof for separately committed specification/check changes. General reusable receipts remain separate work if separately committed evidence must be supported."
  - id: q-71
