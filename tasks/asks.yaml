    answer: "The user, 2026-10-21: the recommendation. A bounded retry: up to three tries, only for a non-fast-forward refusal, each reported, the pre-push hook running each time (p1-push-retry-moved-remote)."
    decision: none
  - id: q-94
    item: "p1-agent-test-runs-once"
    question: "Who runs a task's done_when checks, and how do agents trust it instead of running them by hand?"
    answer: "The user, 2026-10-22: both tiers run them, as itos-cc does (its decisions 44 and 52). Locally, the hooks run each check in process over the ports' fakes, fast and without the network. CI runs the same checks with the real adapters, git and GitHub. Agents never run done_when by hand. When a check fails, itos says so with enough to fix it: the task, the check's command, its exit code and its output, in text and --json, from the hook and from itos push or ci watch. done_when holds only what no gate already runs. This brings back the in-process second driver, which the refactor plan had left out unless it proved itself (option C)."
    decision: 56
  - id: q-95
    item: "p1-agent-test-runs-once"
    question: "Until the in-process tier lands (ADR-0056), do agents still run CI's push proof, or a task's checks, by hand before pushing?"
    answer: "The user, 2026-10-22: no. CI owns both: the push proof (one seeded mutant and the changed lines' coverage, every push) and every named task's checks. An agent's by-hand run repeated CI's exactly and still missed its draw (T-267 seeded from its take commit, CI from the last green run, main went red). A red CI is fixed forward by the agent that pushed. This retires q-55. When p1-agent-test-runs-once builds the in-process driver over the fakes, the pre-push hook runs the local tier automatically: task checks, changed-line coverage and a mutant of the changed functions over the unit tests and in-process scenarios, as itos-cc runs TestScenarios locally."
    decision: 57
  - id: q-96
    item: "slice-165"
    question: "On a git older than 2.54, which runs no hook its config declares, how does itos install its hooks, and does the git config stay the default?"
    answer: "The user, 2026-10-22: the git config stays the default and the only place itos writes on a git that runs its config's hooks (ADR-0037 holds there). On an older git, down to 2.51, hook install writes hook files into the folder git runs hooks from (git rev-parse --git-path hooks), an untracked hook already there kept and run first; a hook file git tracks is never written, the refusal naming the file and the line to add; a project's own hook file that calls itos's hook satisfies the commands that commit or push. Scenarios fake the old git with a wrapper; a real git 2.51 job in CI is a later task. This is a compatibility path, kept a few months until most people's git runs config hooks, then removed."
    decision: 58
  - id: q-97
    item: "p1-agent-test-runs-once"
    question: "p1-agent-test-runs-once: where does the local tier run, how long may it take, how does a done_when shell check get its in-process run, is it breaking, and how does it start? (draft: .git/itos/design-agent-test-runs-once.md)"
    answer: "The user, 2026-10-23: the pre-push hook runs the local tier (it has the push range; commits stay fast). Budget under 2 minutes warm, hard cap 5; over the cap it fails naming the timing, never skips quietly. A done_when check declares its local in-process command beside its run: command (an optional key); a completeness check refuses a check without one, and an unsupported check blocks the local run, never passes vacuously. v8 ships everything additive and opt-in (the driver, the state isolation, the optional key, the structured failures, task checks at pre-push behind a config key this repository turns on); making pre-push the default instead of the commit-msg hook changes live scenarios (commit-tasks.feature) and waits for v9 with q-89. Start with a throwaway spike that proves one scenario in process before any ADR or plan; CI keeps owning task checks and the push proof (ADR-0057) meanwhile."
    decision: 59
  - id: q-98
    item: "p1-evidence-records"
    question: "p1-evidence-records: how are check results recorded so a rerun with nothing changed answers at once, what proves a check passed for work done, and how is red-first proved? (design: docs/plans/evidence-records.md, reviewed in five rounds)"
    answer: "The person, 2026-10-23: do not stop agents from verifying; make a rerun with nothing changed free, as Go's test cache does. Only checks that opt in (a done_when check or ci.steps entry declaring evidence inputs and environment) are memoized, keyed by the whole tree they actually run on (CI: the commit tree; the commit-msg hook: the index tree, once bug-112 runs checks from a staged snapshot; by hand: HEAD's tree when the tracked tree is clean, else uncached), the command, policy, toolchain, platform and declared untracked inputs. One record shape serves local and CI runs. Local records (.git/itos/evidence) only make local reruns instant and never prove anything; CI records are artifacts kept 90 days, accepted only for the expected completed run and head, an expired one asking for fresh CI. Red-first records come from itos tests red-first on a test commit against its parent build, counting only Then failures. Everything consumer-visible is opt-in in v8 (ci.evidence, work.evidence.require_ci, work.evidence.require_red_first); this repository turns each on after its feature; defaults are a v9 question. Only deterministic checks opt in; their author declares inputs. A lock or record failure runs uncached, never fails a check. Once local lookup exists, agents may run checks freely for local feedback; CI acceptance and release proof are unchanged."
    decision: 60
  - id: q-99
    item: "bug-112"
    question: "bug-112 CI 40021166532 failed changed-line coverage. The mandatory guide-repair revert was attempted under T-287, but the existing moves gate rejects a revert turning live HOOKSNAP-01,02,03,07,09,12,13 back to wip, exactly what the guide prescribes. The rejected revert was cleanly undone without bypassing the gate; no source restoration commit exists. Recommend an explicit exception to the guide for this incident: let the same implementing agent add the missing branch tests and repair forward, holding other implementation landings until CI passes. No gate changes, skips, broad exceptions or manual mutation proof. Address the guide/gate contradiction separately. Approve forward repair, or prefer to specify a durable revert-policy correction first?"
    answer: "Approved repair forward for this incident. Resume the same bug-112 implementer to add the missing branch tests without changing, skipping or weakening any gate. Hold other implementation landings until CI passes. The failed revert was undone; fix the guide/moves-rule contradiction as a separate item."
  - id: q-100
    item: "slice-161"
    question: "For slice-161 (separate accepted ADR direction from validation evidence), review found the current default metadata/index rewrite would change released Markdown-file contracts. Recommend a nonbreaking first delivery: preserve default and legacy ADR/index bytes, add opt-in validation on newly recorded ADRs and effective unknown validation in decision show; split later in-place updates, and defer any universal index reformat to v9. Alternative: keep the current universal unknown labels/default rewrite and include the full change in the planned v9 compatibility bundle. Which delivery should we specify? No v9 release is authorised by this question."
    answer: "Nonbreaking first. Preserve default and legacy ADR/index formats, add opt-in validation on new records and effective unknown inspection first, and split later in-place updates. Defer universal index changes to the planned v9 bundle; no major release is authorised. The first delivery keeps index link text unchanged, avoiding inferred consent from previously unreserved hand-authored validation metadata."
  - id: q-101
    item: "p1-agent-test-runs-once"
