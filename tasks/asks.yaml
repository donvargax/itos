    answer: "Explicit question relinking and actionable config-check diagnostics first. Provide supported relink and clear-item operations with validation and atomic writes; preserve answers and recorded decision links. Automatic upgrade repair based on proven rename provenance is separate work, with no guessed relinking in this delivery."
  - id: q-75
