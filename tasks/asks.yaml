    question: "Replace local complete mutation generation with CI-owned bounded sampling and coordinator-owned waiting? Recommended and accepted by the person on 2026-10-08: no local mutant execution; push CI judges one mutant total over changed committed code, nightly 20 total, using valid cached or targeted coverage and relevant unit/integration tests. This is sampled assurance rather than proof every changed function has complete mutant results. Agents tools/bin/itos push --no-wait and hand back the exact pushed SHA plus a clean checkout. The coordinator watches asynchronously, starts independent work while pending, assigns red repairs in isolated worktrees inside this directory, and closes items only on a green covering run; releases remain blocked by required CI and red main takes priority before further landings. No stale-cache pass, vacuous new-code sample, hidden full mutation pass, force-push or coverage percentage threshold. A separate CI task must replace the check-only policy after fresh bounded sampling is supported. All work stays within this directory."
    answer: "Accepted by the person in this session: no new local mutation execution; push CI runs one mutant total over changed committed code, nightly 20 total. Agents push with --no-wait and hand back the exact SHA and a clean checkout; the coordinator owns asynchronous CI watching, targeted red repairs in isolated worktrees inside this directory, and closure only after a green covering run. Releases remain blocked on required CI. This changes complete changed-function mutation proof into sampled assurance and requires fresh bounded provider support (itos-cc#27) before replacing the old gate. Preserve coverage and source/test freshness, relevant integration tests, explicit no-site outcomes, and honest failure evidence; no hidden full mutation prepass or empty-cache pass. The already-running local job was separately allowed to finish and its generated snapshots, including failures, must be preserved and pushed unchanged. All work stays within this directory."
