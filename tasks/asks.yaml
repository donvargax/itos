# The questions to the person the work is for, written by itos decision (itos help decision).
questions:
  - id: q-1
    item: "bug-12"
    question: "The starter config itos init writes requires a Task footer of docs commits, but work add, edit, take, done and task add commit docs with none, so every registry command fails under init's own hooks (bug 12's @ID-INIT-23 and 24 wait on this). Drop docs from the starter's required_for, as this repository does (the coordinator's recommendation), exempt a docs commit touching only the registry and ledger in the hook, or something else? The Item: footer, once built, could also satisfy it."
    answer: "Option 1 (2026-10-04): drop docs from the starter's required_for, as this repository does, and give docs the starter's one path scope (Markdown, docs/ and itos's data beside the ledger), so a change labelled docs to skip the Task footer is still refused. Every other type stays unscoped."
    decision: none
  - id: q-2
    item: "p1-push-needs-hooks"
    question: "Refusing itos commit and itos push when the hook they rely on cannot run breaks every consumer without hooks installed. Put it behind a config key, off by default until v3.0.0, with only the clear bug (core.hooksPath naming a missing folder) refused at once as a fix (the coordinator's recommendation)?"
    answer: "Refuse, in v6.0.0 and with no config key (the user's call, 2026-10-06; decision 36 rules out feature flags). Every itos command that commits or pushes checks first that the hook it relies on will run (git rev-parse --git-path hooks, and a stealth config's git-config hooks with a git that runs them) and exits 3 naming the cause and telling the person to run their project's hook installation when it will not: core.hooksPath naming a missing folder, a hooks folder with no commit-msg or pre-push hook, hooks never installed. Plain git stays the deliberate way around; CI's verify is the backstop. Running the checks in itos itself instead was rejected: it would cover itos's checks only, not the project's other hooks. Issue #16 is the case that bit. itos stops covering for hook managers: hook install writes git's own hooks only (plain, or git-config in stealth mode), prints the lines to add where another tool owns the hooks folder, and hooks.manager is removed (the user's call: itos is not a babysitter)."
  - id: q-3
    item: "p1-follow-reopen"
    question: "A closed itos follow thread: reopen it with an explicit itos follow reopen <id> (the coordinator's recommendation, so a late note does not bring it back by accident), or let any note reopen it?"
  - id: q-4
    question: "When do the other repositories move to the current itos (by hand from a release's notes, or with itos pin)?"
  - id: q-5
    item: "slice-59"
    question: "Once itos init --agent-rules lands, does this repository's hand-written AGENTS.md become the generated block (the coordinator recommends yes, a small docs task)?"
    answer: "Yes (the user, 2026-10-05). This repository's AGENTS.md gains the generated block, and its hand-written part keeps only what no command checks; T-096."
  - id: q-6
    question: "Set a unit coverage threshold? Coverage is collected with none since the template's demo app left; it blocks nothing."
  - id: q-7
    question: "Confirm or overturn the coordinator's older calls: slice 4 drops the keys of features not built yet; slice 7 counts a task with no work item as in progress; slice 8 tries each cost pattern as written and as hooks.bin to itos; slice 9 reads a check's reused run even when an earlier check of its task changed the tree; slice 10 keeps a failing delegate's exit code in the hook; slice 13 makes a missing ledger folder exit 2; slice 46's pre-push verify is silent when commits pass, with no opt-out."
  - id: q-8
    item: "p1-adr-tools-default-dir"
    question: "A repository set up with adr-tools' defaults keeps its records in doc/adr with no .adr-dir file, so itos ask record would start a second log in docs/adr, numbered from 1. Should an existing doc/adr holding records win when there is no .adr-dir, as adr-tools' own lookup does (the coordinator's recommendation: compatibility was the point of using its format), or stay with docs/adr unless .adr-dir says otherwise?"
    answer: "No (2026-10-04): docs/adr stays the default and a different folder is configured, with a .adr-dir file. Defaults follow the most common convention; configuration is the escape hatch (convention over configuration). An existing doc/adr does not win on its own."
    decision: 1
  - id: q-9
    item: "p1-adr-madr"
    question: "Decision records move to MADR 4 (p1-adr-madr). Which folder by default: docs/decisions, MADR's own convention (the coordinator's recommendation, by decision 1, since a default follows the format's convention), or docs/adr as decided for adr-tools' format? Either way .adr-dir stays the escape hatch."
    answer: "docs/decisions (2026-10-04): MADR's own folder is the default, by decision 1; another folder is configured."
  - id: q-10
    item: "p1-adr-madr"
    question: "Writing MADR instead of Nygard changes what v2.28.0's itos ask record promises, so it is a breaking feat and cuts v3.0.0. Cut v3.0.0 now for it alone, the planned v3 items (v3-hooks-bin-default, v3-stealth-pre-push) moving to the next major (the coordinator's recommendation: majors cost nothing under fix-forward, and holding it means T-085 writes about 20 records in a format being dropped), or hold MADR until those items are ready and ship them together?"
    answer: "Cut v3.0.0 now for MADR alone (2026-10-04); the planned v3 items go to the next major, and another major follows whenever one is needed."
  - id: q-11
    item: "p1-registry-archive"
    question: "p1-registry-archive: dropping done items from the registry (your call of 2026-10-04) collides with what is released: work list promises every item, done ones too; the nightly's done-task step and slice 7 read done-ness from the registry, so a task whose item is gone would count as in progress; and reading dropped items back from close commits means parsing git history. Move each closed item to an archive file beside the registry (tasks/work-items-done.yaml) that work done writes, and that work list, work show, ids and the nightly read too: the live registry shrinks to open work, nothing released breaks, no history is parsed (the coordinator's recommendation)? Or drop them as decided and cut v4.0.0 for it?"
    answer: "Neither (the user's calls, 2026-10-04): the registry is an index, its whys an idea's alone, a slice's or bug's living in its feature file, a task's in its ledger, a change's in its commit; work done drops the closed item's why, so the registry grows with open work only. Slices 76 to 79, the breaking part in v4.0.0 with work list open by default."
    decision: 34
  - id: q-12
    item: "p3-plugin-guide-wrappers"
    question: "With the plugin's itos skill dropped (sessions start with ! itos go, and every implementer runs itos guide work), where does how to work with itos live, now that ADR-0032 says it stays in the plugin's skill?"
    answer: "The config's rules are generated into a marked block of AGENTS.md, itos touching only what is inside its markers. How to work with itos lives in itos's own guides, versioned with the binary: itos go for the session the person talks to, itos guide work for an implementer, told to run it by its brief. No flow needs the Claude Code plugin, which keeps its titles and its guard and drops its itos skill. --agents writes the orchestration files once, as the project's own. Under --stealth, Claude Code gets a CLAUDE.local.md importing the rules and Codex an AGENTS.override.md holding a copy of the project's AGENTS.md beside them, both listed in .git/info/exclude. (The user's calls, 2026-10-04.)"
    decision: 33
  - id: q-13
    item: "p1-nightly-late-done-checks"
    question: "done_when and dumb checks (p1-nightly-late-done-checks' note holds the proposal): (a) do generic standing rules, itos-enforced, match what itos was started to prevent, dumb checks never existing or never breaking? (b) ban raw string checks (grep, test) in done_when, or let them expire at done? (c) are coverage, tools exercised by a standing step and docs references resolving the right set of standing rules, or is a category missing (workflow behaviour is covered only by tools/selftest/gates.ts)?"
  - id: q-14
    item: "slice-78"
    question: "Pruning the ideas, once work drop (slice 78) lands; the coordinator's proposal of 2026-10-05. Drop as superseded or obsolete: v3-hooks-bin-default and v3-stealth-pre-push (folded into slice-79); p1-v4-work-list-wording (folded into slice-79); p1-release-checks-its-notes (notes are generated by CI since T-069, no committed file); p1-release-notes-schema-keys (schema-contract compares the schemas, T-070); p1-plugin-ci-watch (the plugin's skill is gone, T-092; itos ci watch exists); p3-init-orchestration (itos go and the guides ship in itos, ADR-0033); p1-follow-ups (built as itos follow and itos ask, slices 61 and 62); p3-notice-names-pin (superseded by p1-upgrade-notices); p1-commit-message-file (itos commit -F); p1-work-brief (itos guide work and work show); p3-pre-push-without-commands (the Go pre-push verifies without hooks.pre_push, slice 46). Drop as low value: p1-own-recognize-for-itos, p1-smoke-suggest, p1-work-spend. Your call: slice-59 and p3-init-agent-rules-stealth (deprioritised twice; the block would hold only rules the hooks already teach), which would also close q-5. Waiting on q-13: p1-nightly-issue-names-tasks, p1-nightly-past-first-failure, p1-ci-after-push-checks, p1-ci-checks-once, p1-hook-checks-once. Approve all, or name the ones to keep?"
    answer: "The user's call (2026-10-05) was to drop only the superseded or obsolete ideas, the twelve listed, and keep p1-own-recognize-for-itos, p1-smoke-suggest, p1-work-spend, slice-59 and p3-init-agent-rules-stealth."
    decision: none
  - id: q-15
    item: "slice-82"
    question: "slice-82 changes the words of one v5.0.8 corpus case: config check still refuses builtin moves on a command kind without supports_at, same rule (config-range-check-builtin), exit 2 and problem count, but the message now names supports_at instead of 'reads feature files'. previous-release judges a config error's words (T-095), and a feat may not change an old case, so it is a breaking change as the gate stands. Recommended: previous-release judges an old config error by its exit code, rule ids and problem count, not its message and fix text (a ci task before slice-82 lands), since a refusal reworded when its reason changes breaks no consumer and every such refinement would otherwise cost a major. Or: land slice-82 as breaking, v6.0.0. Or: keep the old, now untrue, message when supports_at is absent (not recommended). The finished patch waits in the scratchpad (slice-82-feat.patch)."
    answer: "Only machine output is itos's contract: its exit codes, its --json output less every key named message or fix, and the files it writes. Every plain-text output, a refusal's or a success's, is for people and may change in any release; message and fix in --json are the same sentences and may change with them, so a script reads the rule id and the other keys, never a message. The exit codes keep grep's and diff's model: 0 success, 1 a check said no, 2 usage or config error, 3 missing environment; v6 adds 75 (sysexits' EX_TEMPFAIL) for a failure that may pass if run again unchanged (a network failure, a server error or rate limit itos gave up retrying, a run still going at ci.watch.timeout), so a retry wrapper can act on it without --json. ci run stops passing a failing step's exit code through, which could read as 75: it exits 1 and names the step's code. previous-release judges an old case by that contract alone (T-100), replacing the help and usage-error exemptions; this tree's own corpus still pins every word. v6.0.0 announces the contract in a BREAKING-CHANGE footer and carries 75 and ci run's code (slice-86, with the /v6 module path, T-101). Per-rule structured fields in --json problems, so no script needs a message, come after v6 as additive keys. slice-82 lands after T-100 as a plain feat."
    decision: 35
  - id: q-16
    question: "Which CLI changes does v6.0.0 carry, besides exit 75 and ci run's own exit code (slice-86) and itos version saying what answers it (slice-87)?"
    answer: "The user's calls, 2026-10-06, from the CLI review (docs/CLI.md). The Claude Code guard becomes itos guard claude-code; itos ask becomes itos question and itos follow becomes itos followup (asks.yaml, follow-ups.yaml and the q-<n> ids stay); hooks install becomes hook install; work promote --as becomes --id and work queue --drop becomes --remove; itos help with an unknown topic exits 2. An old name exits 2 naming the new one; nothing keeps an old interface working, no alias and no feature flag. Every command parses its flags from a declared spec: an unknown flag and a flag with no value are refused with exit 2, --flag=value is read as --flag value, a flag's value is never read as a global flag, and a ref argument is checked. Exit codes come from the kind of the error, never from a default: 2 usage or config, 3 missing environment, 75 a failure that may pass when run again, 70 (sysexits' EX_SOFTWARE) an error itos cannot classify. All of it ships in one push, with slice-86, slice-87 and T-101: each part is built by one agent at a time, committed and not pushed, and the coordinator pushes the stack once. Code that keeps an old interface working is removed after v6 (p1-drop-compat-code)."
    decision: 36
  - id: q-17
    question: "How does itos install its hooks from v6.0.0, now that it refuses to commit or push where they cannot run?"
    answer: "Only in the git config, everywhere (the user's call, 2026-10-06): itos hook install declares its commit-msg and pre-push hooks as hook.<name>.event and hook.<name>.command in .git/config, which every worktree of the clone shares and git runs beside any hooks folder, whatever core.hooksPath says. itos knows no hook manager: the marker detection, the writing in each manager's layout, hook install's --manager and hooks.manager go, and a project's own hooks are its own business. Every itos command that commits or pushes refuses, exit 3, when its hooks are not declared or the git cannot run hooks its config declares, naming itos hook install or the git to upgrade. Each fresh clone installs once; a git too old for config hooks is the cost, recorded with the version that added them. Issue #16 would not have happened: the fresh worktree shared the config."
    decision: 37
  - id: q-18
    question: "What is the group for the questions waiting on the person the work is for called, after itos question still caught 'what should I ask X?'?"
    answer: "itos decision (the user's call, 2026-10-06): a name should say who answers, not what is asked. The group holds the decisions waiting on the person the work is for, which end as decision records or as --none, so it is decision add, answer, record and show, and itos decision lists them; it lines up with docs/decisions, which it writes. Anything to take up with someone else, a question included, is itos followup. itos ask and itos question exit 2 naming both. asks.yaml, work.asks, the q-<n> ids and the docs: ask q-<n> headers stay. It changes decision 36's ask-to-question line before any release has it."
    decision: 38
  - id: q-19
    item: "p1-pr-mode"
    question: "Relax strict trunk-based work so pull requests join the way of working once work runs in parallel? On what terms?"
    answer: "Yes, behind a config switch, push.mode: trunk or pr, trunk the default, so it is additive. In pr mode an agent's work goes on a short-lived branch named for its item, merged by rebase-merge, never squash (each commit is a changelog entry with its footers, and the red-first test commit stays its own), the branch required to be up to date with main before it merges. Claims (work take), queue moves and the coordinator's registry commits stay direct to main, so two agents never take one item. itos push in pr mode pushes the branch, opens the PR with gh, turns on auto-merge (gh pr merge --auto --rebase; the repository allows auto-merge and a ruleset on main requires the checks) and watches its checks; since auto-merge never updates a branch main left behind, itos asks GitHub to rebase it (gh pr update-branch --rebase) rather than force-pushing; a merge queue would do it too but is offered only to organization-owned repositories. CI also runs on pull_request, its range merge-base..head. GitHub's rebase-merge gives the commits new SHAs, so work done means the PR merged and main's run green. Releases stay on main. itos init offers the repository settings. It also lets remote agents (cloud sessions pushing a branch and opening a PR) work as ordinary itos agents. Parallel agents come after, one clone or devcontainer each, never a shared worktree. The user's calls, 2026-10-06."
    decision: 39
  - id: q-20
    question: "Decision 35 makes the files itos writes part of its contract. Are their comment lines part of it too?"
    answer: "No. A written file is contract by its data; its comment lines are for people, like plain output, and may change in any release. This refines decision 35: docs/CLI.md's contract section says the data of the files itos writes, and the conformance runner's --additive mode, which previous-release uses, stops comparing comment lines in written YAML and Markdown. The user's call, 2026-10-07, recorded from that session's transcript."
    decision: 40
  - id: q-21
    item: "slice-94"
    question: "The Claude Code plugin calls itos commands (guard claude-code, and work list --all and task list with --json for the titles): may a release rename or remove them, and does the launcher map them to an older pin's names?"
    answer: "They are part of the contract with the plugin, never renamed or removed, even in a major release. The v6.0.0 rename stands, with no compatibility kept for pins older than v6: no launcher mapping. docs/CLI.md rule 43 gains the exception, and the entry-points rules name these commands as the plugin's contract; a ci check that every itos command the plugin's scripts call is answered by the built itos makes the promise a gate, so slice-94, which specified the launcher mapping, is dropped. The user's calls, 2026-10-07, recorded from that session's transcript."
    decision: 41
  - id: q-22
    item: "bug-38"
    question: "bug-38 (itos writes its own files atomically) fixes what an interrupt or a full disk does mid-write, which no feature scenario can produce reliably, yet a fix commit must name a scenario. Recommended: prove it with unit tests over one temp-file, fsync and rename helper (as follow.Save since bug 16), and land it as a refactor task in place of the bug, which is dropped naming the task. Or: keep it a fix with a scenario that injects a write failure through a test-only hook in itos."
  - id: q-23
    item: "bug-42"
    question: "bug-42 (under --stealth, a yes at the terminal writes nothing) shows only on a real terminal; the features have no pseudo-terminal. Recommended: add a pseudo-terminal step to the features (github.com/creack/pty, Unix only, the scenario skipped on Windows), which also lets init's other questions be specified. Or: prove it with a unit test of the branch and land it as a refactor task in place of the bug."
  - id: q-24
    item: "p1-nightly-late-done-checks"
    question: "How is v7 released while its bundle lands one item at a time, given that every green push with a breaking commit cuts a major of its own today?"
    answer: "As pre-releases: while itos.yaml carries a pre-release marker (T-118), the commits that would cut 7.0.0 cut 7.0.0-rc.1, rc.2 and so on, marked pre-release and never latest, so go install @latest, the update notice and a bare itos pin keep naming 6.x, and a repository opts in by pinning an rc. 6.x is finished first (T-117, T-113 and the two upgrade items), since moving the module path to /v7 for the first rc ends 6.x patches from main. The itos-cc integration lands first, as v7.0.0-rc.1 (the role protocol, the proof rule and work done, CI's mutation sample, expiring checks); the rest of the bundle follows as further rcs; removing the marker cuts v7.0.0. The user's calls, 2026-10-07; docs/plans/v7-proof-of-done.md holds the plan."
    decision: 42
