  - id: q-12
    item: "p3-plugin-guide-wrappers"
    question: "With the plugin's itos skill dropped (sessions start with ! itos go, and every implementer runs itos guide work), where does how to work with itos live, now that ADR-0032 says it stays in the plugin's skill?"
    answer: "The config's rules are generated into a marked block of AGENTS.md, itos touching only what is inside its markers. How to work with itos lives in itos's own guides, versioned with the binary: itos go for the session the person talks to, itos guide work for an implementer, told to run it by its brief. No flow needs the Claude Code plugin, which keeps its titles and its guard and drops its itos skill. --agents writes the orchestration files once, as the project's own. Under --stealth, Claude Code gets a CLAUDE.local.md importing the rules and Codex an AGENTS.override.md holding a copy of the project's AGENTS.md beside them, both listed in .git/info/exclude. (The user's calls, 2026-10-04.)"
    decision: 33
  - id: q-13
    item: "p1-nightly-late-done-checks"
    question: "done_when and dumb checks (p1-nightly-late-done-checks' note holds the proposal): (a) do generic standing rules, itos-enforced, match what itos was started to prevent, dumb checks never existing or never breaking? (b) ban raw string checks (grep, test) in done_when, or let them expire at done? (c) are coverage, tools exercised by a standing step and docs references resolving the right set of standing rules, or is a category missing (workflow behaviour is covered only by tools/selftest/gates.ts)?"
    answer: "Settled 2026-10-07; docs/plans/v7-proof-of-done.md holds it. (a) Yes: guarantees come from rules itos enforces, never from a task's own checks. A task's proof is computed from its diff and its type: Go code by itos-cc's mutation check over the functions the item changed (--since its base, --fail-uncovered), behaviour by its scenarios, gates by their own tests run, prose by the person's review; nothing closes an item past a failing proof. (b) String checks are scaffolding: a task's checks run while it is open and gate work done, then leave the ledger; nothing reruns a done task's checks. (c) The standing rules are: no test reads a policy file as text; every gate program's tests run in CI; every command, path, scenario and decision the docs name resolves. No coverage threshold (q-6)."
    decision: 43
  - id: q-14
    item: "slice-78"
    question: "Pruning the ideas, once work drop (slice 78) lands; the coordinator's proposal of 2026-10-05. Drop as superseded or obsolete: v3-hooks-bin-default and v3-stealth-pre-push (folded into slice-79); p1-v4-work-list-wording (folded into slice-79); p1-release-checks-its-notes (notes are generated by CI since T-069, no committed file); p1-release-notes-schema-keys (schema-contract compares the schemas, T-070); p1-plugin-ci-watch (the plugin's skill is gone, T-092; itos ci watch exists); p3-init-orchestration (itos go and the guides ship in itos, ADR-0033); p1-follow-ups (built as itos follow and itos ask, slices 61 and 62); p3-notice-names-pin (superseded by p1-upgrade-notices); p1-commit-message-file (itos commit -F); p1-work-brief (itos guide work and work show); p3-pre-push-without-commands (the Go pre-push verifies without hooks.pre_push, slice 46). Drop as low value: p1-own-recognize-for-itos, p1-smoke-suggest, p1-work-spend. Your call: slice-59 and p3-init-agent-rules-stealth (deprioritised twice; the block would hold only rules the hooks already teach), which would also close q-5. Waiting on q-13: p1-nightly-issue-names-tasks, p1-nightly-past-first-failure, p1-ci-after-push-checks, p1-ci-checks-once, p1-hook-checks-once. Approve all, or name the ones to keep?"
    answer: "The user's call (2026-10-05) was to drop only the superseded or obsolete ideas, the twelve listed, and keep p1-own-recognize-for-itos, p1-smoke-suggest, p1-work-spend, slice-59 and p3-init-agent-rules-stealth."
