  - id: q-30
    item: "p3-guard-replacement"
    question: "For guided item-aware commits, must every commit select a declared commit-plan part supplying its type, imperative subject and required footer metadata, or may itos infer missing metadata? Recommended: require a lightweight declared part; the agent supplies its body and itos refuses mismatched staged paths or missing semantic metadata instead of guessing. The design draft is docs/plans/guided-commits.md."
    answer: "Require a lightweight declared commit plan. Every guided commit selects a part; itos refuses missing semantic metadata or mismatched staged paths rather than inferring a different commit."
  - id: q-31
    item: "p3-guard-replacement"
    question: "Who may author or amend a required commit plan? Recommended: the coordinator specifies and approves its parts; the implementing agent proposes amendments and waits for approval rather than changing its own constraints. Alternatives: the implementer may append parts within current path/type rules, or edit the plan freely. This is a workflow ownership rule; the mechanism proving approval is not yet designed. See docs/plans/guided-commits.md."
    answer: "The coordinator prepares and approves plans and amendments. Implementing agents propose changes and wait for approval; the approval mechanism is a workflow rule, not proof of a separate identity."
  - id: q-32
    item: "p3-guard-replacement"
    question: "Is an approved commit-plan part reusable for several commits, or consumed by one commit? Recommended: reusable until explicitly completed, with each commit satisfying the same approved type, subject, footer metadata, path rules and normal gates; further commits after completion need coordinator approval. Alternative: one commit per part, with each checkpoint or correction requiring a new approved part. Completion declaration and proof remain to be designed. See docs/plans/guided-commits.md."
    answer: "Parts are reusable approved intents until completion. Every commit must satisfy the same declared metadata, path rules and normal gates; reopening a completed part needs coordinator approval."
  - id: q-33
    item: "p3-guard-replacement"
    question: "For the first guided-commit version, is coordinator approval a recorded/reviewed workflow rule, or must it be a verifiable technical boundary? Both current sessions share OS/git rights, so an approve command or plan hash alone cannot prove the approving role. Recommended first: enforce declared-part constraints and record approved revisions/amendments honestly; add a hard boundary only with isolated workers or approval credentials unavailable to implementers. Alternative: require that trusted boundary from the start. See docs/plans/guided-commits.md."
    answer: "Workflow first. Validate parts and record approved revisions and explicit amendments; do not claim a security boundary while sessions share OS/git rights. Stronger isolated or signed approval can come later."
