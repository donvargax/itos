    answer: "Neither (the user's calls, 2026-10-04): the registry is an index, its whys an idea's alone, a slice's or bug's living in its feature file, a task's in its ledger, a change's in its commit; work done drops the closed item's why, so the registry grows with open work only. Slices 76 to 79, the breaking part in v4.0.0 with work list open by default."
