  - id: q-25
    item: "p1-drop-compat-code"
    question: "v7: should config check refuse the nightly step { tasks: done }? Once slice-101 and T-125 land, nothing here uses it, and a task closed by v7 has no checks left for it to run. Recommended: refuse it in v7, a breaking change in the bundle (a new slice; nightly.feature's four scenarios and the corpus cases using it named in Changes:), so no consumer keeps a nightly rerunning old done tasks' checks without knowing. Or: keep it, running whatever checks tasks closed before v7 still have, and drop it in a later major."
    answer: "The user (2026-10-08): refuse it in v7. A new slice in the bundle, breaking: config check refuses the nightly step { tasks: done }, with nightly.features four scenarios and the corpus cases using it named in Changes, so no consumer keeps a nightly that reruns old done tasks checks without knowing it is gone. slice-101 has landed and T-125 removes this repository own step, so nothing here uses it"
