# Phase 1: itos v0 in its own repository. The template's demo app goes; the
# named tests become Gherkin feature files at the root, run by godog against
# the binary as a black box; verification starts at commits.since; and the
# repository is AGPL-3.0 as a whole. The scenarios are in features/, tagged
# @phase-1; the Go port that follows is judged by the same feature files.

- id: T-014
  type: chore
  title: Drop the template's demo app
  why: >
    itos has no browser and no page. The template's demo (index.html, the
    greeting module and its scenario, Playwright and playwright-bdd) goes, with
    every reference to it in the config, the hooks, CI, the gates self-test and
    the docs. The unit coverage thresholds were the demo's, over src/**: itos is
    proven through its command line (the features and the conformance corpus),
    which unit coverage cannot see, so coverage is still collected for the
    audit's scores, without thresholds. The audit fails on a dependency nothing
    uses, so Playwright left behind fails it.

- id: T-015
  type: build
  title: The Go toolchain
  why: >
    The features' steps are Go, run by godog, so that the same feature files
    judge the TypeScript v0 and the Go port. go.mod pins Go with a toolchain
    line and holds one dependency set, godog's; CI sets Go up from go.mod; gofmt
    and go vet run where vp check does, on the staged files before a commit and
    as static steps in CI.

- id: T-016
  type: test
  title: The features, run by godog against the binary
  why: >
    itos's named tests are Gherkin feature files at the root, features/, whose
    steps treat itos as a black box: they run the binary ITOS_BIN names
    (tools/bin/itos by default) in scratch git repositories and assert its exit
    codes and output, so the same files judge any implementation. The run
    selects by tag: godog's own tag filter takes only exact tags joined by
    commas, which the kind's ids_pattern cannot produce from the IDs it joins
    with |, so the harness takes a regular expression over the tags
    (-scenarios=…) and turns it into godog's filter. The self-test proves that
    the commands the plan builds run exactly the scenarios they claim. The
    conformance YAML stays as a regression corpus, run by a CI step of its own.

- id: T-017
  type: build
  title: Verification starts after the template's squashed commit
  why: >
    GitHub made this repository from the project template as one squashed
    commit, "Initial commit", which no rule passes: it is not a Conventional
    Commit, and it adds a live scenario outside feat and fix. CI verifies every
    commit after the last green run, and there was none, so every push was red.
    commits.since names that commit; verify and the range checks start after
    it.

- id: T-018
  type: chore
  title: AGPL-3.0 for the whole repository
  why: >
    The template is 0BSD, with the task tool's AGPL-3.0 licence in its folder;
    itos is the tool, so the whole repository is AGPL-3.0 and the folder's own
    licence goes. The check asks GitHub which licence it detects.

- id: T-019
  type: docs
  title: itos's README, plan and agent docs
  why: >
    What itos is, its two halves (itos for the rules a command can decide, the
    agent instructions for the rest), its status (v0 in TypeScript, the Go port
    next, judged by the same features), and PLAN.md with the goals, the model,
    the schema, the command line, the order of the work and the distribution;
    AGENTS.md, docs/ARCHITECTURE.md, docs/PHASES.md and tasks/README.md describe
    this repository's layout, not the template's demo. Prose has no check that
    runs it: review is the proof.
  done_when: []

- id: T-020
  type: build
  title: itos packed to JavaScript, as a tarball a consumer installs
  why: >
    A consumer pins itos as a dependency, and Node strips types only outside
    node_modules, so tools/itos/*.ts cannot run from an install as they are.
    vp pack bundles tools/itos/main.ts and what it imports (yaml included) into
    one JavaScript entry point under dist/, which package.json's bin names as
    itos; the package's files are that entry point, LICENSE and README.md, and
    packing it gives itos-<version>.tgz. In this repository tools/bin/itos keeps
    running the TypeScript of the working tree, which the hooks and CI judge;
    the packed entry point is for consumers. The self-test proves the tarball,
    not the source: it packs, installs the tarball into a scratch project with
    no network, and runs the conformance corpus and every feature against the
    installed bin, so a file the bundle misses, or a path resolved beside the
    source, fails it. Nothing in tools/itos/ reads a file beside itself, so the
    source needed no change. Against a bundle that left yaml out, the self-test
    failed three ways: the installed itos could not say its version, and the
    corpus and the features failed.

- id: T-021
  type: ci
  title: A release on a v* tag, with its checksum
  why: >
    Consumers pin a release, never a branch. A tag v<version> runs the release
    workflow, which refuses a tag that differs from package.json's version and
    itos --version, runs the release self-test, and publishes a GitHub release
    holding itos-<version>.tgz and checksums.txt (its SHA-256), so a consumer
    pins the tarball's URL and checks its hash. v0.1.0 is the first; the
    project template and the character editor then replace their copies of
    tools/itos/ with the pin, from their own repositories. The release check
    can pass only once the tag's release exists, and every CI run whose range
    names T-021 runs it, so it is late: the run that lands the workflow proves
    everything else before it fails there, the tag goes on that commit, and
    the run is green when re-run after the release.

- id: T-022
  type: ci
  title: itos config check in the gates
  why: >
    No hook ran it, and CI only when a pushed commit named a task carrying it,
    so a broken config, ledger, registry or smoke set could land and fail a
    later push. It is now a static CI step, in the prose steps too (the
    registry was then under docs/**, and CONTRIBUTORS.md, the people its
    owners must be among, is Markdown, so a prose-only push can break it), and
    the pre-commit hook ran it when itos.yaml, tasks/ (the ledger and, since
    T-025, the registry) or features/smoke.yaml was staged, before the early
    exit for prose. Slice 6 moved the commit-time check into itos hook
    commit-msg, over the staged tree, and T-023 dropped the pre-commit one,
    which read the working tree. The self-test proves both: in a scratch copy
    of the repository, a commit staging a ledger with a misspelt key is
    rejected (by the commit-msg hook, since T-023), and the CI plan runs the
    check for a range that touches the registry and for a prose-only one that
    touches CONTRIBUTORS.md.

- id: T-023
  type: ci
  title: The pre-commit hook leaves itos's data to the commit-msg hook
  why: >
    Once itos hook commit-msg validates itos.yaml, the ledger, the registry and
    the smoke set from the staged tree (slice 6), the pre-commit hook's own
    config check (T-022) runs the same check a second time, from the working
    tree, which can judge what is not being committed. The pre-commit hook
    drops it, and its early exit skips the tests and the audit when every
    staged file is Markdown, under docs/**, under tasks/** (the ledger and the
    registry) or a feature file. The self-test (tools/selftest/config-gate.ts)
    proves the commit is still rejected, now by commit-msg, and that a
    commit staging only docs/** and tasks/** runs no unit tests.

- id: T-024
  type: build
  title: v0.2.0, with the version in one place and notes a consumer upgrades from
  why: >
    The consumers move their pin when the registry's new default and the
    commit-time validation are released. The version was written twice,
    package.json and tools/itos/version.ts, so a bump touched the
    implementation and needed a code commit; version.ts now reads
    package.json's at build time (the bundle inlines it), and a release is one
    build commit and a tag. Every release's notes are a committed file,
    docs/releases/v<version>.md, which the release workflow publishes (filling
    in the tarball's SHA-256 where the file writes {sha256}) and without which
    it refuses the tag. The notes end with an "Upgrading" section, from which a
    consumer's session updates alone, so it is complete: each config key added,
    removed, renamed or with a changed default; each workaround a consumer can
    now drop; each behaviour that can reject a commit that passed before; and
    the pin line to change. For v0.2.0 that is, among the rest, the registry's
    move from docs/work-items.yaml to tasks/work-items.yaml (or work.registry
    naming the old path), that ci plan reads a missing registry as no task
    waiting, and the commit-msg hook's new rejections. The notes check proves
    the parts a command can: the section is there and last, its pin line names
    this version's tarball, and every key whose default differs between the
    last release's --print-defaults --json and this one's is named in it.
    Against v0.1.0 those keys are work.registry and ci.stop_at_first_failure;
    the check failed on scratch notes that left the second out, that ended
    with another section, and whose pin line named v0.1.0's tarball.

- id: T-025
  type: chore
  title: This repository's registry moves to tasks/work-items.yaml
  why: >
    Slice 5 makes tasks/work-items.yaml the registry's default home; this
    repository's own registry moves there with git mv, and itos.yaml's
    work.registry line goes, since the default now says it. The two must land
    in one commit: a docs commit may not touch itos.yaml and a build or ci one
    may not touch tasks/**, and either half alone leaves a tree whose config
    check fails (the config naming a registry that is not there). So it is a
    chore, the type whose paths take both, with what names this repository's
    path in passing: the pre-commit hook's paths, the identity fixture, the
    config gate's self-test (a registry edit is no longer prose-only, so it
    proves CI's plan runs config check for it as code, and for a prose-only
    edit of CONTRIBUTORS.md, the people the registry's owners come from) and
    the conformance cases whose scratch projects mirror this layout.

- id: T-026
  type: build
  title: The docs call itos task directly, and the task script goes
  why: >
    `vp run task <id>` was a package.json script wrapping `tools/bin/itos task`:
    a second name for one command, which a project without Vite+ does not
    have. The docs (AGENTS.md, tasks/README.md, docs/**, the comments, the CI
    step that proves the commit rules) call `tools/bin/itos task <id>`, and the
    script goes. The negative proof is that the script no longer runs. No
    message or help text itos prints named the script, so no printed wording
    changed; the gates self-test, which proves pre-push leaves a footer's task
    to CI by the echo it must not print, looks for `$ tools/bin/itos task` now.

- id: T-027
  type: build
  title: v0.3.0, the hook's task checks and a config with no unread keys
  why: >
    v0.3.0 releases slice 7 (the commit-msg hook runs the static checks of the
    tasks a commit names) and slice 4 (every accepted config key read, and the
    keys of features not built yet dropped), slice 8 (a cost pattern written
    for itos matches a command written as hooks.bin) and slice 9 (the task
    runner runs each check once; task list shows the registry's status), with
    the notes PLAN.md §10 asks for. Slice 8 can turn a consumer's check from
    late to static, so the hook starts running it. Slice 4 removes keys a consumer's config may set
    (commits.header_lint.use and alongside, ledger.check.pushed), which
    config check then rejects as unknown, and slice 7 can reject a commit that
    passed before: the Upgrading section names each, with what to do. The
    notes check compares defaults only (p1-release-notes-schema-keys), so the
    removed keys are named by hand unless that idea lands first. The tag waits
    for the user's review of the notes. Against v0.2.0 the changed defaults
    are work.statuses, work.groups_key, tests.<kind>.smoke.every_file and
    hooks.commit_msg's task_checks and check_timeout; hooks.manager, which has
    no default, is named by hand with the three removed keys. Until the
    version is bumped the check judges v0.2.0's notes against this tree and
    fails, and pinning it to 0.2.0 would not help: it would compare v0.1.0's
    defaults with this tree's.

- id: T-028
  type: ci
  title: This repository's cost pattern names itos as itos
  why: >
    Slice 8 reads a command whose first word is hooks.bin as itos in the cost
    rule, so ci.cost.static's pattern for itos's own commands is written
    ^itos (…) instead of ^(tools/bin/)?itos (…), as a consumer's would be. It
    lands after the feat, so no commit's config classifies differently from
    its own itos; ci plan from the first commit prints the same classes before
    and after it. The second check says cost: static below the first, which
    names itos as hooks.bin, so config check's written-order rule fails the
    first check unless the new pattern still makes tools/bin/itos static.

- id: T-029
  type: test
  title: A release task's notes check judges its own release
  why: >
    tools/selftest/release-notes.ts judges the notes of a version against this
    tree's defaults, whatever version it is given, so every release task's
    check judges the newest work: T-024's went red when slice 7 added
    defaults, and T-027's goes red with the next default anyone changes,
    though both releases are out and unchanged. Given a version whose tag
    exists, the self-test reads that tag's defaults (its tree, or its
    released tarball) and the release before it; only a version not yet
    tagged is judged against this tree, which is how a release task proves its
    notes before the tag. T-024's and T-027's checks name their versions, so a
    finished release stays green while later work moves the defaults. A
    tagged release's defaults come from its released tarball, not the tag's
    tree: the tarball is the bundle consumers run and installs offline with
    nothing from this checkout, while the tag's source would run against this
    checkout's node_modules, which move with the lockfile. Its notes are the
    tag's file, the one the release published. The check failed on v0.3.0's
    notes with hooks.commit_msg.check_timeout left out.

- id: T-030
  type: build
  title: This repository's commitlint config judges the header and body alone
  why: >
    Slice 10 has itos run commits.footers itself, beside whatever header lint
    the config delegates to, so the footer plugin commitlint.config.ts carried
    (one <key>-footer rule per footer, calling tools/itos/footers.ts) reports
    every footer problem a second time. The config goes back to
    config-conventional alone, in the commit right after the feat and in the
    same push, so the double report lasts one commit. The plugin's unit test
    moved to footers.test.ts first, calling checkFooter itself, since a
    build commit may not touch a test. The first check passes
    a chore without its Task: footer through commitlint alone, which the
    plugin rejected; the second runs a footer naming an unknown task through
    commit check-message, delegate included, and counts its task-footer
    problems: one, itos's own. Since commitlint left (T-063) the header lint
    is the built-in one, and the first check counts every problem
    check-message finds in that chore: one, the footer's, none the header
    lint's.

- id: T-031
  type: refactor
  title: The template's E2E names out of the code
  why: >
    itos came out of a template whose named tests were a Playwright E2E
    suite, and the code still says so: e2e-scope.ts and e2eStep hold the
    smoke rule and the plan's run of named tests, and comments name
    e2e/smoke.yaml, e2e/features and Playwright. An agent reading the code
    meets names for a suite this repository does not have. The modules and
    functions are renamed for what they do and the comments name the
    config's keys. What itos prints changes in slice 11, not here. The
    default root of scenario-moves (e2e/features) is behaviour, and goes with
    p1-config-names-from-config.

- id: T-032
  type: build
  title: The released package's manifest holds only what a consumer needs
  why: >
    itos-<version>.tgz carries this repository's package.json whole: its
    prepare script (vp config), which npm lists on every consumer's install
    as an install script awaiting approval and which would fail without
    Vite+, its devDependencies and packageManager, and no engines, though the
    bundle needs Node 24 (import.meta.main). The packed manifest holds name,
    version, type, bin, files and engines, and nothing else; the release
    self-test proves it and that an install reports no install script.
    tools/bin/pack.ts packs it, for the release workflow and release.ts alike.
    The install report is npm's, so the self-test first installs a control
    package with a prepare script and fails if npm reports nothing for it.
    Against v0.3.0's way of packing the check fails on the keys, on engines
    and on the install script.

- id: T-033
  type: build
  title: v0.4.0, the footer rules beside the header lint and a manifest without scripts
  why: >
    v0.4.0 releases slice 10 (itos runs the footer rules beside any
    header-lint delegate), slice 11 (ci run names a merged check's kind),
    slice 12 (an empty selection of named tests adds no pattern), slice 13 (a
    missing footer source is a problem, not a crash) and T-032 (the packed
    manifest holds only what a consumer needs), with the notes PLAN.md §10
    asks for. Slice 10 can reject a commit a footer-less delegate passed,
    verify included, and a consumer whose commitlint config carries the
    footer plugin reports each footer problem twice until it drops it: the
    Upgrading section says so. The tag waits for the user's review of the
    notes. Against v0.3.0 the notes check finds no changed default, and no
    key is added, removed or has its accepted values changed, so the notes
    say that by hand. Until the version is bumped the notes check judges
    0.4.0 as untagged against this tree, which is how it proves the notes
    before the tag.

- id: T-034
  type: test
  title: The corpus proves what consumers' ledgers stop checking of itos
  why: >
    The character editor, where itos was first built, kept done_when checks
    that tested itos's own behavior: synthetic configs through ITOS_CONFIG,
    messages piped to commit check-message and the commit-msg hook, verify and
    ci plan over recorded ranges, --json shapes. Two re-verified history up to
    HEAD and grew with every commit (179 s by 2026-10-01). It dropped them all:
    a consumer's ledger checks its own code and config, itos's behavior is
    proven here, and a regression a consumer finds is a bug raised here. Of
    the eleven behaviors they proved, the corpus already had nine. It lacked
    verify rejecting a commit made without the hooks (no type, no footer),
    which a header-lint delegate rejects, as commitlint does there: without
    one itos judges only the footers, and a typeless commit no footer is
    required for passes. And it lacked the commit-msg hook accepting a docs
    message that names a task, beside the build one it rejects without one.
    The next release's Upgrading section tells consumers to drop such checks.
    The check passes on the cases as they now stand; the corpus has no way to
    fail on a case that is missing, so their review is what proves they are
    there.

- id: T-035
  type: ci
  title: This repository's nightly runs every done task's static checks
  why: >
    Slice 16 gives ci.nightly.steps a step that runs the checks of every task
    whose work item is done. Here a done task's checks ran only when a push
    named it: T-024 was red from slice 7 to v0.3.0 unseen. The nightly takes
    { tasks: done, cost: static }, the checks that take seconds; the late ones
    (the release self-tests, the whole suite) stay with the pushes that name
    their tasks. The check reads the nightly's plan, which lists no task check
    before the step.

- id: T-036
  type: build
  title: v0.5.0, the done tasks' nightly step and three fixes consumers met
  why: >
    v0.5.0 releases slice 16 (a nightly step, { tasks: done }, runs the
    checks of every done task, asked for by the character editor), slice 14
    (a missing ledger folder is one problem in every command that reads the
    ledger), slice 15 (a check merged into a run of named tests that does not
    happen runs as itself) and slice 17 (a commits.since outside a shallow
    clone says the clone is shallow), with the notes PLAN.md §10 asks for.
    docs/releases/v0.5.0.md was written slice by slice as each landed, with
    T-034's step that has consumers drop ledger checks of itos's own
    behaviour; this task finishes it. Slice 16 changes the failure line of a
    failing task check, which anything reading CI's log must match, and the
    step needs the nightly's job to have the history and tools CI has: the
    Upgrading section says both. The tag waits for the user's review of the
    notes. Against v0.4.0 the notes check finds no changed default, and no
    key is added, removed or renamed; ci.nightly.steps gains a step shape,
    which the notes say by hand. Until the version is bumped the notes check
    judges 0.5.0 as untagged against this tree, which is how it proves the
    notes before the tag.

- id: T-037
  type: build
  title: This repository's moving rule is itos's built-in, and its script goes
  why: >
    Slice 23 ships the moving rule as a built-in range check, { builtin:
    moves, except_types, allowed_renames }, so this repository's
    tests.scenario.range_checks takes it in place of the two commands that ran
    tools/itos/scenario-moves.ts, and the script, with its ALLOWED_RENAMES
    table, goes: the rule's one home is itos, as for every consumer. Once the
    script is gone, a config still naming it would fail every verify, so CI's
    verify of the range proves the switch; the checks run the built-in
    command on this tree and prove the script is gone.

- id: T-038
  type: build
  title: v0.6.0, the config contract before the Go port
  why: >
    v0.6.0 releases the config contract the Go port will copy: slice 18 (CI
    reads the ledger footer, the ledger's folder and the prose steps from the
    config), slice 19 (one table of defaults, applied and printed alike),
    slice 20 (every command pattern reads hooks.bin as itos), slice 21
    (ledger.group.label read), slice 22 (work.registry's default beside the
    ledger) and slice 23 with T-037 (the moving rule as itos's built-in, a
    range check and itos tests moves), with the notes PLAN.md §10 asks for.
    docs/releases/v0.6.0.md was written slice by slice; this task finishes
    it. The user waived the review of the notes for this release, so the tag
    follows CI being green but for the after-push download check.

- id: T-082
  type: chore
  title: The plugin skill names itos work add and edit
  why: >
    Was p1-skill-work-add, found by slice 54's agent: the itos skill in the Claude Code plugin named
    itos work take, done and list, but not work add and work edit, so an agent in another
    repository still recorded the gaps it found by editing the registry's YAML by hand, which
    slice 54 made unnecessary. The skill now says to record a gap with itos work add and to note
    on an item with itos work edit; the plugin's minor version is raised in the chore commit
    T-074's rule asks for. T-092 dropped the skill, how to work with itos being itos's own guides,
    so the checks read the guide that holds each command.

- id: T-083
  type: build
  title: Declare the Item footer in this repository, standing in for Task for test, docs and chore
  why: >
    Slice 63 gave itos a footer of work registry items (source registry) that can stand in for
    another footer (in_place_of). This repository declares it as Item, in place of Task for test,
    docs and chore, so a slice, which has no task, can commit its steps red first in a test commit
    before its feat (docs/ORCHESTRATING.md asks the brief for one), and a spec written in a docs
    commit names its item, which work show then lists.

- id: T-084
  type: docs
  title: docs/ORCHESTRATING.md keeps only this repository's own notes, and the handoff is gone
  why: >
    Was p1-orchestrating-own-notes. itos go prints the generic coordinator's guide (slice 64), then
    docs/ORCHESTRATING.md, then itos status (slice 67), so the handoff rewritten by hand after
    every landing is gone, and ORCHESTRATING.md holds only what is true of this repository alone.

- id: T-085
  type: docs
  title: PLAN.md's decisions become records in docs/decisions/, and PLAN.md keeps what itos is
  why: >
    Was p1-plan-to-adrs (the user's calls, 2026-10-04). A person cannot find a decision in a
    909-line plan or a registry's whys; slice 69 gave itos decision records, MADR 4 since slice 71,
    with an index of the live ones. Seed them from PLAN.md's curated decisions only: one record
    per row of its decisions table and per decision of its distribution section, written by hand
    in the format itos ask record writes (it numbers past them), each Context saying why and each
    Date the day it was decided where PLAN.md says so, else today's; the index block in
    docs/decisions/README.md as ask record writes it. The registry's calls stay in history, so the
    records do not sprawl. PLAN.md keeps the goals, non-goals, name and model, and links the
    index; what duplicates or is history goes: the command table (it restates --help and drifts),
    the architecture (docs/ARCHITECTURE.md), the phases, the working rules (AGENTS.md), and
    docs/releases/, which stops at v2.3.0 since CI writes the notes. The Go and TypeScript
    comments that cite a PLAN.md section by number cite the record instead, in a refactor commit
    naming this task. What this move teaches feeds p1-adr-adoption-guide.

- id: T-086
  type: docs
  title: The coordinator's guide says how decisions are recorded, and how a repository moves its docs' decisions into records
  why: >
    Was p1-adr-adoption-guide (the user's call, 2026-10-04): once decision records shipped, a
    repository adopting itos needs to know how to move the decisions its docs already hold into
    records. Written from what T-085 learnt moving this repository's PLAN.md: only decisions
    become records, one each; each seeded through itos ask add, answer and record, so it keeps its
    question and itos's format, which needs no command for a decision with no question; citations
    found with git grep and pointed at records, code comments in a refactor commit; a task's
    checks aimed at what it changes. It lives in the coordinator's guide, since such a move is a
    task a coordinator hands out, and not in a guide of its own: a new guide's name would change
    the list @ID-GUIDE-05 promises, a breaking change for a paragraph.

- id: T-087
  type: test
  title: The features' PATH hides any itos but the one under test, as it hides claude
  why: >
    Was p1-features-hide-global-itos. The scenarios' PATH hides claude but not itos, so a scenario
    whose hooks call itos ran the developer's global itos, not the one under test: bug 12's
    agent saw one pass locally and fail in CI, and this machine's global itos lags the tree. The
    steps put the itos under test on the PATH only where a step asks for it (itosOnPath) and hide
    every other. The check runs the features with a failing itos first on the PATH, which only a
    PATH that hides it lets pass.

- id: T-088
  type: refactor
  title: One copy of what a releasable commit is, for itos status and the release cut
  why: >
    Was p1-release-rules-one-copy. Slice 70 gave itos status the rules for a releasable commit in
    internal/release while tools/bin/release-version keeps its own copy, and nothing checks that
    the two agree, so status could list commits the next release does not carry. release-version
    imports internal/release, which needs nothing outside the standard library, and its copy goes.

- id: T-089
  type: build
  title: The module path is github.com/donvargax/itos/v3, and a major release is refused while it is not
  why: >
    Found 2026-10-04: v3.0.0 to v3.3.0 were cut from a go.mod whose module path still ends in /v2,
    and Go's module proxy rejects a v3 tag for a /v2 path, so go install ...@latest gives v2.29.1
    and the README's and the release notes' go install line fails for every v3 version. A major
    release was cut with no check of the module path: the missing check of this break, fixed forward
    (decision 0021). The path becomes /v3 everywhere it is named (go.mod, the imports, the ldflags
    that stamp the version, the README, the release notes' go install line), and the release cut
    refuses a version whose major does not match the module path's suffix, so the next major moves
    the path first. go install works from the first release cut after it.

- id: T-090
  type: refactor
  title: release-notes, schema-contract and previous-release pick the last release by internal/release's one rule
  why: >
    Was p1-last-release-one-rule. Bug 20 put the rule for the last release (v followed by three
    numbers and nothing else, ordered numerically) in internal/release, and status and the release
    cut pick with it, while tools/bin/release-notes, schema-contract and previous-release kept their
    own vX.Y.Z regex and git's version sort, which orders a number with leading zeros as a
    fraction. They agree on every tag this repository has, but nothing held them to the cut. Each
    lists the tags it reaches as now and picks with release.Newest.

- id: T-091
  type: build
  title: Each release publishes upgrading.json, its Upgrading section as data
  why: >
    Split from p1-itos-upgrade (the user's calls, 2026-10-04): itos upgrade walks the Upgrading
    sections of every release between a project's pin and the new one, and reads each from a release
    asset, not the notes' Markdown. tools/bin/release-notes gains -json, writing what it already
    gathers for the Upgrading section as {"schema":1,"version":"<X.Y.Z>","previous":"<the last
    release,
    X.Y.Z>","breaking":[{"commit","header","text"}],"upgrading":[{"commit","header","text"}],"changes":[{"commit","header","text"}],"config":[{"key","change"}]},
    each list what the Markdown section quotes (Upgrading footers saying none left out, as there),
    in the same order. previous is how itos upgrade walks back from the new release to the pin
    without listing releases through an API. The release workflow writes it beside notes.md and
    uploads it as the asset upgrading.json before the draft is published, so the release and every
    asset appear together. It is not in checksums.txt: itos only prints it, and the pin is still
    checked against checksums.txt. tools/selftest/upgrading-json.ts proves the asset for a range as
    release-notes.ts proves the notes: every Upgrading and Changes footer itos commit footers lists,
    each config key schema-contract names, and previous the last release. docs/ARCHITECTURE.md
    describes the asset beside the notes, in a docs commit.

- id: T-094
  type: refactor
  title: The module path is github.com/donvargax/itos/v4, for v4.0.0
  why: >
    Slice 79 cuts v4.0.0, and tools/bin/release-version refuses a v4 tag from a go.mod whose module
    path ends in /v3 (T-089), as Go's module proxy refuses it. The path moves to /v4 everywhere it
    is named, in one refactor commit in the push that carries slice 79's breaking feats: go.mod,
    every import of itos's own packages, the -X ldflags that stamp the version (.goreleaser.yaml,
    tools/bin/itos, tools/bin/build-go.ts, CI's Build itos step), go-hooks.ts's module prefix, and
    the go install lines of the README and ARCHITECTURE. The done tasks whose checks named the /v3
    path (T-088, T-089, T-090) are reworded to hold whatever the major, so the nightly's done-task
    checks stay green across this move and the next.

- id: T-095
  type: ci
  title: The last release's usage errors are left out of the release check, as its help cases are
  why: >
    T-075 judged the old corpus's usage errors by their exit code alone, 2. A usage error pins only
    what a command refuses, and refusing less is additive: slice 80 makes itos init --stealth
    --agent-rules, which v4.1.0 refused as not written yet, do what it says, and the check would
    call that a breaking change and cut v5.0.0 (the user's call, 2026-10-05: correct the check).
    previous-release now leaves an old usage error's case out of the run, counted and said beside
    the help cases it leaves out, and a unit test proves it reads such a case as one and leaves it
    out while a config error's case stays judged. This tree's own corpus still pins every usage
    message exactly.

- id: T-098
  type: ci
  title: Only build and ci commits may touch the gates, and style is no type
  why: >
    The user's calls (2026-10-05). An Item footer stands in for Task on chore with no checks at all,
    and chore, refactor, perf and test could edit the gates themselves: itos.yaml, the workflows,
    the hooks, tools/bin (the release check and the other gates' Go code), tools/selftest and
    deps-check.json. A path set gates holds those, and only build and ci, which need a Task, may
    touch it; refactor keeps the rest of the config, such as go.mod for a module move. style goes
    from commits.types: no commit ever used it, vp staged formats every commit, and it needed no
    footer and could touch anything. Not a fortress: a build or ci commit can still change the
    gates, and the coordinator's review of each agent's commits is what catches that
    (p3-gate-changes-visible).

- id: T-099
  type: refactor
  title: The module path is github.com/donvargax/itos/v5, and this config holds nothing v5 removed
  why: >
    Slice 85 cuts v5.0.0, and tools/bin/release-version refuses a v5 tag from a go.mod whose module
    path ends in /v4 (T-089), as Go's module proxy refuses it. The path moves to /v5 everywhere it
    is named, as T-094 moved it to /v4, but in two commits since T-098 holds the gates to build and
    ci commits: a refactor commit for go.mod, every import of itos's own packages under cmd/,
    internal/ and features/, .goreleaser.yaml's -X ldflags and the go install lines of the README
    and ARCHITECTURE; then a ci commit for what is under tools/bin (its Go programs' imports, the
    ldflags of tools/bin/itos, build-go.ts and previous-release), CI's Build itos step and
    go-hooks.ts's module prefix. Between them tools/bin does not build, which no hook of the first
    commit runs. This repository's itos.yaml drops ci.range.github.branch, which v5 refuses (slice
    85), in a ci commit of its own before the feat.

- id: T-100
  type: ci
  title: previous-release judges an old case by itos's machine output alone, and CI reads ci range and version through --json
  why: >
    Decision 35 (q-15, 2026-10-06): only exit codes, --json less the keys named message and fix,
    and the files itos writes are the contract; every plain-text output may change in any release.
    The previous-release check judged an old case's stdout and stderr word for word, less its help
    cases and usage errors (T-075, T-095), so a feat that reworded a refusal was a breaking change
    (slice 82, and the config-footer-source message held since v2.20.0). It now judges an old case's
    exit code, files_after and json, comparing json with every key named message or fix left out
    at any depth and keys added still passing (T-076), and no longer compares stdout, stderr,
    stdout_has or stderr_has; the help and usage-error exemptions go, being the general rule now.
    This repository's workflow reads the two values it takes from plain output, ci range's start
    and itos version's, through --json, since plain output is no longer promised. Its unit tests
    show a reworded stderr and a changed message passing, and a changed exit code, rule id, json key
    or files_after failing.

- id: T-101
  type: refactor
  title: The module path is github.com/donvargax/itos/v6
  why: >
    Slice 86 cuts v6.0.0, and tools/bin/release-version refuses a v6 tag from a go.mod whose module
    path ends in /v5 (T-089), as Go's module proxy refuses it. The path moves to /v6 as T-099 moved
    it to /v5, in two commits since T-098 holds the gates to build and ci commits: a refactor commit
    for go.mod, every import of itos's own packages under cmd/, internal/ and features/,
    .goreleaser.yaml's -X ldflags and the go install lines of the README and ARCHITECTURE; then a ci
    commit for what is under tools/bin (its Go programs' imports, the ldflags of tools/bin/itos,
    build-go.ts and previous-release), CI's Build itos step and go-hooks.ts's module prefix. Slice
    86's agent does it in the same push as the feat, as slice 85's did T-099.

- id: T-102
  type: ci
  title: The gate self-tests run the hooks the git config declares, and .vite-hooks no longer calls itos
  why: >
    Decision 37 (slice 91) declares itos's hooks in the git config alone, so .vite-hooks/commit-msg and
    .vite-hooks/pre-push, which hold nothing but a call to tools/bin/itos hook, run itos's checks a
    second time on every commit and push here: both files go. tools/selftest/gates.ts runs
    sh .vite-hooks/commit-msg to judge a message, and scratch.ts's hookGates runs
    sh .vite-hooks/pre-push for gates.ts and go-hooks.ts, so once the files go those self-tests would
    test nothing of itos's. They run the hooks the git config declares instead (git hook run
    commit-msg and git hook run pre-push, the scratch worktree declaring them as slice 91's steps
    do), so the nightly proves what the hooks really run. One ci commit, in the v6.0.0 push. The
    self-tests themselves are the nightly's (ci.nightly_only runs gates.ts and go-hooks.ts with no
    timeout), not this task's checks: each hook run that reaches internal/cli waits about 300
    seconds on TestRollbackGitCannotStart (p1-slow-rollback-test), locally and in CI, so go-hooks.ts
    takes about 30 minutes and a push naming this task would be killed at any check's timeout. Both
    passed run directly on the commit that made this change.

- id: T-103
  type: ci
  title: go-schema.ts's value-not-allowed case names a key v6 still has
  why: >
    tools/selftest/go-schema.ts holds the generated schema to a config with hooks.manager: overcommit
    and expects an enum refusal at /hooks/manager. Slice 91 removed hooks.manager, so the schema now
    refuses it by additionalProperties at /hooks and the nightly's go-schema self-test fails. The case
    moves to another key with an enum, such as commits.header_lint.use, still expecting the enum
    refusal at that key's path. One ci commit, in the v6.0.0 push.

- id: T-104
  type: test
  title: The features and unit tests run the real git, never an itos linked as git
  why: >
    Found by bug-46's agent (2026-10-06): with the itos git shim first on the PATH (a git that is a
    link to itos, which itos init offers since slice 50), 63 features fail (chore commits need
    --task) and internal/cli's TestDeclareHooksOldGit hangs, so every brief here carries
    PATH=/usr/bin:$PATH. T-087 hides claude, itos and itos-* from the features' PATH, not a git that
    is itos. The features and the unit tests resolve git past any itos shim, as itos itself does
    since bug 45, by one rule rather than a second copy of it. The check puts a link to the built
    itos first on the PATH as git and runs every feature and the cli unit test that hung.

- id: T-105
  type: perf
  title: TestRollbackGitCannotStart takes seconds, not five minutes
  why: >
    internal/cli's TestRollbackGitCannotStart takes about 300 seconds locally and internal/cli 200 to
    290 seconds in CI on every platform, nearly all of it this test; every push and hook run that
    reaches internal/cli waits on it, and go-hooks.ts runs about 30 minutes (T-102). The test commits
    a 5 MB message so git cannot start. First find where the time goes with a profile, not a guess:
    if itos reads a message in more than linear time (header lint, footer parse, wrap), that is a
    perf bug of itos, fixed in itos with a unit test holding a large message to a time bound; only if
    itos is linear does the test change, and then it must still prove the rollback when git cannot
    start on every platform (macOS has no per-argument limit, hence the 5 MB).

    Likely cause, found by slice-96's agent (2026-10-07, idea p1-wrap-long-body): message.wrapLine
    joins the rest of the line at every break, so wrapping a body is quadratic, and the test's 5 MB
    body takes about 300 s. Profile first, as above; if that is it, fold p1-wrap-long-body in.

- id: T-106
  type: ci
  title: previous-release excuses an old failure only when a commit names it, breaking or not
  why: >
    Found after v6.0.0 (2026-10-06): previous-release accepted all 232 old scenarios and corpus
    cases that failed against v6, because excuse() accepts any failure once any commit in the range
    is marked breaking, before it reads a Changes: footer. One breaking commit (slice 91's) so waived
    failures it did not cause, and a release could change what it never announced. A breaking commit
    excuses only the old scenarios and cases it names in Changes:, as a fix must; a feat naming one
    without being breaking still excuses nothing; the message says to name each failure. AGENTS.md
    and the coordinator's notes say a breaking commit carries both footers.

- id: T-107
  type: docs
  title: The coordinator's guide carries the brief rules and the lesson format that hold for any repository
  why: >
    The user's call (2026-10-06), beside slice 95. docs/ORCHESTRATING.md holds advice that is true
    of any repository using itos, which every other repository goes without: the brief lines on
    commit bodies (no body line starting with word:, which git reads as a trailer), scratch files
    prefixed with the item's id, and naming the neighbouring scenarios to run before a push; and the
    format a lesson keeps (its exit, an item or permanent; the date recorded and the date last seen;
    at most ten). They move into internal/guide/coordinate.md, which itos go prints in every
    repository; ORCHESTRATING.md keeps only what is this repository's (the inbox, the releases, the
    Upgrading and Changes footers, previous-release, its own lessons). A starter notes file seeded
    by itos init was dropped already (p3-init-orchestration, decision 33): it would drift in each
    copy.

- id: T-108
  type: build
  title: "A devcontainer for this repository: Claude Code sandboxed, itos and its git shim first on the PATH, egress allowlisted"
  why: >
    The user's call (2026-10-06): the container tested on 2026-10-06 worked, and it lands here for
    now, a base for the user's devcontainer sandboxing project; an unattended agent runs in it, so
    auto mode failing no longer stops the work. Its base is trailofbits/claude-code-devcontainer at
    feea113 (Apache-2.0: its LICENSE and a line saying what was changed go with it), with the
    additions tested then, kept in this clone's .git/itos/container-test (itos-additions.diff,
    ws-itos/.devcontainer, and the ct/ scripts that probed it): itos from a pinned release, v6.0.0
    or newer, its checksums.txt checked against a pinned hash, in /usr/local/lib/itos/bin (the base
    chowns /opt to vscode), itos git-shim install, and that folder first on the PATH in the image's
    last ENV. The shim stays: it is the guard against a poisoned model, the container only limits
    what reaches the host. Beyond what was tested: the Go of go.mod and pnpm/vp, so this
    repository's hooks and gates run inside; the allowlist on by default, GitHub's meta CIDRs plus
    Anthropic's API, the Go proxy and sum database, npm and pypi, never a list of addresses resolved
    once (they rotate within minutes); no passwordless sudo for the container user, which with
    NET_ADMIN could undo the shim and the firewall, so the firewall is a root-owned script in the
    image, run through one sudoers rule naming it alone, never a script under /workspace that the
    container can rewrite; no fixed container name. The base mounts .git/config and .git/hooks
    read-only, so itos init and hooks install run on the host, and a git worktree cannot be the
    workspace: the .devcontainer README says so, and to commit inside the container, never on the
    host, once the container has written the workspace (the host's hooks would run the checks the
    container wrote). Shim gaps (--no-verify, -c core.hooksPath) are p1-shim-refuses-hook-skipping,
    not this task. The container test's report (2026-10-06) named three holes, and the user asked
    that this version close each: sudo letting the container undo the allowlist and the shim;
    the host's hooks running checks the container wrote into itos.yaml or the ledger; the
    read-only git files. Done shows, in a container built from this tree, sudo -n true and
    iptables -F OUTPUT refused to the container user, the allowlist still applied after a
    restart, git resolving to the shim, and a host outside the allowlist unreachable; the
    README's first section says what runs on the host first and that commits are made inside.

- id: T-109
  type: refactor
  title: "docs/ARCHITECTURE.md is a map: per-package detail lives in package doc comments, history in the changelog"
  why: >
    Measured 2026-10-06: docs/ARCHITECTURE.md is 181K bytes (some 45K tokens), up 27K in two days
    and 21 commits, since nearly every slice appends to it; it names slices, bugs and tasks 186
    times, history the changelog keeps (vp run changelog -- --task/--scenario), and its The code
    section is 1600 of its 2500 lines. Briefs send agents to it, so every item pays for it. It
    becomes a map of at most 40K bytes: the layout, how the pieces meet, where to look. What each Go
    package does and why moves into that package's doc comment (doc.go), read when the package is
    touched and changed in the same commit as its code; history references go, except where a
    decision record or a scenario is the reason to read further. The doc comments are refactor
    commits, the map docs commits. PLAN.md (138K to 33K when its decisions became records) shows the
    method works. The user's call, 2026-10-06.

- id: T-110
  type: ci
  title: CI holds the always-read docs to a byte budget, on docs-only pushes too
  why: >
    The cut holds only if growth costs something (the user's call, 2026-10-06). A ci step, go run
    ./tools/bin/doc-budget, checks byte caps on the docs every session or most briefs read:
    AGENTS.md 26000, internal/guide/coordinate.md 14000, internal/guide/work.md 6000,
    docs/ORCHESTRATING.md 11000, docs/ARCHITECTURE.md 40000 (2026-10-06's sizes plus a little room;
    the agent may adjust each by a few percent, saying why). Text past a cap means taking some out
    first, as the cap of ten lessons does. The caps live in one file the step reads, and the step
    runs in the docs-only plan too (a docs-only push runs only vp check, config check and
    plugin-version today), since docs-only pushes are where the docs grow. Waits on T-109, whose cut
    the ARCHITECTURE cap needs.

- id: T-111
  type: ci
  title: CI checks that the built itos answers every command the Claude Code plugin calls
  why: >
    Decision 41 (2026-10-07): the commands the plugin calls (guard claude-code; work list --all and
    task list with --json, for the titles) are contract, never renamed or removed; without a gate
    that is only a promise. A step in itos.yaml's CI plan reads the itos commands the plugin's
    scripts call (integrations/claude-code/hooks: guard.sh, register.ts, titles.ts) and runs each
    against the built itos, refusing one that exits 2 as unknown or whose --json lacks the key the
    plugin reads (items, tasks); a rename that breaks the plugin goes red on the push that makes it,
    not after a release. The list is read from the scripts, never kept by hand beside them.

- id: T-112
  type: test
  title: The conformance runner's --additive mode compares a written file's data, not its comment lines
  why: >
    Decision 40 (2026-10-07): a written file is contract by its data; its comment lines are for
    people. previous-release runs the last release's corpus with the runner's --additive mode, which
    today compares written YAML and Markdown whole, so a reworded comment in a file itos writes
    reads as a break. --additive compares the data alone; the runner's own run passes, and a case
    shows a changed comment passing and changed data failing. tools/itos/conformance is test's to
    touch, so a test task.

- id: T-113
  type: test
  title: The hooks.yaml corpus cases pin their --json and the git config entries they write
  why: >
    Found reviewing v6.0.0's waived failures (2026-10-06): seven cases in
    tools/itos/conformance/hooks.yaml pin only exit 0 and their plain text, which decision 35 says
    is not contract, so they check almost nothing a release could break. Each pins its --json and
    the hook entries it leaves in the git config (hook.itos-commit-msg, hook.itos-pre-push), the
    data a consumer relies on.

- id: T-114
  type: ci
  title: The gates self-test touches a Go source without anchoring on its comment layout
  why: >
    T-109 moved each package comment into a doc.go, so internal/version/version.go now starts with
    its package clause, and tools/selftest/gates.ts, which anchored its docs-commit edit on a
    newline before that clause, threw and turned the nightly red. The edit only needs a Go source
    under internal/ that a docs commit may not touch, so it appends a line to the file instead,
    which no later move of its comments can break.

- id: T-115
  type: test
  title: The Windows platform job's features run well under go test's 10-minute limit
  why: >
    Measured 2026-10-07 over 33 green runs: the windows-latest Features step took 263 to 509 s
    (median about 415 s) against go test's 600 s default, and one run went over and failed with
    nothing broken; the spread is the runner's, the suite only grows. Find where Windows spends the
    time first (per-scenario timings from a Windows run: process starts per step, the binary built
    per scenario, the temp folder), then make those scenarios cheaper or run the suite in shards
    across jobs; never raise the timeout, which only moves the cliff. Was
    p1-windows-features-timeout.

- id: T-116
  type: docs
  title: Sessions in repositories that use itos report its problems once, after checking the release and searching the issues
  why: >
    The user's call (2026-10-07): nothing told a session how to report a problem with itos, and with
    adoption one bug would arrive as many issues (bug-49 was hit by itos-cc and here the same day).
    The coordinator's guide says: report to itos, never patch around it locally, never send a pull
    request (fixes go through itos's own specs and gates); only the coordinator reports, once per
    problem, after checking the newest release and searching open and closed issues, commenting on a
    match only with something new. The implementing agent's guide says a problem itos causes goes in
    its report. The consumer-report form asks to confirm the search.

- id: T-117
  type: ci
  title: The previous-release self-test holds T-106's rule, and the nightly runs it
  why: >
    Found doing T-112 (2026-10-07): node tools/selftest/previous-release.ts fails three of its
    checks on main (a feat naming the scenario in Changes:, and a breaking change by footer and by
    bang), each still expecting the rule before T-106, which made a breaking commit excuse only what
    its Changes: footer names. No gate runs that self-test, so it went red unseen. Its three
    expectations are brought to T-106's rule (a feat naming a case excuses nothing; a breaking
    commit excuses only what Changes: names), never the program bent to the old ones, and
    itos.yaml's nightly runs it beside the other self-tests. Was p1-previous-release-selftest-red.

- id: T-118
  type: ci
  title: "Releases can be pre-releases: while itos.yaml says so, a major cuts vN.0.0-rc.N, marked pre-release, not latest"
  why: >
    The user's call (2026-10-07): v7 is released as pre-releases while its bundle lands, the itos-cc
    integration first, so it can be tried (pinned) before the final v7.0.0, instead of each breaking
    push cutting a major of its own. tools/bin/release-version learns a pre-release mode, switched
    on by a key in itos.yaml (for example release: { prerelease: rc }, a gate path only build and ci
    commits touch): while it is on, the commits that would cut the next major cut
    <major>.0.0-rc.<n>, n counting up from the last rc tag of that major, and a feat or fix after an
    rc cuts the next rc; removing the key cuts the final <major>.0.0. The release workflow marks an
    rc release pre-release and never latest, so go install @latest, the launcher's update notice and
    itos pin with no version keep naming the newest stable release; itos pin <rc> pins one
    explicitly. Self-tested as release-version's other rules are (tools/selftest/go-release.ts or
    its unit tests), by running it on scratch histories. Lands after 6.x's last items; the module
    path's move to /v7 (T-089's rule: no v7 tag from a /v6 go.mod) comes with the first rc, after
    which main cuts no 6.x patch.

- id: T-119
  type: refactor
  title: itos's module path moves to /v7 and the pre-release marker is on, the first v7 work
  why: >
    Decision 42 (2026-10-07): v7 ships as pre-releases, so the first v7 commits move the module path
    to github.com/donvargax/itos/v7 (T-089: no v7 tag from a /v6 go.mod), as T-099 and T-101 moved
    it before, and turn on T-118's pre-release marker in itos.yaml (a ci commit), so the next feat
    or breaking change cuts v7.0.0-rc.1. After it, main cuts no 6.x patch.

    Where the marker lives (the coordinator's call, 2026-10-07, settling p1-config-release-prerelease):
    not in itos.yaml, whose schema holds only keys itos reads, but in a file of the release tool's
    own, tools/bin/release-version/prerelease, holding rc. This task switches release-version (and its
    tests) from itos.yaml's release.prerelease to that file, then creates it.

- id: T-121
  type: test
  title: The features build the itos under test with -cover when GOCOVERDIR is set, so its coverage reaches itos-cc
  why: >
    Decision 42's code proof (2026-10-07): itos's behaviour is tested by features that run the built
    itos as another process, and Go records no coverage there unless the binary is built with -cover
    and GOCOVERDIR names where to write it (Go's integration coverage, go.dev/doc/build-cover).
    itos-cc#14 asks itos-cc to set GOCOVERDIR and merge what it finds; this task is itos's half:
    when GOCOVERDIR is set, the features harness builds the itos under test (and any other binary it
    runs that is itos's own code) with go build -cover, and runs it with GOCOVERDIR passed through;
    when it is not set, nothing changes. Proven by a run with GOCOVERDIR set leaving coverage data
    that go tool covdata reads, covering a function only a feature reaches.

    Widened 2026-10-08 for itos-cc v0.5.0, which closed #14 with listed tests: each mutant runs only
    the scenarios whose coverage reaches its line, so itos-cc needs coverage per scenario. It runs
    every listed test once with ITOS_CC_TEST_COVERDIR set to a folder of its own (go test passes
    that variable to the test binary unchanged, as it does not GOCOVERDIR), and a harness that
    gives every process a scenario starts GOCOVERDIR=<that folder>/<the scenario's ID> splits the
    coverage in one run; one that does not makes itos-cc run each of about 500 scenarios alone. So
    when ITOS_CC_TEST_COVERDIR is set, the harness builds the itos under test with -cover too, and
    each scenario's commands run with GOCOVERDIR at <ITOS_CC_TEST_COVERDIR>/<its @ID tag without
    the @>, a folder that exists before the first command runs; it wins over a GOCOVERDIR also set.
    The cover build is stamped and linked as tools/bin/itos builds itos, and lives apart from
    .tools/bin/itos. Traps: w.env() drops every ITOS_ variable from the commands' environment, so
    the harness reads ITOS_CC_TEST_COVERDIR itself; a -cover binary whose GOCOVERDIR is missing
    writes a warning to stderr, which breaks every scenario that reads itos's output, so the
    variable must reach every itos a scenario starts (git hooks, the git shim, the launcher's
    child, extensions told $ITOS_BIN). tools/bin/itos is a gate a test commit may not touch.

    The checks: one scenario's coverage with GOCOVERDIR (the original); the split, where the
    launcher's fetch is covered in the folder of the scenario that fetches a pinned release
    (ID-PIN-01) and not in that of one that does not (ID-ASK-01), with nothing written at the top;
    and the scenarios most likely to break under -cover (the launcher, the shim, extensions, the
    hooks, exact help output) passing with ITOS_CC_TEST_COVERDIR set. The user's call (2026-10-08):
    a targeted set, not every feature, to keep the check light on the machine running it.

    Corrected 2026-10-08, after three agents (Haiku, Sonnet and Opus 5.5) built it side by side:
    the launcher, the shim and extensions syscall.Exec on unix and so never write their counters,
    which no harness change can fix faithfully; T-124 makes them write the counters first, and
    T-121's checks pass only with it. The first check grepped covdata percent for internal/launch,
    which lists the package at 0.0% from the meta file alone, so it passed with no counters at
    all; it now asks for the launcher's fetch covered, as the split check does.

- id: T-120
  type: ci
  title: This repository requires the code proof through itos-cc, with the features' coverage, and CI spot-checks it
  why: >
    Decision 42 (2026-10-07), the right way from the start (the user's call): once itos-cc carries
    #14 (integration coverage through GOCOVERDIR, released) and T-121 has the features build itos
    with -cover, itos.yaml gains proof.code (paths {cmd,internal}/**/*.go, check: tools/bin/pinned
    itos-cc mutation check --since {base} --fail-uncovered --json, itos-cc pinned at the release
    carrying #14, with its checksums), CI's plan a step running itos-cc mutation sample over the
    pushed range with the flags the results were recorded with, and the coordinator's notes a brief
    line: run itos-cc mutation run --since <base> --fail-uncovered, with the features' coverage,
    before work done. No interim without coverage. Equivalent mutants go in itos-cc.yaml with their
    reasons, for the person to review.

    What it takes (found 2026-10-07, corrected 2026-10-08, and again 2026-10-08): itos-cc v0.5.0 is the first release
    carrying all of #14. v0.4.0 has only one GOCOVERDIR for the whole run, so every mutant would
    run every feature (--all-tests, about 3 minutes each); v0.5.0 adds listed tests, each mutant
    running only the scenarios that reach its line. tools/bin/pinned knows only goreleaser and
    git-cliff, so this task teaches it itos-cc (its version and per-platform hashes, from the
    release's checksums.txt). No age gate on that pin: itos-cc is our own tool, so the 7-day wait
    T-067 holds a dependency to does not apply to it (ADR-0046), and waiting to try a new itos-cc
    feature is not a trade worth making. The rest of the rule is untouched: pinned fetches the tool
    with its checksums and govulncheck still runs. itos-cc.yaml lists the
    scenarios under mutation.tests: list prints one test a line, its ID, a tab and its file from
    the root, live scenarios only, which itos tests list scenario does not (two spaces, a file
    under features/, @wip ones too), so the list command reshapes it (its --json through a small
    script, or awk); run is go test ./features -count=1 -scenarios='{pattern}', ids_pattern
    '^@(?:{ids})$', join each '{id}' with '|', whole go test ./features -count=1, and support the
    harness (features/*_test.go, features/testdata/**). Nothing is left to wait for: T-121 and
    slice-100 are done and the hold ended 2026-10-08 when itos-cc v0.5.0 closed #14 with listed
    tests, so this can start now.

