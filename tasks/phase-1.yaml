    required job. Keep nightly latest-CI coverage meaningful when metadata-only runs legitimately
    skip platform coverage, by selecting a real complete code-validation run or explicitly
    validating the reduced run type; do not accept partial failures as successful coverage. Add an
    executable regression self-test over synthetic git ranges showing the prior workflow/plan runs
    unnecessary tests, the new route executes real validation and refuses malformed data, and all
    fallback cases retain their checks. Include a case with a named late task check and a named
