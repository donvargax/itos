- id: T-135
  type: ci
  title: Every program in tools/ starts this repository's shell programs, windows included
  why: >
    Windows starts no script by its #! line, so every program under tools/ that spawns one of this
    repository's shell programs (tools/bin/itos, dev-version, pinned) gets a null exit code there
    and fails, while linux and macos run the same file by its kernel: measured on a native windows
    clone, tools/bin/itos-cc-tests.ts printed "tools/bin/itos tests list scenario exited null" and
    itos-cc mutation run refused with tests.list-failed, having judged no mutant. One resolver in
    tools/bin gives the command and its arguments, sh and the script first on windows and the
    script alone elsewhere, and the nine spawns go through it: build-go.ts's dev-version and pinned,
    itos-cc-tests.ts, ci-mutation-budget, go-dogfood's itos and dev-version, go-schema's config
    check, scratch.ts's itos and header-agreement's hook reading. scratch.ts's spawnOutput is left
    as it is, because it also runs commitlint and a built Go program, which are not this
    repository's shell programs, so its other callers keep handing it a command to start. A .ps1 or
    a second script per platform is not the shape to take: the repository holds no .ps1, .cmd or
    .bat at all, and its platform differences live in branches and in Go's _<goos>.go files. Where
    the script is spawned unchanged on linux and macOS, so no gate behaves differently where it
    already works, and the fix adds no gate and weakens none: tools/bin/pinned still ships no
    windows asset and the ci job is still ubuntu-latest, so what this buys is a developer running
    the gates and itos-cc locally on windows, and nothing here claims more than that. The nightly
    runs the self-test, which starts two of the real programs through the resolver, so the claim
    is checked by running the gates rather than by reading them.
  done_when:
    - run: tools/bin/itos config check
    - run: node tools/selftest/tools-bin-programs.ts

