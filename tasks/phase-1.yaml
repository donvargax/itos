    CLI behavior. This is a concise clarification of an observed ambiguity, not a new receipt, scope
    placeholder, zero-work refusal or proof policy. Review the README example against the current
    configuration and corrected CI help after T-179; execute only the existing help acceptance
    check, with semantic review of prose as a separate criterion and no new policy-text test.
  done_when:
