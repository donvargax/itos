    unless in_place_of allows registry substitution. If both links are required and neither
    substitutes, name both distinct placeholders. Never pass a slice ID as a ledger ID or infer a
    task from depends_on. When a real acceptance task is needed but not supplied, state that missing
    setup rather than inventing an executable command; after slice-138 task promotion is a valid way
    to supply that task. When no work-link footer is required, no linking flag need be prescribed.
    Custom footer names and other required footers remain the existing guide commit renderer's
    responsibility, with no invented flag or config edit. The first delivery is static conditional
    prose, including outside a configured repository, not a filled brief or a new config-dependent
    renderer. Review emitted work and brief guides under registry substitution, registry without
    substitution, both required, ledger-only, no required work link, custom names, and no-config
    contexts. Preserve all existing footer enforcement, red-first ordering, check execution and
    publication/wait ownership. Update the existing guide corpus text where necessary; semantic
    correctness is reviewed against these cases, without a new feature scenario or policy-text regex
    test. Read T-178 for adjacent brief edits and retain its explicit publication scope.
    #89: guide commit also says that each footer flag (--task, --item, --scenarios) writes its footer
    into the message's last paragraph, so the -F text leaves those footers out; an agent wrote Task:
    by hand and passed --task as well.
  done_when:
    - run: tools/bin/itos guide work
    - run: tools/bin/itos guide brief
    - run: go run ./tools/bin/conformance --bin tools/bin/itos --only tools/itos/conformance/guide.yaml

- id: T-184
  type: docs
  title: Document the missing v7 migration guidance and v8 distinctions
  why: >
    Issue #40. Add a concise current migration guide at docs/upgrading.md, linked from README.md's
    upgrade documentation, to explain the v6-to-v7 changes and the later v8 difference. Published
    release bodies, historical commit footers and tags are immutable; this is an advisory
    supplement, not rewritten release history. Cover: numbered task/work/scenario minting reserves
    refs/itos/ids on the selected push remote, uses the minting code's narrowly scoped --no-verify
    push for that counter ref only (no source branch or tag), needs network/auth when a remote
    exists and fails offline instead of issuing a pretend reservation, while supported
    no-remote/stealth counters remain local. Do not prescribe hook bypass for user commits or
    pushes. Explain task next-id is a local preview counting ledger/registry IDs, not a cross-clone
    reservation, and use task add/work promotion or tests next-id with a full scenario stem for real
    claims; auxiliary test stems retain preview semantics. Explain work done removes a closing
    task's checks, lasting checks belong in CI/nightly when ready, and no keep-check flag exists.
    Separate a manually edited done status retaining checks from supported closure; already-done
    work done is idempotent, not a cleanup command for hand-closed tasks. Provide an honest
    review/manual-migration path through ordinary commits without invoking nonexistent cleanup
    automation or changing done status to manufacture one. Verify historical behavior at tags:
    source-read v7.0.0 still accepts and executes nightly tasks:done (internal/config/schema.go and
    internal/plan/plan.go); its removal is slice-107/59a483fe, present in v8.0.0 and v8.0.0-rc.2,
    not a v7 removal. Before moving an open check into a standing gate, ensure the implementation
    exists and the gate is at its intended cost tier; do not publish an intentionally failing
    standing gate just to preserve a future check. State the original empty/repeated What changed
    headings as a historical reporting limitation, without claiming this documentation repairs a
    release generator. Current upgrade text grouping is slice-152, distinct from historical release
    generation. Link primary repository source/tags and current help for supported commands; do not
    copy the broad historical proof plan as current truth. Acceptance is semantic review of examples
    and source attribution plus existing shipped help checks. No product behavior, config, provider
    protocol, release rewrite or policy-text test belongs here.
  done_when:
    - run: tools/bin/itos tests next-id --help
    - run: tools/bin/itos work done --help

- id: T-185
  type: ci
  title: The Nightly red issue names each failed plan step and the mutation sites it found
  why: >
    The Nightly red issue says only 'nightly: failure. No failing scenario in its log' for the
    plan's job (comments on #29 for runs 38896023548 and 39029889396), so a nightly red every night
    on mutation survivors (the user keeps the random step strict, 2026-10-17) hides any new failure
    behind the same text. Run 39029889396 showed the cost: the runner received a shutdown signal
    during the changed-site step and the ten steps after it never ran, with nothing in the issue to
    say so. The report step's body is built by a Go program under tools/bin, unit-tested on log
    excerpts of those two runs kept as testdata, replacing the inline bash in nightly.yml's report
    job. For each red job, as now, its failing scenarios; for the plan's job, from its log lines:
    each failed step from 'CI failed at:' and 'also failed at:' with its exit code; for each failed
    itos-cc mutation step, each site its JSON names with rule mutation.survived or
    mutation.uncovered (file:line:col, the change, the function), and count.interrupted when
    present; and when the log shows the runner shut down or the operation cancelled, the last step
    started and that the steps after it did not run. Read from the log, not ci run --json: no
    artifact plumbing. Also (the user, 2026-10-17) the two itos-cc mutation steps move to the end
    of ci.nightly in itos.yaml, random then changed-site, so an interrupted runner costs only them:
    the steps after them take about 1.5 minutes. No other change to the plan or any verdict; a
    self-test that holds the nightly's shape follows the new order, no looser. Was
    p1-nightly-report-names-steps (split from slice-133).

