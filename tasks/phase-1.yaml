- id: T-183
  type: docs
  title: Make guide commit-link examples conditional on the footer policy
  why: >
    Issue #66, wording-only delivery from p1-guides-use-configured-footers. Replace unconditional
    runnable-looking itos commit --item <slice> prescriptions in internal/guide/brief.md and
