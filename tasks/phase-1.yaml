- id: T-140
  type: build
  title: Build itos with Go 1.27.2, past the net/http vulnerabilities of 1.27.1
  why: >
    The nightly of 2026-10-10 (run 38049620063) went red in go-hooks.ts: govulncheck reports nine
    standard-library vulnerabilities the code reaches in Go 1.27.1 (GO-2026-6603 to GO-2026-6617,
    net/http and its http2), all fixed in 1.27.2, so the pre-commit refuses a go.mod change.
    go.mod's toolchain line picks the Go that CI, the nightly and the release build with
    (go-version-file), and a local go under GOTOOLCHAIN=auto, so raising it clears the finding
    everywhere and builds v7.0.0 with the fixed library.

- id: T-141
  type: build
  title: The repository ignores local notes in .tmp/ and the metrics reports beside .metrics/mutate/
  why: >
    vp check reads the repository's .gitignore, not a person's global git ignore, so local files git
    skips still fail it: .tmp/ notes and the crap, dry and scrap reports written to .metrics/ on
    2026-10-03 kept T-137's check, vp check, red in this clone while CI's clean checkout passed.
    Ignoring .tmp/ and the JSON reports directly under .metrics/ keeps a working tree's vp check
    judging the repository's own files; .metrics/mutate/ stays tracked, since itos-cc's cached
    results are committed.

- id: T-142
  type: build
  title: Markdown and YAML are formatted without vp, Go first, and itos declares the pre-commit hook in place of vp staged
  why: >
    The user's call (2026-10-10): this repository drops vp and Node, and every tool is Go where Go
    can do it. Markdown and YAML formatting survive: google/yamlfmt for YAML, and for Markdown T-142
    spikes Kunde21/markdownfmt (last tagged January 2023, no front matter support, so behind a
    wrapper that sets front matter aside) against dprint (maintained, one non-Go binary pinned by
    checksum through tools/bin/pinned) and picks by the diff each makes over the tracked files. None
    of it changes what itos does for consumers, whose repositories never carried vp. First step: a
    spike in a scratch copy runs markdownfmt and yamlfmt over every tracked Markdown and YAML file;
    a small faithful diff with only front matter to set aside means pure Go, damage to tables, lists
    or fences means dprint. The chosen formatter replaces vp check's formatting and Oxfmt, keeping
    paragraphs' line breaks so prose is not rewrapped, T-137's exclusion of itos's own tasks/*.yaml
    kept, and one reformat commit for what the formatter's output changes. The pre-commit hook moves
    to the git config beside commit-msg and pre-push (decision 37), running the chosen formatter on
    the staged files, gofmt, go vet and tools/bin/go-unit-tests, so .vite-hooks, vp staged,
    vite.config.ts, Oxlint and the Vite+ block of AGENTS.md go. vp run scripts become the commands
    they ran. p1-hook-env-unset-tracked is settled here: whatever the new hook needs to keep a
    hook's git environment from the unit tests lives in the tracked hook. Its check also requires
    the chosen formatter to be a step of CI's plan, so dropping formatting cannot close it.

