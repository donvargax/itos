    behaviour through text converts to json: (or json_has:), exit and files_after, adding --json
    where the command has it; a case checking only wording, or with a --json twin over the same
    argv, is deleted; a usage case keeps its exit code and a loose stderr_has naming the offending
    flag or argument; a case whose command prints no JSON (or prints JSON lacking the fact) keeps at
    most a loose stdout_has or stderr_has on its key fact, and the missing JSON is listed in
    p1-json-gaps; output from a child process (a task check, git, a hook) stays a loose _has.
    ADR-0054's script outputs (ci scope docs_only=, ci range FROM= TO=, config get, tests next-id,
    tests smoke ids) and guard claude-code's hook JSON keep their exact pins. No product change;
    previous-release is unaffected until the next release. Files: tasks.yaml status.yaml init.yaml.

