- id: T-165
  type: ci
  title: The release asks the Go module proxy for its new version, and the README's go install line names v8
  why: >
    The user (2026-10-12) ran go install github.com/donvargax/itos/v8/cmd/itos@latest for a while
    after v8.3.0 was cut and kept getting v8.2.0: proxy.golang.org caches a module's @latest and
    version list and refreshes them on its own schedule, and release.yml never tells it a tag
    exists. Asking for @v/<tag>.info made the proxy fetch the version at once (v8.3.0 and v8.3.1
    that day), though @latest lagged a while longer. release.yml gains a last step, after Publish,
    that requests the new version from the proxy (go list -m <module>@<tag> with
    GOPROXY=https://proxy.golang.org, or its @v/<tag>.info), retried a few times; the release is
    already out by then, so a proxy that does not answer warns (::warning::) and never fails the
    job. README.md's install paragraph names /v8 (it still says /v7) and says @latest can lag the
    newest release by a while, @v<version> never does. From p1-release-warms-go-proxy; the same
    change goes to go-template-itos as a backport issue once it lands.

- id: T-166
  type: docs
  title: ARCHITECTURE.md is a map of about 12 KB that points to the code and the decision records, and its cap falls to match
  why: >
    The user (2026-10-12): ARCHITECTURE.md was 32 KB, about 8,000 tokens every brief pays, and
    T-165's paragraph on a release step it already commented put it over its cap. It mixes a map
    (the layout, how a run goes, where to look, the rules that cross packages, about 10 KB) with
    step-by-step accounts of CI, the release, the hooks, the features and the plugin (about 16 KB)
    that the workflows, itos.yaml, the doc comments and itos ci plan already say, and with reasons
    that are the decision records' (it links 8 of 51). It becomes the map: those sections a short
    paragraph each, saying what the piece is and where its detail lives (the file, the doc comment,
    the ADR by path). Code is king (the user's rule): detail the code, a workflow or a config
    already shows is cut, not moved into comments; a comment or paragraph stays only where the code
    is ambiguous or serves a purpose it does not show, security for one. A fact no other file holds
    and a reader needs moves to its doc.go or decision record first. AGENTS.md's 'Where knowledge
    goes' gains that rule in a sentence. tools/bin/doc-budget/caps.json lowers ARCHITECTURE.md's cap
    to 12000, in a ci commit of its own that says why.

- id: T-167
  type: build
  title: The pre-commit hook runs the doc budget when a capped file is staged
  why: >
    From p1-doc-budget-at-commit (the user's OK, 2026-10-12): T-165 pushed docs/ARCHITECTURE.md 31
    bytes over its cap and CI's static doc-budget step turned main red (run 38286287307), as no hook
    checks the budget. tools/bin/pre-commit runs go run ./tools/bin/doc-budget when a file
    tools/bin/doc-budget/caps.json lists is staged, as it runs go vet when Go is staged, reading the
