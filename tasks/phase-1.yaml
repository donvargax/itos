- id: T-179
  type: refactor
  title: Correct the embedded CI code-proof help and planner comment
  why: >
    Issue #45, tracked by p1-ci-run-help-proof-check. Correct only documentation text in
    internal/cli/help.go and the matching comments in internal/plan/plan.go, internal/plan/doc.go and
