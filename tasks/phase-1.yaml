    the layer arrows of itos-cc's docs/architecture.md (internal/slices/<x> imports no sibling
    slice; a slice's domain imports no adapter, I/O or UI; adapters import their domain; nothing
    outside internal/slices imports a slice but cmd; no porttest linked into the binary; no mocking
    library anywhere), each with a fixture it must accept and one it must refuse, as itos-cc's
    fixtures do; rules for paths that do not exist yet hold over the fixtures alone.
    architecture-check's hard-coded exceptions (itos-cc#61) become itos's own (none today). Of
    itos-cc's other linters, enable those today's tree passes unchanged; the rest go into an idea
    naming each linter and its finding count, not fixed here (the user, 2026-10-21: as fast as
    possible). itos.yaml's ci steps gain both, cost static, after go vet. Behaviour unchanged: no
    product Go edits beyond what a linter enabled here requires, which should be none.

- id: T-195
  type: refactor
  title: "Process-global state out of internal/cli and internal/tests: draft promote runs Main through a value, not an init re-entry"
  why: >
    ADR-0053, step 2 of docs/plans/slices-and-ports.md: each global is a reason a command cannot run
    twice in one process, and a slice must take what it needs as values. Out: draftmint.go's init()
    setting mainReserved (cmd or Main hands draft promote the function to run), idmint.go's package
    var reserved (a parameter of the commands that mint), cli.go's origin (a value carried with the
    output, as itos-cc's UI carries its paths), tests.Warnings and warned (tests/tests.go: a writer
    and a per-run set passed in). Left for later steps, named so no one does them twice: the
    package-global current source (the tree-reader port), the cached core.commentChar (the VCS
    port's messages group), process cwd and environment set by applyGlobals, git.Export, ci and shim
    (the boundary, with the OS as a value). No behaviour change; help, output and exit codes are
    byte-for-byte as before.

- id: T-196
  type: refactor
  title: "Pilot slices: guard and version move to internal/slices, each with its CLI, Query, Handler and Ports"
  why: >
    ADR-0053, step 3 of docs/plans/slices-and-ports.md, after T-194's gates and T-195: the two
    smallest commands prove the layout, the depguard rules and architecture-check on real code, as
    itos-cc's units pilot did. guard (internal/cli's guard command and internal/guard as the slice's
    domain, internal/slices/guard/domain) and version (internal/slices/version, no domain) each get
    a package with a CLI value parsing what internal/cli's flag spec hands it, a Query of domain
    values, Handler.Handle(ctx, q) and a Ports interface the slice owns (guard's one outside need,
    config.Managed(dir), becomes a Ports method). Until step 5 moves the assembly into cmd,
    internal/cli is the assembly: its command table calls each slice, binds its Ports to the real
    code, and is architecture-check's one outside exception, removed in step 5. A slice imports
    nothing of internal/cli (which would cycle); its output goes through internal/out. Every Ports
    method takes a context.Context first; internal/cli passes context.Background(). The rules T-194
    wrote for internal/slices now hold real packages; tighten any that only held fixtures. Help,
    output, exit codes and --json unchanged; mutation snapshots and exceptions under .metrics/mutate
    move with the files.

