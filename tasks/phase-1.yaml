    stealth locks go through the tracker port's Hold, the lock file staying cfg.Work.Registry plus
    ".lock" so an older itos in another worktree still excludes a newer one; the drafts lock through
    the private store's Hold on the same file draft.go computes today. A depguard rule
    lock-internals, as git-internals, makes internal/lock the store adapters' alone, with an
    architecture fixture. A lock timeout stays kind.Temporary (75); the port wraps no error with a
    kind. No behaviour change.

- id: T-227
  type: refactor
  title: "The tracker store, part 3: IDs reserved through the tracker port, internal/idcounter its adapter's internals"
  why: >
    ADR-0053, step 6, after T-226: the tracker port's last part. Reserve(ctx, series, floor, count)
    joins the port, with its contract case (the floor, the counter, consecutive runs, a bad series,
    count below 1, overflow) and its fault in the broken fake; counterStore (internal/cli/idmint.go)
    and idcounter.Claim's caller (nextid.go) move into the file adapter, and a depguard rule
    idcounter-internals makes internal/idcounter the adapter's internals. idcounter's files, locks
    and the Windows MoveFileEx stay as they are. Reserve locates when it reserves, never when the
    adapter is built, and wraps a failed locate with kind.Unknown (exit 70, bug-119, @ID-IDS-08); an
    unreachable remote stays exit 3 (@ID-IDS-04). Numbering (nextid.Next, widths,
    ledger.NextIDAfter, taggedIDs) stays for step 7's ids engine. No behaviour change.

- id: T-228
  type: build
  title: "Engines have a home and a gate: internal/engine with depguard rules and architecture fixtures"
  why: >
    ADR-0053, step 7 of docs/plans/slices-and-ports.md: the engines out of internal/cli, which run
    in three parallel lanes (the user, 2026-10-22). This task lands the gate once so no engine task
    edits a rule or fixture. Engines live at internal/engine/<name> (the coordinator's call,
    2026-10-22: one parent folder, so one glob holds them; itos-cc's rules otherwise, its
    .golangci.yml engine rules being the model). .golangci.yml: a rule engines (files
    **/internal/engine/**, list-mode lax) denying internal/cli$, internal/slices/, the four store
    and VCS adapters (internal/store/private/adapter, internal/store/tree/adapter,
    internal/store/tracker/adapter, internal/vcs/adapter), internal/launch$ and internal/shim$, no
    entry a prefix of another (TestNoDenyEntryPrefixesAnother); a rule engine-fakes
    (**/internal/engine/** and !$test) denying the four porttests as slice-fakes does;
    internal/engine/ added to slice-packages' allow list. git-internals, lock-internals and
    idcounter-internals already cover engines through **/internal/**. tools/testdata/architecture:
    stubs internal/engine/alpha and beta; fixtures in code and test for an engine importing
    internal/cli, a slice, each adapter (refused), a port, internal/out, another engine and the
    standard library (accepted), a porttest (refused in code, accepted in a test), internal/git,
    internal/lock and internal/idcounter (refused by their rules, the engine stub added to their
    layer lists), and a slice importing an engine (accepted); outside_test.go one case for an engine
    importing a slice. docs/ARCHITECTURE.md (11988 of 12000 bytes): one bullet in Where to look,
    what several commands share is internal/engine/<name>, its doc saying what, with at least as
    many bytes cut elsewhere (the release program list, which release.yml gives). No Go outside
    tools/testdata; no behaviour change.

