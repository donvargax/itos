- id: T-123
  type: ci
  title: A module path ahead of the last release's major cuts that major (or its release candidate) for any releasable commit
  why: >
    Found by T-119's agent (2026-10-07): with go.mod at /v7, v6.5.1 the last release and the
    pre-release marker on, a feat or a fix with no breaking change still computes 6.6.0 or 6.5.2,
    which T-089's module-path rule refuses, so the release job fails and main goes red; only a
    breaking commit would cut v7.0.0-rc.1. A module path ahead of the last release's major already
    promises that major: release-version cuts <major>.0.0 (or <major>.0.0-rc.<n> with the marker on)
    for any releasable commit when go.mod's major is above the last release's, and refuses as today
    when it is below. Proven by release-version's tests on scratch histories: a fix after a /v7 move
    cuts 7.0.0-rc.1 with the marker and 7.0.0 without, a docs-only push still releases nothing. It
    lands before any feat or fix, so main never goes red waiting for slice-100's breaking change.
    Was p1-release-major-from-module-path.

- id: T-124
  type: refactor
  title: itos writes its coverage counters before it replaces itself with syscall.Exec
  why: >
    Found by T-121's agents (2026-10-08): on unix the launcher (internal/launch/run_unix.go), the
    git shim (internal/shim/run_unix.go) and an extension's call (internal/cli/extension_unix.go)
    replace the process with syscall.Exec, which runs none of the exit hooks where a binary built
    with -cover writes its counters, so the coverage of every scenario that runs a pinned version,
    passes git through the shim or calls an extension loses all it ran before the exec, and itos-cc
    would call those lines uncovered. Each of the three, when GOCOVERDIR is set, writes its counters
    there first with runtime/coverage.WriteCountersDir, its error ignored: a binary built without
    -cover refuses the call and runs as before, so nothing a user sees changes, which is why this is
    a refactor and not a fix (the user's call, 2026-10-08). WriteCountersDir needs
    -covermode=atomic, which T-121's cover build uses. Not on windows, where the _other.go files
    start the program and wait, so the process exits and writes its counters itself. Proven by the
    coverage of one scenario reaching each site, each site's function covered in its own scenario's
    folder; it needs T-121's harness, and lands with it.

- id: T-125
  type: ci
  title: This repository's nightly reruns no done task's checks, and its done tasks keep none
  why: >
    Slice 101 makes work done remove a task's checks from the ledger when it closes it
    (docs/plans/v7-proof-of-done.md: a task's checks are the agent's progress, then leave; git
    history keeps them). This repository still has the checks of every task closed before it, and
    the nightly's { tasks: done, cost: static } step reruns them each night, which the plan drops:
    they cost every night and caught nothing real (the evidence is on p1-nightly-late-done-checks).
    This task removes that step from ci.nightly.steps (regenerating AGENTS.md's rules block with
    itos init --agent-rules) and removes done_when from every done task's ledger entry. A done
    task's check that guards something no scenario, unit test or gate self-test does, and that runs
    the thing rather than grepping a file, becomes a ci.steps or ci.nightly.steps step of its own
    instead, with a comment saying what it guards; the rest go, git keeping them. The CI step that
    runs tools/bin/itos task T-007 goes with T-007's checks, its guards kept as steps where they are
    not already the @ID-CMSG scenarios. Which guards survive is the person's call, not the agent's
    (raised in review, 2026-10-08): the agent first lists every done task's check, each marked keep (as
    which step, and what it guards that nothing else does) or drop (and why), puts the list to the
    person through itos decision add, and stops; it removes nothing until the person has answered,
    and then builds the answered list. The change to itos.yaml is a ci commit, the ledger's a docs
    commit; the ci commit first, so the nightly never runs a stripped ledger's step. The checks
    below read the result through itos, not the files: the nightly's plan names no task, and no done
    task keeps a check.

- id: T-126
  type: build
  title: The action installs the launcher of the release its ref names, a pre-release tag or a release's commit included
  why: >
    Issue #23 (2026-10-08): action.yml (T-093) installs the launcher of the release its ref names
    only when the ref matches ^v[0-9]+\.[0-9]+\.[0-9]+$, so uses: donvargax/itos@v7.0.0-rc.1
    installs the newest stable launcher instead, and a commit-sha pin (what GitHub and Renovate
    recommend) never matches, so a consumer repeats the version in the version input and the two
    drift: itos-template's CI ran launcher 6.0.0 through 6.4.0 and rc.1, missing 6.5.1's pre-release
    ordering. The coordinator's calls, ASAP at the user's request: the ref's version moves into
    tools/bin/action-version <ref> [<owner/repo>], a POSIX sh script that prints the version to
    install, or nothing for the newest, so it can be checked outside a runner. A tag ref vX.Y.Z or
    vX.Y.Z-<pre-release> prints X.Y.Z[-pre-release]. A 40-hex commit sha prints the version of the
    release tag that points at it, read with git ls-remote --tags from
    https://github.com/<owner/repo> (default donvargax/itos; the action passes
    github.action_repository), lightweight or annotated (its ^{} line), the stable one when a commit
    carries both a pre-release and a release. Anything else (a branch, a sha no release names)
    prints nothing, and the action then installs the newest as today, with a ::warning:: naming the
    ref when it was a sha. The tagged commit's tree holds no version file (a release is cut without
    a commit), so the tags are the one source. The version input still wins. action.yml's comment
    and input description, and the README's install section, say this. Consumers get it with the
    next release cut (a build commit cuts none), so the README says to pin the action by a release's
    tag or its commit.

- id: T-127
  type: ci
  title: CI confirms a release without downloading one, and caches the launcher
  why: >
    The nightly downloaded the newest release linux-amd64 tarball (4.5 MB) every night only to
    verify its attestation, and every push downloads a launcher tarball on three platform jobs,
    which is most of what this repository asks of GitHub (the person, 2026-10-08: only confirming a
    release is available should be enough, and be conscious of GitHub servers). GitHub publishes a
    sha256 digest on every release asset, so one API call plus checksums.txt (564 bytes) confirms
    availability and integrity with no artifact downloaded: every expected asset present, non-empty,
    with a digest matching checksums.txt. The attestation stays where the bytes are, in the release
    job that uploads them; the nightly keeps it only if the runner gh can verify by digest without
    the file, which the agent must check on the runner (gh attestation verify --help: the local gh
    2.32.1 has no attestation command at all, so never decide this from the local gh). The action
    caches the launcher per release version, so a repeat push fetches nothing. The checks read the
    plan through itos, never a file

