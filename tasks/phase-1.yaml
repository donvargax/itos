    up-to-date branch, with an admin bypass for the registry commits pr sends straight to main. This
    task sets push.mode: pr in itos.yaml and rewrites the working rules for it: everything but
    registry and ledger commits goes through a pull request, the coordinator's specs and docs
    included (the person's call); an implementer's worktree branch is renamed to its item id (or
    starts from origin/<item> when a spec is already there); itos push opens the pull request, turns
    on auto-merge and waits for its checks; work done runs on main only after the merge. Being
    itself a config and docs change, it lands through the first pull request, which is the smoke
    test: auto-merge waits for the required checks, registry commits still go straight to main, and
    the item closes after the merge.

