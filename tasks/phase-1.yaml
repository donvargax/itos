- id: T-268
  type: ci
  title: The gates self-test's CI-catches-a-refactor case edits a printed line its package's unit tests do not read
  why: >
    Found by T-242's agent (2026-10-22): the gates self-test (nightly only;
    tools/selftest/gates/gates_test.go) edits internal/cli/verify.go's line commits pass the commit
    rules to prove that a refactor changing what itos prints passes both hooks and is caught by CI's
    features step. T-234 (e2e9b136) moved that line into internal/engine/judge/judge.go, whose unit
    tests read it, so the edit no longer applies and the self-test fails; the next nightly goes red
    on it. The case needs a printed line in a Go package whose own unit tests do not read it, and
    which a smoke-set scenario does read (so CI's features step for a push catches the change); pick
    one, state the choice in the case's comment, keep what the case proves. Step 9 moves code out of
    internal/cli: prefer a line in a package step 9 does not move (an engine, a domain package) or
    say why it is stable. A ci commit; no product change.

- id: T-269
  type: ci
  title: The pre-push hook runs staticcheck when Go changed, as it runs golangci-lint
  why: >
    T-247's and T-251's pushes (2026-10-22, step 9 lanes) each turned main red on staticcheck's
    ST1008 in a new test: staticcheck (go tool staticcheck, T-148) is a CI step no hook runs, so
    every lane's push stayed red until each repair landed. As T-220 did for golangci-lint:
    tools/bin/staticcheck-changed {base} runs go tool staticcheck over the packages the pushed range
    changes when Go changed (and nothing when it did not), --all over the module; itos.yaml's
    hooks.pre_push per_base and whole run it after golangci-lint-changed; its self-test beside
    golangci-lint-changed's (tools/selftest). A ci commit; AGENTS.md's pre-push sentence names it in
    a docs commit.

- id: T-270
  type: ci
  title: The gates self-test edits a test file that stays in internal/cli through step 9
  why: >
    Found by T-269's agent (2026-10-22): tools/selftest/gates/gates_test.go (lines 110-111) edits
    internal/cli/verify_test.go, which T-247 (f5261dda) moved into internal/slices/verify, so the
    nightly-only self-test fails to open it. Point the case at a test file that stays in
    internal/cli while commands move (cli_test.go: internal/cli remains the assembly), and grep
    tools/selftest for every other internal/cli path a step 9 move could take away; fix any the
    merged moves already broke. The agent verified cli_test.go locally. A ci commit; no product
    change.

- id: T-271
  type: test
  title: Tests cover the error branches the draft slice's move left uncovered
  why: >
    Coverage debt of step 9 (the user's rule for the moves, 2026-10-21). T-252's push (9adb6b8e)
    moved old code whose error branches no test reaches, so the push proof's strict line coverage
    fails: internal/slices/draft/change.go:58 (a copy's stat failing for a reason other than not
    there), :83 (editPatch cannot create the patch file), :87 (cannot write it), :109 (topPaths
    cannot read the working folder), handler.go:317 (drop cannot save the list). Unit tests over the
    slice's fakes, each forcing an error every OS reports alike (a NUL byte in a path, a folder
    where a file goes, a fake that fails); if a branch is truly unreachable, a seam in the slice's
    Ports rather than an OS branch. No change to what itos does.

- id: T-272
  type: test
  title: Tests cover the branches the init slice's move left uncovered
  why: >
    Coverage debt of step 9 (the user's rule for the moves). T-256's push (11fbc7e2) moved old code
    whose branches no test reaches, so the push proof's strict line coverage fails:
    internal/slices/initcmd/parse.go:157 (filepath.Abs failing: the working folder gone),
    report.go:42 (found == nil under --json, likely unreachable since configcheck.Findings never
    returns a nil list), write.go:59 (the starter file's write failing) and write.go:92 (the
    registry's write failing). As T-271 did for draft: seams are Ports methods, never package vars
    or GOOS branches (Getwd for Abs's input, a Write port for the two writes, bound in
    internal/cli/init.go to the calls made today), and a branch that cannot happen is removed only
    if the change provably keeps every byte (say why in the commit). No change to what itos does.

- id: T-273
  type: ci
  title: nightly-report reads a job log that holds terminal escape sequences
  why: >
    T-192 made the Nightly red comment carry why a job log could not be read, and the nightly of
    2026-10-22 (run 39773321788, issue #29) gave it: 'gh: exit status 1: the response contains
    terminal escape sequences; pass --allow-escape-sequences to output it anyway'. The gh the
    nightly installs (GH_VERSION 2.101.0 in nightly.yml) refuses to print an API response holding
    escape sequences, and a job log holds the colours go test, itos-cc and the steps print, so every
    log fetch fails and the issue names no failing step or survivor (the same log read with gh api
    through a person's older gh renders it). tools/bin/nightly-report passes
    --allow-escape-sequences to its gh api call for a job's logs, and only to that one (the jobs
    list is JSON). The body goes to a GitHub issue, not a terminal, but strip removes every escape
    sequence the log can hold (CSI, including colours, and OSC, such as the hyperlinks newer tools
    print), not only colours, so none reaches the body. Its unit test asserts the flag is on the log
    fetch and that a log with a CSI and an OSC sequence renders without either. No change to itos.

