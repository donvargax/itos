- id: T-194
  type: build
  title: "The gates of itos-cc's layout: pinned golangci-lint with depguard, architecture-check and its fixtures"
  why: >
    ADR-0053, step 1 of docs/plans/slices-and-ports.md. Copy itos-cc's gates
    (~/tmp/llms-safe/code-quality: .golangci.yml, tools/bin/architecture-check,
    tools/testdata/architecture, golangci-lint in tools/bin/pinned with its checksums) and adapt
