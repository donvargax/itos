    - run: go run ./tools/bin/conformance --bin tools/bin/itos --only tools/itos/conformance/help.yaml

- id: T-180
  type: docs
  title: Explain configured proof scope and execution in the README
  why: >
    Documentation delivery for #24, with the related #45 and #35 inaccuracies found in README.md
    Proof of done. Explain beside the example that proof.code.paths controls whether the automatic
    ranged proof is selected; the configured command and its operands determine what the provider
