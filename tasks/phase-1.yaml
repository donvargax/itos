- id: T-171
  type: ci
  title: Use a narrow CI validation route for registry-only pushes
  why: >
    The user approved change-aware CI selection on 2026-10-14 after registry-only push 95018c2 ran
    the full plan and all platform tests. A known nonempty range changing only tasks/work-items.yaml
    (optionally alongside existing prose paths) and naming no Task or Scenarios requirements should
    run commit verification, formatting, config/ledger/registry validation, and the other existing
