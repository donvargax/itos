- id: T-302
  type: docs
  title: Implementing agents wait for CI, fix a red run and close their item
  why: >
    The person, 2026-10-24: CI on main now takes about 6 minutes (median of the last 29 runs; p90 8,
    max 12), so the coordinator no longer needs to watch it for agents. bug-136 (v8.13.1) lets an
    agent in a worktree with no upstream push to origin's default branch, so agents push themselves.
    AGENTS.md's Finishing and docs/ORCHESTRATING.md's brief line change: push with tools/bin/itos
    push in the foreground (600000 ms timeout), which waits for CI; if the call is cut off, run
    tools/bin/itos ci watch <sha> in the foreground once more, never a sleep or a loop; a red run is
    the agent's to fix forward; once green, itos work done <item>; report the pushed SHA and the
    green run. The coordinator still checks the named run against the pushed head and reviews the
    diff after the push. The wait-loop lesson stays: a foreground call that blocks is not a loop.

- id: T-303
  type: build
  title: Switch this repository to push.mode pr
  why: >
    The person, 2026-10-24: work in pr mode as soon as possible. slice-175 (rebased head watched),
    slice-176 (work done waits for the merge) and slice-177 (ledger edits beside the registry reach
    main) landed today (v8.16.1-v8.16.3); the repository's merge settings were applied by hand
    (rebase-merge only, auto-merge, delete branch on merge, update branch) and the main ruleset
