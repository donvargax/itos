# Phase 0: the scaffold, the gates, the task tool and CI, inherited from the
# project template this repository was made from. The template's demo app
# (a page, its greeting and its Playwright scenario) went in phase 1, so the
# checks below are the ones that hold here: each task's why says what changed.

- id: T-001
  type: build
  title: Repository scaffold
  why: >
    A Vite+ project with TypeScript in its own git repository, so every gate
    below has something real to run. Here the TypeScript is itos itself, and a
    Go module (go.mod) carries the features' steps; the template's page and
    its build went in phase 1 (T-014).
  done_when:
    - run: vp install
    - run: go mod verify

- id: T-002
  type: build
  title: Static quality gates
  why: >
    Formatting, type-aware lint and type checking, repo-wide in CI and on the
    staged files before each commit.
  done_when:
    - run: vp check

- id: T-003
  type: build
  title: Unit tests, and coverage for the audit
  why: >
    The hooks run only the unit tests a change reaches; CI runs the whole suite
    with coverage. The template held its demo's modules to coverage
    thresholds; itos is proven through its command line (the features, the
    conformance corpus), which a unit test's coverage cannot see, so the
    coverage feeds the audit's scores and holds no threshold (T-014).
  done_when:
    - run: vp test run
    - run: vp run test:coverage

- id: T-004
  type: build
  title: Audit gate
  why: >
    No new dead code, unused exports or dependencies, no new duplication and no
    new complex, uncovered functions (fallow), on the files each commit adds or
    changes and over the whole tree in CI.
  done_when:
    - run: vp run audit

- id: T-005
  type: build
  title: Named tests and the smoke set
  why: >
    Scenarios in Gherkin, a smoke set every push runs with what its commits
    name, in one run, and a self-test proving the plan's command selects
    exactly that. The template ran its scenarios with Playwright against its
    demo page; here they are the features at features/, run by godog against
    the itos binary (T-016), and the self-test reads go test's own record of
    what ran.
  done_when:
    - run: tools/bin/itos tests smoke check scenario
    - run: tools/bin/itos tests smoke run scenario
    - run: node tools/selftest/features-scope.ts

- id: T-006
  type: build
  title: itos v0, the task tool
  why: >
    The ledger, the commit rules, CI's plan and the work routing are one tool
    read from one config (itos.yaml), so the policy is data and a project
    changes it without forking code. Its conformance suite states what it does
    as cases run through its command line; a tampered copy of the cases must
    fail, so the runner compares what it claims to.
  done_when:
    - run: tools/bin/itos config check
    - fails: ITOS_CONFIG=tools/itos/fixtures/typo.yaml tools/bin/itos config check
    - fails: tools/bin/itos config check --ledger tools/itos/fixtures/static-after-late.yaml
    - fails: tools/bin/itos work check tools/itos/fixtures/cycle.yaml
    - fails: tools/bin/itos task T-000
    - run: ITOS_CONFIG=tools/itos/fixtures/lax-refactor.yaml tools/bin/itos commit check-paths --type refactor features/since.feature
    - run: ITOS_CONFIG=tools/itos/fixtures/command-adapter.yaml tools/bin/itos tests list fixture --json
    - run: sh -c 'test "$(ITOS_CONFIG=tools/itos/fixtures/range-command-false.yaml tools/bin/itos ci range --head HEAD)" = FROM='
    - run: sh -c 'ITOS_CONFIG=tools/itos/fixtures/identity-command.yaml tools/bin/itos work | grep -q "Working for someone"'
    - run: node tools/itos/conformance/run.ts --bin tools/bin/itos
    - fails: node tools/itos/conformance/run.ts --bin tools/bin/itos --only tools/itos/conformance/fixtures/tampered.yaml
    - run: vp test run tools/itos

- id: T-007
  type: build
  title: Commit rules and the hooks
  why: >
    Conventional Commits with a Task: or Scenarios: footer naming what drives
    the commit, and each type held to the paths it may touch, so a commit's
    type is honest: here a build may not touch the implementation, nor a
    refactor a feature file. The commit-msg hook applies the path rules, the scenario
    moves, then commitlint (config-conventional) and itos's footer rules
    (one per footer of itos.yaml) beside it; pre-commit formats, lints and runs the unit tests the
    change reaches and the audit; pre-push runs the unit tests the pushed
    commits reach. CI runs this task on every push. The hook itself is proven
    by the commit-msg scenarios, in repositories the steps build: two checks
    that ran it here on "build: x" and "docs: x" judged whatever was staged,
    so the second failed in any commit staging more than prose once the hook
    ran a named task's static checks mid-commit. The message checks go
    through commit check-message, which runs commitlint and the footer rules
    as the hook does: since slice 10 the footer rules are itos's, not a
    commitlint plugin's, so commitlint alone no longer rejects a missing or
    unknown footer.
  done_when:
    - fails: "printf 'update things\\n' | tools/bin/itos commit check-message -"
      cost: static
    - run: "printf 'build: scaffold\\n\\nTask: T-001\\n' | tools/bin/itos commit check-message -"
      cost: static
    - fails: "printf 'build: scaffold\\n' | tools/bin/itos commit check-message -"
      cost: static
    - fails: "printf 'feat: x\\n\\nScenarios: @ID-NOPE-01\\n' | tools/bin/itos commit check-message -"
      cost: static
    - fails: tools/bin/itos commit check-paths --type refactor features/since.feature
    - fails: tools/bin/itos commit check-paths --type build tools/itos/main.ts
    - fails: tools/bin/itos commit check-paths --type chore tools/itos/main.ts
    - run: tools/bin/itos commit check-paths --type docs README.md tasks/phase-0.yaml
    - run: go test ./features -count=1 -scenarios='^@ID-CMSG-'

- id: T-008
  type: ci
  title: GitHub Actions CI
  why: >
    Every push runs the same gates as local development, through one local
    command (`vp run ci`, `itos ci run`), so the workflow is a thin wrapper:
    the range from the last green run, the named tasks' checks in cost order,
    one run of the features over the smoke set and what the range names, a prose-only
    shortcut. It re-checks every pushed commit with the commit-msg rules, so a
    commit made with the hooks bypassed fails CI.
  done_when:
    - run: actionlint
    - run: node tools/selftest/ci-scope.ts
    - run: node tools/selftest/ci-range.ts
    - run: tools/bin/itos verify "" HEAD
      cost: late # sized by the history, not by the change
    - fails: tools/bin/itos verify HEAD "$(git commit-tree 'HEAD^{tree}' -p HEAD -m 'update things')"
    - run: vp run ci

- id: T-009
  type: ci
  title: The nightly, and the gates self-test
  why: >
    A push runs the smoke set and what it names; the nightly runs every
    scenario, then the gates self-test, which proves in a scratch worktree that
    the hooks run only what a change reaches and that CI's steps catch what
    they leave out. A red nightly opens one issue (or comments on the open
    one), and a green one closes it.
  done_when:
    - run: actionlint
    - run: node tools/selftest/gates.ts

- id: T-010
  type: build
  title: The changelog from the commits
  why: >
    The history is the changelog: git-cliff groups the Conventional Commits by
    type, each with its footers and its body, written on demand into an
    ignored folder; a filter prints the commits that name one task or one
    scenario.
  done_when:
    - run: vp run changelog
    - run: sh -c 'test -s docs/changelog/CHANGELOG.md'
    - run: vp run changelog -- --task T-010

- id: T-011
  type: chore
  title: Licences
  why: >
    The template is 0BSD, so a project made from it owes nothing, with the task
    tool's AGPL-3.0 licence in its folder. This repository is the tool, so it
    is AGPL-3.0 as a whole (T-018). The check asks GitHub which licence it
    detects for the repository.
  done_when:
    - run: gh api 'repos/{owner}/{repo}/license' --jq .license.spdx_id | grep -qx AGPL-3.0
      after: push

- id: T-012
  type: docs
  title: README
  why: >
    What the template is, how to create a project from it, and the first steps
    in a new one.
  done_when: []

- id: T-013
  type: docs
  title: Agent instructions
  why: >
    itos holds every rule a command can decide; the agent instructions hold
    the rest, written for any project made from the template. AGENTS.md is
    the implementing session's (which session you are, what drives a change,
    the split, the gates as built, what no gate does, Never, Finishing),
    docs/ORCHESTRATING.md the coordinator's (the loop, the brief, a slice that
    fails, lessons, doc work beside a running agent, checking a result), and
    docs/HANDOFF.md, PLAN.md and docs/ARCHITECTURE.md the skeletons a project
    fills in. Where a gate enforces a rule, the docs name the gate rather than
    restating it. Prose has no check that runs it: review is the proof.
  done_when: []
