# Steps 3 and 4 split by corpus file, since the runner selects whole files
# and the files mix commands: moves.yaml runs the commit-msg hook in eight of
# its cases, so it waits for the hook group; plans.yaml, ci-run.yaml and
# range.yaml are step 5's, work.yaml step 7's, hooks.yaml step 8's.

- id: T-045
  type: refactor
  title: The Go footers and commit check-message
  why: >
    PLAN.md, phase 2, step 3. One message through the footer rules, as the
    corpus's messages.yaml records it: each rejection's wording, the tree a
    footer's IDs are read at (the staged tree by default, the commit --at
    names, the working tree for a commit that predates the source, or always
    with read_at: worktree), a missing ledger folder read only for a message
    naming a task, a command adapter's tests named in a footer, a Gherkin
    kind's default wip tag, and the delegated header lint's report read into
    problems with the footer rules run beside it. Reading the index and a
    commit is p2-go-source-trees, which internal/source lacks, so this task
    closes that item. No scenario runs check-message; the corpus judges it.
  done_when:
    - run: sh -c 'node tools/bin/build-go.ts dist/go && node tools/itos/conformance/run.ts --bin dist/go/itos --only tools/itos/conformance/messages.yaml'
      timeout: 600
    - run: node tools/selftest/go-port.ts
      timeout: 900

