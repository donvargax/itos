    order, --phase/--group/--pending, and task list's statuses from the
    registry.
  done_when:
    - run: sh -c 'node tools/bin/build-go.ts dist/go && node tools/itos/conformance/run.ts --bin dist/go/itos --only tools/itos/conformance/tasks.yaml'
      timeout: 600
    - run: sh -c 'node tools/bin/build-go.ts dist/go && ITOS_BIN="$PWD/dist/go/itos" go test ./features -count=1 -scenarios="^@ID-(TASK-0[1-4]|LEDGER-0[34]|CONFIG-(01|18))$"'
      timeout: 600
    - run: node tools/selftest/go-port.ts
      timeout: 900

- id: T-044
