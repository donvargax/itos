      timeout: 600
    - run: node tools/selftest/go-port.ts
      timeout: 900

- id: T-047
  type: refactor
  title: The Go verify and the built-in moves rule
  why: >
    PLAN.md, phase 2, steps 3 and 4: verify re-checks every non-merge commit
    of a range after commits.since (its message with the footers at that
    commit, its paths, the built-in moves rule against its parent), then each
    range check once, with the summary line agents quote; tests moves runs the
    moves rule on HEAD and the index by hand. Corpus: verify.yaml (moves.yaml
    joins with the hook group); scenarios: the ones that run verify or tests
    moves.
  done_when:
    - run: sh -c 'node tools/bin/build-go.ts dist/go && node tools/itos/conformance/run.ts --bin dist/go/itos --only tools/itos/conformance/verify.yaml'
      timeout: 600
    - run: sh -c 'node tools/bin/build-go.ts dist/go && ITOS_BIN="$PWD/dist/go/itos" go test ./features -count=1 -scenarios="^@ID-(SINCE-0[1238]|FOOT-04|CONFIG-04|MOVES-0[56])$"'
      timeout: 600
    - run: node tools/selftest/go-port.ts
      timeout: 900
