version: "2"
issues:
  # Every finding in one run.
  max-same-issues: 0
  max-issues-per-linter: 0
linters:
  # itos-cc's linters that today's tree passes unchanged (T-194); errcheck,
  # gosec, ineffassign, staticcheck (go tool staticcheck is its own step) and
  # revive's file-length-limit wait on the idea p1-lint-itos-cc-linters.
  default: none
  enable:
    # ADR-0053 (5): a context is the first parameter, never held in a
    # struct; the fixtures prove both refuse.
    - containedctx
    - depguard
    # A type switch over a sealed set (//sumtype:decl) names every kind.
    - gochecksumtype
    - govet
    - revive
    - unused
  settings:
    gochecksumtype:
      default-signifies-exhaustive: false
    # Only the rules listed run: revive's defaults stay off.
    revive:
      rules:
        - name: context-as-argument
    # ADR-0053's arrows, from itos-cc's .golangci.yml, adapted to this module.
    # They hold the slices moved so far (docs/plans/slices-and-ports.md) and
    # tools/testdata/architecture's fixtures; tools/bin/architecture-check
    # runs the fixtures and holds what depguard cannot: a slice importing
    # another, within a slice the domain and the adapters importing only the
    # domain, who imports a slice, and the binary linking a fake. A move whose
    # import a rule refuses extends the rule, with a fixture, never loosens
    # it.
    depguard:
      rules:
        # A slice, outside its domain and adapters, imports nothing of ours
        # but its own subpackages (architecture-check refuses another
        # slice's), internal/declare, which its command is declared by, the
        # engines, internal/out, through which its output goes and its usage
        # errors, the domain packages the commands share (T-243), and the
        # stores' ports and the VCS's, with their fakes for its tests
        # (slice-fakes keeps them out of its code). It reaches everything
        # else through the Ports it owns, which the assembly binds;
        # internal/cli is the assembly until the step that moves it into
        # cmd, so a slice importing it would cycle. A store's adapter, and
        # the VCS's, is the assembly's to bind, never a slice's to import,
        # as are git, the lock, the ID counter, the launcher and the shim.
        slice-packages:
          list-mode: lax
          files:
            - "**/internal/slices/**"
            - "!**/internal/slices/*/domain/**"
            - "!**/internal/slices/*/adapters/**"
          allow:
            - github.com/donvargax/itos/v8/internal/slices/
            - github.com/donvargax/itos/v8/internal/declare$
            - github.com/donvargax/itos/v8/internal/engine/
            - github.com/donvargax/itos/v8/internal/out$
            - github.com/donvargax/itos/v8/internal/adr$
            - github.com/donvargax/itos/v8/internal/ask$
            - github.com/donvargax/itos/v8/internal/check$
            - github.com/donvargax/itos/v8/internal/ci$
            - github.com/donvargax/itos/v8/internal/config$
            - github.com/donvargax/itos/v8/internal/draft$
            - github.com/donvargax/itos/v8/internal/glob$
            - github.com/donvargax/itos/v8/internal/guide$
            - github.com/donvargax/itos/v8/internal/kind$
            - github.com/donvargax/itos/v8/internal/ledger$
            - github.com/donvargax/itos/v8/internal/message$
            - github.com/donvargax/itos/v8/internal/nextid$
            - github.com/donvargax/itos/v8/internal/plan$
            - github.com/donvargax/itos/v8/internal/proof$
            - github.com/donvargax/itos/v8/internal/scope$
            - github.com/donvargax/itos/v8/internal/tests$
            - github.com/donvargax/itos/v8/internal/value$
            - github.com/donvargax/itos/v8/internal/version$
            - github.com/donvargax/itos/v8/internal/work$
            # The property tier's shared part, for a slice's tests alone:
            # proptest-tests-only refuses it, and rapid, in any code.
            - github.com/donvargax/itos/v8/internal/proptest$
            # Debt, not the design: these do I/O a slice should reach
            # through its Ports (the idea p1-slice-io-behind-ports).
            - github.com/donvargax/itos/v8/internal/providers$
            - github.com/donvargax/itos/v8/internal/release$
            - github.com/donvargax/itos/v8/internal/shell$
            - github.com/donvargax/itos/v8/internal/store/private/port$
            - github.com/donvargax/itos/v8/internal/store/private/port/porttest$
            - github.com/donvargax/itos/v8/internal/store/tree/port$
            - github.com/donvargax/itos/v8/internal/store/tree/port/porttest$
            - github.com/donvargax/itos/v8/internal/store/tracker/port$
            - github.com/donvargax/itos/v8/internal/store/tracker/port/porttest$
            - github.com/donvargax/itos/v8/internal/vcs/port$
            - github.com/donvargax/itos/v8/internal/vcs/port/porttest$
          deny:
            - pkg: github.com/donvargax/itos/v8
              desc: "a slice imports nothing of ours but its own subpackages, internal/declare, the engines, internal/out, the domain packages and the stores' and the VCS's ports (ADR-0053): reach the rest through its Ports; extend the rule, with a fixture, never loosen it"
        # A command's declaration (internal/declare), its tests with it, is a
        # leaf: it imports nothing of ours, so a slice and internal/cli both
        # import it with no cycle, and does no I/O, so declaring a command
        # costs help and version nothing.
        declare-leaf:
          files:
            - "**/internal/declare/**"
          deny:
            - pkg: github.com/donvargax/itos/v8
              desc: "a declaration imports nothing of ours (T-239): it is data a slice and internal/cli both import"
            - pkg: os
              desc: "a declaration reads nothing (T-239): the parser reads the config for the flags its More names"
            - pkg: net
              desc: "a declaration reads nothing (T-239): it is data, which help and version read"
        # A slice's code links no port's fake, which its tests alone may use:
        # slice-packages allows each store's porttest for the tests, so this
        # rule refuses it by name over the code. architecture-check --linked
        # refuses a binary linking any porttest.
        slice-fakes:
          files:
            - "**/internal/slices/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/store/private/port/porttest
              desc: "a slice's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/store/tree/port/porttest
              desc: "a slice's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/store/tracker/port/porttest
              desc: "a slice's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/vcs/port/porttest
              desc: "a slice's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
        # An engine (internal/engine/<name>) is what several commands share,
        # which no slice owns: a slice calls it, never the reverse. It, its
        # tests with it, imports no command, slice, store or VCS adapter,
        # launcher or shim; it takes the ports, which its caller binds, and
        # imports the rest of ours, another engine among them. A new engine
        # needs no new rule. No deny entry may prefix another
        # (TestNoDenyEntryPrefixesAnother).
        engines:
          list-mode: lax
          files:
            - "**/internal/engine/**"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/cli$
              desc: "an engine imports no command (ADR-0053): internal/cli calls the engine, never the reverse"
            - pkg: github.com/donvargax/itos/v8/internal/slices/
              desc: "an engine imports no slice (ADR-0053): a slice calls the engine; what several slices share moves into it"
            - pkg: github.com/donvargax/itos/v8/internal/store/private/adapter
              desc: "an engine imports no adapter (ADR-0053): take the private store's port, which the caller binds"
            - pkg: github.com/donvargax/itos/v8/internal/store/tree/adapter
              desc: "an engine imports no adapter (ADR-0053): take the tree reader's port, which the caller binds"
            - pkg: github.com/donvargax/itos/v8/internal/store/tracker/adapter
              desc: "an engine imports no adapter (ADR-0053): take the tracker's port, which the caller binds"
            - pkg: github.com/donvargax/itos/v8/internal/vcs/adapter
              desc: "an engine imports no adapter (ADR-0053): take the VCS port, which the caller binds"
            - pkg: github.com/donvargax/itos/v8/internal/launch$
              desc: "an engine imports no launcher (ADR-0053): the launcher runs commands, which call engines"
            - pkg: github.com/donvargax/itos/v8/internal/shim$
              desc: "an engine imports no shim (ADR-0053): the shim runs commands, which call engines"
        # An engine's code links no port's fake, which its tests alone may
        # use, as slice-fakes holds for a slice.
        engine-fakes:
          files:
            - "**/internal/engine/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/store/private/port/porttest
              desc: "an engine's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/store/tree/port/porttest
              desc: "an engine's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/store/tracker/port/porttest
              desc: "an engine's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/vcs/port/porttest
              desc: "an engine's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
        # The launcher and the git shim (internal/launch, internal/shim) run
        # before the command line, which cmd/itos hands them in a launch.CLI:
        # they, their tests with them, import no internal/cli (T-236).
        pre-dispatch:
          list-mode: lax
          files:
            - "**/internal/launch/**"
            - "**/internal/shim/**"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/cli$
              desc: "the launcher and the shim run before the command line (T-236): take what they need of it from the launch.CLI cmd/itos hands them"
        # A store's port and its fake (internal/store/<store>/port and
        # port/porttest), and the VCS's (internal/vcs/port), their tests
        # with them, import nothing of ours but the port and the fake: no
        # slice, engine, adapter or UI. A slice and the adapter import them,
        # never the reverse. The list names every port's, so it lets one
        # port import another's.
        store-ports:
          list-mode: lax
          files:
            - "**/internal/store/*/port/**"
            - "**/internal/vcs/port/**"
          allow:
            - github.com/donvargax/itos/v8/internal/store/private/port$
            - github.com/donvargax/itos/v8/internal/store/private/port/porttest$
            - github.com/donvargax/itos/v8/internal/store/tree/port$
            - github.com/donvargax/itos/v8/internal/store/tree/port/porttest$
            - github.com/donvargax/itos/v8/internal/store/tracker/port$
            - github.com/donvargax/itos/v8/internal/store/tracker/port/porttest$
            - github.com/donvargax/itos/v8/internal/vcs/port$
            - github.com/donvargax/itos/v8/internal/vcs/port/porttest$
          deny:
            - pkg: github.com/donvargax/itos/v8
              desc: "a store's or the VCS's port and its fake import nothing of ours but the port and the fake (ADR-0053); extend the rule, with a fixture, never loosen it"
        # A port and its fake do no I/O in their code: the fake keeps its
        # state in memory. The adapter does the I/O; tests may read fixtures.
        store-ports-io:
          files:
            - "**/internal/store/*/port/**"
            - "**/internal/vcs/port/**"
            - "!$test"
          deny:
            - pkg: os
              desc: "a port and its fake do no I/O (ADR-0053): the fake keeps its state in memory, the adapter reaches the disk"
            - pkg: net
              desc: "a port and its fake do no I/O (ADR-0053): the fake keeps its state in memory, the adapter reaches the network"
        # A store's adapter (internal/store/<store>/adapter), and the VCS's
        # (internal/vcs/adapter), wraps the libraries it needs (git, the
        # lock, the config's folder) and serves every slice through the
        # assembly: its code imports no slice and links no fake. Its tests
        # run the port's contract suite, the fake's package with it.
        store-adapters:
          files:
            - "**/internal/store/*/adapter/**"
            - "**/internal/vcs/adapter/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/slices/
              desc: "a store's adapter imports no slice (ADR-0053): the assembly binds it to a slice's Ports"
            - pkg: github.com/donvargax/itos/v8/internal/store/private/port/porttest
              desc: "a store's adapter's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/store/tree/port/porttest
              desc: "a store's adapter's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/store/tracker/port/porttest
              desc: "a store's adapter's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
            - pkg: github.com/donvargax/itos/v8/internal/vcs/port/porttest
              desc: "a store's adapter's code links no fake (ADR-0053): a port's fake enters only through _test.go files"
        # git runs in the VCS's git adapter alone (internal/vcs/adapter):
        # internal/git is its internals, which no other package's code
        # imports, a test's setup may. A slice and a port are refused it by
        # their own rules.
        git-internals:
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!**/internal/git/**"
            - "!**/internal/vcs/adapter/**"
            - "!**/internal/slices/**"
            - "!**/internal/store/*/port/**"
            - "!**/internal/vcs/port/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/git
              desc: "git runs in the VCS's git adapter alone (T-218): ask the VCS port (internal/vcs/port), or the adapter at the assembly"
        # The lock (internal/lock) is the stores' internals: a store's
        # adapter takes it for its port's Hold, and internal/idcounter for
        # its counter. No other package's code imports it, a test's setup
        # may. A slice and a port are refused it by their own rules.
        lock-internals:
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!**/internal/lock/**"
            - "!**/internal/store/*/adapter/**"
            - "!**/internal/idcounter/**"
            - "!**/internal/slices/**"
            - "!**/internal/store/*/port/**"
            - "!**/internal/vcs/port/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/lock
              desc: "the lock is the store adapters' alone (T-226): take it through a store port's Hold, the private store's or the tracker's"
        # The ID counter (internal/idcounter) is the tracker store's
        # adapter's internals, which reserves through it for the port's
        # Reserve. No other package's code imports it, a test's setup may.
        # A slice and a port are refused it by their own rules.
        idcounter-internals:
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!**/internal/idcounter/**"
            - "!**/internal/store/tracker/adapter/**"
            - "!**/internal/slices/**"
            - "!**/internal/store/*/port/**"
            - "!**/internal/vcs/port/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/idcounter
              desc: "the ID counter is the tracker adapter's alone (T-227): reserve through the tracker port's Reserve"
        # A slice's domain, its tests and subpackages with it, imports nothing
        # of ours outside internal/slices: no UI, engine, adapter or cmd. It
        # reaches the outside through its port.
        slice-domain:
          list-mode: lax
          files:
            - "**/internal/slices/*/domain/**"
          allow:
            - github.com/donvargax/itos/v8/internal/slices/
          deny:
            - pkg: github.com/donvargax/itos/v8
              desc: "a slice's domain imports nothing of ours outside internal/slices (ADR-0053): reach the outside through its port; extend the rule, with a fixture, never loosen it"
        # The domain's own code does no I/O; its tests may read fixtures.
        slice-domain-io:
          files:
            - "**/internal/slices/*/domain/**"
            - "!$test"
          deny:
            - pkg: os
              desc: "a slice's domain does no I/O (ADR-0053): do it in an adapter behind the domain's port"
            - pkg: net
              desc: "a slice's domain does no I/O (ADR-0053): reach networks from an adapter behind the domain's port"
        # An adapter's code imports nothing of ours outside internal/slices:
        # of its slice, the domain it serves (architecture-check holds that).
        # Its tests may use the port's fake.
        slice-adapters:
          list-mode: lax
          files:
            - "**/internal/slices/*/adapters/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos/v8/internal/slices/
          deny:
            - pkg: github.com/donvargax/itos/v8
              desc: "an adapter imports nothing of ours but its slice's domain and the libraries its rule allows (ADR-0053); extend the rule, with a fixture, never loosen it"
        # The property tier (internal/proptest, ADR-0051) and rapid are for
        # tests: no package's code imports them but internal/proptest, which
        # wraps rapid (p1-proptest-depguard).
        proptest-tests-only:
          files:
            - $all
            - "!$test"
            - "!**/internal/proptest/**"
          deny:
            - pkg: github.com/donvargax/itos/v8/internal/proptest$
              desc: "the property tier is for tests (ADR-0051): internal/proptest enters only through _test.go files"
            - pkg: pgregory.net/rapid
              desc: "rapid is for tests (ADR-0051): only internal/proptest, which wraps it, and _test.go files import it"
        mocks:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "no mocking library: write an in-memory fake of the port in its porttest package"
            - pkg: go.uber.org/mock
              desc: "no mocking library: write an in-memory fake of the port in its porttest package"
            - pkg: github.com/stretchr/testify/mock
              desc: "no mocking library: write an in-memory fake of the port in its porttest package"
            - pkg: github.com/vektra/mockery
              desc: "no mocking library: write an in-memory fake of the port in its porttest package"
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: "no mocking library: write an in-memory fake of the port in its porttest package"
formatters:
  enable:
    - gofmt
