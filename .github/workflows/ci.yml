name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # the last green run, where a push's range starts
  issues: read # the consumer inbox, tools/bin/inbox.ts, which T-057's check runs

# A newer push replaces a run still waiting for the runner; a running one
# finishes. The newest run checks every commit since the last green one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  TO: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # One job, always run, always reported: a prose-only push still gets its
  # green check, it just has less to prove. What each range has to run is
  # decided by `tools/bin/itos ci run` (itos.yaml's `ci`), so it is the same
  # decision locally.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit re-check and the scope read the pushed range
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: "24"
          cache: true
      # Go for itos itself and the features' steps (godog), the version go.mod's
      # toolchain line pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # tools/bin/itos runs the Go binary, built here once into .tools/bin/ and
      # stamped with the version git describe gives the commit (tools/bin/dev-version):
      # every later call in the job finds it current and runs it without building.
      - name: Build itos
        run: tools/bin/itos version
      - run: vp install
      # Where the range starts, computed once for every step below: a pull
      # request's base, else the last green run on main, else empty (run
      # everything). See `tools/bin/itos ci range --help`.
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          range=$(tools/bin/itos ci range --head "$TO" --base "$BASE")
          echo "$range"
          echo "$range" >> "$GITHUB_ENV"
      # The commit-msg hook's rules again, for commits made without hooks.
      - run: tools/bin/itos verify "$FROM" "$TO"
      # actionlint, for the task checks that lint the workflows: the runners
      # don't carry it. Pinned, from its own release script.
      - name: actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Claude Code, for the task checks that run it (T-066's claude plugin validate and claude
      # plugin test, which need no login): the latest release, unpinned, since it releases several
      # times a day and the latest is what a person runs, from its own native installer. Only when
      # the plan will run a claude check, as it is an 86 MB download that most pushes never use.
      # The step is handed no token and the job's permissions stay read-only.
      - name: Claude Code
        run: |
          if tools/bin/itos ci plan --json "$FROM" "$TO" |
            jq -e 'any(.order[]; .action == "run" and ((.check.command // "") | startswith("claude ")))' >/dev/null; then
            curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
            bash "$RUNNER_TEMP/claude-install.sh" latest
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/claude" --version
          else
            echo "No check in this run needs Claude Code."
          fi
      # Every gate lives in one local command. Its features step is one go test
      # run over the smoke set and the scenarios and task subsets the range
      # names; the whole suite runs in nightly.yml. GH_TOKEN is for the task
      # checks that ask GitHub.
      - run: tools/bin/itos ci run "$FROM" "$TO"
        env:
          GH_TOKEN: ${{ github.token }}

  # The unit tests and every feature on Linux, macOS and Windows (T-072): itos built natively on
  # each runner and run as a person on that platform meets it, with that platform's git, shell and
  # paths. The release archives are cross-compiled on Linux (T-069); this is what runs them. It
  # blocks, and the release job needs it, so a platform break stops a release as every other check
  # of a push does. The job's name holds the runner's OS word, which T-072's check reads.
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git for Windows' bash on windows
    steps:
      # Every action pinned to a commit, each release at least 7 days old when pinned (T-067's
      # rule), as release.yml pins them: actions/checkout v4.4.0, actions/setup-go v7.0.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags, for the version the build is stamped with
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The build tools/bin/itos makes, stamped with tools/bin/dev-version's version, but written
      # where the features find it on every platform: ITOS_BIN, itos.exe on windows, since Go runs
      # no shell script there and tools/bin/itos is one.
      - name: Build itos
        id: build
        run: |
          exe=""
          [ "$RUNNER_OS" != Windows ] || exe=.exe
          bin="$RUNNER_TEMP/itos/itos$exe"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/donvargax/itos/v2/internal/version.stamp=$(tools/bin/dev-version)" \
            -o "$bin" ./cmd/itos
          "$bin" version
          echo "ITOS_BIN=$bin" >> "$GITHUB_ENV"
      - name: Unit tests
        run: go test ./cmd/... ./internal/...
      # After the unit tests whatever they said, so one run shows a platform's every failure.
      - name: Features
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: go test ./features -count=1

  # A push to main whose ci job and platform jobs are green cuts a release when its commits since
  # the last tag carry a feat, a fix or a breaking change (T-069; release.yml says how). The only
  # job with write access, granted here and to nothing else; a pull request never releases.
  release:
    needs: [ci, platform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
