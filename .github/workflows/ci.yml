name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # the last green run, where a push's range starts, and a merged pull request's head's run
  pull-requests: read # the pull request a push to main merged, for the trust ci-repo gives its green head

# On main a newer push replaces only a run still waiting; a running one finishes, and the
# newest run checks every commit since the last green one. On a pull request a newer head
# cancels the older run, since only the head's run is judged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TO: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # One job, run and reported for every push and every pull request but a draft's
  # (nothing judges a draft; marking it ready runs this on the same head): a
  # prose-only push still gets its green check, it just has less to prove. What each range has to run is
  # decided by `go run ./tools/bin/ci-repo run` using itos.yaml, so it is the same
  # decision locally, including registry-only changes without named requirements.
  ci:
    name: ci (ubuntu-latest)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit re-check and the scope read the pushed range
      # Go for itos itself and the features' steps (godog), the version go.mod's
      # toolchain line pins.
      - uses: ./.github/actions/go-toolchain
      # tools/bin/itos runs the Go binary, built here once into .tools/bin/ and
      # stamped with the version git describe gives the commit (tools/bin/dev-version):
      # every later call in the job finds it current and runs it without building.
      - name: Build itos
        run: tools/bin/itos version
      # dprint, for the plan's format step (T-142): fetched and checked against the SHA-256
      # tools/bin/pinned holds, and its plugins against those dprint.json holds, here, so the step
      # itself asks no network.
      - name: dprint
        run: tools/bin/pinned dprint output-resolved-config > /dev/null
      # golangci-lint, for the plan's lint and architecture-check steps (T-194), fetched and
      # checked here as dprint is, so neither step asks the network.
      - name: golangci-lint
        run: tools/bin/pinned --path golangci-lint > /dev/null
      # Where the range starts, computed once for every step below: a pull
      # request's base, else the last green run on main, else empty (run
      # everything). See `tools/bin/itos ci range --help`. Read from --json, since
      # only machine output is itos's contract (decision 35, T-100); jq fails the
      # step when the output has no string "from".
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(tools/bin/itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(go run ./tools/bin/ci-repo scope "$FROM" "$TO")
          echo "$out"
          full=$(jq -er '.full | tostring' <<<"$out")
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Validation-only range
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'This range needs metadata validation only; the scope above says why.'
      # The commit-msg hook's rules again, for commits made without hooks.
      - run: tools/bin/itos verify "$FROM" "$TO"
      # actionlint, for the step of the plan that lints the workflows: the
      # runners don't carry it. Pinned, from its own release script.
      - name: actionlint
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Every gate lives in one local command. Its features step is one go test
      # run over the smoke set and the scenarios and task subsets the range
      # names; the whole suite runs in nightly.yml. GH_TOKEN is for the task
      # checks that ask GitHub.
      - name: Plan
        run: go run ./tools/bin/ci-repo run "$FROM" "$TO"
        env:
          GH_TOKEN: ${{ github.token }}

      # The global itos as a consumer's CI gets it, from this repository's own action (T-093),
      # proved on every platform by every full push, and cached per release by it (T-127), so a push
      # after the one that installed that release fetches no launcher archive at all. Last, so the
      # launcher it puts on the PATH cannot stand in for the build the steps above test; this
      # repository pins nothing, so the launcher runs as itself and says its own version.
      - name: Install the launcher
        id: launcher
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' }}
        uses: ./
      - name: The launcher
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' && steps.launcher.outcome == 'success' }}
        run: |
          command -v itos
          out=$(itos version --json)
          echo "$out"
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+")' <<<"$out"

  # What the platform jobs below run is decided once, here, from itos.yaml's ci.jobs (slice 202): a
  # range that touches none of the paths the platform jobs judge (a registry or ledger commit, a
  # plugin script) skips them, and they report as skipped, which GitHub reads as a success for a
  # required check. Its if: is the ci job's, so a draft's run skips it with the rest. A planner
  # that fails or is skipped never skips them: they run, as every push's did.
  plan:
    name: plan
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.jobs.outputs.platform }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the range's commits, and the tags for the version itos is stamped with
      - uses: ./.github/actions/go-toolchain
      - name: Build itos
        run: tools/bin/itos version
      # Where the range starts, as the ci job's Range step reads it.
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(tools/bin/itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      # Whether the range has more than metadata to validate, as the platform jobs' Scope step reads
      # it: the platform jobs run nothing else on a range that needs validation only.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(go run ./tools/bin/ci-repo scope "$FROM" "$TO")
          echo "$out"
          full=$(jq -er '.full | tostring' <<<"$out")
          echo "full=$full" >> "$GITHUB_OUTPUT"
      # Whether the range runs the platform jobs: ci plan --json's jobs.platform.runs, true when
      # itos.yaml's ci.jobs does not declare the job.
      - name: Jobs
        id: jobs
        run: |
          out=$(tools/bin/itos ci plan "$FROM" "$TO" --json)
          jq -c '.jobs' <<<"$out"
          platform=$(jq -er 'if .jobs.platform then .jobs.platform.runs else true end | tostring' <<<"$out")
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

  # The unit tests and the range's named tests on macOS and Windows (T-072, T-163): itos
  # built natively on each runner and run as a person on that platform meets it, with that
  # platform's git, shell and paths. The release archives are cross-compiled on Linux (T-069); this
  # is what runs them. It blocks, and the release job needs it, so a platform break stops a release
  # as every other check of a push does. Every feature on the three platforms is the nightly's
  # (nightly.yml's platform jobs), so a push waits for the scenarios the ci job runs, not for the
  # whole suite on Windows. Linux runs these once in ci above, including the launcher check
  # (T-170); the nightly requires all three named jobs to succeed and proves their scope.
  #
  # Two jobs and not one matrix, since a job-level if: is evaluated before the matrix is applied:
  # a skipped matrix job reports one check named "platform (${{ matrix.os }})", never the required
  # "platform (macos-latest)" and "platform (windows-latest)", which would stay pending. They skip
  # when the planner succeeded and said the range touches no platform path or needs validation
  # only (slice 202). Their steps differ in their runner alone; tools/selftest/ci-platform holds
  # them to each other, and the steps the nightly reads by name (Validation-only range, Unit tests,
  # Named tests, Install the launcher, The launcher) stay here and not in the shared action.
  platform-macos:
    name: platform (macos-latest)
    needs: [plan]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || (needs.plan.outputs.platform != 'false' && needs.plan.outputs.full != 'false')) }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      # Every action pinned to a commit, each release at least 7 days old when pinned (T-067's
      # rule), as release.yml pins them: actions/checkout v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags, for the version the build is stamped with, and the range's commits
      - uses: ./.github/actions/platform-build
      # Scope is computed independently on each runner: code jobs stay concurrent with Linux.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(go run ./tools/bin/ci-repo scope "$FROM" "$TO")
          echo "$out"
          full=$(jq -er '.full | tostring' <<<"$out" | tr -d '\r')
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Validation-only range
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'This range needs metadata validation only; the scope above says why.'
      - name: Unit tests
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: go test ./cmd/... ./internal/...
      # After the unit tests whatever they said, so one run shows a platform's every failure. The
      # plan's one run of named tests alone (slice-132): the smoke set and the scenarios and task
      # subsets the range names, the ci job's own features step, here on this platform. Its command
      # is the config's, so it takes no -timings: where the features spend their time on each
      # platform is the nightly's summary. The scenarios find the build through ITOS_BIN, which ci
      # run hands on to go test with the rest of the job's environment.
      - name: Named tests
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/bin/ci-repo tests "$FROM" "$TO"
      # The global itos as a consumer's CI gets it, from this repository's own action (T-093),
      # proved on every platform by every full push, and cached per release by it (T-127), so a push
      # after the one that installed that release fetches no launcher archive at all. Last, so the
      # launcher it puts on the PATH cannot stand in for the build the steps above test; this
      # repository pins nothing, so the launcher runs as itself and says its own version.
      - name: Install the launcher
        id: launcher
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' }}
        uses: ./
      - name: The launcher
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' && steps.launcher.outcome == 'success' }}
        run: |
          command -v itos
          out=$(itos version --json)
          echo "$out"
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+")' <<<"$out"

  # platform-macos above, on Windows.
  platform-windows:
    name: platform (windows-latest)
    needs: [plan]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || (needs.plan.outputs.platform != 'false' && needs.plan.outputs.full != 'false')) }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Git for Windows' bash on windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags, for the version the build is stamped with, and the range's commits
      - uses: ./.github/actions/platform-build
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(go run ./tools/bin/ci-repo scope "$FROM" "$TO")
          echo "$out"
          full=$(jq -er '.full | tostring' <<<"$out" | tr -d '\r')
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Validation-only range
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'This range needs metadata validation only; the scope above says why.'
      - name: Unit tests
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: go test ./cmd/... ./internal/...
      - name: Named tests
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/bin/ci-repo tests "$FROM" "$TO"
      - name: Install the launcher
        id: launcher
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' }}
        uses: ./
      - name: The launcher
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' && steps.launcher.outcome == 'success' }}
        run: |
          command -v itos
          out=$(itos version --json)
          echo "$out"
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+")' <<<"$out"

  # A push to main whose ci job and platform jobs are green cuts a release when its commits since
  # the last tag carry a feat, a fix or a breaking change (T-069; release.yml says how). The only
  # job with write access, granted here and to nothing else; a pull request never releases. A
  # platform job the planner skipped does not skip it: a fix to the plugin's Markdown touches no
  # platform path and still releases. A failed or cancelled job does.
  release:
    needs: [ci, platform-macos, platform-windows]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
