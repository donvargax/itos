name: Nightly

# Every feature, on Linux, macOS and Windows. A push's CI runs the smoke set
# and the scenarios and task subsets its commits name, on each platform; every
# scenario runs here, once a night on main, or by hand from the Actions tab
# (workflow_dispatch), in the platform jobs (T-163). Beside them the nightly
# job runs the gates self-test, which a push's CI leaves to the nightly, and
# the steps ci.nightly holds that a push does not (itos.yaml's `ci.nightly`):
# the hostile-PATH runs, the two coverage runs, the plugin's own Claude Code
# checks. When they are done, the report job reads how each ended: a red job
# opens one issue, "Nightly red", or comments on the open one; a night whose
# every job is green closes it. A push's CI opens nothing.
on:
  schedule:
    - cron: "44 11 * * *" # 11:44 UTC every day
  workflow_dispatch:

permissions:
  contents: read # the newest release's assets and checksums.txt, which the plan's release step reads
  actions: read # the newest completed CI run's platform jobs, which the plan's last step reads

# A group of its own: the nightly never cancels a push's run, nor is cancelled
# by one. A second nightly waits for the first.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      # The whole history, as ci.yml has: `itos config check` finds the commit
      # commits.since names.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Go for itos itself and the features' steps (godog), the version go.mod's
      # toolchain line pins.
      - uses: ./.github/actions/go-toolchain
      # tools/bin/itos runs the Go binary, built here once into .tools/bin/ and
      # stamped with the version git describe gives the commit (tools/bin/dev-version):
      # every later call in the job finds it current and runs it without building.
      - name: Build itos
        run: tools/bin/itos version
      # Claude Code, for the two plugin steps of ci.nightly (claude plugin validate --strict on the
      # marketplace and on the plugin, and claude plugin test, which need no login): the latest
      # release, unpinned, since it releases several times a day and the latest is what a person
      # runs, from its own native installer. Unconditional, as those steps are in every night's
      # plan (T-125); ci.yml's push plan no longer names a claude check, so it installs none.
      # The step is handed no token and the job's permissions stay read-only.
      - name: Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
          bash "$RUNNER_TEMP/claude-install.sh" latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
      # The GitHub CLI, for the plan's last step, which reads the newest completed
      # CI run's platform jobs. Pinned, from its release tarball, checked against
      # the release's SHA-256, so the runner image's own copy, whatever its
      # version, does not decide what runs. The report job installs the same one.
      - name: GitHub CLI
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          mv "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$tgz" "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version
      # go test's `--- FAIL: TestFeatures/…` lines in this step's log are the
      # failing scenarios the report job copies into the issue.
      - name: Nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/bin/itos ci run --nightly

  # The unit tests and every feature on Linux, macOS and Windows (T-072's platform jobs, moved here
  # by T-163, where a push's own platform jobs now run the range's named tests): itos built natively
  # on each runner, as ci.yml's platform job builds it, and run as a person on that platform meets
  # it. On Linux this is the night's every-feature run; the nightly job's plan runs them again only
  # with something hostile first on the PATH. Actions pinned as ci.yml's platform job pins them.
  #
  # Windows runs the features in shards, one job for each (T-308): its process starts cost several
  # times what Linux's do, the suite ran 264 s, then 494 s, then past go test's 600 s with nothing
  # broken. A shard is the share i of n of the scenarios (-shard=i/n, features/shard_test.go);
  # n is the shard count of every entry of the platform, and tools/selftest/ci-platform holds the
  # shards of each platform to a complete set.
  platform:
    name: platform (${{ matrix.os }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest, shard: 1/2 }
          - { os: windows-latest, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git for Windows' bash on windows
    steps:
      # actions/checkout v4.4.0, as ci.yml's platform job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags, for the version the build is stamped with
      - uses: ./.github/actions/go-toolchain
      # As ci.yml's platform job: the build tools/bin/itos makes, written where the features find
      # it on every platform, ITOS_BIN, itos.exe on windows.
      - name: Build itos
        id: build
        run: |
          exe=""
          [ "$RUNNER_OS" != Windows ] || exe=.exe
          bin="$RUNNER_TEMP/itos/itos$exe"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/donvargax/itos/v8/internal/version.stamp=$(tools/bin/dev-version)" \
            -o "$bin" ./cmd/itos
          "$bin" version
          echo "ITOS_BIN=$bin" >> "$GITHUB_ENV"
      # Once a platform, in its first shard.
      - name: Unit tests
        if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
        run: go test ./cmd/... ./internal/...
      # After the unit tests whatever they said, so one run shows a platform's every failure.
      # -timings writes where the run spent its time (features/timings_test.go, T-115), which the
      # next step prints, so a platform that slows down says what it pays for.
      - name: Features
        id: features
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: go test ./features -count=1 ${SHARD:+-shard=$SHARD} -timings="$RUNNER_TEMP/features-timings.txt"
      - name: Where the features spent their time
        if: ${{ !cancelled() && (steps.features.outcome == 'success' || steps.features.outcome == 'failure') }}
        run: |
          f="$RUNNER_TEMP/features-timings.txt"
          [ -f "$f" ] || { echo "The features wrote no timings."; exit 0; }
          cat "$f"
          { echo "### Features on ${{ matrix.os }} ${{ matrix.shard }}"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The Nightly red issue, from one job once every other is done, so two red jobs never race to
  # open two issues. Red, any job not green: one open issue labelled nightly-red, opened by the
  # first red run and commented on by every later one, naming the run's URL and, for each red job,
  # what its log says it failed at (tools/bin/nightly-report, T-185): its failing scenarios, the
  # plan's failed steps with their exit codes and the sites each failed mutation step found, and,
  # when the runner shut down or the run was cancelled, the step it stopped in. A job whose log
  # names none of these failed outside them, and the issue says so. The label is created on the
  # first red run. Green, every job green: the open issue is closed, naming the run. A cancelled
  # run reports nothing.
  report:
    needs: [nightly, platform]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout, for tools/bin/nightly-report
      actions: read # the run's jobs and their logs
      issues: write # the Nightly red issue
    steps:
      # actions/checkout v4.4.0, as the platform job; Go to run tools/bin/nightly-report.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/go-toolchain
      # As the nightly job installs it.
      - name: GitHub CLI
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          mv "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$tgz" "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version
      # The body is tools/bin/nightly-report's, from each red job of this attempt and its log.
      - name: Open or comment on the Nightly red issue
        if: ${{ needs.nightly.result != 'success' || needs.platform.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/nightly-red.md"
          go run ./tools/bin/nightly-report -repo "$GH_REPO" -run "$RUN_ID" -attempt "$RUN_ATTEMPT" -url "$RUN_URL" > "$body"
          cat "$body"
          gh label create nightly-red --description "The nightly run is red" --color B60205 2>/dev/null || true
          open=$(gh issue list --label nightly-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Commenting on issue #$open"
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --title "Nightly red" --label nightly-red --body-file "$body"
          fi
      # Green: close the open nightly-red issue, naming this run; with none open, nothing.
      - name: Close the Nightly red issue
        if: ${{ needs.nightly.result == 'success' && needs.platform.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label nightly-red --state open --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            echo "No open nightly-red issue"
            exit 0
          fi
          gh issue close "$open" --comment "Nightly run $RUN_URL is green."
