name: Release

# The release, cut by CI (T-069): ci.yml calls this after its ci job passes on a push to main, and
# it releases when the commits since the last vX.Y.Z tag carry a feat, a fix or a breaking change.
# The tag is the version, computed from those commits (tools/bin/release-version): a breaking
# change a major, a feat a minor, a fix a patch; with none, nothing is released and the job ends
# green. Its one gate of its own is that version against go.mod's module path (T-089): a major
# the path does not end in (/vN from v2, nothing below) fails the version step, before any tag,
# since Go's module proxy would refuse that tag; and a path ahead of the last release's major
# (/v7 after v6.5.1) promises that major, so any feat, fix or breaking change cuts it (T-123),
# where a v6 version would be refused. While tools/bin/release-version/prerelease says rc
# (T-118, T-119), the commits that would cut the next major cut a candidate of it, vN.0.0-rc.<n>
# (release-version says prerelease=true), which is published as a pre-release and never as latest:
# GitHub's latest release, which the launcher's update notice and a bare itos pin read, stays the
# newest stable one, as go install @latest does by Go's own rule (a pre-release version is never
# @latest while a release exists), and itos pin <rc> pins a candidate. Otherwise the push's CI,
# with the schema contract (T-070) and the last release's scenarios and corpus (T-071), is what a
# release rests on, and a break that slips through is a missing check, fixed forward with the
# check and a fix release.
#
# What it publishes is what the launcher, a pin, go install and a consumer's install script read
# (docs/decisions/0022-itos-is-distributed-as-release-archives-with-checksums-installed-pinned.md;
# .goreleaser.yaml): the five archives, itos.schema.json and checksums.txt; and upgrading.json,
# the Upgrading section as data, which itos upgrade reads of every release since a project's pin
# (T-091). In order, all in this one job, since a tag pushed with the workflow's token starts no
# other workflow:
#   1. the version; nothing more when there is none;
#   2. the tag, made locally only;
#   3. GoReleaser (tools/bin/pinned, at the version pinned there) builds, packs and uploads a draft
#      release whose target is this commit;
#   4. the archives and the schema are attested (Sigstore, no keys), and the attestation is
#      verified here on the archive just built, `gh attestation verify <file> -R donvargax/itos`,
#      which takes a file and never a digest, so it belongs where the bytes are (T-127);
#   5. the notes are generated (tools/bin/release-notes: git-cliff over the range, every
#      Upgrading: and Changes: footer, the config's changes, the install lines and the pin filled
#      from checksums.txt), and upgrading.json beside them (release-notes -json: the same
#      breaking changes, footers and config changes, and previous, the last release);
#   6. upgrading.json is uploaded to the draft, then the draft is published with those notes,
#      which is when GitHub creates the tag, so the tag and a release holding every asset appear
#      together. upgrading.json is not in checksums.txt, so neither attested nor read by a pin:
#      itos only prints it. The upload replaces an asset already there, and the publish is
#      retried, so a GitHub 5xx (bug-143: a 500 left v8.25.0 a draft with its tag made, and
#      schema-contract 404 on it) does not leave the release half-made. A run that fails before
#      GitHub makes the tag leaves only a draft the next run replaces, and a rerun of the job
#      completes it; once the tag is made, a run that still fails leaves a draft that nothing
#      reruns (the next run computes from that tag), to publish by hand,
#      `gh release edit <tag> --draft=false`, which schema-contract names when it finds the
#      release a 404; a tag is never moved;
#   7. proxy.golang.org is asked for the new version, so go install finds it at once (T-165).
# The releaser never commits: the notes are the release's description, not a file.
on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    # The only job given write access: the release and its assets, the OIDC token Sigstore signs
    # with, and the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # One at a time, never cancelled, so pushes in a row cut their releases in order. ci.yml's
    # runs on main already wait for each other; this holds even if that changes.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Every action pinned to a commit, each release at least 7 days old when pinned (T-067's
      # rule): actions/checkout v4.4.0,
      # actions/attest-build-provenance v4.2.2.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags and the commits since the last one
      - uses: ./.github/actions/go-toolchain
      - name: Version
        id: version
        run: |
          go run ./tools/bin/release-version > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/version.txt"
      # The GitHub CLI, to publish the draft: pinned from its release tarball and checked against
      # its SHA-256, as nightly.yml installs it, so the runner's own copy does not decide what runs.
      - name: GitHub CLI
        if: steps.version.outputs.next != ''
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          mv "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$tgz" "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version
      # Local only: GoReleaser reads the version from it, and GitHub creates the remote tag when the
      # draft is published.
      - name: Tag
        if: steps.version.outputs.next != ''
        env:
          TAG: v${{ steps.version.outputs.next }}
        run: git tag "$TAG" "$GITHUB_SHA"
      - name: GoReleaser
        if: steps.version.outputs.next != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/bin/pinned goreleaser release --clean
      # checksums.txt lists every archive and the schema by name and SHA-256: each is a subject.
      - name: Attest
        if: steps.version.outputs.next != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/goreleaser/checksums.txt
      # The attestation is verified here, where the bytes it signs are, on the archive just built
      # and not on a copy fetched from GitHub (T-127): `gh attestation verify` takes the file or
      # an image, never a digest, so the nightly used to download the newest release's 4.5 MB
      # linux-amd64 archive every night to check the same thing, and the nightly now holds the
      # release to its digests instead. Retried a few times, as the attestation takes a moment to
      # be readable after the action writes it.
      - name: Verify the attestation
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          archive="dist/goreleaser/itos-$NEXT-linux-amd64.tar.gz"
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify "$archive" -R donvargax/itos; then
              exit 0
            fi
            echo "attempt $attempt: the attestation is not readable yet"
            sleep 10
          done
          exit 1
      - name: Notes
        if: steps.version.outputs.next != ''
        env:
          LAST: ${{ steps.version.outputs.last }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          go run ./tools/bin/release-notes -version "$NEXT" -from "$LAST" \
            -checksums dist/goreleaser/checksums.txt > "$RUNNER_TEMP/notes.md"
          go run ./tools/bin/release-notes -json -version "$NEXT" -from "$LAST" \
            > "$RUNNER_TEMP/upgrading.json"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.next }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        # The asset is named after the file, upgrading.json; it goes up while the release is a
        # draft, so the release is never seen without it, and --clobber lets a rerun that failed
        # after the upload go up again. A candidate is published as a pre-release and explicitly
        # not latest; any other release as latest. The publish is retried a few times, as the
        # attestation check is: GitHub answers it with a 5xx now and then, even after it has made
        # the tag.
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/upgrading.json" --clobber
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false "${flags[@]}"; then
              exit 0
            fi
            echo "attempt $attempt: the release is not published yet"
            sleep 10
          done
          echo "::error::$TAG is still a draft: publish it by hand with gh release edit $TAG --draft=false"
          exit 1
      # proxy.golang.org caches a module's version list and @latest and refreshes them on its own
      # schedule, so go install ...@latest lagged each new release by a while (T-165). Asking the
      # proxy for the new version is what makes it fetch the tag at once; @latest follows later.
      # The module path is go.mod's, so the next major needs no edit here (it is all lower case,
      # which the proxy's path takes as is). The release is published by now, so a proxy that
      # never answers is a warning and never fails the job.
      - name: Ask the Go module proxy for the version
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          module=$(go list -m)
          url="https://proxy.golang.org/$module/@v/v$NEXT.info"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$url"; then
              echo
              exit 0
            fi
            echo "attempt $attempt: the proxy has no $module@v$NEXT yet"
            sleep 10
          done
          echo "::warning::proxy.golang.org did not answer for $module@v$NEXT; go install fetches it on first use, and @latest may lag"
          exit 0
