name: Pinned Go toolchain
description: Select and verify go.mod's exact toolchain using hosted Go and cache its downloads.
# Use Go's checksum-verified toolchain download instead of the setup-go archive, which runner
# setup repeatedly failed to fetch (T-172). Share this bootstrap across CI, nightly and release.
runs:
  using: composite
  steps:
    - name: Go toolchain
      id: go
      shell: bash
      run: |
        toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod | tr -d '\r')
        if [[ ! "$toolchain" =~ ^go[0-9]+\.[0-9]+(\.[0-9]+|rc[0-9]+|beta[0-9]+)$ ]]; then
          echo 'go.mod must name one exact Go toolchain' >&2
          exit 1
        fi
        echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
        case "$RUNNER_ARCH" in
          ARM64) cache_arch=arm64; host_arch=arm64 ;;
          X64) cache_arch=x64; host_arch=amd64 ;;
          *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        # macOS caches Go without putting it on PATH. Use the tool-cache layout and
        # completion marker that actions/tool-cache uses, restricted to the native arch.
        if ! command -v go >/dev/null; then
          for bin in "$RUNNER_TOOL_CACHE"/go/*/"$cache_arch"/bin; do
            [ -f "${bin%/bin}.complete" ] || continue
            if [ -x "$bin/go" ] || [ -x "$bin/go.exe" ]; then
              export PATH="$bin:$PATH"
              echo "$bin" >> "$GITHUB_PATH"
              break
            fi
          done
        fi
        command -v go >/dev/null || { echo 'No native bootstrap Go found' >&2; exit 1; }
        actual_arch=$(GOTOOLCHAIN=local go env GOHOSTARCH | tr -d '\r')
        [ "$actual_arch" = "$host_arch" ] || { echo "Go architecture $actual_arch is not $host_arch" >&2; exit 1; }
        # Read cache paths with the bundled Go before restoring the selected toolchain cache.
        mod=$(GOTOOLCHAIN=local go env GOMODCACHE | tr -d '\r')
        build=$(GOTOOLCHAIN=local go env GOCACHE | tr -d '\r')
        echo "mod=$mod" >> "$GITHUB_OUTPUT"
        echo "build=$build" >> "$GITHUB_OUTPUT"
    - name: Go cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0, as action.yml
      with:
        path: |
          ${{ steps.go.outputs.mod }}
          ${{ steps.go.outputs.build }}
        key: go-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
    - name: Verify Go toolchain
      shell: bash
      run: |
        actual=$(go env GOVERSION | tr -d '\r')
        if [ "$actual" != "$GOTOOLCHAIN" ]; then
          echo "Go selected $actual, expected $GOTOOLCHAIN" >&2
          exit 1
        fi
        # itos-cc prepares frozen checkouts offline with GOTOOLCHAIN=local. Put the
        # verified toolchain itself on PATH, so those children cannot use the bootstrap.
        root=$(go env GOROOT | tr -d '\r' | tr '\\' '/')
        native_bin="$root/bin"
        shell_bin="$native_bin"
        # Native drive colons split Bash PATH. MSYS supplies the shell spelling;
        # GITHUB_PATH still takes the native spelling for later runner steps.
        if [ "$RUNNER_OS" = Windows ]; then
          shell_bin=$(cygpath -u "$native_bin")
        fi
        selected_go="$shell_bin/go"
        [ -x "$selected_go" ] || selected_go="$shell_bin/go.exe"
        [ -x "$selected_go" ] || {
          echo "No Go executable in selected toolchain: $root" >&2
          exit 1
        }
        actual=$(GOTOOLCHAIN=local "$selected_go" env GOVERSION | tr -d '\r')
        [ "$actual" = "$GOTOOLCHAIN" ] || {
          echo "Local Go selected $actual, expected $GOTOOLCHAIN" >&2
          exit 1
        }
        case "$RUNNER_ARCH" in
          ARM64) host_arch=arm64 ;;
          X64) host_arch=amd64 ;;
          *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        actual_arch=$(GOTOOLCHAIN=local "$selected_go" env GOHOSTARCH | tr -d '\r')
        [ "$actual_arch" = "$host_arch" ] || {
          echo "Local Go architecture $actual_arch is not $host_arch" >&2
          exit 1
        }
        export PATH="$shell_bin:$PATH"
        actual=$(GOTOOLCHAIN=local go env GOVERSION | tr -d '\r')
        [ "$actual" = "$GOTOOLCHAIN" ] || {
          echo "PATH Go selected $actual, expected $GOTOOLCHAIN" >&2
          exit 1
        }
        echo "$native_bin" >> "$GITHUB_PATH"
        go version
    - name: Go problem matcher
      shell: bash
      run: echo "::add-matcher::$GITHUB_ACTION_PATH/go-matcher.json"
