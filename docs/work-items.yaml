  - id: p1-verify-with-last-release
    title: CI verifies with the last released itos too
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [T-021]
    kind: idea
    why: >
      The hooks and CI run the working tree's itos, so a commit that breaks a gate can approve
      itself. CI also running verify and the conformance corpus with the last released itos closes
      that; a release that changes a rule on purpose says so in its notes.

  - id: p1-release-manifest
    title: The released package's manifest holds only what a consumer needs
    phase: 1
    owner: null
    status: todo
    depends_on: [T-021]
    kind: idea
    why: >
      itos-<version>.tgz carries the repository's package.json: its `prepare: vp config` script,
      which npm lists on every consumer's install as an install script awaiting approval (and
      which would fail without Vite+ if run), its devDependencies and packageManager, and no
      `engines`, though the bundle needs Node 24 (import.meta.main). Packing a manifest of name,
      version, type, bin, files and engines would fix it, and the release self-test can require an
      install that warns of no install script.

  - id: p1-ci-after-push-checks
    title: CI waits on an after-push check the push itself cannot satisfy
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      CI runs a named task's `after: push` checks on every range that names it. T-021's check
      needs the release a tag makes after the push, so every range naming T-021 was red until
      v0.1.0 existed and green only when re-run after it; its check was made late so the red run
      still proved everything else first. A check that waits on something after the push (a
      release, a tag) could be reported pending by CI instead, so the push that lands the workflow
      is green and the next release task does not meet the same red.

  - id: T-022
    title: itos config check in the gates
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
    refs: [tasks/phase-1.yaml]

  - id: p1-config-check-staged
    title: The pre-commit hook checks the staged config, not the working tree's
    phase: 1
    owner: null
    status: todo
    depends_on: [T-022]
    kind: idea
    why: >
      The pre-commit hook runs `itos config check` when itos.yaml, tasks/, docs/work-items.yaml
      or features/smoke.yaml is staged, but the check reads the files on disk: a ledger staged
      broken and fixed only in the working tree passes the hook, and a sound one staged beside an
      unstaged broken edit is rejected. CI catches the first on the push. A check reading the index
      (as `ci plan --data-at` reads a commit) would make the hook judge what is committed.

  - id: slice-3
    title: Every command itos runs goes through the configured shell, and ci.stop_at_first_failure is read
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: slice
    refs: [features/config.feature]
    why: >
      checks, CI steps, header-lint delegates and range checks ran sh -c whatever shell said (only
      the providers and the command adapter honoured it), and ci.stop_at_first_failure was validated
      but never read. @ID-CONFIG-01 to 06.

  - id: slice-4
    title: The work, smoke and hooks keys read; the keys of unbuilt features dropped
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [slice-3]
    kind: slice
    refs: [features/config.feature]
    why: >
      work.statuses, work.groups_key, tests.<kind>.smoke.every_file and hooks.manager were validated
      but never read; each is now read. commits.header_lint.use and alongside wait on the built-in
      header lint, and ledger.check.pushed has one value: they leave the schema, and come back with
      the feature that gives them a second value. @ID-CONFIG-07 to 14.

  - id: p1-config-names-from-config
    title: The names the tools hardcode, read from the config
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [slice-4]
    kind: idea
    why: >
      What is left of the config-keys audit: scenario-moves' range mode hardcodes feat and fix and
      ignores except_types; it, ci-scope's Task key, ci plan --data-at and the smoke rule default to
      the kind named scenario; ci run's messages name tasks/, docs/work-items.yaml and vp check.
      Each is read from the config.

  - id: p1-one-defaults-table
    title: The defaults the tools apply, read from one table
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      config check --print-defaults prints a table beside the code, but each tool writes its own
      fallback where it reads a key (?? 600, ?? "docs/work-items.yaml", ?? "@wip"), so the printed
      table can drift from what runs: tests.<kind>.tag_prefix is @ in the table and the Gherkin adapter
      but empty where a smoke ID loses its prefix. One table the loader merges under the file, which the
      tools and the flag both read, closes it; it fits the Go port's config loader.

  - id: p1-footers-beside-header-lint
    title: The footer rules run by itos beside the header lint
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      With a header-lint delegate configured, the commit-msg hook and verify run only the delegate:
      the footer rules run because the template's commitlint config carries them as a plugin
      (commitlint.config.ts, calling tools/itos/footers.ts), and a delegate without that plugin skips
      them silently. The plan has the hook run the scope rules, the range checks, the footer rules and
      the header lint in turn, each itos's or the delegate's; until then, the features' header-lint
      scenario uses commitlint without the plugin and the footer scenarios use no delegate.

  - id: p1-several-test-kinds
    title: A CI run that merges more than one kind of named test
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The plan merges only the kind of the first tests: step of ci.steps, with one smoke set, and the
      smoke rule names the kind scenario: in a config with two kinds (scenarios and Go tests, say)
      every tests: step would take the first kind's merged command.

  - id: p1-e2e-names
    title: "The template's E2E names out of the code and its output"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The code still says what the template ran: e2e-scope.ts and e2eStep for the smoke rule and the
      plan's run of named tests, comments naming e2e/smoke.yaml and Playwright, and ci run's
      "(in the E2E run above)" for a merged check. A refactor renames the modules; the wording, which
      agents read, changes in a feat with its conformance case.

  - id: p1-range-check-since-diverged
    title: A range check given commits.since when the range has diverged from it
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A range check takes one {from}. verify gives it commits.since when the range's own start is
      empty or older than it, but keeps the start when the two have diverged (a pull request based
      before commits.since, say), so a project's own range check may judge commits before it;
      scenario-moves leaves them out itself. A {since} in the template, or a range given as a commit
      list, would close it.

  - id: p1-hooks-config-write
    title: "hooks install writes lefthook's and pre-commit's config"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      hooks install writes shim files for Vite+, husky and plain git, but for lefthook, pre-commit
      and prek, whose hooks live in their YAML config, it only prints the snippet to add. Merging it into
      the file, keeping the other hooks and comments, would make install one step for them too, and
      hooks.manager could then override detection, which it does not yet.

  - id: p1-identity-map
    title: "An identity command's answer mapped to a login"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A command identity takes the command's output as the handle, so the command must print the
      login itself. Asking git config user.email and mapping it through a people file that pairs a
      login with an email needs a map: key and that file; it fits the people sources in the Go port.

  - id: p1-conformance-http
    title: Conformance cases for the providers that ask an HTTP API
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      The corpus runs every provider that needs no network, but not which run the github range
      provider takes from the API's answer (the newest success, whatever the list's order), which
      stays in tools/selftest/ci-range.ts. A case serving a canned response, with the provider taking
      its API's base URL from the environment as GITHUB_API_URL gives it in Actions, would cover it, and
      GitLab and Forgejo after it.

  - id: p1-agent-rules-as-checks
    title: Agent rules a command can decide, moved into itos
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      A rule moves from the agent instructions into itos once a command can decide it. Two
      candidates: pre-push refusing a non-fast-forward push (AGENTS.md, "Force-push, in any form"),
      and a commit refusing paths the config marks as someone's work in progress (AGENTS.md, "Stage
      your own work"). The instructions then point to the check.

  # ---- phase 2 ----------------------------------------------------------------
  - id: p2-go-port
    title: The Go port, one command group at a time
    phase: 2
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      PLAN.md, phase 2: the Go binary built here beside the TypeScript, one command group at a
